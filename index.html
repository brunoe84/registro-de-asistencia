/* Domingo de Pascua (algoritmo gregoriano anónimo) */
function easter(y){
  const a = y%19, b = Math.floor(y/100), c = y%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d-g+15)%30, i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7, m = Math.floor((a+11*h+22*l)/451);
  const mo = Math.floor((h+l-7*m+114)/31), da = ((h+l-7*m+114)%31)+1;
  return new Date(y, mo-1, da);
}
/* Feriados nacionales del Perú + los días que agregue el administrador */
const PE_FIXED = [['01-01','Año Nuevo'],['05-01','Día del Trabajo'],['06-07','Batalla de Arica y Día de la Bandera'],['06-29','San Pedro y San Pablo'],['07-23','Día de la Fuerza Aérea del Perú'],['07-28','Fiestas Patrias'],['07-29','Fiestas Patrias'],['08-06','Batalla de Junín'],['08-30','Santa Rosa de Lima'],['10-08','Combate de Angamos'],['11-01','Día de Todos los Santos'],['12-08','Inmaculada Concepción'],['12-09','Batalla de Ayacucho'],['12-25','Navidad']];
let HOL_CACHE = {};
function holidaysOf(y){
  if(HOL_CACHE[y]) return HOL_CACHE[y];
  const map = {};
  PE_FIXED.forEach(([md, n]) => map[`${y}-${md}`] = n);
  const ea = easter(y);
  const th = new Date(ea); th.setDate(ea.getDate()-3); map[iso(th)] = 'Jueves Santo';
  const fr = new Date(ea); fr.setDate(ea.getDate()-2); map[iso(fr)] = 'Viernes Santo';
  (SETTINGS.holidays||[]).forEach(h => { if(h.d && h.d.startsWith(String(y))) map[h.d] = h.n || 'Día no laborable'; });
  return HOL_CACHE[y] = map;
}
/* Devuelve el motivo si ese día no hay clase (domingo o feriado); vacío si es un día normal. */
function blockedReason(ds){
  const d = parseISO(ds);
  if(d.getDay() === 0) return 'Domingo';
  const h = holidaysOf(d.getFullYear())[ds];
  return h ? 'Feriado: ' + h : '';
}
function periodsOf(prog){ return ((SETTINGS.periods||{})[prog] || []).map((p, i) => Object.assign({ key: prog+i }, p)).filter(p => p.s && p.e); }
function currentPeriod(prog){
  const t = todayISO(), list = periodsOf(prog);
  return list.find(p => p.s <= t && t <= p.e) || list.find(p => p.s > t) || list[list.length-1] || null;
}
function periodLabel(p){ return `${p.n} · ${fmtDMY(p.s)} al ${fmtDMY(p.e)}`; }
/* Rango de la clase: si está ligada a un periodo, usa las fechas vigentes que configuró el administrador. */
function classRange(cls){
  const m = cls.meta;
  if(m.period){
    const p = periodsOf(m.program).find(x => x.key === m.period.key && x.s.slice(0,4) === String(m.period.s||'').slice(0,4));
    if(p) return { s: p.s, e: p.e, name: p.n };
    return { s: m.period.s || m.start, e: m.period.e || '', name: m.period.n };
  }
  return { s: m.start || todayISO(), e: m.end || '', name: '' };
}
function classDates(cls){
  const m = cls.meta; const set = new Set();
  const r = classRange(cls);
  const start = parseISO(r.s);
  const t = todayISO();
  const end = parseISO(r.e && r.e < t ? r.e : t);
  const days = (m.days || []).filter(d => d !== 0);
  if(days.length){ const d = new Date(start); let guard = 0; while(d <= end && guard < 800){ const ds = iso(d); if(days.includes(d.getDay()) && !blockedReason(ds)) set.add(ds); d.setDate(d.getDate()+1); guard++; } }
  (m.extraDates||[]).forEach(x => { if(x <= t) set.add(x); });
  Object.keys(cls.att||{}).forEach(x => { if(Object.keys(cls.att[x]||{}).length && !blockedReason(x)) set.add(x); });
  (m.skipDates||[]).forEach(x => { if(!(cls.att[x] && Object.keys(cls.att[x]).length)) set.delete(x); });
  return [...set].sort();
}
/* Fechas donde empieza una semana nueva (lunes a sábado) respecto a la fecha anterior de la lista: llevan una línea divisoria. */
function weekStarts(list){ const out = new Set(); let prev = ''; list.forEach(d => { const dt = parseISO(d); const mon = new Date(dt); mon.setDate(dt.getDate() - ((dt.getDay() + 6) % 7)); const k = iso(mon); if(prev && k !== prev) out.add(d); prev = k; }); return out; }
function classPendingCount(cls){ return Object.keys(cls.dirty||{}).length + Object.keys(cls.sigPending||{}).length; }
async function syncClass(code, {silent=false}={}){

  setSync('syncing');
  try{
    if(cls.canEdit){
      const sent = Object.entries(cls.dirty||{});
      if(sent.length){
        const patch = {}; sent.forEach(([p]) => { patch[p] = getPath(cls, p); });
        await Sync.req(`classes/${code}`, 'PATCH', patch);
        sent.forEach(([p, st]) => { if(cls.dirty[p] === st) delete cls.dirty[p]; });
      }
      const sigs = Object.keys(cls.sigPending||{});
      if(sigs.length){
        const patch = {}; sigs.forEach(id => { if(cls.sigs[id]) patch[id] = cls.sigs[id]; });
        if(Object.keys(patch).length) await Sync.req(`classsigs/${code}`, 'PATCH', patch);
        sigs.forEach(id => delete cls.sigPending[id]);

    }

    if(remote){
      const dirty = cls.dirty || {};
      if(remote.meta && !dirty.meta) cls.meta = remote.meta;
      Object.entries(remote.students||{}).forEach(([id, s]) => { if(!dirty['students/'+id]) cls.students[id] = s; });
      const ratt = remote.att || {};
      const dates = new Set([...Object.keys(ratt), ...Object.keys(cls.att||{})]);
      dates.forEach(d => {
        const loc = cls.att[d] || {}, rem = ratt[d] || {};
        const sids = new Set([...Object.keys(loc), ...Object.keys(rem)]);
        sids.forEach(sid => { if(dirty[`att/${d}/${sid}`]) return; if(rem[sid]) loc[sid] = rem[sid]; else delete loc[sid]; });
        if(Object.keys(loc).length) cls.att[d] = loc; else delete cls.att[d];
      });
    }
    cls.lastSync = Date.now();
    saveClasses(); setSync('ok');

  if(CUR.type === 'class' && CUR.code === code) liveClass();

let PROG_STAKES = ['Cañete Perú Stake','Chincha Perú Stake','Ica Perú Stake','Nazca Perú District','Pisco Perú Stake'];
// Nombre corto: sin "Perú", "Stake", "District"... ("Ica Perú Stake" → "Ica"; "Lima Perú Los Olivos Stake" → "Lima Los Olivos").
const stakeShort = s => { const t = String(s || '').replace(/(^|\s)(per[uú]|stake|district|distrito|estaca)(?=\s|$)/gi, ' ').replace(/\s+/g, ' ').trim() || String(s || '').split(' ')[0]; return /^nazca$/i.test(t) ? 'Nasca' : t; };
// Núcleo de una estaca para compararlas ("Ica", "Ica Peru Stake" e "Ica Perú Stake" son la misma). Igual que nucleo_estaca() en la base.
const nucleoEstaca = s => norm(s).replace(/\bnasca\b/g, 'nazca').split(' ').filter(w => w && !['peru', 'stake', 'district', 'distrito', 'estaca'].includes(w)).join(' ');
// La estaca de la lista que corresponde a un texto de Wise ("Ica Peru Stake IN (61151)" → "Ica Perú Stake").
function estacaCanon(txt, lista = PROG_STAKES){
  const n = nucleoEstaca(txt); if(!n) return '';
  let best = '', len = 0;
  lista.forEach(k => { const c = nucleoEstaca(k); if(c && (n === c || n.startsWith(c + ' ')) && c.length > len){ best = k; len = c.length; } });
  return best;
}
/* ---------- Entornos en la app ----------
   Cada programa (entorno) tiene sus estacas, periodos y feriados. El administrador trabaja con los de su
   entorno; maestros y jóvenes ven las estacas de todos los entornos activos y el calendario del entorno
   de su clase. Sin la migración 0038 todo sigue con los valores de Programa Ica. */
const ESTACAS_BASE = PROG_STAKES.slice();
const ENT = {
  lista: LS.get('ca_entornos', null) || [],
  activo: null,
  async cargar(){
    try{ const l = await SB.rpc('entornos_publicos'); if(Array.isArray(l)){ this.lista = l; LS.set('ca_entornos', l); } }catch(e){ /* sin 0038: se queda la lista guardada */ }
    return this.lista;
  },
  estacasDe(e){ return [...new Set(((e && e.estacas) || []).map(x => x.estaca))].sort((a, b) => a.localeCompare(b, 'es')); },
  todas(){ const s = [...new Set(this.lista.flatMap(e => this.estacasDe(e)))].sort((a, b) => a.localeCompare(b, 'es')); return s.length ? s : ESTACAS_BASE.slice(); },
  // Entorno de una estaca y programa (el más antiguo que la tiene, como en la base).
  dePar(estaca, programa){ const n = nucleoEstaca(estaca); if(!n) return null; return this.lista.find(e => (e.estacas || []).some(x => nucleoEstaca(x.estaca) === n && (!programa || x.programa === programa))) || null; },
  porId(id){ return this.lista.find(e => e.id === id) || null; },
  // Periodos y feriados de un entorno (si los tiene configurados).
  usarCalendario(e){
    if(!e || !e.ajustes || !e.ajustes.periods || this.activo === e.id) return;
    SETTINGS = Object.assign(defaultSettings(), e.ajustes); HOL_CACHE = {}; this.activo = e.id;
  },
  // Estacas para formularios y filtros: el administrador, las de su entorno; los demás, las de todos.
  usarEstacas(e){ const l = e ? this.estacasDe(e) : this.todas(); PROG_STAKES = l.length ? l : ESTACAS_BASE.slice(); },
  aplicar(){
    if(SB.admin && SB.entorno){ this.usarEstacas(SB.entorno); this.usarCalendario(SB.entorno); return; }
    this.usarEstacas(null);
  }
};

const SB = {
  client:null, signingIn:null, ready:false, admin:false, user:null, mis:[], solicitudes:[], counts:{solicitudes:0, alertas:0}, resumen:[], watchers:[], global:null, readyP:null,
  on(){ return !!(window.CA_CONFIG && window.CA_CONFIG.supabaseUrl && window.CA_CONFIG.supabaseKey); },
  init(){
    if(this.readyP) return this.readyP;
    this.readyP = (async () => {
      if(!this.on()){ this.ready = true; return; }
      try{
        if(!window.supabase) await loadScript(SUPABASE_JS_URL);

      }catch(e){ console.error(e); }
      this.ready = true;

      syncAllPending();

  async ensureSession(){
    if(!this.client) throw new Error('No hay conexión con el servidor. Revisa tu internet.');
    if(this.user) return this.user;
    if(!this.signingIn) this.signingIn = this.client.auth.signInAnonymously().then(({ data, error }) => { if(error) throw error; this.user = data.user; return this.user; }).finally(() => { this.signingIn = null; });

  async refresh(){
    if(!this.user) return;
    const perfil = await this.fetchAll('perfiles', 'rol,nombre', [['id', this.user.id]]);
    let admin = !!(perfil[0] && perfil[0].rol === 'admin');
    // Entorno en el que trabaja el administrador (programa, estacas, ajustes). Si su entorno está
    // pendiente, rechazado o suspendido, no entra como administrador. Sin la migración 0036 sigue como antes.
    this.entorno = null;
    if(admin){
      try{ this.entorno = await this.rpc('mi_entorno'); if(!this.entorno) admin = false; }
      catch(e){ if(!/mi_entorno|schema cache|could not find/i.test(String(e && e.message))) console.warn('mi_entorno', e); }
    }
    this.admin = admin;
    // Estacas y calendario del entorno (el administrador) o de todos los programas (maestros).
    await ENT.cargar(); ENT.aplicar();

  async volver(){

  // entrar y salir como administrador) se vuelven a pedir con el mismo nombre: entra sin esperar.
  async recuperarAccesos(){
    const g = misAccesos(), tengo = new Set(this.mis.map(c => c.id));
    let volvio = false, cambio = false;
    for(const id of Object.keys(g)){

    if(c && c.inscripciones == null){

        c.inscripciones_S = (s || []).length; c.inscripciones_I = (i || []).length;

  async rpc(name, args){
    if(!this.client) throw new Error('No hay conexión con el servidor. Revisa tu internet.');
    const { data, error } = await this.client.rpc(name, args || {});
    if(error) throw error;
    return data;
  },
  async fetchAll(table, cols, filters=[], order){
    const out = [];
    for(let from=0; ; from+=1000){
      let q = this.client.from(table).select(cols);
      filters.forEach(([c, v]) => { q = q.eq(c, v); });
      if(order) q = q.order(order);
      const { data, error } = await q.range(from, from+999);
      if(error) throw error;
      out.push(...data);
      if(data.length < 1000) return out;
    }
  },
  watch(table, filter, cb){
    if(!this.client || !this.client.channel) return;
    const ch = this.client.channel(`w-${table}-${filter||'all'}-${Date.now()}`).on('postgres_changes', Object.assign({ event:'*', schema:'public', table }, filter ? { filter } : {}), debounce(cb, 900)).subscribe();
    this.watchers.push(ch);
  },
  stopWatch(){ this.watchers.forEach(ch => { try{ this.client.removeChannel(ch); }catch(e){} }); this.watchers = []; },
  watchGlobal(){
    if(this.global || !this.client || !this.client.channel) return;
    // Un supervisor pide varias clases a la vez: se junta en un solo aviso.
    let nuevas = [];
    const avisar = debounce(() => {
      const sup = nuevas.filter(r => r.rol === 'supervisor');
      const n = nuevas.length; nuevas = [];
      const s = sup[0];
      toast(s ? `🔔 ${s.nombres} ${s.apellidos} (supervisor) pide acceso a ${sup.length} clase${sup.length===1?'':'s'}` : `🔔 Nueva${n>1?'s':''} solicitud${n>1?'es':''} de acceso a una clase`, 'warn', { action:'Ver', onAction: () => go('#/solicitudes'), ms:9000 });
      this.loadCounts().then(() => { if(CUR.type === 'home') renderHome(); if(CUR.type === 'solicitudes') renderSolicitudes(); }).catch(()=>{});
    }, 1200);
    this.global = this.client.channel('admin-notificaciones').on('postgres_changes', { event:'INSERT', schema:'public', table:'solicitudes_acceso' }, ev => {
      if(ev && ev.new && ev.new.estado && ev.new.estado !== 'pendiente') return;
      nuevas.push((ev && ev.new) || {});
      avisar();
    }).subscribe();
  },
  async signOut(){
    this.stopWatch();
    if(this.global){ try{ this.client.removeChannel(this.global); }catch(e){} this.global = null; }
    await this.client.auth.signOut({ scope:'local' });
    this.user = null; this.admin = false; this.entorno = null; ENT.activo = null; loadSettings(); ENT.aplicar(); this.mis = []; this.solicitudes = []; this.barrios = null; this.counts = {solicitudes:0, alertas:0};
    Object.keys(CLASSES).forEach(c => { if(CLASSES[c].remote) delete CLASSES[c]; }); saveClasses();
    // Vuelve la sesión que tenía este dispositivo antes de entrar como administrador,
    // para no perder las clases y accesos que ya tenía.
    const prev = LS.get('ca_sesion_dispositivo', null);
    if(prev){
      LS.del('ca_sesion_dispositivo');
      try{ const { data, error } = await this.client.auth.setSession(prev); if(!error && data.user) this.user = data.user; }catch(e){ console.error(e); }
    }
    await this.volver();
  }
};

function studentFromRow(a){
  return { id:a.id, pid:a.persona_id, n:a.nombre, src: a.origen === 'maestro' && a.vinculo !== 'vinculado' ? 'nuevo' : 'base', vinculo:a.vinculo, data:{ k:a.estaca, w:a.barrio }, addedAt: Date.parse(a.agregado_en) || 0, ...(a.retirado_en ? { del:true } : {}), ...(a.en_wise_en ? { wise:1 } : {}) };
}
function metaFromRow(c){
  return { title:c.titulo, teacher:c.maestro_nombre, program:c.programa, stake:c.estaca, ward:c.barrio, days:c.dias || [], start:c.inicio || '', end:c.fin || '', extraDates:c.fechas_extra || [], skipDates:c.fechas_omitidas || [], horario:c.horario, curso:c.curso, createdAt: Date.parse(c.creado_en) || 0 };
}
async function pushRemoteClass(cls){
  const sent = Object.entries(cls.dirty||{});
  const id = cls.dbId;
  for(const [p, st] of sent.filter(([p]) => p.startsWith('students/'))){
    const s = getPath(cls, p);
    if(s){
      const { error } = await SB.client.from('clase_alumnos').upsert({ id:s.id, clase_id:id, nombre:s.n, estaca:(s.data||{}).k || '', barrio:(s.data||{}).w || '', persona_id:s.pid || null, retirado_en: s.del ? new Date(s.delAt || Date.now()).toISOString() : null }, { onConflict:'id' });
      if(error && error.code === '23505'){ delete cls.students[s.id]; toast(`${prettyName(s.n)} ya estaba en la clase`, 'warn'); }
      else if(error) throw error;
      // Alumno nuevo con WhatsApp: se crea su ficha con el enlace que ya se le envió.
      else if(s.fichaCel && !s.del){
        const r = await SB.rpc('preinscribir_alumno', { alumno:s.id, celular:s.fichaCel, token:s.fichaTok || null });
        (cls.fichas = cls.fichas || {})[s.id] = { token:r.token, whatsapp:s.fichaCel, completa:!!r.completa, inscrito:false, enviado_en:new Date().toISOString(), envios:1 };
        delete s.fichaCel; delete s.fichaTok;
      }
    }
    if(cls.dirty[p] === st) delete cls.dirty[p];
  }
  const att = sent.filter(([p]) => p.startsWith('att/'));
  const rows = [];
  for(const [p] of att){
    const [, fecha, alumno] = p.split('/');
    const v = (cls.att[fecha]||{})[alumno];
    if(v) rows.push({ clase_id:id, alumno_id:alumno, fecha, estado:v, marcado_por:SB.user.id, actualizado_en:new Date().toISOString() });
    else { const { error } = await SB.client.from('asistencia').delete().eq('alumno_id', alumno).eq('fecha', fecha); if(error) throw error; }
  }
  if(rows.length){ const { error } = await SB.client.from('asistencia').upsert(rows, { onConflict:'alumno_id,fecha' }); if(error) throw error; }
  att.forEach(([p, st]) => { if(cls.dirty[p] === st) delete cls.dirty[p]; });
  if(cls.dirty.meta){
    const st = cls.dirty.meta, m = cls.meta;
    await SB.rpc('actualizar_calendario', { clase:id, dias_nuevos:m.days || [], extra:m.extraDates || [], omitidas:m.skipDates || [] });
    if(cls.dirty.meta === st) delete cls.dirty.meta;
  }
}
async function pullRemoteClass(cls){
  const rows = await SB.fetchAll('clases', '*', [['codigo', cls.code]]);
  if(!rows.length) return false;
  const dirty = cls.dirty || {};
  cls.dbId = rows[0].id;
  cls.qr = rows[0].qr || null;
  if(!dirty.meta) cls.meta = metaFromRow(rows[0]);
  const alumnos = await SB.fetchAll('clase_alumnos', '*', [['clase_id', cls.dbId]]);
  const marcas = await SB.fetchAll('asistencia', 'alumno_id,fecha,estado', [['clase_id', cls.dbId]]);
  const ids = new Set(alumnos.map(a => a.id));
  Object.keys(cls.students).forEach(id => { if(!ids.has(id) && !dirty['students/'+id]) delete cls.students[id]; });
  alumnos.forEach(a => { if(!dirty['students/'+a.id]) cls.students[a.id] = studentFromRow(a); });
  // Estado de las fichas de inscripción de los alumnos nuevos (naranja: pendiente; dorado: completa).
  try{ const f = await SB.rpc('fichas_de_clase', { clase: cls.dbId }); cls.fichas = {}; (f || []).forEach(x => cls.fichas[x.alumno_id] = x); }
  catch(e){ console.warn('fichas_de_clase', e); }
  // Lo que dice el Class Roll de Wise de esta clase (se muestra al lado, no reemplaza nada).
  try{ const w = await SB.rpc('wise_de_clase', { clase: cls.dbId }); const r = (w || [])[0]; if(r){ if(!cls.wroll || cls.wroll.actualizado_en !== r.actualizado_en){ cls.wroll = r; delete cls._wmap; } } else { delete cls.wroll; delete cls._wmap; } }
  catch(e){ console.warn('wise_de_clase', e); }
  if(SB.admin) autoWiseMarcas(cls);
  const ratt = {}; marcas.forEach(m => { (ratt[m.fecha] = ratt[m.fecha] || {})[m.alumno_id] = m.estado; });
  const dates = new Set([...Object.keys(ratt), ...Object.keys(cls.att||{})]);
  dates.forEach(d => {
    const loc = cls.att[d] || {}, rem = ratt[d] || {};
    new Set([...Object.keys(loc), ...Object.keys(rem)]).forEach(sid => { if(dirty[`att/${d}/${sid}`]) return; if(rem[sid]) loc[sid] = rem[sid]; else delete loc[sid]; });
    if(Object.keys(loc).length) cls.att[d] = loc; else delete cls.att[d];
  });
  return true;
}
async function syncRemoteClass(code, {silent=false}={}){
  const cls = CLASSES[code]; if(!cls) return;
  if(BUSY.has(code)) return; BUSY.add(code);
  setSync('syncing');
  let gone = false;
  try{
    await SB.ensureSession();
    if(classPendingCount(cls)) await pushRemoteClass(cls);
    gone = !(await pullRemoteClass(cls));
    cls.lastSync = Date.now();
    if(gone) delete CLASSES[code];
    saveClasses(); setSync('ok');
    if(!silent && !gone) toast('Asistencia guardada y sincronizada ✓', 'ok');
  }catch(e){
    console.error(e);
    saveClasses(); setSync('error');
    if(!silent) toast('Sin conexión: quedó guardado en este dispositivo y se enviará al reconectar.', 'warn', {ms:4200});
  }finally{ BUSY.delete(code); }
  if(gone){ toast('Ya no tienes acceso a esta clase.', 'warn'); if(CUR.code === code) go('#/'); return; }
  if(CUR.type === 'class' && CUR.code === code) liveClass();
}
/* unirse: llegó con un código (pegado o por enlace). Si es una invitación, entra como colaborador
   por el tiempo que eligió el maestro y se abre la clase con su código fijo. */
async function openRemoteClass(code, unirse){
  await SB.readyP;
  try{
    await SB.ensureSession();
    const cls = CLASSES[code] || Object.assign(newClassObj(code, {}), { dirty:{} });
    cls.remote = true; cls.canEdit = true;
    let ok = await pullRemoteClass(cls);
    if(!ok && unirse){
      if(!(await aceptarTerminos('colaborar_clase'))){ go('#/'); return; }
      const r = await SB.rpc('unirme_con_codigo', { codigo_clase:code });
      const avisos = {
        no_existe:'No existe ninguna clase ni invitación con ese código. Revisa que esté bien escrito.',
        usado:'Esa invitación ya fue usada por otra persona. Pide al maestro un código nuevo.',
        sin_invitacion:'Ese es el código fijo de la clase. Para colaborar, pide al maestro un código de invitación.'
      };
      if(avisos[r.estado]){ toast(avisos[r.estado], 'error', { ms:6000 }); go('#/'); return; }
      if(r.estado === 'acceso') toast(`✓ Entraste como colaborador${r.vence_en ? ' hasta el '+fmtDate(fechaLocal(r.vence_en)) : ''}`, 'ok', { ms:5000 });
      await SB.refresh().catch(() => {});
      if(r.codigo && r.codigo !== code) return openRemoteClass(r.codigo);
      ok = await pullRemoteClass(cls);
    }
    if(!ok){ toast('No tienes acceso a esa clase.', 'error'); go('#/'); return; }
    CLASSES[code] = cls; saveClasses();
    if(location.hash === '#/clase/'+code) renderClass(code); else go('#/clase/'+code);
  }catch(e){ console.error(e); toast(errMsg(e), 'error'); }
}
function classBack(cls){
  if(!cls.remote) return '#/clases';
  if(!SB.admin) return '#/';
  return `#/todas/${cls.meta.program}/${Math.max(0, PROG_STAKES.indexOf(cls.meta.stake))}`;

/* ---------- Seguimiento: retrasos y últimos cambios ---------- */
const DIAS_RETRASO = 7;
/* Última fecha con marcas en el Class Roll de Wise, por clase de la app (id → 'AAAA-MM-DD'). */
const WISE_ULT = {};
function ultimaWise(alumnos){ let u = ''; (alumnos || []).forEach(a => Object.entries((a && a.m) || {}).forEach(([f, v]) => { if(v && /^\d{4}-\d\d-\d\d$/.test(f) && f > u) u = f; })); return u; }
let WISE_ULT_AT = 0;
async function cargarWiseUlt(){
  try{
    if(SB.admin){ if(Date.now() - WISE_ULT_AT < 60000) return; (await SB.rpc('wise_clases_admin') || []).forEach(w => { if(w.clase_id) WISE_ULT[w.clase_id] = ultimaWise(w.alumnos); }); WISE_ULT_AT = Date.now(); }
    else await Promise.all((SB.mis || []).map(async c => { const r = ((await SB.rpc('wise_de_clase', { clase:c.id })) || [])[0]; if(r) WISE_ULT[c.id] = ultimaWise(r.alumnos); }));
  }catch(e){ console.warn('Wise: última fecha', e); }
}
/* Una clase está atrasada si su primera sesión sin marcar tiene más de una semana. */
function retrasoDe(c){
  if(!c || !c.inicio || !c.dias) return null;
  const dates = classDates({ meta:{ days:c.dias, start:c.inicio, end:c.fin || '', extraDates:c.fechas_extra || [], skipDates:c.fechas_omitidas || [] }, att:{} });
  // Cuenta lo marcado en la app y lo marcado en Wise (Class Roll): vale la fecha más reciente de las dos.
  const w = WISE_ULT[c.id] || '', ult = (c.ultima_fecha || '') > w ? (c.ultima_fecha || '') : w;
  const pend = dates.filter(d => d > ult);
  if(!pend.length) return null;
  const dias = Math.floor((parseISO(todayISO()) - parseISO(pend[0])) / 864e5);
  return dias > DIAS_RETRASO ? { dias, desde:pend[0], sesiones:pend.length } : null;
}
const fechaLocal = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fechaHora = ts => { if(!ts) return ''; const d = new Date(ts); return isNaN(d) ? '' : `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${fmtTime(d)}`; };
// Institutos (clases semanales): el atraso se cuenta en semanas; Seminarios (diario), en días.
function atrasoTxt(c, r){
  if(c.programa !== 'I') return `Atrasada ${r.dias} días`;
  const sem = Math.max(1, Math.floor(r.dias / 7));
  return `Atrasada ${sem} semana${sem === 1 ? '' : 's'} · ${r.sesiones} sesi${r.sesiones === 1 ? 'ón' : 'ones'} sin marcar`;
}
function seguimientoHTML(c){
  const r = retrasoDe(c);
  return `<small>${c.titular ? `Adoptada por <b>${esc(c.titular)}</b>${c.adoptada_en ? ' · '+esc(fechaHora(c.adoptada_en)) : ''}` : 'Sin adoptar'}</small>
    <small>${c.ultimo_cambio ? `Último cambio del maestro: <b>${esc(fechaHora(c.ultimo_cambio))}</b> · ${c.cambios} cambio${c.cambios===1?'':'s'}` : 'Sin cambios del maestro'}${r ? ` · <b class="late-txt">${atrasoTxt(c, r)}</b>` : ''}${Number(c.recordatorios) ? ' · 🔔 Recordatorios activos' : ''}</small>`;
}
async function renderSeguimiento(filtro='adoptadas'){
  CUR = { type:'seguimiento', code:null };

  bindTop();
  // "Al día en Wise": marca del administrador; se anula sola si el maestro cambia algo después.
  let alDia = {};
  const ms = t => { const v = Date.parse(t); return isNaN(v) ? 0 : v; };
  const estaAlDia = c => { const t = alDia[c.id]; return !!t && (!c.ultimo_cambio || ms(t) >= ms(c.ultimo_cambio)); };
  const paint = () => {

    const nombres = { adoptadas:'Adoptadas', cambios:'Con cambios', atrasadas:'Atrasadas', sin:'Sin adoptar' };
    const list = grupos[filtro].slice().sort((a,b) => (estaAlDia(a) - estaAlDia(b)) || String(b.ultimo_cambio||'').localeCompare(String(a.ultimo_cambio||'')) || String(b.adoptada_en||'').localeCompare(String(a.adoptada_en||'')));
    const nOk = list.filter(estaAlDia).length;
    body.innerHTML = `<div class="seg" id="segTabs" style="margin-bottom:12px">${Object.keys(nombres).map(k => `<button data-f="${k}" class="${k===filtro?'on':''}">${nombres[k]} (${grupos[k].length})</button>`).join('')}</div>

      ${list.map(c => { const ok = estaAlDia(c), viejo = alDia[c.id] && !ok; return `<div class="seg-row${ok ? ' al-dia' : ''}"><button class="wchk${ok ? ' on' : ''}" data-chk="${c.id}" aria-pressed="${ok}" title="${ok ? 'Al día en Wise · toca para desmarcar' : 'Marcar: ya la actualicé en Wise'}">${ok ? ICON.check : ''}</button><button class="item" data-go="#/clase/${c.codigo}"><span class="av">${esc(initials(c.maestro))}</span><span class="ii"><b>${esc(prettyName(c.maestro))}</b><small>${esc([progLabel(c.programa), stakeShort(c.estaca), c.horario].filter(Boolean).join(' · '))}</small>${seguimientoHTML(c)}${ok ? `<small class="wd-ok">✓ Al día en Wise desde ${esc(fechaHora(alDia[c.id]))}</small>` : viejo ? `<small class="wd-new">● Cambios nuevos después de tu revisión del ${esc(fechaHora(alDia[c.id]))}</small>` : ''}</span>${ICON.next}</button></div>`; }).join('') || '<div class="empty">No hay clases en este grupo.</div>'}`;
    $$('[data-go]', body).forEach(b => b.onclick = () => go(b.dataset.go));

      const id = b.dataset.chk, c = all.find(x => x.id === id); const marcar = !(c && estaAlDia(c));

      paint();
      if(marcar && c) toast(`✓ ${prettyName(c.maestro)}: al día en Wise`, 'ok', { action:'Deshacer', onAction: () => quitar(id, antes) });
      try{ const t = await SB.rpc('marcar_clase_wise', { clase:id, al_dia:marcar }); if(marcar && t) alDia[id] = t; }
      catch(e){ console.error(e); if(antes) alDia[id] = antes; else delete alDia[id]; paint(); toast(/marcar_clase_wise|PGRST202|function/i.test(e.message || '') ? 'Falta aplicar la migración 0026 en Supabase' : errMsg(e), 'error', {ms:4200}); }
    });
  };
  const quitar = async (id, antes) => {
    if(antes) alDia[id] = antes; else delete alDia[id]; paint();
    try{ await SB.rpc('marcar_clase_wise', { clase:id, al_dia:!!antes }); }catch(e){ console.error(e); }
  };
  const load = async () => {
    const body = $('#segBody'); if(!body) return;
    try{
      SB.resumen = await SB.rpc('resumen_clases');
      await cargarWiseUlt();
      try{ const r = await SB.rpc('clases_wise_al_dia'); alDia = {}; (r || []).forEach(x => { alDia[x.id] = x.al_dia_en; }); }catch(e){ console.warn('clases_wise_al_dia', e); }
      conservarVista(body, paint);
    }catch(e){ console.error(e); body.innerHTML = `<div class="warn-box">${esc(errMsg(e))}</div>`; }
  };
  await load();
  SB.watch('asistencia', null, load);
  SB.watch('clase_accesos', null, load);
}

/* ---------- Recordatorios al celular ---------- */
const pushDisponible = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const instalada = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function claveBytes(b64){ const s = atob(b64.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4 - b64.length % 4) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function suscripcionActual(){ const reg = await navigator.serviceWorker.getRegistration('/'); return reg ? reg.pushManager.getSubscription() : null; }
async function paintPush(){
  const box = $('#pushBox'); if(!box) return;
  const pinta = (b, s, boton='') => { box.innerHTML = `<div class="pend-box"><div><b>${b}</b><small>${s}</small></div>${boton}</div>`; };
  if(!window.CA_CONFIG.pushKey){ box.innerHTML = ''; return; }
  if(!pushDisponible()){
    if(esIOS() && !instalada()) pinta('Activa los recordatorios en tu iPhone', 'En Safari toca Compartir y luego “Agregar a inicio”. Abre la app desde ese ícono y activa aquí los recordatorios.');
    else pinta('Recordatorios no disponibles', 'Este navegador no permite notificaciones. Revisa la página cada semana para marcar tu asistencia.');
    return;
  }
  const sub = await suscripcionActual().catch(() => null);
  if(sub && Notification.permission === 'granted'){
    pinta('Recordatorios activados', 'Te avisaremos si tu asistencia se atrasa más de una semana.', '<button class="btn sm" id="pushOff">Desactivar</button>');
    $('#pushOff').onclick = () => desactivarPush().then(paintPush).catch(e => toast(errMsg(e), 'error'));
    return;
  }
  if(Notification.permission === 'denied'){ pinta('Notificaciones bloqueadas', 'Actívalas en los ajustes del navegador para este sitio y vuelve a abrir la página.'); return; }
  pinta('Recibe recordatorios en este celular', 'Te avisaremos si tu asistencia se atrasa más de una semana. Se detienen al ponerte al día.', '<button class="btn sm gold" id="pushOn">Activar</button>');
  $('#pushOn').onclick = () => activarPush().then(paintPush).catch(e => { console.error(e); toast(errMsg(e), 'error'); });
}
async function activarPush(){
  const permiso = await Notification.requestPermission();
  if(permiso !== 'granted'){ toast('No se activaron: falta dar permiso de notificaciones.', 'warn'); return; }
  await SB.ensureSession();
  const reg = await navigator.serviceWorker.register('/sw.js');
  await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:claveBytes(window.CA_CONFIG.pushKey) });
  const j = sub.toJSON();
  await SB.rpc('guardar_suscripcion', { punto:j.endpoint, clave_p256dh:j.keys.p256dh, clave_auth:j.keys.auth });
  toast('✓ Recordatorios activados en este celular', 'ok');
}
async function desactivarPush(){
  const sub = await suscripcionActual(); if(!sub) return;
  await SB.rpc('quitar_suscripcion', { punto:sub.endpoint });
  await sub.unsubscribe();
  toast('Recordatorios desactivados');
}

/* ---------- Clases creadas en el dispositivo antes de la base en línea ---------- */
/* Se busca su clase en línea (por alumnos, maestro y curso) y, si el maestro confirma,
   se le suman los alumnos y las marcas que tenía guardadas aquí. */
let localesRevisadas = 0, revisandoLocales = false;
const clasesLocales = () => Object.values(CLASSES).filter(c => c && !c.remote && c.canEdit !== false && classStudents(c).length);
const marcasLocales = cls => Object.values(cls.att || {}).reduce((n, d) => n + Object.keys(d || {}).length, 0);
// Unir es OBLIGATORIO: las clases que solo existen en el celular ya no se usan; sus alumnos y su
// asistencia deben pasar a la clase en línea.
const sinUnir = () => clasesLocales().filter(c => !c.enLinea);
// Solo se muestran las que FALTAN unir. Las ya unidas no se ven (su asistencia ya está en la clase
// en línea); su copia sigue en el celular como respaldo, sin borrarse.
function localesHTML(){
  const list = sinUnir();
  if(!list.length) return '';
  return `<section class="section unir-oblig"><div class="section-h"><h2>⚠ Une tu clase guardada en este celular</h2></div>
    <p class="hint" style="margin:0 2px 8px"><b>Es obligatorio.</b> ${list.length > 1 ? 'Estas clases se crearon' : 'Esta clase se creó'} antes de la base en línea y ya no sirve para tomar asistencia. <b>Únela a tu clase en línea</b>: sus alumnos y su asistencia se suman a ella y no se pierde nada.</p>
    ${list.map(c => `<div class="item"><span class="ico g">${ICON.book}</span><span class="ii"><b>${esc(c.meta.title || 'Clase')}</b><small>${esc([c.meta.teacher, progLabel(c.meta.program), classStudents(c).length+' alumnos', marcasLocales(c)+' marcas'].filter(Boolean).join(' · '))}${c.esperando ? ' · esperando acceso a la clase en línea' : ''}</small></span><button class="btn gold" data-unir="${esc(c.code)}">Unir ahora</button></div>`).join('')}</section>`;
}
function datosLocal(cls){
  const m = cls.meta || {};
  return {
    maestro:m.teacher || myName() || '', titulo:m.title || '', programa:m.program || '', estaca:m.stake || '',
    alumnos:classStudents(cls).map(s => {
      const marcas = {};
      Object.entries(cls.att || {}).forEach(([d, a]) => { const v = (a || {})[s.id]; if(v && /^\d{4}-\d\d-\d\d$/.test(d)) marcas[d] = v; });
      return { nombre:s.n, estaca:(s.data||{}).k || '', barrio:(s.data||{}).w || '', marcas };
    })
  };
}
async function revisarClasesLocales(){
  revisandoLocales = true;
  try{
    for(const cls of sinUnir()){
      // Ya le dieron acceso a la clase que esperaba: se une sin preguntar otra vez.
      if(cls.esperando && SB.user && (SB.mis||[]).some(x => x.id === cls.esperando)){ await unirClaseLocal(cls, cls.esperando); continue; }
      // (Antes se podía decir "No es ninguna"; ahora unir es obligatorio y se vuelve a preguntar.)
      if(cls.esperando) continue;
      const seguir = await buscarClaseParaLocal(cls, false);
      if(!seguir) break;
    }
  }catch(e){ console.error(e); }
  revisandoLocales = false;
}
/* Devuelve true si se puede pasar a la siguiente clase local. */
async function buscarClaseParaLocal(cls, manual){
  if(!cls) return true;
  let sug = [];
  try{
    await SB.ensureSession();
    const datos = datosLocal(cls);
    sug = await SB.rpc('sugerir_clase_local', { datos:{ maestro:datos.maestro, titulo:datos.titulo, programa:datos.programa, estaca:datos.estaca, alumnos:datos.alumnos.map(a => a.nombre) } });
  }catch(e){ console.error(e); if(manual) toast(errMsg(e), 'error'); return true; }
  const ids = new Set(sug.map(x => x.id));
  const mias = (SB.mis||[]).filter(x => !ids.has(x.id)).map(x => ({ id:x.id, maestro:x.maestro, programa:x.programa, estaca:x.estaca, horario:x.horario, curso:x.curso, alumnos:x.alumnos, tengo_acceso:true, mia:true }));
  const opciones = sug.concat(mias);
  if(!opciones.length){
    // Unir es obligatorio: también se avisa en la revisión automática (y no se apilan más avisos).
    sheet(`${sheetHead('Une tu clase guardada', esc(cls.meta.title || ''))}<p class="hint" style="margin-top:0">Todavía no encontramos en línea una clase que coincida con <b>${esc(cls.meta.title || 'esta clase')}</b>. Toca <b>Entrar a mi clase</b>, búscala por tu nombre y adóptala; luego vuelve al inicio y toca <b>Unir ahora</b>. Es obligatorio para no perder la asistencia guardada en este celular.</p><div class="sh-foot"><button class="btn" data-close>Después</button><button class="btn primary" id="toEnt">Entrar a mi clase</button></div>`, { onMount(el, close){ $('#toEnt', el).onclick = () => { close(); go('#/entrar'); }; } });
    return false;
  }
  const n = classStudents(cls).length;
  return new Promise(res => {
    let fin = false;
    const terminar = v => { if(!fin){ fin = true; res(v); } };
    sheet(`${sheetHead(sug.length ? 'Encontramos una clase para ti' : 'Elige tu clase en línea', esc(cls.meta.title || ''))}
      <div class="warn-box"><b>Unir es obligatorio:</b> la clase guardada en este celular ya no se puede usar para tomar asistencia.</div>
      <div class="info-box">En este dispositivo tienes la clase <b>${esc(cls.meta.title || 'sin título')}</b>${cls.meta.teacher ? ` de <b>${esc(cls.meta.teacher)}</b>` : ''} con <b>${n}</b> alumnos y <b>${marcasLocales(cls)}</b> marcas. Si es la misma clase, sus alumnos y su asistencia se suman a la clase en línea. Lo que ya está marcado en línea no se cambia.</div>
      ${opciones.map((o, i) => `<div class="item" style="margin:8px 0 0"><span class="av">${esc(initials(o.maestro))}</span><span class="ii"><b>${esc(prettyName(o.maestro))}</b><small>${esc([progLabel(o.programa), stakeShort(o.estaca), o.horario, o.curso].filter(Boolean).join(' · '))}</small><small>${o.mia ? 'Una de tus clases' : `<b>${o.coincidentes} de ${n}</b> alumnos coinciden`}${o.adoptada && !o.tengo_acceso ? ' · ya adoptada' : ''}</small></span><button class="btn sm ${i===0 && !o.mia ? 'gold' : ''}" data-op="${i}">Es esta</button></div>`).join('')}
      <div class="sh-foot"><button class="btn ghost" id="noEs">Mi clase no está aquí</button><button class="btn" data-close>Después</button></div>`, {
      wide:true,
      onClose(){ terminar(false); },
      onMount(el, close){
        $('#noEs', el).onclick = () => { close(); terminar(false); go('#/entrar'); toast('Busca tu clase por tu nombre y adóptala. Luego vuelve al inicio y toca “Unir ahora”.', '', { ms:5000 }); };
        $$('[data-op]', el).forEach(b => b.onclick = async () => { close(); terminar(false); await unirClaseLocal(cls, opciones[+b.dataset.op].id, opciones[+b.dataset.op]); });
      }
    });
  });
}

async function unirClaseLocal(cls, id, op){
  try{
    toast('Uniendo tu asistencia…');
    await SB.ensureSession();
    const r = await SB.rpc('unir_clase_local', { clase:id, datos:datosLocal(cls) });
    if(r.estado === 'sin_acceso'){
      cls.esperando = id; saveClasses();
      await confirmBox('Esta clase ya la adoptó otra persona. Pide acceso con tu nombre y apellido: si eres su maestro entrarás al instante y uniremos tu asistencia. Si no, se unirá cuando el administrador te dé acceso.', { title:'Pide acceso primero', ok:'Pedir acceso', cancel:'Cerrar' })
        && openSolicitud(op || { id, maestro:'', horario:'', estaca:cls.meta.stake, programa:cls.meta.program });
      return;
    }
    if(r.estado !== 'unida'){ toast('Esa clase ya no existe.', 'error'); return; }
    cls.enLinea = r.codigo; delete cls.esperando; delete cls.noUnir; saveClasses();
    await SB.refresh();
    sheet(`${sheetHead('✓ Clase unida')}<dl class="kv"><dt>Alumnos agregados</dt><dd>${r.alumnos}</dd><dt>Marcas agregadas</dt><dd>${r.marcas}</dd>${r.distintas ? `<dt>Marcas que ya estaban en línea con otro valor (se mantuvieron)</dt><dd>${r.distintas}</dd>` : ''}</dl>
      <p class="hint">La copia de este dispositivo se conserva como respaldo.</p><div class="sh-foot"><button class="btn primary" id="toCl">Abrir la clase</button></div>`, { onMount(el, close){ $('#toCl', el).onclick = () => { close(); go('#/clase/'+r.codigo); }; } });
    if(CUR.type === 'home') renderHome(true);
  }catch(e){ console.error(e); toast(errMsg(e), 'error'); }
}
/* Iniciar sesión como administrador reemplaza la sesión anónima del dispositivo (con sus clases).
   Se guarda para recuperarla al cerrar la sesión de administrador. */
async function guardarSesionDispositivo(){
  const { data } = await SB.client.auth.getSession();
  const s = data && data.session;
  if(s && s.user && s.user.is_anonymous) LS.set('ca_sesion_dispositivo', { access_token:s.access_token, refresh_token:s.refresh_token });
}
function askAdminOnline(){
  sheet(`${sheetHead('Acceso de administrador')}<form id="alf"><div class="field"><label>Correo</label><input id="aEm" type="email" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="aPw" type="password" autocomplete="current-password"></div></form><div class="sh-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Entrar</button></div>
    <div class="adm-nuevo"><span>¿Eres asistente administrativo de un programa?</span><button class="btn" id="aNuevo">${ICON.userPlus} Crear nuevo administrador</button></div>`, {
    onMount(el, close){
      setTimeout(() => $('#aEm', el).focus(), 250);
      $('#aNuevo', el).onclick = () => { close(); setTimeout(() => openRegistroAdmin(), 250); };
      const tryIt = async () => {
        try{
          await guardarSesionDispositivo();
          const { data, error } = await SB.client.auth.signInWithPassword({ email:$('#aEm', el).value.trim(), password:$('#aPw', el).value });
          if(error) throw error;
          SB.user = data.user;
          await SB.refresh();
          if(!SB.admin){
            // Cuenta de un asistente que pidió su entorno: se le muestra cómo va su solicitud.
            const correo = String((data.user && data.user.email) || '').toLowerCase();
            let sol = null; try{ sol = await SB.rpc('mi_solicitud_entorno'); }catch(e){}
            close();
            if(sol){ await SB.signOut(); mostrarSolicitudEntorno(sol); return; }
            if(DOMINIO_IGLESIA.test(correo)){ toast('Esta cuenta todavía no es de administrador: completa tu solicitud.', 'warn', { ms:5000 }); setTimeout(() => openRegistroAdmin({ sesion:true, correo }), 250); return; }
            await SB.signOut(); toast('Esa cuenta no es de administrador.', 'error'); return;
          }
          close(); toast('Bienvenido', 'ok'); go('#/todas');
        }catch(e){ toast(/invalid/i.test(String(e.message)) ? 'Correo o contraseña incorrectos.' : /not confirmed/i.test(String(e.message)) ? 'Primero confirma tu correo: abre el mensaje que te enviamos al registrarte.' : errMsg(e), 'error', { ms:6000 }); }
      };
      $('#ok', el).onclick = tryIt;
      $('#alf', el).onsubmit = e => { e.preventDefault(); tryIt(); };
    }
  });
}

/* ---------- Entornos: "Crear nuevo administrador" y aprobación del administrador general ----------
   Cada programa (asistente administrativo + coordinador) pide su entorno con su correo de la Iglesia.
   El administrador general lo aprueba; recién ahí la cuenta pasa a ser administradora de ese entorno. */
const DOMINIO_IGLESIA = /@churchofjesuschrist\.org$/i;
// Estacas del formulario: filas { estaca, S, I }. Los pares del servidor ({ estaca, programa }) se agrupan por estaca.
const paresAFilas = pares => { const m = new Map(); (pares || []).forEach(p => { const f = m.get(p.estaca) || { estaca:p.estaca, S:false, I:false }; f[p.programa] = true; m.set(p.estaca, f); }); return [...m.values()]; };
function estacasEditorHTML(filas){
  const fila = x => `<div class="est-row"><input class="inp" list="dlEstacas" placeholder="Ej.: Ica Perú Stake" value="${esc(x.estaca || '')}" autocomplete="off">
    <label class="est-chk"><input type="checkbox" data-p="S" ${x.S ? 'checked' : ''}> Seminario</label>
    <label class="est-chk"><input type="checkbox" data-p="I" ${x.I ? 'checked' : ''}> Instituto</label>
    <button type="button" class="icon-btn sm" data-quitar aria-label="Quitar estaca" title="Quitar">${ICON.x}</button></div>`;
  return `<div class="est-ed" data-fila="${esc(fila({ estaca:'', S:true, I:true }))}">${(filas && filas.length ? filas : [{ estaca:'', S:true, I:true }]).map(fila).join('')}</div>
    <button type="button" class="btn sm" data-agregar-estaca>${ICON.plus} Agregar estaca</button>
    <datalist id="dlEstacas">${estacasConocidas().map(k => `<option value="${esc(k)}">`).join('')}</datalist>`;
}
// Nombres completos que ya existen (de todos los programas): "Ica" se convierte en "Ica Perú Stake".
const estacasConocidas = () => [...new Set([...ENT.todas(), ...ESTACAS_BASE])].sort((a, b) => a.localeCompare(b, 'es'));
function bindEstacasEditor(el){
  const ed = $('.est-ed', el);
  ed.addEventListener('change', e => { const i = e.target.closest('input.inp'); if(!i) return; const n = nucleoEstaca(i.value); const k = n && estacasConocidas().find(x => nucleoEstaca(x) === n); if(k) i.value = k; });
  $('[data-agregar-estaca]', el).onclick = () => { ed.insertAdjacentHTML('beforeend', ed.dataset.fila); const ins = $$('.est-row input.inp', ed); ins[ins.length - 1].focus(); };
  ed.onclick = e => { const b = e.target.closest('[data-quitar]'); if(b){ b.closest('.est-row').remove(); if(!$('.est-row', ed)) $('[data-agregar-estaca]', el).click(); } };
}
const leerEstacas = el => $$('.est-row', el).map(r => ({ estaca:$('input.inp', r).value.trim().replace(/\s+/g, ' '), S:$('[data-p="S"]', r).checked, I:$('[data-p="I"]', r).checked }))
  .filter(x => x.estaca && (x.S || x.I));
const estacasTxt = filas => filas.map(f => `${f.estaca} (${[f.S && 'Seminario', f.I && 'Instituto'].filter(Boolean).join(' e ')})`).join(' · ');

// Formulario. sesion: la cuenta ya existe y entró con su contraseña (se envía con esa sesión).
function openRegistroAdmin({ sesion=false, correo='' }={}){
  let enviado = false;
  const campo = (id, label, ph='', tipo='text', extra='') => `<div class="field"><label>${label}</label><input id="${id}" type="${tipo}" placeholder="${esc(ph)}" ${extra}></div>`;
  sheet(`${sheetHead('Crear nuevo administrador', 'Para el asistente administrativo de un programa de Seminarios e Institutos')}
    <p class="hint" style="margin-top:0">Completa los datos de tu programa. El administrador general revisará tu solicitud; cuando la apruebe tendrás tu propio entorno para sincronizar tus Class Roll, tu base de personas, Programados, Potenciales, el Audit y tus informes.</p>
    <form id="rgf" autocomplete="on">
      ${campo('rgProg', 'Nombre del programa', 'Ej.: Programa Arequipa')}
      <h3 class="rg-h">Asistente administrativo</h3>
      <div class="row2">${campo('rgAsN', 'Nombre y apellidos', '', 'text', 'autocomplete="name"')}${campo('rgAsC', 'Celular', '9XX XXX XXX', 'tel', 'inputmode="tel"')}</div>
      <h3 class="rg-h">Coordinador</h3>
      <div class="row2">${campo('rgCoN', 'Nombre y apellidos')}${campo('rgCoC', 'Celular', '9XX XXX XXX', 'tel', 'inputmode="tel"')}</div>
      <h3 class="rg-h">Estacas a cargo</h3>
      <p class="hint" style="margin:0 0 8px">Escríbelas como aparecen en Wise (por ejemplo «Ica Perú Stake») y marca si llevas Seminario, Instituto o los dos.</p>
      ${estacasEditorHTML([])}
      <h3 class="rg-h">Tu cuenta</h3>
      ${sesion ? `<p class="hint" style="margin:0">Se enviará con tu cuenta <b>${esc(correo)}</b>.</p>` : `
        ${campo('rgMail', 'Correo de la Iglesia', 'nombre@churchofjesuschrist.org', 'email', 'autocomplete="username"')}
        <div class="row2">${campo('rgPw1', 'Contraseña', 'Mínimo 8 caracteres', 'password', 'autocomplete="new-password"')}${campo('rgPw2', 'Repite la contraseña', '', 'password', 'autocomplete="new-password"')}</div>
        <p class="hint" style="margin:0">Solo se aceptan correos <b>@churchofjesuschrist.org</b>. Con este correo y contraseña entrarás en «Soy administrador».</p>`}
    </form>
    <div class="sh-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="rgOk">Enviar solicitud</button></div>`, {
    wide:true,
    onClose(){ if(sesion && !enviado) SB.signOut().catch(() => {}); },
    onMount(el, close){
      bindEstacasEditor(el);
      setTimeout(() => $('#rgProg', el).focus(), 250);
      const btn = $('#rgOk', el);
      const enviar = async () => {
        const v = id => ($('#' + id, el) ? $('#' + id, el).value.trim() : '');
        const tel = s => s.replace(/[^0-9+]/g, '');
        const datos = { programa:v('rgProg'), asistente_nombre:v('rgAsN'), asistente_celular:tel(v('rgAsC')), coordinador_nombre:v('rgCoN'), coordinador_celular:tel(v('rgCoC')), estacas:leerEstacas(el) };
        const falta = !datos.programa ? 'el nombre del programa' : !datos.asistente_nombre ? 'el nombre del asistente administrativo' : datos.asistente_celular.replace('+', '').length < 9 ? 'el celular del asistente administrativo'
          : !datos.coordinador_nombre ? 'el nombre del coordinador' : datos.coordinador_celular.replace('+', '').length < 9 ? 'el celular del coordinador' : !datos.estacas.length ? 'al menos una estaca (con Seminario o Instituto)' : '';
        if(falta) return toast('Falta ' + falta + '.', 'warn');
        const email = sesion ? correo : v('rgMail').toLowerCase(), pw = sesion ? '' : $('#rgPw1', el).value;
        if(!sesion){
          if(!DOMINIO_IGLESIA.test(email)) return toast('Usa tu correo @churchofjesuschrist.org.', 'warn');
          if(pw.length < 8) return toast('La contraseña debe tener al menos 8 caracteres.', 'warn');
          if(pw !== $('#rgPw2', el).value) return toast('Las contraseñas no coinciden.', 'warn');
        }
        btn.disabled = true;
        try{
          if(sesion){
            const sol = await SB.rpc('solicitar_entorno', { datos });
            enviado = true; close(); await SB.signOut();
            return mostrarSolicitudEntorno(sol, { nueva:true });
          }
          await guardarSesionDispositivo();
          const { data, error } = await SB.client.auth.signUp({ email, password:pw, options:{ data:{ nombre:datos.asistente_nombre, solicitud_entorno:datos } } });
          if(error) throw error;
          // Correo ya registrado: Supabase responde sin error pero sin identidades.
          if(data && data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw new Error('already registered');
          enviado = true; close();
          // Sin confirmación por correo la cuenta queda abierta aquí: se vuelve a la sesión del dispositivo.
          if(data && data.session) await SB.signOut();
          sheet(`${sheetHead('✓ Solicitud enviada', esc(datos.programa))}
            <p>El administrador general revisará tu solicitud y se comunicará contigo.</p>
            ${data && data.session ? '' : '<div class="info-box">Te enviamos un correo para <b>confirmar tu cuenta</b>: ábrelo y confirma. Si no lo ves, revisa la carpeta de spam.</div>'}
            <p class="hint">Cuando la aprueben, entra con <b>Soy administrador</b> (al pie de la página) usando <b>${esc(email)}</b> y tu contraseña.</p>
            <div class="sh-foot"><button class="btn primary" data-close>Entendido</button></div>`);
        }catch(e){
          console.error(e);
          const m = String((e && (e.message || e.code)) || '');
          toast(/already registered|already been registered|user already exists/i.test(m) ? 'Ese correo ya tiene una cuenta: entra con «Soy administrador» y tu contraseña para ver o enviar tu solicitud.'
            : /not authorized|email_address_not_authorized|sending confirmation|confirmation email/i.test(m) ? 'No se pudo enviar el correo de confirmación. Avisa al administrador general.'
            : /password/i.test(m) && /weak|short|least/i.test(m) ? 'Esa contraseña es muy débil: usa letras y números (mínimo 8).'
            : errMsg(e), 'error', { ms:8000 });
        }finally{ btn.disabled = false; }
      };
      btn.onclick = enviar;
      $('#rgf', el).onsubmit = e => { e.preventDefault(); enviar(); };
    }
  });
}
function mostrarSolicitudEntorno(sol, { nueva=false }={}){
  const prog = esc((sol && sol.programa) || 'tu programa');
  const txt = !sol ? 'No encontramos tu solicitud.'
    : sol.estado === 'pendiente' ? `${nueva ? 'Recibimos' : 'Tenemos'} tu solicitud para <b>${prog}</b>. Está en revisión: cuando el administrador general la apruebe podrás entrar con «Soy administrador».`
    : sol.estado === 'rechazado' ? `Tu solicitud para <b>${prog}</b> no fue aprobada. Comunícate con el administrador general.`
    : sol.estado === 'suspendido' ? `El entorno <b>${prog}</b> está suspendido. Comunícate con el administrador general.`
    : `Tu entorno <b>${prog}</b> ya está activo. Vuelve a entrar con «Soy administrador».`;
  sheet(`${sheetHead(sol && sol.estado === 'pendiente' ? '⏳ Solicitud en revisión' : 'Solicitud de administrador')}<p>${txt}</p><div class="sh-foot"><button class="btn primary" data-close>Entendido</button></div>`);
}

  app.innerHTML = topbar({ back:'#/', title:'Administradores', sub:'Entornos de cada programa' }) + `<main class="wrap wide"><div id="admBody">${loadingHTML()}</div></main>`;

  const ESTADO = { pendiente:['Pendiente', 'b-new'], activo:['Activo', 'b-ok'], rechazado:['Rechazado', 'b-ro'], suspendido:['Suspendido', 'b-ro'] };

        <dt>Estacas</dt><dd>${est.length ? est.map(f => `<span class="est-tag">${esc(f.estaca)}<small>${[f.S && 'S', f.I && 'I'].filter(Boolean).join(' · ')}</small></span>`).join('') : '<i class="muted">Ninguna</i>'}</dd>
      </dl>
      <div class="btn-row adm-acc">
        ${x.estado === 'pendiente' ? `<button class="btn primary" data-acc="aprobar">${ICON.check} Aprobar</button><button class="btn" data-acc="editar">${ICON.edit} Editar</button><button class="btn" data-acc="rechazar">Rechazar</button>`
          : x.estado === 'activo' ? `${x.actual ? '' : `<button class="btn primary" data-acc="entrar">${ICON.next} Entrar a este entorno</button>`}<button class="btn" data-acc="editar">${ICON.edit} Editar datos y estacas</button>${x.principal ? '' : '<button class="btn" data-acc="suspender">Suspender</button>'}`
          : `<button class="btn" data-acc="aprobar">${ICON.check} ${x.estado === 'suspendido' ? 'Reactivar' : 'Aprobar'}</button><button class="btn" data-acc="editar">${ICON.edit} Editar</button>`}

    <div class="section-h" style="margin-top:22px"><h2>Activos</h2></div>${act.map(tarjeta).join('')}
    ${otros.length ? `<details class="section" style="margin-top:22px"><summary class="hint"><b>Rechazados y suspendidos (${otros.length})</b></summary>${otros.map(tarjeta).join('')}</details>` : ''}`;
  $$('[data-wa]', body).forEach(a => a.onclick = e => { e.preventDefault(); waOpen('', a.dataset.wa); });

  $$('[data-acc]', body).forEach(b => b.onclick = () => {

      onMount(el, close){
        $('#admOk', el).onclick = async () => {
          try{ await SB.rpc('resolver_entorno', { entorno:x.id, estado: acc === 'aprobar' ? 'activo' : acc === 'rechazar' ? 'rechazado' : 'suspendido' }); close(); toast(acc === 'aprobar' ? 'Entorno activo' : 'Listo', 'ok'); recargar(); }

}
function editarEntorno(x, despues){

    <h3 class="rg-h">Coordinador</h3><div class="row2">${campo('edCoN', 'Nombre y apellidos', x.coordinador_nombre)}${campo('edCoC', 'Celular', x.coordinador_celular, 'tel')}</div>
    <h3 class="rg-h">Estacas</h3><p class="hint" style="margin:0 0 8px">Deben coincidir con el nombre de la estaca en Wise y en las clases (por ejemplo «Ica Perú Stake»).</p>

      };
    }
  });
}

/* ---------- Entrar a mi clase ---------- */
function renderEntrar(){
  CUR = { type:'entrar', code:null };
  app.innerHTML = topbar({ back:'#/', title:'Entrar a mi clase', sub:'Seminarios e Institutos' }) + `<main class="wrap">
    <section class="card"><h2>${ICON.search} ¿Cómo te llamas?</h2>
      <p class="hint" style="margin-top:0">Escribe tu nombre y apellido como maestro de la clase.</p>
      <div class="search-box"><span class="si">${ICON.search}</span><input id="tq" type="search" placeholder="Nombre y apellido…" autocomplete="off" spellcheck="false" value="${esc(myName())}"></div>
      <div id="tres" class="results" style="margin-top:12px"></div>
    </section></main>`;
  bindTop();
  const q = $('#tq');
  const run = debounce(() => buscarMiClase(q.value), 300);
  q.oninput = run;
  setTimeout(() => q.focus(), 100);
  if(q.value) buscarMiClase(q.value);
}
async function buscarMiClase(txt){
  const el = $('#tres'); if(!el) return;
  if(norm(txt).length < 3){ el.innerHTML = '<p class="hint" style="margin:0 2px">Sigue escribiendo para ver las clases.</p>'; return; }
  try{
    await SB.ensureSession();
    const list = await SB.rpc('buscar_clases', { texto:txt });
    if($('#tq') && $('#tq').value !== txt) return;

/* ---------- Importar clases desde el reporte Class Roll ---------- */
const ROLL_MES = { jan:1, ene:1, feb:2, mar:3, apr:4, abr:4, may:5, jun:6, jul:7, aug:8, ago:8, sep:9, set:9, oct:10, nov:11, dec:12, dic:12 };
function rollDate(s){ const m = String(s).trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/); if(!m || !ROLL_MES[m[2].toLowerCase()]) return null; return `${m[3].length===2?'20'+m[3]:m[3]}-${pad2(ROLL_MES[m[2].toLowerCase()])}-${pad2(m[1])}`; }
const rollClean = s => String(s ?? '').replace(/\s+/g,' ').trim();
function levenshtein(a, b){ if(Math.abs(a.length-b.length) > 3) return 9; let p = Array.from({length:b.length+1}, (_, i) => i); for(let i=1;i<=a.length;i++){ const c = [i]; for(let j=1;j<=b.length;j++) c[j] = Math.min(p[j]+1, c[j-1]+1, p[j-1]+(a[i-1]===b[j-1]?0:1)); p = c; } return p[b.length]; }
/* El reporte a veces repite el apellido: "Pérez Soto, Pérez Soto, Ana" o "Pérez Soto, Ana, Pérez Soto". */
function rollName(n){
  const parts = rollClean(n).split(',').map(s => s.trim()).filter(Boolean);
  if(parts.length < 2) return parts.join('');
  const ape = parts[0];
  const rest = parts.slice(1).filter(x => levenshtein(norm(x), norm(ape)) > 2);
  let nom = rest.join(' ') || parts[parts.length-1];
  const i = norm(nom).lastIndexOf(norm(ape));
  if(i > 0 && norm(nom).endsWith(norm(ape))) nom = nom.split(/\s+/).slice(0, -ape.split(/\s+/).length).join(' ') || nom;
  return `${ape}, ${nom}`;
}
function rollStake(u){ return estacaCanon(u); }
function parseRollWorkbook(wb, progDefault){
  const clases = [], avisos = [];
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:false, defval:'' });
    // Valores crudos: los Class Roll de Power BI traen las fechas como número de serie de Excel.
    const crudo = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:true, defval:'' });
    const serial = v => typeof v === 'number' && v > 30000 && v < 80000 ? new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5).toISOString().slice(0, 10) : null;
    const titulo = rows.slice(0,3).map(r => rollClean(r && r[0])).join(' ');
    const mT = titulo.match(/Class Roll\s*(.*?)\s*\(\d+\)/i);
    const unidad = mT ? mT[1] : titulo;
    const periodo = (rows.slice(0,5).map(r => rollClean(r && r[0])).join(' ').match(/T[ée]rmino:\s*(.*?)(?:\s*Fecha|\s*$)/i) || [])[1] || '';
    let cur = null, cols = [], enLista = false, halladas = 0;
    rows.forEach((r, ri) => {
      const head = r.map(rollClean).find(c => / - .+ - /.test(c));
      if(head){
        const p = head.split(' - ');
        const tok = p[0].trim().split(/\s+/);
        const up = norm(unidad).toUpperCase();
        const programa = /\bSEM\b/.test(up) ? 'S' : /\bINS?T?\b/.test(up) ? 'I' : progDefault;
        cur = { unidad, periodo, estaca:rollStake(unidad), programa, maestro:p.slice(1,-1).join(' - ').trim(), horario: programa === 'I' ? p[0].trim() : tok.slice(1).join(' '), curso:p[p.length-1].trim(), fechas:[], alumnos:[], total:null, desconocidas:0 };
        const tot = r.map(rollClean).find(c => /Total de alumnos/i.test(c)); if(tot) cur.total = +tot.replace(/\D/g,'');
        clases.push(cur); halladas++; cols = []; enLista = false; return;
      }
      if(!cur) return;
      if(rollClean(r[0]) === 'Nombre'){ enLista = true; cols = []; r.forEach((c, j) => { const d = rollDate(c) || serial((crudo[ri] || [])[j]); if(d) cols.push([j, d]); }); cur.fechas = cols.map(x => x[1]); return; }
      if(!enLista) return;
      const n = rollClean(r[0]); if(!n || !n.includes(',')) return;
      const marcas = {};
      cols.forEach(([j, d]) => { const v = rollClean(r[j]).toUpperCase(); if(!v) return; if(v === 'A') marcas[d] = 'F'; else if(ATT_TXT[v]) marcas[d] = v; else cur.desconocidas++; });
      cur.alumnos.push({ nombre:rollName(n), marcas });
    });
    if(!halladas) avisos.push(`${sn}: no se encontró una clase`);
  });
  clases.forEach(c => {
    const f = c.fechas.slice().sort();
    c.titulo = c.programa === 'I' ? c.curso : [c.curso, c.horario].filter(Boolean).join(' · ');
    c.inicio = f[0] || todayISO();
    c.dias = [...new Set(f.map(d => parseISO(d).getDay()))].filter(d => d !== 0);
    if(!c.estaca) avisos.push(`${c.maestro}: no se reconoció la estaca “${c.unidad}”`);
    if(c.total != null && c.total > c.alumnos.length) avisos.push(`${c.maestro}: el reporte dice ${c.total} alumnos y se leyeron ${c.alumnos.length}`);
    if(!f.length) avisos.push(`${c.maestro} (${c.horario}): el reporte no trae fechas; el maestro podrá agregarlas al marcar`);
    if(c.desconocidas) avisos.push(`${c.maestro}: ${c.desconocidas} marcas con letras desconocidas se omitieron`);
  });
  return { clases, avisos };
}

        if(CUR.type === 'todas') route();

async function parseRollFiles(files, prog){
  await loadScript(SHEETJS_URL);
  const out = { clases:[], avisos:[] };
  for(const f of files){
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array', raw:false });
    const r = parseRollWorkbook(wb, prog);
    out.clases.push(...r.clases); out.avisos.push(...r.avisos.map(a => `${f.name} · ${a}`));
  }
  return out;
}
function finDeClase(c){
  if(c.programa === 'I') return c.fechas.slice().sort().pop() || '';
  const p = currentPeriod('S');
  return p ? p.e : '';
}
async function importRollClases(lista, onStep){
  const res = { nuevas:0, alumnos:0, marcas:0, errores:[] };
  for(let i=0;i<lista.length;i++){
    onStep && onStep(i+1);
    const c = lista[i];
    try{
      const r = await SB.rpc('importar_clase', { datos:{ titulo:c.titulo, programa:c.programa, estaca:c.estaca, maestro:c.maestro, horario:c.horario, curso:c.curso, unidad:c.unidad, periodo:c.periodo, dias:c.dias, inicio:c.inicio, fin:finDeClase(c), alumnos:c.alumnos } });
      if(r.nueva) res.nuevas++;
      res.alumnos += r.alumnos; res.marcas += r.marcas;
    }catch(e){ console.error(e); res.errores.push(`${c.maestro}: ${errMsg(e)}`); }
  }
  return res;
}

/* ---------- Class Roll de Wise: lectura diaria de la carpeta "DEL DÍA" ----------
   El administrador vincula una vez la carpeta (Edge/Chrome recuerdan el permiso). Cada vez que abre la app
   se leen solo los Excel que cambiaron; cada clase de Wise se guarda en la nube y se vincula con su clase de
   la app. Lo de Wise no reemplaza la asistencia de la app: se muestra al lado en la Planilla. */
function fsdb(){ return new Promise((res, rej) => { const q = indexedDB.open('ca_fs', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function fsGet(k){ const db = await fsdb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function fsSet(k, v){ const db = await fsdb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function rollArchivos(dir, ruta, out, prof){
  for await (const [name, h] of dir.entries()){
    const p = ruta + '/' + name;
    if(h.kind === 'directory'){ if(prof < 3) await rollArchivos(h, p, out, prof + 1); }
    else if(/\.xlsx$/i.test(name) && !/^~\$/.test(name) && (/class roll|audit/i.test(p) || /^(potenciales|programados)/i.test(name))) out.push({ path:p, handle:h });
  }
  return out;

function parseAuditWorkbook(wb){

  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:true, defval:'' });
    let cur = null;
    rows.forEach(r => {
      const vals = r.filter(v => String(v).trim() !== '');
      if(!vals.length) return;

function wiseDeAudit(a, wises, usados){

/* ---------- Envío masivo guiado (estilo Wapi): un WhatsApp personalizado por maestro ----------

   administrador presiona Enviar en WhatsApp. Opcionalmente también deja el mensaje en la app. */
const MASIVO_TPL = 'Hola {nombre} 👋\n\nSegún el reporte de Wise, tu clase *{clase}* tiene *{sesiones}* sin marcar desde el *{desde}* ({dias} días).\n\nPor favor actualiza la asistencia lo antes posible. ¡Gracias por tu servicio! 🙏\n\n👉 Entra directo a tu clase:\n{enlace}';
function textoMasivo(tpl, it){
  const n = it.audit ? it.audit.sesiones : it.roll ? it.roll.sesiones : 0;
  const nom = /unassigned/i.test(it.maestro) ? '' : prettyName(it.maestro).split(/\s+/)[0];
  const clase = [it.w ? it.w.curso : it.audit.curso, it.w ? (it.programa === 'S' ? it.w.horario : '') : it.audit.hora].filter(Boolean).join(' · ');
  const v = { nombre: nom, clase, sesiones: `${n} sesi${n === 1 ? 'ón' : 'ones'}`, desde: it.desde ? fmtDate(it.desde).replace(/\s\d{4}$/, '') : '', dias: it.dias,
    enlace: location.origin + location.pathname + '#/clase/' + it.app.codigo, estaca: stakeShort(it.estaca), maestro: prettyName(it.maestro) };
  return tpl.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m).replace(/Hola\s+👋/, 'Hola 👋');
}

// Sincronización automática (administrador, mientras la app está abierta). Modos:
//  "cambios": al abrir la app y cada 15 min revisa si algún Excel cambió (lee solo los nuevos).
//  "9am": una vez al día, la primera vez que la app está abierta desde las 9:00.
//  "manual": solo con el botón "Sincronizar ahora".
const ROLL_MODOS = { cambios:'Cuando cambie algún archivo', '9am':'Una vez al día desde las 9:00', manual:'Solo manual' };
const rollModo = () => LS.get('ca_roll_modo', 'cambios');
function rollAutoIniciar(){
  if(rollAutoIniciar.on || !window.showDirectoryPicker) return;
  rollAutoIniciar.on = true;
  setInterval(() => { if(SB.admin) rollAuto(); }, 5 * 60e3);
}
async function rollAuto(){
  if(!SB.admin || !window.showDirectoryPicker) return;
  rollAutoIniciar();
  const modo = rollModo(), ahora = new Date();
  if(modo === 'manual') return;
  if(modo === '9am'){
    const nueve = new Date(ahora); nueve.setHours(9, 0, 0, 0);
    if(ahora < nueve || LS.get('ca_roll_ultima', 0) >= +nueve) return;
  } else if(Date.now() - (rollAuto.t || 0) < 15 * 60e3) return;
  rollAuto.t = Date.now();
  try{
    const r = await leerClassRoll();
    // Edge/Chrome vuelven a pedir permiso al reabrir el navegador: sin un toque no se puede leer la carpeta.
    if(r.sinPermiso){
      rollAuto.t = 0;
      if(!rollAuto.avisado){ rollAuto.avisado = true; toast('Class Roll de Wise: el navegador pide permiso para leer la carpeta DEL DÍA', 'warn', { ms:30000, action:'Permitir', onAction: rollPermitir }); }
      return;
    }
    if(r.sinCambios) LS.set('ca_roll_ultima', Date.now());
    if(r.fallidos && r.fallidos.length && !r.leidos && !r.sinCambios) console.warn('Class Roll automático: archivos sin leer', r.fallidos);
    if(r.base && !r.base.error && !r.leidos) toast(`Base de personas actualizada desde Potenciales · ${r.base.nuevas} nuevas · ${r.base.resueltas} alertas resueltas`, 'ok', { ms:4500 });
    if(r.leidos) toast(`Class Roll de Wise actualizado · ${r.clases} clases${r.pendientes ? ` · ${r.pendientes} por crear o vincular` : ''}`, r.pendientes ? 'warn' : 'ok', { ms:4500, action: r.pendientes ? 'Ver' : undefined, onAction: () => go('#/wiseroll') });
  }catch(e){ console.warn('Class Roll automático', e); }
}
// Toque del administrador: pide el permiso de la carpeta y lee (o abre la pantalla, si ya está ahí).

  if(CUR.type === 'wiseroll'){ const l = $('#wrLeer'); if(l){ l.click(); return; } }
  try{
    const dir = await fsGet('rollDir');
    if(!dir || (await dir.requestPermission({ mode:'read' })) !== 'granted'){ go('#/wiseroll'); return; }

  }catch(e){ console.error(e); go('#/wiseroll'); }
}

// Trae todas las filas de una consulta, de 1000 en 1000. build() arma la consulta (sin .range).
async function traerTodo(build){
  const out = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await build().range(from, from + 999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) return out;
  }
}
const ORDINAL_SEM = ['Primera', 'Segunda', 'Tercera', 'Cuarta', 'Quinta'];
/* Semanas de lunes a domingo. Cada semana es del mes donde cae su jueves (como el calendario ISO),
   así ninguna semana queda de un solo día. n = 1.ª, 2.ª… semana de ese mes. */
function semanasDelRango(s, e){
  const ini = parseISO(s), fin = parseISO(e);
  const lun = new Date(ini); lun.setDate(ini.getDate() - ((ini.getDay() + 6) % 7));
  const out = [];
  for(const d = new Date(lun); d <= fin; d.setDate(d.getDate() + 7)){
    const dom = new Date(d); dom.setDate(d.getDate() + 6);
    const jue = new Date(d); jue.setDate(d.getDate() + 3);
    out.push({ lun:iso(d), dom:iso(dom), mes:iso(jue).slice(0, 7), n:Math.ceil(jue.getDate() / 7),
      desde: iso(d) < s ? s : iso(d), hasta: iso(dom) > e ? e : iso(dom) });
  }
  return out;
}
const rangoCorto = (a, b) => { const x = parseISO(a), y = parseISO(b); return x.getMonth() === y.getMonth() ? `del ${x.getDate()} al ${y.getDate()}` : `del ${x.getDate()} ${MES[x.getMonth()]} al ${y.getDate()} ${MES[y.getMonth()]}`; };

/* ---------- Informe para presidentes de estaca ----------
   Se arma con Potenciales.xlsx y Programados.xlsx de Wise (carpeta DEL DÍA). Las edades y las fechas de
   confirmación y de regreso de la misión se usan solo aquí, en la memoria del navegador, para contar.
   A la nube (tabla informe_estacas, solo administrador) van únicamente los totales por barrio y estaca. */
const PRES_EDAD = { sem:[14, 17], i1:[18, 25], i2:[26, 35], nc2:[18, 35] };
const enEdad = (e, [a, b]) => e != null && e >= a && e <= b;
// Primera hoja de un export de Wise → objetos con los encabezados normalizados ("stake district", "term number"…).
function xlFilas(wb){
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
  const hi = aoa.findIndex(r => r.some(c => /^student name$/i.test(String(c).trim())));
  if(hi < 0) throw new Error('no tiene la columna "Student Name"');
  const H = aoa[hi].map(h => norm(h));
  return aoa.slice(hi + 1).map(r => { const o = {}; H.forEach((h, i) => { if(h) o[h] = r[i]; }); return o; })
    .filter(o => String(o['student name'] || '').trim() && !/^filtros/i.test(String(o['student name'])));
}
// Fecha de Excel (número de serie o texto) → AAAA-MM-DD.
function xlFecha(v){
  if(v === '' || v == null) return '';
  if(typeof v === 'number') return v > 1000 ? new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10) : '';
  if(v instanceof Date) return iso(v);
  const s = String(v).trim(); let m;
  if((m = s.match(/^(\d{4})-(\d\d)-(\d\d)/))) return m[0];
  if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))){ const a = +m[1], b = +m[2], [mo, d] = a > 12 ? [b, a] : [a, b]; return `${m[3]}-${pad2(mo)}-${pad2(d)}`; }
  const d = new Date(s); return isNaN(d) ? '' : iso(d);
}
const estacaDeTxt = s => estacaCanon(s);
const barrioCorto = w => { const s = String(w || '').trim(); return /\bbranch$/i.test(s) ? s.replace(/\s*branch$/i, '') + ' (Rama)' : s.replace(/\s*ward$/i, ''); };
function calcPresidentes(pot, prog, hoy){
  const persona = (n, k) => wiseTokens(n).slice().sort().join(' ') + '|' + k;
  const edadDe = v => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };
  // det: quiénes están detrás de cada número (solo en memoria, para ver los nombres al tocar un número).
  const nom = new Map(), ins = new Map(), cls = new Map();
  const out = {};
  const E = k => out[k] = out[k] || { barrios:{}, mp:new Set(), mpCls:new Set(), maeI:new Set() };
  const COLS_SET = ['semPot', 'semEnr', 'i1Pot', 'i1Enr', 'i2Pot', 'i2Enr', 'nc1', 'nc1Enr', 'nc2', 'nc2Enr', 'rm', 'rmEnr', 'maeS'];
  const B = (e, w) => e.barrios[w] = e.barrios[w] || Object.fromEntries(COLS_SET.map(c => [c, new Set()]));
  const si = v => /^(yes|si|sí|1|true)$/i.test(String(v).trim());
  // Programados: alumnos enrolados en el año escolar, sin los que se retiraron.
  const filas = prog.map(r => { const p = String(r.program || ''); return { r, tipo: /\bSEM\b/i.test(p) ? 'S' : /\bIN\b|\bINST/i.test(p) ? 'I' : '', ek:estacaDeTxt(r['stake district']), pk:estacaDeTxt(p), w:barrioCorto(r['ward branch']), t:parseInt(r['term number'], 10) || 0, edad:edadDe(r.age), n:String(r['student name']).trim() }; })
    .filter(x => x.tipo && (r => r.enrolled === undefined || si(r.enrolled))(x.r) && !si(x.r.dropped));
  // Periodo actual de cada programa: el último que trae Programados.
  const term = { S:Math.max(0, ...filas.filter(x => x.tipo === 'S').map(x => x.t)), I:Math.max(0, ...filas.filter(x => x.tipo === 'I').map(x => x.t)) };
  const actuales = new Set(), maeSem = new Map();
  filas.forEach(x => {
    const cur = x.t === term[x.tipo];
    if(x.ek){
      const per = persona(x.n, x.ek); nom.set(per, x.n);
      if(cur) actuales.add(per);
      if(x.w){ const b = B(E(x.ek), x.w);
        if(x.tipo === 'S') b.semEnr.add(per);
        else if(enEdad(x.edad, PRES_EDAD.i1)) b.i1Enr.add(per);
        else if(enEdad(x.edad, PRES_EDAD.i2)) b.i2Enr.add(per); }
    }
    const pk = x.pk || x.ek, mae = norm(x.r.instructor);
    if(!pk || !cur) return;
    if(mae) ins.set(mae, String(x.r.instructor).trim());
    if(x.tipo === 'I'){
      if(mae) E(pk).maeI.add(mae);
      if(/missionary prep|preparaci.n misional/i.test(String(x.r.course || ''))){
        const per = persona(x.n, pk), c = [mae, norm(x.r.course), norm(x.r.section)].join('|');
        nom.set(per, x.n); E(pk).mp.add(per); E(pk).mpCls.add(c);
        cls.set(c, [String(x.r.course || '').trim(), String(x.r.section || '').trim(), String(x.r.instructor || '').trim()].filter(Boolean).join(' · '));
      }
    } else if(mae && x.ek === pk && x.w){
      // Cada maestro de Seminario cuenta en el barrio donde tiene más alumnos.
      const key = pk + '|' + mae, m = maeSem.get(key) || new Map(); m.set(x.w, (m.get(x.w) || 0) + 1); maeSem.set(key, m);
    }
  });
  maeSem.forEach((m, key) => { const i = key.indexOf('|'), k = key.slice(0, i), w = [...m.entries()].sort((a, b) => b[1] - a[1])[0][0]; B(E(k), w).maeS.add(key.slice(i + 1)); });
  // Potenciales: potencial por edad, nuevos conversos y misioneros retornados de los últimos 12 meses.
  const d = parseISO(hoy); d.setFullYear(d.getFullYear() - 1); const desde = iso(d);
  const vistos = new Set();
  pot.forEach(r => {
    const k = estacaDeTxt(r['stake district']), w = barrioCorto(r['ward branch']); if(!k || !w) return;
    const per = persona(r['student name'], k); if(vistos.has(per)) return; vistos.add(per);
    nom.set(per, String(r['student name']).trim());
    const edad = edadDe(r.age), b = B(E(k), w), en = actuales.has(per);
    if(enEdad(edad, PRES_EDAD.sem)) b.semPot.add(per); else if(enEdad(edad, PRES_EDAD.i1)) b.i1Pot.add(per); else if(enEdad(edad, PRES_EDAD.i2)) b.i2Pot.add(per);
    const conf = xlFecha(r['confirmation date']);
    if(conf && conf >= desde && conf <= hoy){
      if(enEdad(edad, PRES_EDAD.sem)){ b.nc1.add(per); if(en) b.nc1Enr.add(per); }
      else if(enEdad(edad, PRES_EDAD.nc2)){ b.nc2.add(per); if(en) b.nc2Enr.add(per); }
    }
    const rm = xlFecha(r['mission release date']);
    if(rm && rm >= desde && rm <= hoy){ b.rm.add(per); if(en) b.rmEnr.add(per); }
  });
  const porEstaca = {};
  Object.entries(out).forEach(([k, e]) => {
    porEstaca[k] = {
      barrios: Object.entries(e.barrios).map(([w, b]) => ({ b:w, ...Object.fromEntries(COLS_SET.map(c => [c, b[c].size])) })).sort((a, b) => a.b.localeCompare(b.b, 'es')),
      mpEnr:e.mp.size, mpCls:e.mpCls.size, maeI:e.maeI.size };
  });
  return { porEstaca, term, det:{ est:out, nom, ins, cls } };
}
// Detalle con nombres de la última cuenta, en la memoria de esta página (se borra al salir del informe).
// En la nube (columna "nombres", solo administrador) va empacado por estaca: solo nombres, sin edades ni fechas.
let PRES_DET = null;
function presEmpacar(det, k){
  const x = det.est[k]; if(!x) return {};
  const N = [], I = [], C = [], iN = new Map(), iI = new Map(), iC = new Map();
  const idx = (map, arr, id, lab) => { if(!map.has(id)){ map.set(id, arr.length); arr.push(lab); } return map.get(id); };
  const pn = id => idx(iN, N, id, det.nom.get(id) || ''), pi = id => idx(iI, I, id, det.ins.get(id) || ''), pc = id => idx(iC, C, id, det.cls.get(id) || '');
  const b = {};
  Object.entries(x.barrios).forEach(([w, s]) => { b[w] = {}; Object.entries(s).forEach(([col, set]) => { if(set.size) b[w][col] = [...set].map(col === 'maeS' ? pi : pn); }); });
  return { n:N, i:I, c:C, b, mp:[...x.mp].map(pn), mpCls:[...x.mpCls].map(pc), maeI:[...x.maeI].map(pi) };
}
function presDesempacar(rows){
  const det = { est:{}, nom:new Map(), ins:new Map(), cls:new Map() };
  rows.forEach(r => {
    const z = r.nombres, k = r.estaca; if(!z || !z.n) return;
    const P = i => { const id = k + '|p' + i; det.nom.set(id, z.n[i]); return id; };
    const Q = i => { const id = k + '|i' + i; det.ins.set(id, z.i[i]); return id; };
    const L = i => { const id = k + '|c' + i; det.cls.set(id, z.c[i]); return id; };
    const barrios = {};
    Object.entries(z.b || {}).forEach(([w, cols]) => { barrios[w] = {}; Object.entries(cols).forEach(([col, arr]) => { barrios[w][col] = new Set(arr.map(col === 'maeS' ? Q : P)); }); });
    det.est[k] = { barrios, mp:new Set((z.mp || []).map(P)), mpCls:new Set((z.mpCls || []).map(L)), maeI:new Set((z.maeI || []).map(Q)) };
  });
  return det;
}
// Cada entorno guarda sus filas por estaca (clave entorno + estaca; el entorno lo pone el servidor).

async function presGuardarEstacas(filas){

async function armarInformePresidentes(potFile, progFile, { guardarNombres=false }={}){

  const hoy = todayISO();

  const meta = { fecha:hoy, pot:new Date(potFile.lastModified).toISOString(), prog:new Date(progFile.lastModified).toISOString(), term:R.term };
  PRES_DET = guardarNombres ? { ...R.det, sello:meta.pot + '|' + meta.prog } : null;

// Busca Potenciales y Programados en la carpeta DEL DÍA vinculada (la misma del Class Roll).
async function presArchivosCarpeta(interactive){
  const dir = await conTiempo(fsGet('rollDir'), 10e3, 'el navegador no devolvió la carpeta vinculada').catch(() => null);
  if(!dir) return { sinCarpeta:true };
  let perm = await dir.queryPermission({ mode:'read' });
  if(perm !== 'granted' && interactive) perm = await conTiempo(dir.requestPermission({ mode:'read' }), 90e3, 'no se respondió el permiso para leer la carpeta');
  if(perm !== 'granted') return { sinPermiso:true };
  const hs = await conTiempo(rollArchivos(dir, dir.name, [], 0), 60e3, 'la carpeta tardó demasiado en responder');

// Dibuja un gráfico en una imagen PNG (para el Excel). tipo 'h': barras de potencial con enrolados encima;

function presGraficoPNG({ titulo, sub, filas, tipo, colA, colB, leyA, leyB }){

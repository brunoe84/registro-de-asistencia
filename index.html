/* ---------- Alertas de base ---------- */
let PERSONAS_CACHE = null;
/* Inscritos para Wise2, por programa. Vienen del QR de una clase (no estaban en la lista) o del
   enlace de inscripción del programa. Solo el administrador ve estos datos y los marca como
   inscritos cuando los pasa a Wise2. */
/* ---------- Datos de inscripción cifrados de punta a punta ----------
   El celular del joven cifra los datos sensibles con la llave pública del administrador
   (RSA-OAEP + AES-GCM). La llave privada solo se abre con la contraseña del administrador
   (PBKDF2): en el servidor nadie puede leerlos. Cada dispositivo del administrador recuerda
   la llave abierta (IndexedDB, no exportable). */
const SENSIBLES = ['cedula', 'usuario', 'nacimiento', 'celular', 'tutor', 'tutor_celular', 'tutor_correo', 'direccion'];
const RSA_ALG = { name:'RSA-OAEP', hash:'SHA-256' };
const aB64 = buf => { const u = new Uint8Array(buf); let s = ''; for(let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const soloSensibles = d => Object.fromEntries(SENSIBLES.filter(k => d && d[k] && d[k] !== '*').map(k => [k, d[k]]));
function idbAbrir(){ return new Promise((res, rej) => { const r = indexedDB.open('ca_llaves', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbLeer(key){ try{ const db = await idbAbrir(); return await new Promise((res, rej) => { const q = db.transaction('k').objectStore('k').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }catch{ return null; } }
async function idbGuardar(key, val){ try{ const db = await idbAbrir(); await new Promise((res, rej) => { const t = db.transaction('k', 'readwrite'); if(val == null) t.objectStore('k').delete(key); else t.objectStore('k').put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); }catch(e){ console.warn(e); } }
async function claveDeContrasena(pass, sal, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt:sal, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
async function crearLlaveInscripciones(pass){
  const kp = await crypto.subtle.generateKey(Object.assign({ modulusLength:2048, publicExponent:new Uint8Array([1, 0, 1]) }, RSA_ALG), true, ['encrypt', 'decrypt']);
  const pub = await crypto.subtle.exportKey('spki', kp.publicKey), pk8 = await crypto.subtle.exportKey('pkcs8', kp.privateKey);
  const sal = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 310000;
  const enc = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await claveDeContrasena(pass, sal, iter), pk8);
  return { datos:{ publica:aB64(pub), privada_cifrada:aB64(enc), sal:aB64(sal), iv:aB64(iv), iteraciones:iter }, priv: await crypto.subtle.importKey('pkcs8', pk8, RSA_ALG, false, ['decrypt']) };
}
async function abrirLlaveInscripciones(info, pass){
  let pk8;
  try{ pk8 = await crypto.subtle.decrypt({ name:'AES-GCM', iv:deB64(info.iv) }, await claveDeContrasena(pass, deB64(info.sal), info.iteraciones), deB64(info.privada_cifrada)); }
  catch{ throw new Error('Contraseña incorrecta'); }
  return crypto.subtle.importKey('pkcs8', pk8, RSA_ALG, false, ['decrypt']);
}
async function cifrarConLlave(publica, obj){
  const pub = await crypto.subtle.importKey('spki', deB64(publica), RSA_ALG, false, ['encrypt']);
  const k = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, k, new TextEncoder().encode(JSON.stringify(obj)));
  const kw = await crypto.subtle.encrypt(RSA_ALG, pub, await crypto.subtle.exportKey('raw', k));
  return { v:'1', k:aB64(kw), iv:aB64(iv), c:aB64(c) };
}
async function descifrarConLlave(priv, cif){
  const k = await crypto.subtle.importKey('raw', await crypto.subtle.decrypt(RSA_ALG, priv, deB64(cif.k)), 'AES-GCM', false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:deB64(cif.iv) }, k, deB64(cif.c))));
}
// Celular del joven: cifra lo sensible antes de enviar. Sin llave creada (o sin WebCrypto) va como antes
// y el administrador lo cifra al abrir sus inscripciones.
// Cada programa (entorno) tiene su llave: se reconoce por el token de la página (enlace de inscripción,
// QR de la clase o ficha). Se guarda una por token.
let LLAVE_PUB, LLAVE_TOKEN = '';
const LLAVES_PUB = {};
async function cifrarDatosInscripcion(datos, prog){
  try{
    if(!(globalThis.crypto && crypto.subtle)) return datos;
    const t = LLAVE_TOKEN || '';
    if(!(t in LLAVES_PUB)) LLAVES_PUB[t] = (await SB.rpc('llave_publica_inscripciones', t ? { token:t } : {})) || null;
    const pub = LLAVES_PUB[t];
    const sens = soloSensibles(datos);
    if(!pub || !Object.keys(sens).length) return datos;
    const rest = Object.fromEntries(Object.entries(datos).filter(([k]) => !SENSIBLES.includes(k)));
    // "*" solo para pasar las validaciones del servidor: no se guardan.
    const marcas = prog === 'S' ? { nacimiento:'*', celular:'*', tutor:'*', tutor_celular:'*' } : { nacimiento:'*', celular:'*' };
    return Object.assign(rest, marcas, { cifrado: await cifrarConLlave(pub, sens) });
  }catch(e){ console.warn('No se pudo cifrar', e); return datos; }
}
// Administrador: estado de la llave en este dispositivo.
const LLAVE = { info:undefined, priv:null };
const llaveIdbKey = info => 'insc:' + info.publica.slice(-32);
async function llaveAdmin(){
  if(LLAVE.info === undefined) LLAVE.info = (await SB.rpc('llave_admin_inscripciones')) || null;
  if(LLAVE.info && !LLAVE.priv) LLAVE.priv = await idbLeer(llaveIdbKey(LLAVE.info));
  return LLAVE;
}

async function cifrarPendientesEnClaro(lista){

  }
  if(!filas.length) return;

  catch(e){ console.warn('cifrar_inscripciones', e); }

function sugerenciasDe(a){
  const k = norm(a.nombre);
  return (PERSONAS_CACHE||[]).map(p => [levenshtein(k, norm(p.nombre)), p]).filter(x => x[0] <= 3).sort((x, y) => x[0]-y[0]).slice(0,3).map(x => x[1]);
}
function alertaHTML(a, i, ult){

  return `<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><b>${esc(prettyName(a.nombre))}</b>

  if(!(parts[0] === 'informes' && parts[1] === 'presidentes')) PRES_DET = null;
  if(document.body.classList.contains('plan-full-on')) planillaGrande(false);
  if(SB.on() && !SB.ready){ app.innerHTML = topbar() + `<main class="wrap">${loadingHTML()}</main>`; return; }
  if(parts[0] === 'qr' && parts[1]) return renderQr(parts[1]);
  if(parts[0] === 'qrc' && parts[1]) return renderQrClase(parts[1]);
  if(parts[0] === 'insc' && parts[1]) return renderInscripcionPublica(parts[1]);
  if(parts[0] === 'ficha' && parts[1]) return renderFichaPublica(parts[1]);
  if(parts[0] === 'terminos' || parts[0] === 'privacidad') return renderLegal(parts[0]);
  if(parts[0] === 'entrar') return renderEntrar();
  if(parts[0] === 'supervisor') return renderSupervisor();
  if(parts[0] === 'administradores'){ if(SB.admin && SB.entorno && SB.entorno.general) return renderAdministradores(); go('#/'); return; }
  if(['todas','solicitudes','alertas','seguimiento','inscripciones','wiseroll','retrasos','informes'].includes(parts[0])){
    if(parts[0] === 'informes' && SB.admin) return parts[1] === 'jas' ? renderInformeJAS() : parts[1] === 'presidentes' ? renderInformePresidentes() : renderInformes();
    if(!SB.admin){ go('#/'); return; }
    if(parts[0] === 'wiseroll') return renderWiseRoll();
    if(parts[0] === 'retrasos') return renderRetrasos();
    if(parts[0] === 'inscripciones') return renderInscripciones();
    if(parts[0] === 'solicitudes') return renderSolicitudes();
    if(parts[0] === 'alertas') return renderAlertas();
    if(parts[0] === 'seguimiento') return renderSeguimiento();
    return renderTodas(parts[1], parts[2]);
  }
  if(parts[0] === 'evento' && parts[1] === 'nuevo') return renderEventForm(null);
  if(parts[0] === 'evento' && parts[1] && parts[2] === 'editar') return renderEventForm(parts[1]);
  if(parts[0] === 'evento' && parts[1]) return renderEvent(parts[1]);
  if(parts[0] === 'clases') return SB.on() ? go('#/') : renderClasses();
  if(parts[0] === 'clase' && parts[1] === 'crear') return SB.on() ? renderCrearClase() : go('#/clase/nueva');
  if(parts[0] === 'clase' && parts[1] === 'nueva') return SB.on() ? go('#/') : renderClassForm(null);
  if(parts[0] === 'clase' && parts[1] && parts[2] === 'editar') return renderClassForm(parts[1]);
  if(parts[0] === 'clase' && parts[1]) return renderClass(parts[1]);
  if(parts[0] === 'admin') return isAdmin() ? renderAdmin() : (go('#/'), askAdmin());
  renderHome();
}

  </div></header>`;

function bindTop(){
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  const pill = $('#syncPill');
  if(pill) pill.onclick = () => {
    if(CUR.type === 'event') syncEvent(CUR.code);
    else if(CUR.type === 'class') syncClass(CUR.code);
    else if(!Sync.on() && !SB.on()) toast('Todo se guarda en este celular. Para juntar la asistencia, envía el Excel y se importa en otro dispositivo.', '', {ms:4200});
    else { syncAllPending().then(()=>toast('Todo sincronizado','ok')); }
  };
  paintSync();
}
function paintSync(){
  const pill = $('#syncPill'); if(!pill) return;
  let cls = 'local', lbl = 'Guardado en el celular';
  let pending = 0;
  if(CUR.type === 'event' && EVENTS[CUR.code]) pending = eventPendingCount(EVENTS[CUR.code]);
  else if(CUR.type === 'class' && CLASSES[CUR.code]) pending = CLASSES[CUR.code].canEdit ? classPendingCount(CLASSES[CUR.code]) : 0;
  const online = Sync.on() || (CUR.type === 'class' && classOnline(CLASSES[CUR.code])) || (SB.on() && CUR.type !== 'event') || (CUR.type === 'event' && eventoEnNube(EVENTS[CUR.code]));
  if(online){
    if(SYNC_STATE.s === 'syncing'){ cls = 'syncing'; lbl = 'Sincronizando…'; }
    else if(SYNC_STATE.s === 'error'){ cls = 'error'; lbl = pending ? `Sin conexión · ${pending} sin enviar` : 'Sin conexión'; }
    else if(pending){ cls = 'pending'; lbl = `${pending} sin enviar`; }
    else if(SYNC_STATE.at){ cls = 'ok'; lbl = 'Sincronizado '+fmtTime(SYNC_STATE.at); }
    else { cls = 'ok'; lbl = 'En línea'; }
  }
  // Clase o evento en línea: la pastilla guarda (no hay barra de guardar abajo).
  const canSave = online && (CUR.type === 'class' || CUR.type === 'event') && !$('#saveBtn');
  if(canSave && pending && SYNC_STATE.s !== 'syncing') lbl = `Guardar · ${pending} sin enviar`;
  pill.className = 'sync-pill '+cls+(canSave ? ' can-save' : '');
  pill.title = canSave ? (pending ? 'Guardar la asistencia ahora' : 'Guardar y sincronizar') : 'Estado de sincronización';
  $('.lbl', pill).textContent = lbl;
  const sb = $('#sbStatus'), btn = $('#saveBtn');
  if(sb){
    if(!online) sb.innerHTML = `<b>Guardado en este celular</b><small>Al terminar, envía la asistencia</small>`;
    else if(pending) sb.innerHTML = `<b>${pending} cambio${pending>1?'s':''} sin enviar</b><small>Toca “Guardar asistencia”</small>`;
    else if(SYNC_STATE.s === 'syncing') sb.innerHTML = `<b>Sincronizando…</b>`;
    else sb.innerHTML = `<b>Todo sincronizado</b>${SYNC_STATE.at ? '<small>Última vez '+fmtTime(SYNC_STATE.at)+'</small>' : ''}`;
  }
  if(btn) btn.classList.toggle('has-pending', pending > 0);
}
function saveBar(label='Guardar asistencia', share=false){
  // En línea se guarda desde la pastilla de arriba ("Sincronizado"): la barra solo queda para enviar

/* El enlace de invitación lleva los datos del evento (título, estaca, barrio, fecha, preguntas)
   para que el colaborador los tenga aunque no exista una base de datos en línea. */
function packMeta(m){
  const o = { t:m.title, k:m.stake, w:m.ward, d:m.date, f:m.fields, c:m.custom, p:m.wa || '' };
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unpackMeta(s){
  try{
    s = String(s).replace(/-/g,'+').replace(/_/g,'/');
    const o = JSON.parse(decodeURIComponent(escape(atob(s))));
    return { title:o.t || '', stake:o.k || '', ward:o.w || '', date:o.d || todayISO(), fields:Array.isArray(o.f) ? o.f : ['k','w'], custom:Array.isArray(o.c) ? o.c : [], wa:o.p || '' };
  }catch(e){ return null; }
}

async function openEvent(code, linkMeta){
  const ex = EVENTS[code];
  if(ex){
    if(linkMeta && ex.meta.placeholder){ ex.meta = Object.assign({}, linkMeta, { joinedAt: ex.meta.joinedAt }); saveEvents(); }
    go('#/evento/'+code); return;
  }
  if(SB.on()){
    if(!(await aceptarTerminos('colaborar_evento'))) return;
    toast('Buscando evento…');
    try{
      await SB.init();   // con el enlace de invitación, la conexión todavía se está abriendo
      await SB.ensureSession();
      const r = await SB.rpc('unirme_evento', { codigo_evento: code });
      if(r && r.estado === 'ok'){
        const meta = Object.assign({ title:'Evento '+code, stake:'', ward:'', date:todayISO(), fields:['k','w'], custom:[] }, r.meta || {}, { joinedAt: Date.now() });
        const ev = newEventObj(r.codigo, meta); ev.metaPending = false; ev.remote = r.id; ev.contrib = !r.organizador;
        EVENTS[r.codigo] = ev; saveEvents();
        ST.tab = 'marcar';
        go('#/evento/'+r.codigo);
        if(!myName()) setTimeout(askName, 400);
        return;
      }
    }catch(e){ console.error(e); }
  }
  if(Sync.on()){
    toast('Buscando evento…');
    try{
      const r = await Sync.req(`events/${code}`);
      if(r && r.meta){
        const ev = newEventObj(code, r.meta); ev.metaPending = false; ev.rows = r.rows || {}; ev.lastSync = Date.now(); ev.contrib = true;
        EVENTS[code] = ev; saveEvents();
        go('#/evento/'+code);
        if(!myName()) setTimeout(askName, 400);
        return;
      }
    }catch(e){}
  }
  if(!linkMeta && !(await confirmBox(`No hay datos del evento <b>${code}</b> en este celular. Puedes unirte igual: marca a los asistentes y al final envía tu Excel al organizador, que lo unirá con los demás por el código.<br><br>Revisa que el código esté bien escrito.`, { title:'Unirme como colaborador', ok:'Unirme' }))) return;
  const meta = linkMeta ? Object.assign({}, linkMeta) : { title:'Evento '+code, stake:'', ward:'', date:todayISO(), fields:['k','w'], custom:[], placeholder:true };
  meta.joinedAt = Date.now();
  const ev = newEventObj(code, meta); ev.metaPending = false; ev.contrib = true;
  EVENTS[code] = ev; saveEvents();
  ST.tab = 'marcar';
  go('#/evento/'+code);
  if(!myName()) setTimeout(askName, 400);
}
async function openClass(code){
  if(CLASSES[code]){ go('#/clase/'+code); return; }
  if(SB.on()) return openRemoteClass(code, true);
  if(!Sync.on()){
    if(await confirmBox(`La clase <b>${code}</b> no está en este celular. Pide al maestro el reporte (o Excel) de su clase y ábrelo aquí: trae un respaldo que la carga completa.`, { title:'Importar clase', ok:'Elegir archivo', cancel:'Cerrar' })) importBackupPicker();

function bindSW(root, px, ward){
  const ss = $('#'+px+'Stake',root), so = $('#'+px+'StakeO',root), ws = $('#'+px+'Ward',root), wo = $('#'+px+'WardO',root);
  const fill = sel => {
    const st = ss.value === '__o' || ss.value === '__m' ? '' : ss.value;
    const list = st ? wardsOf(st) : [];
    const isO = !!sel && !list.includes(sel);
    ws.innerHTML = `<option value="">${esc(ws.dataset.all)}</option>` + list.map(w=>`<option ${w===sel?'selected':''}>${esc(w)}</option>`).join('') + `<option value="__o" ${isO?'selected':''}>Otro…</option>`;
    wo.classList.toggle('hide', !isO); wo.value = isO ? sel : '';
  };
  ss.onchange = () => { so.classList.toggle('hide', ss.value !== '__o'); if(ss.value === '__o') so.focus(); fill(''); };
  ws.onchange = () => { wo.classList.toggle('hide', ws.value !== '__o'); if(ws.value === '__o') wo.focus(); };
  fill(ward || '');
}
function readSW(root, px){

/** Pide aceptar los términos (una vez por versión en este celular) y lo registra en línea. */
async function aceptarTerminos(ctx, { servidor = false } = {}){
  if(LS.get('ca_terminos', '') !== TERMS_VERSION){
    const ok = await new Promise(res => {
      let done = false;
      sheet(`${sheetHead('Antes de continuar', 'Términos y privacidad')}

        <div class="acuerdo" style="border:0;padding-top:0"><details><summary>Leer los Términos y Condiciones</summary><div class="acuerdo-txt">${legalHTML('terminos')}</div></details>
        <details style="margin-top:8px"><summary>Leer la Política de Privacidad</summary><div class="acuerdo-txt">${legalHTML('privacidad')}</div></details></div>
        <label class="check-row" style="margin-top:12px"><input type="checkbox" id="tAcepto"><span>He leído y acepto los <b>Términos y Condiciones</b> y la <b>Política de Privacidad</b>.</span></label>
        <div class="sh-foot"><button class="btn" data-no>Cancelar</button><button class="btn primary" data-yes disabled>${ICON.check} Acepto y continúo</button></div>`, {
        onMount(el, close){
          const yes = $('[data-yes]', el);
          $('#tAcepto', el).onchange = e => { yes.disabled = !e.target.checked; };
          $('[data-no]', el).onclick = () => { done = true; res(false); close(); };
          yes.onclick = () => { done = true; res(true); close(); };
        },
        onClose(){ if(!done) res(false); }
      });
    });
    if(!ok) return false;
    LS.set('ca_terminos', TERMS_VERSION); LS.set('ca_terminos_en', Date.now());
  }
  if(SB.on()){
    const registrar = async () => {
      await SB.ensureSession();
      const marca = ((SB.user && SB.user.id) || '') + '|' + TERMS_VERSION;
      if(servidor ? await SB.rpc('acepto_terminos') : LS.get('ca_terminos_srv', '') === marca) return;
      await SB.rpc('aceptar_terminos', { version: TERMS_VERSION, contexto: ctx });
      LS.set('ca_terminos_srv', marca);
    };
    if(servidor){ try{ await registrar(); }catch(e){ console.warn('términos', e); } }
    else registrar().catch(e => console.warn('términos', e));
  }
  return true;
}

/* ============================================================
   BASE DE DATOS EXTERNA (Excel, CSV…) para un evento o una clase
   Se toma SOLO nombre, estaca, barrio, programa y género. Todo lo demás se descarta en el
   celular antes de enviar (fechas de nacimiento, direcciones, correos, celulares…).
   ============================================================ */
const COL_SENSIBLE = [['nacim','birth','fecha','edad','age','cumple'], ['direcc','address','domicilio','calle'], ['correo','email','e-mail','mail'], ['celular','telef','phone','movil','whatsapp','cel'], ['dni','documento','cedula','pasaporte','membership','mrn','registro']];
const SENSIBLE_LBL = ['Fechas de nacimiento', 'Direcciones', 'Correos', 'Celulares', 'Documentos'];
function tipoColumna(h){
  if(!h) return '';
  if(['student name','nombre completo','nombres y apellidos','apellidos y nombres','alumno','participante','asistente','full name','name','preferred name','nombres completos','integrante','joven'].includes(h)) return 'full';
  if(['nombres','nombre','first name','given name','given names','primer nombre'].includes(h)) return 'nom';
  if(['apellidos','apellido','last name','surname','apellido paterno'].includes(h)) return 'ape';
  if(h === 'apellido materno') return 'ape2';
  if(esColGenero(h)) return 'x';
  const s = COL_SENSIBLE.findIndex(ws => ws.some(w => h.includes(w)));
  if(s >= 0) return 's' + s;
  if(h.includes('estaca') || h.startsWith('stake') || h.includes('distrito')) return 'k';
  if(h.includes('barrio') || h.startsWith('ward') || h === 'rama' || h === 'unidad' || h.includes('branch')) return 'w';
  if(['programa','program','program name'].includes(h)) return 'g';
  return '';
}
/* Género: 'H' hombre, 'M' mujer, '' sin dato. Sirve para mezclar o separar hombres y mujeres en los grupos. */
const esColGenero = h => ['genero','sexo','gender','sex','genero del alumno','student gender'].includes(h);
// Lee la columna completa: si trae "F/M" (inglés), la M es hombre; si trae "H/M", la M es mujer.
function lectorGenero(valores){
  const vs = valores.map(v => norm(v)).filter(Boolean);
  const mEsHombre = vs.some(v => v === 'f' || v.startsWith('fem') || v === 'female') || !vs.some(v => v === 'h' || v.startsWith('hombre'));
  return v => {
    const s = norm(v);
    if(!s) return '';
    if(s === 'm') return mEsHombre ? 'H' : 'M';
    if(s === 'h' || /^(masc|male|hombre|varon|man\b|boy|nino\b|joven varon)/.test(s)) return 'H';
    if(s === 'f' || /^(fem|female|mujer|dama|woman|girl|nina\b|senorita)/.test(s)) return 'M';
    return '';
  };
}
// Sin dato en la base: se deduce por el primer nombre (Apellidos, Nombres). Si no se puede, ''.
const NOMBRES_MUJER = new Set('raquel isabel carmen ruth rut esther ester beatriz luz pilar rocio consuelo dolores mercedes ines abigail abigaíl noemi belen milagros nicole michelle yasmin jasmin jazmin karen lizbeth lisbeth elizabeth elisabeth ingrid astrid ivonne madeleine mirian miriam flor sol marisol rosmery sharon nayeli arely allison alison evelyn carol marilyn jennifer jenifer lucero rubi ruby itzel heidy abril zoe chloe naomi dafne karin kimberly kimberley rachel sarai yuli nely deysi daysi mery nancy lucy betty ely merly gaby yesica jessica jesica liz luz maribel mabel anabel aracely araceli nicol scarlet scarleth fiorel yamile janet janeth lisbet yudith judith edith lizeth lisseth yanet yaneth gladys mildred maryori yomira yoselin joselyn jocelyn joseline brigitte grisel guadalupe soledad trinidad caridad libertad paz nieves concepcion asuncion angeles ashley britney shirley kelly leidy lady wendy sheyla sheila mayra maily nayely mishel madelein solange ivette yvette annie juliet julieth marian maryan'.split(' '));
const NOMBRES_HOMBRE = new Set('luca joshua josua bautista nicola elias jonas tomas matias josias isaias jeremias zacarias andres dennis denis jesus moises noe jose joel abel isaac david daniel saul samuel manuel miguel angel gabriel rafael ismael ezequiel emanuel misael nathanael natanael abdiel uriel ariel'.split(' '));
function adivinarGenero(nombre){
  const s = String(nombre || '');
  const nombres = (s.includes(',') ? s.split(',').slice(1).join(' ') : s).trim();
  for(const t of norm(nombres).split(' ').filter(x => x.length > 1)){
    if(t === 'maria' || t === 'ma') return 'M';
    if(NOMBRES_MUJER.has(t)) return 'M';
    if(NOMBRES_HOMBRE.has(t)) return 'H';
    if(/(a|ene|ine|ane|elle|ille|ise|ice|eth|ith|yn|een)$/.test(t)) return 'M';
    if(/(o|os|el|er|an|on|en|in|ar|or|ir|ur|us|is|es|ez|al|il|ul|y|i|u|e|t|d|k|x|z|s|l|n|r)$/.test(t)) return 'H';
  }
  return '';
}
const GEN_LBL = { H:'Hombre', M:'Mujer' };
const pareceNombre = v => { const s = String(v || '').trim(); return /^[A-Za-zÀ-ÿÑñ'´.,\- ]{5,}$/.test(s) && s.split(/[\s,]+/).filter(Boolean).length >= 2; };
async function leerListaExterna(file, colNombre){
  await loadScript(SHEETJS_URL);
  const buf = await file.arrayBuffer();
  let wb;
  if(/\.(csv|txt)$/i.test(file.name) || /csv|text\/plain/.test(file.type)){
    // CSV: UTF-8 (TextDecoder quita el BOM); si no es UTF-8 válido, Windows-1252 (Excel en español).
    let txt;
    try{ txt = new TextDecoder('utf-8', { fatal:true }).decode(buf); }catch{ txt = new TextDecoder('windows-1252').decode(buf); }
    wb = XLSX.read(txt, { type:'string', raw:false });
  } else wb = XLSX.read(buf, { type:'array', raw:false });
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:false, defval:'' });
  // Encabezado: la fila (de las primeras 15) con más columnas reconocidas.
  let hi = -1, best = 0;
  for(let i = 0; i < Math.min(15, raw.length); i++){
    const n = (raw[i] || []).filter(c => tipoColumna(norm(c))).length;
    if(n > best){ best = n; hi = i; }
  }
  const H = hi >= 0 ? raw[hi].map(c => String(c || '').trim()) : [];
  const ncols = Math.max(...raw.slice(0, 50).map(r => (r || []).length), 0);
  const tipos = Array.from({ length: ncols }, (_, i) => tipoColumna(norm(H[i] || '')));
  // Sin encabezado de nombre (o elegido a mano): la columna indicada o la que más parece nombres.
  if(colNombre != null){ tipos.forEach((t, i) => { if(t === 'full' || t === 'nom' || t === 'ape' || t === 'ape2') tipos[i] = ''; }); tipos[colNombre] = 'full'; }
  else if(!tipos.some(t => t === 'full' || t === 'nom' || t === 'ape')){
    const datos = raw.slice(hi + 1, hi + 80);
    let mejor = -1, max = 0;
    for(let i = 0; i < ncols; i++){
      if(tipos[i]) continue;
      const n = datos.filter(r => pareceNombre(r && r[i])).length;
      if(n > max){ max = n; mejor = i; }
    }
    if(mejor >= 0) tipos[mejor] = 'full';
  }
  const ix = t => tipos.indexOf(t);
  if(ix('full') < 0 && ix('nom') < 0 && ix('ape') < 0) throw new Error('No encontramos una columna con nombres. Revisa que el archivo tenga una columna “Nombres” o “Nombre completo”.');
  const rows = [], vistos = new Set();
  const genDe = lectorGenero(ix('x') >= 0 ? raw.slice(hi + 1).map(r => (r || [])[ix('x')]) : []);
  for(let i = hi + 1; i < raw.length; i++){
    const r = raw[i] || [];
    const get = t => ix(t) >= 0 ? String(r[ix(t)] || '').replace(/\s+/g, ' ').trim() : '';
    let n = get('full');
    if(!n){ const ape = [get('ape'), get('ape2')].filter(Boolean).join(' '), nom = get('nom'); n = ape && nom ? `${ape}, ${nom}` : (ape || nom); }
    // Descarta celdas que no son nombres (correos, números, fechas).
    if(!n || /@|\d{3,}/.test(n) || n.length < 3) continue;
    n = n.slice(0, 120);
    const key = norm(n); if(vistos.has(key)) continue; vistos.add(key);
    const gv = get('g').toUpperCase();
    const row = { n, k: get('k').slice(0, 80), w: get('w').slice(0, 80), g: /^S|SEM/.test(gv) ? 'S' : /^I|INS/.test(gv) ? 'I' : '' };
    const x = genDe(get('x')); if(x) row.x = x;
    rows.push(row);
  }
  if(!rows.length) throw new Error('El archivo no tiene filas con nombres.');
  const excluidas = [...new Set(tipos.filter(t => /^s\d$/.test(t)).map(t => SENSIBLE_LBL[+t.slice(1)]))];
  const ignoradas = tipos.filter(t => !t).length;
  const opciones = Array.from({ length: ncols }, (_, i) => ({ i, nombre: H[i] || `Columna ${XLSX.utils.encode_col(i)}`, tipo: tipos[i] }));
  return { rows, archivo: file.name, excluidas, ignoradas, opciones, usadas: { nombre: ix('full') >= 0 || ix('nom') >= 0 || ix('ape') >= 0, estaca: ix('k') >= 0, barrio: ix('w') >= 0, programa: ix('g') >= 0, genero: rows.some(r => r.x) } };
}

      $('#' + px + 'DropTxt', root).innerHTML = `<b>${esc(L.archivo)}</b>${L.rows.length.toLocaleString('es-PE')} personas<small>Toca o arrastra otro archivo para reemplazarla.</small>`;
      $('#' + px + 'Col', root).onchange = e => leer(st.file, +e.target.value);
    }catch(e){ console.error(e); st.lista = null; prev.innerHTML = `<div class="warn-box" style="margin-top:10px">${esc(e.message || 'No se pudo leer el archivo')}</div>`; }
  };
  drop.onclick = e => { if(e.target !== inp) inp.click(); };
  drop.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); inp.click(); } };
  inp.onchange = () => { if(inp.files[0]) leer(inp.files[0]); inp.value = ''; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) leer(f); };
  return st;
}

function scopeOptions(stake, ward){
  const o = [];

  return o;
}

function multiStakes(m){ return m.stakes && m.stakes.length ? m.stakes : stakesList(); }
function evScope(m, scope){
  if(scope && scope.startsWith('k:')) return { k:scope.slice(2), w:'' };
  if(scope === 'w') return { k:m.stake || '', w:m.ward || '' };
  if(scope === 'k') return { k:m.stake || '', w:'' };
  return { k:'', w:'' };
}
function evLugar(m){
  if(m.multi) return 'Multiestaca' + (m.stakes && m.stakes.length ? ': ' + m.stakes.join(', ') : ' · toda la base');
  return [m.stake, m.ward || (m.stake ? 'Todos los barrios' : '')].filter(Boolean).join(' · ');
}
function scopeFilter(scope, stake, ward){
  if(scope && scope.startsWith('k:')){ const k = scope.slice(2); return p => p.k === k; }
  if(scope === 'w' && ward) return p => p.w === ward && (!stake || p.k === stake);
  if(scope === 'k' && stake) return p => p.k === stake;
  return null;
}

const QR_JS_URL = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const qrLink = token => appLink('q', token);
// Dibuja el QR en un canvas, con el título del evento arriba y un texto abajo si se piden.
async function qrCanvas(text, { title='', sub='', size=720 }={}){
  if(!window.qrcode) await loadScript(QR_JS_URL);
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), pad = 4, cell = Math.max(2, Math.floor(size / (n + pad * 2)));
  const qs = cell * (n + pad * 2);
  const head = title ? Math.round(qs * 0.26) : 0, foot = sub ? Math.round(qs * 0.1) : 0;
  const c = document.createElement('canvas'); c.width = qs; c.height = qs + head + foot;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.textAlign = 'center';
  if(title){
    let fs = Math.round(qs * 0.07);
    g.font = `800 ${fs}px Manrope, system-ui, sans-serif`;
    while(fs > 14 && g.measureText(title).width > qs * 0.92){ fs -= 2; g.font = `800 ${fs}px Manrope, system-ui, sans-serif`; }
    g.fillStyle = '#132C3E'; g.fillText(title, qs / 2, head * 0.45);
    g.font = `600 ${Math.round(qs * 0.042)}px system-ui, sans-serif`; g.fillStyle = '#1F7A83';
    g.fillText('Escanea para registrar tu asistencia', qs / 2, head * 0.85);
  }
  g.fillStyle = '#000';
  for(let r = 0; r < n; r++) for(let k = 0; k < n; k++) if(q.isDark(r, k)) g.fillRect((k + pad) * cell, head + (r + pad) * cell, cell, cell);
  if(sub){ g.font = `500 ${Math.round(qs * 0.036)}px system-ui, sans-serif`; g.fillStyle = '#5C7080'; g.fillText(sub, qs / 2, head + qs + foot * 0.45); }
  return c;
}

/* ============================================================
   GRUPOS O COMPAÑÍAS (con la lista del evento)
   ============================================================ */
function rndInt(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function barajar(a){ for(let i = a.length - 1; i > 0; i--){ const j = rndInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const barrioDe = r => (r.data && (r.data.w || r.data.k)) || '';
/* Género de un asistente, en este orden: corregido a mano en el evento, el de la base (en línea o en
   este celular) y, si no hay, el que se deduce por el nombre. origen: 'manual' | 'base' | 'nombre' | ''. */
function generoFila(ev, r){
  const man = (ev.meta.gen || {})[r.id]; if(man) return { g:man, origen:'manual' };
  const nube = (ev.generos || {})[r.id]; if(nube) return { g:nube, origen:'base' };
  const p = r.pid && PBY.get(r.pid); if(p && p.x) return { g:p.x, origen:'base' };
  const g = adivinarGenero(r.n); return { g, origen: g ? 'nombre' : '' };
}
// Trae de Supabase el género de la base para los asistentes (si la migración 0023 aún no corre, no pasa nada).
async function cargarGenerosEvento(ev){
  if(!eventoEnNube(ev) || !ev.remote || ev.generosAt > Date.now() - 60000) return;
  ev.generosAt = Date.now();
  try{
    const list = await SB.rpc('generos_evento', { evento: ev.remote });
    const m = {}; (list || []).forEach(x => { if(x.genero) m[x.id] = x.genero; });
    const antes = JSON.stringify(ev.generos || {});
    ev.generos = m; saveEvents();
    if(JSON.stringify(m) !== antes && CUR.code === ev.code) renderGrupos();
  }catch(e){ console.warn('generos_evento', e); }
}
function guardarGenero(ev, id, g){
  ev.meta.gen = Object.assign({}, ev.meta.gen); if(g) ev.meta.gen[id] = g; else delete ev.meta.gen[id];
  ev.metaPending = true; saveEvents(); queueSync();
}
// Lista para corregir a quienes no tienen género en la base (deducido por el nombre o sin saber).
function revisarGeneros(ev, rows){
  const fila = r => { const i = generoFila(ev, r); return `<div class="item" style="margin:6px 0 0"><span class="ii"><b>${esc(prettyName(r.n))}</b><small>${esc(barrioDe(r))}${i.origen === 'manual' ? ' · corregido' : ''}</small></span>
    <div class="seg" data-id="${esc(r.id)}">${['H','M'].map(v => `<button data-v="${v}" class="${i.g === v ? 'on' : ''}">${GEN_LBL[v]}</button>`).join('')}</div></div>`; };
  sheet(`${sheetHead('Revisar géneros', `${rows.length} sin dato en la base`)}
    <p class="hint" style="margin-top:0">Se dedujeron por el primer nombre. Toca el correcto si alguno está mal; queda guardado en este evento.</p>
    <div style="max-height:55vh;overflow:auto">${rows.map(fila).join('')}</div>
    <div class="sh-foot"><button class="btn primary" data-close>Listo</button></div>`, {
    onMount(el){
      $$('.seg[data-id]', el).forEach(s => $$('button', s).forEach(b => b.onclick = () => {
        $$('button', s).forEach(x => x.classList.toggle('on', x === b));
        guardarGenero(ev, s.dataset.id, b.dataset.v);
      }));
    },
    onClose(){ renderGrupos(); }
  });
}
// Cuántos de los n grupos son de hombres al separar: el reparto con el grupo más grande lo más chico posible.
function gruposDeHombres(n, h, m){
  let mejor = 1, peor = Infinity;
  for(let k = 1; k < n; k++){ const t = Math.max(Math.ceil(h / k), Math.ceil(m / (n - k))); if(t < peor){ peor = t; mejor = k; } }
  return mejor;
}
// Orden para repartir: con "mezclar barrios", cada barrio queda seguido para que se reparta entre todos los grupos.
function ordenReparto(rows, mezclar){
  if(!mezclar) return barajar(rows.slice());
  const porB = {}; rows.forEach(r => { (porB[barrioDe(r)] = porB[barrioDe(r)] || []).push(r); });
  return barajar(Object.values(porB)).map(barajar).sort((a, b) => b.length - a.length).flat();
}
/* Reparte al azar en grupos del mismo tamaño (±1). Con "mezclar", cada barrio se reparte entre todos los grupos.
   genero: 'mix' = cada grupo con hombres y mujeres en partes parecidas; 'sep' = grupos solo de hombres y solo de mujeres. */
function formarGrupos(rows, nGrupos, nLideres, mezclar, nombre, genero, genDe){
  const lista = Array.from({ length:nGrupos }, (_, i) => ({ n: `${nombre} ${i + 1}`, lideres:[], miembros:[] }));
  const de = { H:[], M:[], '':[] }; rows.forEach(r => de[genDe ? genDe(r) : ''].push(r));
  const repartir = (orden, grupos) => { const off = rndInt(grupos.length); orden.forEach((r, i) => grupos[(i + off) % grupos.length].miembros.push(r.id)); };
  let sep = genero === 'sep' && nGrupos > 1 && de.H.length > 0 && de.M.length > 0;
  if(sep){
    const nH = gruposDeHombres(nGrupos, de.H.length, de.M.length);
    lista.forEach((g, i) => { g.gen = i < nH ? 'H' : 'M'; });
    repartir(ordenReparto(de.H, mezclar), lista.slice(0, nH));
    repartir(ordenReparto(de.M, mezclar), lista.slice(nH));
    // Sin género conocido: al grupo con menos personas.
    barajar(de[''].slice()).forEach(r => lista.reduce((m, g) => g.miembros.length < m.miembros.length ? g : m, lista[0]).miembros.push(r.id));
  } else if(genero === 'mix'){
    // Hombres seguidos y luego mujeres: al repartir en ronda, cada grupo recibe de ambos en partes parecidas.
    const bloques = barajar([de.H, de.M]);
    repartir([...ordenReparto(bloques[0], mezclar), ...ordenReparto(bloques[1], mezclar), ...ordenReparto(de[''], mezclar)], lista);
  } else repartir(ordenReparto(rows, mezclar), lista);
  lista.forEach(g => { g.lideres = barajar(g.miembros.slice()).slice(0, nLideres); });
  return { nombre, lideres:nLideres, mezclar, genero: sep ? 'sep' : genero === 'sep' ? 'mix' : genero, creados: Date.now(), por: myName(), lista };
}
function guardarGrupos(ev, g){
  if(g) ev.meta.grupos = g; else delete ev.meta.grupos;
  ev.metaPending = true; saveEvents(); queueSync(); renderGrupos();
}

async function qrEnviar(){

// Un solo formulario: nombres (si no está en la base), estaca, barrio, si es miembro (y entonces

// d: { persona, nombre, estaca, barrio } si se eligió de la base; { manual:true, nombres, apellidos } si no.
// ctx: programa, encabezado, texto de introducción, botón y qué hacer al enviar (QR de clase por defecto).
function qrcDatos(d, ctx){
  ctx = Object.assign({ prog: QRC.c && QRC.c.programa, head: QRC.head, intro: 'no estás en la lista de esta clase. Tu maestro confirmará tu asistencia y con estos datos te inscribiremos. Solo el administrador los verá.', boton: 'Enviar mi asistencia', enviar: x => qrcMarcar(x), volver: () => qrcBuscar() }, ctx);
  const prev = LS.get('ca_yo_datos', {});
  const base = !!(d.persona || d.ficha);
  const campo = (name, lab, req, attrs = '', val = prev[name] || '') => `<div class="field"><label>${lab} ${req ? '<span class="req">*</span>' : '<span class="opt">(opcional)</span>'}</label><input name="${name}" value="${esc(val)}" ${attrs}></div>`;
  $('#qrMain').innerHTML = ctx.head + `<section class="card"><h2>Tus datos para inscribirte</h2>
    <p class="hint" style="margin-top:0">${base ? `<b>${esc(prettyName(d.nombre))}</b>, ` : ''}${esc(base ? ctx.intro : ctx.intro.charAt(0).toUpperCase() + ctx.intro.slice(1))}</p>
    <form id="qdForm" autocomplete="on">
      ${base ? '' : `<div class="row2">${campo('nombres', 'Nombres', true, 'autocapitalize="words"', d.nombres || '')}${campo('apellidos', 'Apellidos', true, 'autocapitalize="words"', d.apellidos || '')}</div>`}
      <div class="row2"><div class="field"><label>Estaca <span class="req">*</span></label><select name="estaca"><option value="">Seleccionar…</option>${PROG_STAKES.map(s => `<option value="${esc(s)}" ${s === ((base && d.estaca) || prev.estaca) ? 'selected' : ''}>${esc(stakeShort(s))}</option>`).join('')}<option value="Otra" ${prev.estaca === 'Otra' ? 'selected' : ''}>Otra</option></select></div>
        ${campo('barrio', 'Barrio o rama', true, 'autocapitalize="words"', (base && d.barrio) || prev.barrio || '')}</div>
      <div class="field" id="qdMiembro"><label>¿Eres miembro de la Iglesia? <span class="req">*</span></label><div class="seg big" data-v="${esc(prev.miembro || '')}"><button type="button" data-o="si" class="${prev.miembro === 'si' ? 'on' : ''}">Sí</button><button type="button" data-o="no" class="${prev.miembro === 'no' ? 'on' : ''}">No</button></div></div>
      <div id="qdIglesia" class="${prev.miembro === 'si' ? '' : 'hide'}">
        ${campo('cedula', 'Número de cédula de miembro', false, 'inputmode="numeric" placeholder="Si lo sabes"')}
        ${campo('usuario', 'Nombre de usuario de tu cuenta de la Iglesia', false, 'autocapitalize="off" spellcheck="false" placeholder="Si lo sabes"')}
      </div>
      <div class="row2">${campo('nacimiento', 'Fecha de nacimiento', true, `type="date" max="${todayISO()}"`)}${campo('celular', 'Celular', true, 'type="tel" inputmode="tel" placeholder="Ej. 987 654 321"', d.celular || prev.celular || '')}</div>
      ${acuerdoHTML(ctx.prog, prev)}
      <div class="btn-row"><button class="btn primary lg block" type="submit">${ICON.check} ${esc(ctx.boton)}</button></div>
    </form>
    ${ctx.volver ? '<p class="who"><button id="qdAtras">Volver a buscar mi nombre</button></p>' : ''}</section>`;
  const seg = $('#qdMiembro [data-v]');
  $$('[data-o]', seg).forEach(b => b.onclick = () => { $$('[data-o]', seg).forEach(x => x.classList.toggle('on', x === b)); seg.dataset.v = b.dataset.o; $('#qdIglesia').classList.toggle('hide', b.dataset.o !== 'si'); });
  if(ctx.volver) $('#qdAtras').onclick = () => ctx.volver();
  if(!base) setTimeout(() => $('#qdForm [name=nombres]').focus(), 200);
  $('#qdForm').onsubmit = async e => {
    e.preventDefault();
    const v = {}; $$('#qdForm [name]').forEach(i => { if(i.value.trim()) v[i.name] = i.value.trim(); });
    v.miembro = seg.dataset.v;
    if(v.miembro !== 'si'){ delete v.cedula; delete v.usuario; }
    $$('#qdForm .field').forEach(f => f.classList.remove('err'));
    const prog = ctx.prog === 'S' ? 'S' : 'I';
    const miss = [...(base ? [] : ['nombres', 'apellidos']), 'estaca', 'barrio', 'miembro', 'nacimiento', 'celular', ...(prog === 'S' ? ['tutor', 'tutor_celular', 'direccion'] : [])].filter(k => !v[k]);
    if(v.celular && v.celular.replace(/\D/g, '').length < 7) miss.push('celular');
    if(v.tutor_celular && v.tutor_celular.replace(/\D/g, '').length < 7) miss.push('tutor_celular');
    if(v.tutor_correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.tutor_correo)) miss.push('tutor_correo');
    if(miss.length){ miss.forEach(k => { const f = k === 'miembro' ? $('#qdMiembro') : $(`#qdForm [name=${k}]`).closest('.field'); f.classList.add('err'); }); toast('Completa los campos obligatorios (*)', 'error'); return; }
    $('#qdAcepto').classList.remove('err');
    if(!$('#qdAcuerdo').checked){ $('#qdAcepto').classList.add('err'); toast('Para inscribirte debes aceptar el acuerdo de inscripción', 'error'); return; }
    v.acuerdo = ACUERDO_VERSION[prog];
    const { nombres, apellidos, ...datos0 } = v;
    const { acuerdo, ...recordar } = datos0;
    LS.set('ca_yo_datos', recordar);
    // Lo sensible viaja cifrado: solo el administrador puede leerlo.
    const sb = $('#qdForm [type=submit]'); if(sb.disabled) return; sb.disabled = true;
    const datos = await cifrarDatosInscripcion(datos0, prog);
    ctx.enviar(base ? { persona: d.persona || null, datos } : { nombres: titleCase(nombres), apellidos: titleCase(apellidos), datos });
  };
}
const fmtInscripcion = x => !x ? '' : [x.miembro === 'no' ? 'No es miembro' : '', x.cedula ? 'Cédula ' + x.cedula : '', x.usuario ? 'Usuario ' + x.usuario : '', x.nacimiento ? 'Nac. ' + fmtDMY(x.nacimiento) : '', x.celular ? 'Cel. ' + x.celular : ''].filter(Boolean).join(' · ');
function qrcBuscar(){
  const main = $('#qrMain');
  main.innerHTML = QRC.head + `<section class="card"><h2>¿Quién eres?</h2><p class="hint" style="margin-top:0">Escribe tu nombre: te buscamos en la lista de la clase y, si no estás, en la base de Seminarios e Institutos. Solo lo harás la primera vez en este celular.</p>
    <div class="search-box"><span class="si">${ICON.search}</span><input id="qcq" type="search" placeholder="Tu nombre o apellido" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"></div>

    <button class="manual-cta" id="qcMan"><span class="mc-ico">${ICON.userPlus}</span><span><b>No me encuentro</b><small>Escribe tus datos; tu maestro te agregará</small></span>${ICON.next}</button></section>`;
  const q = $('#qcq'), res = $('#qcRes');
  let n = 0, ultimo = null;
  const buscar = debounce(async () => {
    const t = q.value.trim(); if(t === ultimo) return; ultimo = t;
    const id = ++n;
    if(!norm(t).split(' ').some(w => w.length >= 3)){ res.innerHTML = `<div class="empty-hint"><small>Escribe tu nombre o apellido (al menos 3 letras).</small></div>`; return; }
    res.innerHTML = loadingHTML('Buscando…', true);
    try{
      const list = await SB.rpc('buscar_alumno_qr', { token: QRC.token, texto: t });
      if(id !== n) return;
      res.innerHTML = list.length ? list.map((p, i) => `<button class="person" data-i="${i}"><span class="av">${esc(initials(p.nombre))}</span><span class="pi"><b>${highlight(p.nombre, t)}</b><small>${p.ya_enviada ? 'Ya envió su asistencia hoy' : p.en_clase === false ? esc([p.barrio, 'no está en la lista: tu maestro te agregará'].filter(Boolean).join(' · ')) : 'Alumno de la clase'}</small></span><span class="mk">Soy yo</span></button>`).join('')
        : `<div class="empty-hint"><p>No encontramos “${esc(t)}”</p><small>Revisa cómo lo escribiste o usa “No me encuentro”.</small></div>`;
      $$('[data-i]', res).forEach(b => b.onclick = () => { const p = list[+b.dataset.i]; if(p.en_clase === false) qrcDatos({ persona: p.id, nombre: p.nombre, barrio: p.barrio }); else qrcMarcar({ alumno: p.id }); });
    }catch(e){ console.error(e); ultimo = null; if(id === n) res.innerHTML = `<div class="info-box">No se pudo buscar: ${esc(errMsg(e))}.</div>`; }
  }, 350);
  ['input', 'keyup', 'change', 'search'].forEach(ev => q.addEventListener(ev, buscar));
  $('#qcMan').onclick = () => { const t = q.value.trim().split(/\s+/).filter(Boolean); qrcDatos({ manual:true, nombres: titleCase(t[0] || ''), apellidos: titleCase(t.slice(1).join(' ')) }); };
  setTimeout(() => q.focus(), 200);
}
async function qrcMarcar(d){
  $$('#qrMain button').forEach(b => b.disabled = true);
  try{
    const r = await SB.rpc('marcar_por_qr_clase', { token: QRC.token, alumno: d.alumno || null, persona: d.persona || null, nombres: d.nombres || null, apellidos: d.apellidos || null, dispositivo: DEV, datos: d.datos || {} });
    if(r.alumno_id){ const g = misClasesQr(); g[QRC.token] = { id: r.alumno_id, nombre: r.nombre }; LS.set('ca_qr_clase', g); }
    if(!miYo()) guardarYo({ nombre: r.nombre, persona_id: r.persona_id || undefined, nombres: d.nombres, apellidos: d.apellidos });
    if(navigator.vibrate) navigator.vibrate(40);
    const nom = prettyName(r.nombre);
    const [tit, txt] = r.estado === 'ya_presente' ? ['Ya estás presente', `${esc(nom)}, tu maestro ya marcó tu asistencia de hoy.`]
      : r.estado === 'ya_enviada' ? ['Ya la habías enviado', `${esc(nom)}, tu asistencia de hoy ya está enviada. Tu maestro la confirmará.`]
      : ['¡Asistencia enviada!', r.nuevo ? `Gracias, ${esc(nom)}. Tu maestro te agregará a la clase y confirmará tu asistencia.` : `Gracias, ${esc(nom)}. Tu maestro la confirmará en un momento.`];
    $('#qrMain').innerHTML = QRC.head + `<section class="card qr-done">${OK_ANIM}<h2>${tit}</h2><p>${txt}</p></section>`;
  }catch(e){ console.error(e); $$('#qrMain button').forEach(b => b.disabled = false); toast(errMsg(e), 'error'); }
}

  const box = $('#inscMaestro'); if(!box) return;

    <p class="hint" style="margin-top:0">Escribe el <b>nombre de tu maestro</b>. Si no lo sabes, escribe el <b>nombre de tu barrio</b> y te mostramos las clases de ahí. Así quedas en su lista desde hoy.</p>
    <div class="search-box"><span class="si">${ICON.search}</span><input id="mq" type="search" placeholder="Nombre del maestro o de tu barrio" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"></div>
    <div id="mRes" class="results"><div class="empty-hint"><small>Escribe al menos 3 letras.</small></div></div>
    <p class="who"><button id="mSkip">Todavía no tengo maestro</button></p></section>`;
  const q = $('#mq'), res = $('#mRes');
  let n = 0, ultimo = null;
  const buscar = debounce(async () => {
    const t = q.value.trim(); if(t === ultimo) return; ultimo = t;
    const id = ++n;
    if(!norm(t).split(' ').some(w => w.length >= 3)){ res.innerHTML = `<div class="empty-hint"><small>Escribe al menos 3 letras.</small></div>`; return; }
    res.innerHTML = loadingHTML('Buscando clases…', true);
    try{
      const list = await SB.rpc('buscar_clases_inscripcion', { token: INSC_P.token, texto: t, estaca: datos.estaca || null });
      if(id !== n) return;
      const porBarrio = list.length && list.every(c => c.coincide === 'barrio');
      res.innerHTML = list.length
        ? (porBarrio ? `<div class="hint" style="margin:2px 2px 8px">Clases con alumnos de “${esc(t)}”. Elige la tuya:</div>` : '')
          + list.map((c, i) => `<button class="person" data-i="${i}"><span class="av">${esc(initials(c.maestro))}</span><span class="pi"><b>${c.coincide === 'maestro' ? highlight(c.maestro, t) : esc(prettyName(c.maestro))}</b><small>${esc([c.curso, [diasCortos(c.dias), c.horario].filter(Boolean).join(' '), c.barrio || stakeShort(c.estaca_clase), c.alumnos ? c.alumnos + ' alumno' + (c.alumnos > 1 ? 's' : '') : ''].filter(Boolean).join(' · '))}</small></span><span class="mk">Es mi clase</span></button>`).join('')
        : `<div class="empty-hint"><p>No encontramos clases con “${esc(t)}”</p><small>Prueba solo con el apellido de tu maestro o con el nombre de tu barrio.</small></div>`;
      $$('[data-i]', res).forEach(b => b.onclick = () => inscUnirClase(inscId, list[+b.dataset.i]));
    }catch(e){ console.error(e); ultimo = null; if(id === n) res.innerHTML = `<div class="info-box">No se pudo buscar: ${esc(errMsg(e))}.</div>`; }
  }, 350);
  ['input', 'keyup', 'change', 'search'].forEach(ev => q.addEventListener(ev, buscar));
  $('#mSkip').onclick = () => { box.innerHTML = `<div class="info-box" style="margin-top:12px">Está bien. Cuando sepas quién es tu maestro, él podrá agregarte a su clase.</div>`; };
  // Sugerencia inicial: las clases de su barrio.
  if(norm(datos.barrio || '').split(' ').some(w => w.length >= 3)){ q.value = datos.barrio; buscar(); }
}
async function inscUnirClase(inscId, c){

function bindPersonForm(el, {onUseExisting, sw}={}){
  if(sw) bindSW(el, 'm', sw.ward);

function collectPersonForm(el){

    e.preventDefault();
    $$('.field', f).forEach(x => x.classList.remove('err'));
    const bad = (sel, msg) => { const x = $(sel, f); x.closest('.field').classList.add('err'); x.scrollIntoView({ block:'center', behavior:'smooth' }); toast(msg, 'error'); };
    const sw = readSW(f, 'n');
    const propia = baseSt.modo === 'propia';
    const datos = { titulo:$('#nTit', f).value.trim(), maestro:$('#nMae', f).value.trim(), curso:$('#nCurso', f).value.trim(), horario:$('#nHor', f).value.trim(),
      programa:prog, estaca:sw.stake, barrio:sw.ward, dias:$$('#nDays .chip.on', f).map(c => +c.dataset.d), inicio:$('#nIni', f).value, fin:$('#nFin', f).value,
      base: propia ? 'propia' : 'ica',
      // Solo nombre, estaca y barrio: lo demás del Excel ya se descartó en el celular.
      alumnos: propia && baseSt.lista ? baseSt.lista.rows.slice(0, 500).map(r => ({ nombre:r.n, estaca:r.k || sw.stake || '', barrio:r.w || '' })) : [] };
    if(!datos.curso && !datos.titulo) return bad('#nCurso', 'Escribe el curso o el nombre de la clase');
    if(!datos.maestro) return bad('#nMae', 'Escribe el nombre del maestro');
    if(!propia && !datos.estaca) return bad('#nStake', 'Elige la estaca');
    if(!datos.dias.length) return toast('Elige al menos un día de clase', 'error');
    if(datos.inicio && datos.fin && datos.fin < datos.inicio) return bad('#nFin', 'El fin no puede ser antes del inicio');
    if(propia && !baseSt.lista){ $('#nbBase', f).classList.add('err'); $('#nbBase', f).scrollIntoView({ block:'center', behavior:'smooth' }); return toast('Sube tu Excel con los alumnos o elige la base del Programa Ica', 'error'); }
    if(propia && baseSt.lista.rows.length > 500) toast('Solo se agregan los primeros 500 nombres', 'warn');
    if(!(await aceptarTerminos('crear_clase', { servidor:true }))) return;
    const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Creando la clase…';
    try{
      await SB.ensureSession();
      setMyName(datos.maestro);
      const r = await SB.rpc('crear_clase', { datos });
      try{ SB.mis = await SB.rpc('mis_clases'); }catch(err){ console.warn(err); }
      toast(propia ? `Clase creada con ${r.alumnos} alumno${r.alumnos === 1 ? '' : 's'} ✓` : 'Clase creada ✓ Ahora agrega a tus alumnos', 'ok', { ms:4500 });
      go('#/clase/' + r.codigo);
    }catch(err){ console.error(err); btn.disabled = false; btn.innerHTML = `${ICON.check} Crear clase`; toast(errMsg(err), 'error'); }
  };
}

/* ---------- Mensajes del administrador al maestro ----------
   El administrador deja un mensaje con un tono (felicitación, urgente, recordatorio o aviso).
   El maestro lo ve en una ventana emergente al abrir su clase; al cerrarla queda como visto. */
const MSG_TIPOS = {
  felicitacion: { ico:'🎉', label:'Felicitación', titulo:'¡Felicitaciones!' },
  urgente:      { ico:'🚨', label:'Urgente',      titulo:'Atención: pedido urgente' },
  recordatorio: { ico:'🔔', label:'Recordatorio', titulo:'Recordatorio' },
  aviso:        { ico:'💬', label:'Aviso',        titulo:'Mensaje del administrador' }
};
const fechaCorta = t => { try{ return new Date(t).toLocaleString('es-PE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }catch(e){ return ''; } };
function openMensajeMaestro(cls, pre){
  let tipo = (pre && pre.tipo) || 'felicitacion', hist = null;
  const teacher = prettyName(cls.meta.teacher || 'el maestro');
  sheet(`${sheetHead('Mensaje al maestro', `${esc(teacher)} lo verá al abrir su clase`)}
    <div class="msg-tipos">${Object.entries(MSG_TIPOS).map(([k, t]) => `<button type="button" class="msg-tipo t-${k}" data-tipo="${k}"><span>${t.ico}</span>${t.label}</button>`).join('')}</div>
    <div class="field"><label>Mensaje</label><textarea id="msgT" rows="4" maxlength="2000" placeholder="Ej. ¡Gracias por tener la asistencia al día! Sigue así."></textarea></div>
    <button type="button" class="link-btn" id="msgPrev" style="font-size:13px">👁 Ver cómo lo verá el maestro</button>
    <div class="field" style="margin-top:12px"><label>Celular del maestro (WhatsApp)</label><input id="msgCel" type="tel" inputmode="tel" placeholder="Ej. 987 654 321" autocomplete="off"><small class="hint" id="msgCelH" style="display:block;margin-top:4px">Se guarda solo y se recuerda para este maestro.</small></div>
    <details class="msg-res"><summary>Resumen que va por WhatsApp</summary><pre id="msgRes"></pre></details>
    <div class="wc-sec" id="msgHist"></div>
    <div class="sh-foot"><button class="btn" data-close>Cerrar</button><button class="btn" id="msgWa" disabled title="Lo deja en la app y abre WhatsApp con el mensaje, el resumen y el enlace de la clase">${ICON.chat} Enviar + WhatsApp</button><button class="btn primary" id="msgSend" disabled>Enviar mensaje</button></div>`, {
    onMount(el){
      const ta = $('#msgT', el), send = $('#msgSend', el), box = $('#msgHist', el), wa = $('#msgWa', el), cel = $('#msgCel', el), celH = $('#msgCelH', el), res = $('#msgRes', el);
      let celGuardado = '', tocado = false;
      const pintarRes = () => { res.textContent = textoWhatsMaestro(cls, ta.value.trim() || '(tu mensaje)', tipo); };
      const pintarBtns = () => { send.disabled = !ta.value.trim(); wa.disabled = !ta.value.trim() || !normPhone(cel.value); };
      // Primero lo que recuerda este dispositivo (al instante); luego el de la nube (el último guardado para este maestro).
      const local = celLocal(cls);
      if(local){ cel.value = local; celGuardado = local; celH.textContent = '✓ Número recordado.'; pintarBtns(); }
      SB.rpc('celular_maestro', { clase: cls.dbId }).then(v => {
        if(tocado) return;
        if(v){ cel.value = v; celGuardado = v; celLocal(cls, v); celH.textContent = '✓ Número recordado para este maestro.'; pintarBtns(); }
        else if(local) guardarCel(true); // estaba solo en este dispositivo: se sube a la nube
      }).catch(e => { console.warn(e); if(/celular_maestro|PGRST202|function/i.test(e.message || '')) celH.textContent = 'Falta aplicar la migración en Supabase.'; });
      const guardarCel = async forzar => {
        const v = cel.value.trim(); if(v === celGuardado && !forzar) return;
        if(v && !normPhone(v)){ celH.textContent = 'Revisa el número: 9 dígitos (Perú) o con código de país.'; return; }
        celLocal(cls, v);
        try{ await SB.rpc('guardar_celular_maestro', { clase: cls.dbId, celular: v }); celGuardado = v; celH.textContent = v ? '✓ Guardado: se recordará para este maestro.' : 'Se quitó el número.'; }
        catch(e){ console.error(e); celH.textContent = 'Guardado en este dispositivo; no se pudo subir: ' + errMsg(e); }
      };
      const guardarPronto = debounce(() => guardarCel(), 900);
      cel.oninput = () => { tocado = true; celH.textContent = 'Guardando…'; pintarBtns(); guardarPronto(); };
      cel.onchange = () => guardarCel();
      pintarRes();
      const pintarTipo = () => $$('[data-tipo]', el).forEach(b => b.classList.toggle('on', b.dataset.tipo === tipo));
      $$('[data-tipo]', el).forEach(b => b.onclick = () => { tipo = b.dataset.tipo; pintarTipo(); pintarRes(); });
      pintarTipo();
      ta.oninput = () => { pintarBtns(); pintarRes(); };
      if(pre && pre.texto){ ta.value = pre.texto; pintarBtns(); pintarRes(); }
      setTimeout(() => ta.focus(), 120);
      $('#msgPrev', el).onclick = () => { if(!ta.value.trim()){ toast('Escribe el mensaje primero'); return; } popupMensaje({ tipo, texto: ta.value.trim(), creado_en: new Date().toISOString() }, { vista:true }); };
      const pintarHist = async () => {
        try{ hist = await SB.rpc('mensajes_de_clase', { clase: cls.dbId }) || []; }
        catch(e){ console.error(e); box.innerHTML = `<div class="wc-warn">${/mensajes_de_clase|PGRST202|function/i.test(e.message || '') ? 'Falta aplicar la migración 0027 en Supabase.' : esc(errMsg(e))}</div>`; return; }
        box.innerHTML = hist.length ? `<h4>Mensajes enviados</h4>${hist.map(m => `<div class="wc-row msg-h t-${m.tipo}"><span class="mh-ico">${(MSG_TIPOS[m.tipo] || MSG_TIPOS.aviso).ico}</span><div class="wn">${esc(m.texto)}<small>${fechaCorta(m.creado_en)} · ${m.visto_en ? `<b class="mh-ok">✓ Visto ${fechaCorta(m.visto_en)}</b>` : '<b class="mh-no">Aún no lo ve</b>'}</small></div><button class="icon-btn" data-del="${m.id}" title="Borrar mensaje" aria-label="Borrar">${ICON.x}</button></div>`).join('')}` : '';
        $$('[data-del]', box).forEach(b => b.onclick = async () => {
          if(!await confirmBox('¿Borrar este mensaje? Si el maestro aún no lo vio, ya no le aparecerá.', { title:'Borrar mensaje', ok:'Borrar', danger:true })) return;
          try{ await SB.rpc('borrar_mensaje_clase', { mensaje: b.dataset.del }); pintarHist(); }catch(e){ toast(errMsg(e), 'error'); }
        });
      };
      const enviar = async conWa => {
        const texto = ta.value.trim(); if(!texto) return;
        // WhatsApp se abre en el mismo clic (si se espera al servidor, el navegador bloquea la ventana).
        if(conWa){ waOpen(textoWhatsMaestro(cls, texto, tipo), cel.value); guardarCel(); }
        send.disabled = wa.disabled = true;
        try{
          await SB.rpc('dejar_mensaje_clase', { clase: cls.dbId, texto, tipo });
          ta.value = ''; pintarRes(); toast(`✓ Mensaje dejado para ${teacher}${conWa ? ' · revisa WhatsApp y presiona Enviar' : ''}`, 'ok', {ms:3600}); pintarHist();
        }catch(e){ console.error(e); toast(/dejar_mensaje_clase|PGRST202|function/i.test(e.message || '') ? 'Falta aplicar la migración 0027 en Supabase' : errMsg(e), 'error', {ms:4200}); }
        pintarBtns();
      };
      send.onclick = () => enviar(false);
      wa.onclick = () => enviar(true);
      pintarHist();
    }
  });
}
// Celular del maestro recordado en este dispositivo, por clase y por nombre del maestro (respaldo de la nube).
function celLocal(cls, v){
  const code = Object.keys(CLASSES).find(k => CLASSES[k] === cls) || '', tn = 'm:' + norm(cls.meta.teacher || '');

// Texto para WhatsApp: el mensaje, el estado de la asistencia hasta hoy y el enlace directo a la clase.
function resumenAsistencia(cls){
  const t = todayISO(), studs = classStudents(cls), fechas = classDates(cls);
  const marcada = f => studs.some(s => (cls.att[f] || {})[s.id]);
  const pasadas = fechas.filter(f => f < t), hoy = fechas.includes(t);
  const falta = pasadas.filter(f => !marcada(f));
  let ultima = ''; pasadas.forEach(f => { if(marcada(f)) ultima = f; });
  const cola = pasadas.filter(f => f > ultima && !marcada(f));
  return { total: fechas.length, pasadas: pasadas.length, hoy, falta, desde: cola[0] || '', huecos: falta.filter(f => !cola.includes(f)), ultima };
}
function textoWhatsMaestro(cls, texto, tipo){
  const code = Object.keys(CLASSES).find(k => CLASSES[k] === cls) || '';
  const r = resumenAsistencia(cls), m = cls.meta, t = MSG_TIPOS[tipo] || MSG_TIPOS.aviso;
  const dia = f => fmtDate(f).replace(/\s\d{4}$/, '');
  const lineas = [`${t.ico} *${t.titulo}*`, '', texto, '', `📋 *${m.title || 'Tu clase'}*${m.horario && !norm(m.title || '').includes(norm(m.horario)) ? ' · ' + m.horario : ''}`];
  lineas.push(`📅 Sesiones hasta hoy: *${r.total}*${r.hoy ? ' (incluida la de hoy)' : ''}`);
  if(!r.pasadas) lineas.push('Aún no hay sesiones anteriores a hoy.');
  else if(!r.falta.length) lineas.push(`✅ Asistencia al día: las ${r.pasadas} sesiones anteriores están marcadas. ¡Gracias!`);
  else {
    lineas.push(`✅ Marcadas: ${r.pasadas - r.falta.length} de ${r.pasadas}`);
    if(r.desde) lineas.push(`⚠️ Sin marcar desde el *${dia(r.desde)}*` + (r.ultima ? ` (la última marcada fue el ${dia(r.ultima)})` : ' (aún no se marcó ninguna)'));
    lineas.push(`⚠️ Falta marcar *${r.falta.length}* sesi${r.falta.length === 1 ? 'ón' : 'ones'}: ${r.falta.slice(0, 12).map(fmtShort).join(', ')}${r.falta.length > 12 ? '…' : ''}`);
  }
  if(code) lineas.push('', '👉 Entra directo a tu clase:', location.origin + location.pathname + '#/clase/' + code);
  return lineas.join('\n');
}
const MSG_VISTOS = new Set();
let MSG_BUSY = false;
async function mostrarMensajesMaestro(cls){
  if(MSG_BUSY) return; MSG_BUSY = true;
  try{
    let list;
    try{ list = await SB.rpc('mensajes_pendientes', { clase: cls.dbId }) || []; }catch(e){ console.warn('mensajes_pendientes', e); return; }
    for(const m of list.filter(m => !MSG_VISTOS.has(m.id))){

function popupMensaje(m, { vista=false }={}){
  return new Promise(res => {
    const t = MSG_TIPOS[m.tipo] || MSG_TIPOS.aviso;
    const ov = document.createElement('div');
    ov.className = 'msg-ov t-' + (MSG_TIPOS[m.tipo] ? m.tipo : 'aviso');
    ov.innerHTML = `<div class="msg-card" role="alertdialog" aria-modal="true" aria-labelledby="msgTit">

      <div class="msg-top"><span class="msg-ico">${t.ico}</span><h3 id="msgTit">${t.titulo}</h3><small>${vista ? 'Vista previa' : 'Del administrador · ' + fechaCorta(m.creado_en)}</small></div>

      <div class="msg-foot"><button class="btn primary msg-ok">${m.tipo === 'urgente' ? 'Entendido, lo atiendo' : m.tipo === 'felicitacion' ? '¡Gracias!' : 'Entendido'}</button></div>
    </div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('in'));

// Lluvia de confeti en un canvas sobre la ventana (se detiene sola o al cerrar).
function confeti(host){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return null;
  const cv = document.createElement('canvas'); cv.className = 'msg-confeti'; host.appendChild(cv);
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const colores = ['#0E7C86', '#F2B705', '#E4572E', '#2E86DE', '#27AE60', '#9B59B6'];
  const P = [];
  const rafaga = (x, n) => { for(let i = 0; i < n; i++){ const a = -Math.PI / 2 + (Math.random() - .5) * 1.6, v = (9 + Math.random() * 9) * dpr; P.push({ x, y: H * .62, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: (5 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colores[i % colores.length], t: 0 }); } };
  rafaga(W * .25, 90); rafaga(W * .75, 90);
  setTimeout(() => rafaga(W * .5, 110), 350);
  let run = true, t0 = performance.now();
  const step = now => {
    if(!run) return;
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .32 * dpr; p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if(now - t0 < 4200) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
  return () => { run = false; cv.remove(); };
}

/* Redibujar por una sincronización no debe mover la vista: guarda y devuelve el desplazamiento de la
   página y de cada caja con scroll (planilla, listas), los <details> abiertos y el campo donde se escribe. */
function conservarVista(root, fn){
  if(!root) return fn();
  const ruta = el => { const p = []; while(el && el !== root){ p.unshift(el.id ? '#' + el.id : [...el.parentNode.children].indexOf(el)); if(el.id) break; el = el.parentNode; } return p; };
  const buscar = p => { let el = root; for(const k of p){ el = typeof k === 'string' ? document.getElementById(k.slice(1)) : el && el.children[k]; if(!el) return null; } return el; };
  const wx = window.scrollX, wy = window.scrollY;
  const cajas = [[[], root.scrollTop, root.scrollLeft]];
  root.querySelectorAll('*').forEach(el => { if(el.scrollTop || el.scrollLeft) cajas.push([ruta(el), el.scrollTop, el.scrollLeft]); });
  const det = [...root.querySelectorAll('details')].map(d => d.open);
  const f = document.activeElement, foco = f && f !== document.body && root.contains(f) && f.id ? { id:f.id, s:f.selectionStart, e:f.selectionEnd } : null;
  const r = fn();
  const volver = () => {
    cajas.forEach(([p, t, l]) => { const el = buscar(p); if(el){ el.scrollTop = t; el.scrollLeft = l; } });
    window.scrollTo(wx, wy);
  };
  const ds = root.querySelectorAll('details'); if(ds.length === det.length) ds.forEach((d, i) => { d.open = det[i]; });
  if(foco){ const el = document.getElementById(foco.id); if(el && el !== document.activeElement){ el.focus({ preventScroll:true }); try{ if(foco.s != null) el.setSelectionRange(foco.s, foco.e); }catch(e){} } }
  volver();
  // La planilla ajusta su alto un instante después: se vuelve a poner en su lugar.
  requestAnimationFrame(() => { if(window.scrollY !== wy && Math.abs(window.scrollY - wy) > 2) window.scrollTo(wx, wy); cajas.forEach(([p, t, l]) => { const el = buscar(p); if(el && (el.scrollTop !== t || el.scrollLeft !== l)){ el.scrollTop = t; el.scrollLeft = l; } }); });
  return r;
}

function defaultClassDate(dates){
  const t = todayISO();
  if(dates.includes(t)) return t;
  const past = dates.filter(d => d <= t);
  return past.length ? past[past.length-1] : (dates[0] || t);
}

/* Unir a esta clase un evento (EV-…) u otra clase (CL-…) creada por error: primero muestra lo que

function openUnirCodigo(cls){
  const avisos = {
    no_existe:'No existe ningún evento ni clase con ese código. Revisa que esté bien escrito.',
    misma:'Ese es el código de esta misma clase.',
    sin_acceso:'No tienes acceso para modificar esta clase.',
    sin_acceso_origen:'No tienes acceso a ese evento o clase. Debe unirlo quien lo creó o el administrador.',
    no_existe_clase:'Esta clase ya no existe.'
  };
  const leerCodigo = v => { const t = String(v || '').trim().toUpperCase(); const m = t.match(/\b(EV|CL)-[A-Z0-9]+/); return m ? m[0] : t; };
  const resumen = r => `<dl class="kv">
      <dt>${r.tipo === 'evento' ? 'Evento' : 'Clase'}</dt><dd><b>${esc(r.titulo || '')}</b>${r.detalle ? ' · ' + esc(r.tipo === 'evento' ? fmtDate(r.detalle) : prettyName(r.detalle)) : ''}</dd>
      <dt>${r.tipo === 'evento' ? 'Asistentes' : 'Alumnos'} en el origen</dt><dd>${r.origen}</dd>
      <dt>Ya estaban en esta clase (no se duplican)</dt><dd>${r.ya_estaban}</dd>
      <dt>Alumnos que se agregan</dt><dd><b>${r.alumnos}</b></dd>
      ${r.reactivados ? `<dt>Alumnos retirados que vuelven a la clase</dt><dd>${r.reactivados}</dd>` : ''}
      <dt>Marcas de asistencia que se suman</dt><dd><b>${r.marcas}</b></dd>
      ${r.distintas ? `<dt>Marcas que ya existen aquí con otro valor (se mantienen)</dt><dd>${r.distintas}</dd>` : ''}
      ${r.fechas_extra ? `<dt>Fechas extra que se agregan al calendario</dt><dd>${r.fechas_extra}</dd>` : ''}
    </dl>`;
  // Fechas del origen que no son sesiones de la clase: se sugiere la sesión más cercana (hasta 6 días).
  const sesiones = classDates(cls);
  const enClase = new Set(sesiones);
  const dias = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 864e5);
  const sugerida = f => { let best = null; sesiones.forEach(d => { if(Math.abs(dias(d, f)) <= 6 && (!best || Math.abs(dias(d, f)) < Math.abs(dias(best, f)))) best = d; }); return best || f; };
  const fechasHTML = (fuera, fo, mapa) => `<div class="warn-box" style="margin-top:12px"><b>${fuera.length === 1 ? 'Una fecha no coincide' : fuera.length + ' fechas no coinciden'} con las sesiones de esta clase.</b> Elige en qué sesión poner esa asistencia, si la agregas como fecha extra o si no la pasas.</div>
    ${fuera.map(f => `<div class="field" style="margin-top:8px"><label>${esc(fmtDate(f))} · ${fo[f]} marca${fo[f] === 1 ? '' : 's'}</label><select data-fecha="${f}">
      ${sesiones.length ? `<optgroup label="Poner en la sesión de la clase">${sesiones.slice().reverse().map(d => `<option value="${d}"${mapa[f] === d ? ' selected' : ''}>${esc(fmtDate(d))}</option>`).join('')}</optgroup>` : ''}
      <option value="${f}"${mapa[f] === f ? ' selected' : ''}>Agregar ${esc(fmtShort(f))} como fecha extra de la clase</option>

    </select></div>`).join('')}`;
  sheet(`${sheetHead('Unir un evento u otra clase', esc(cls.meta.title || ''))}
    <p class="hint" style="margin-top:0">Escribe o pega el código del evento (<b>EV-…</b>) o de la clase (<b>CL-…</b>) donde se marcó la asistencia por error. Sus alumnos y su asistencia se suman a esta clase: los alumnos que ya están no se duplican y las marcas que ya existen aquí no se cambian. El evento o la clase de origen no se borra.</p>
    <form id="ucf"><div class="field"><label>Código</label><input id="ucCod" autocomplete="off" spellcheck="false" placeholder="EV-XXXXX o CL-XXXXX" style="text-transform:uppercase"></div></form>
    <div id="ucFechas"></div><div id="ucRes"></div>
    <div class="sh-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ucBtn">Revisar</button></div>`, {
    wide:true,
    onMount(el, close){
      const inp = $('#ucCod', el), btn = $('#ucBtn', el), res = $('#ucRes', el), fbox = $('#ucFechas', el);
      let vista = null, mapa = {};
      setTimeout(() => inp.focus(), 250);
      const reiniciar = () => { vista = null; mapa = {}; res.innerHTML = ''; fbox.innerHTML = ''; btn.textContent = 'Revisar'; btn.className = 'btn primary'; };
      inp.oninput = () => { if(vista) reiniciar(); };
      const mostrar = r => {
        const hay = r.alumnos || r.marcas || r.reactivados;
        res.innerHTML = `<div class="info-box" style="margin-top:10px">Esto es lo que pasará al unir <b>${esc(vista.cod)}</b>:</div>${resumen(r)}${hay ? '' : '<p class="hint">No hay nada nuevo que sumar: todo ya está en esta clase.</p>'}`;
        btn.textContent = hay ? 'Unir a esta clase' : 'Revisar'; btn.className = hay ? 'btn gold' : 'btn primary';
      };
      const previa = async () => {
        const r = await SB.rpc('unir_codigo_a_clase', { clase:cls.dbId, codigo_origen:vista.cod, confirmar:false, fechas:mapa });
        if(avisos[r.estado]){ res.innerHTML = `<div class="warn-box">${avisos[r.estado]}</div>`; vista = null; return null; }
        vista.r = r; mostrar(r); return r;
      };
      const correr = async () => {
        const cod = leerCodigo(inp.value);
        if(!/^(EV|CL)-/.test(cod)){ toast('El código empieza con EV- (evento) o CL- (clase).', 'warn'); inp.focus(); return; }
        btn.disabled = true;
        try{
          await SB.ensureSession();
          if(!vista || !vista.r || !(vista.r.alumnos || vista.r.marcas || vista.r.reactivados)){
            reiniciar();
            // Lo pendiente de esta clase se envía antes, para comparar con lo último.
            if(classPendingCount(cls)) await syncRemoteClass(cls.code, { silent:true });
            vista = { cod };
            const r0 = await SB.rpc('unir_codigo_a_clase', { clase:cls.dbId, codigo_origen:cod, confirmar:false });
            if(avisos[r0.estado]){ res.innerHTML = `<div class="warn-box">${avisos[r0.estado]}</div>`; vista = null; return; }
            const fo = r0.fechas_origen || {};
            const fuera = Object.keys(fo).filter(f => !enClase.has(f)).sort();
            if(!fuera.length){ vista.r = r0; mostrar(r0); return; }
            fuera.forEach(f => mapa[f] = sugerida(f));
            fbox.innerHTML = fechasHTML(fuera, fo, mapa);
            $$('select[data-fecha]', fbox).forEach(s => s.onchange = async () => {
              mapa[s.dataset.fecha] = s.value; btn.disabled = true;
              try{ await previa(); }catch(e){ console.error(e); toast(errMsg(e), 'error'); }finally{ btn.disabled = false; }
            });
            await previa();
            return;
          }
          const r = await SB.rpc('unir_codigo_a_clase', { clase:cls.dbId, codigo_origen:vista.cod, confirmar:true, fechas:mapa });
          if(avisos[r.estado]){ res.innerHTML = `<div class="warn-box">${avisos[r.estado]}</div>`; vista = null; btn.textContent = 'Revisar'; btn.className = 'btn primary'; return; }
          close();
          await syncRemoteClass(cls.code, { silent:true });
          if(CUR.type === 'class' && CUR.code === cls.code) renderClass(cls.code);
          sheet(`${sheetHead('✓ Unido a la clase', esc(vista.cod))}${resumen(r)}<p class="hint">El ${r.tipo === 'evento' ? 'evento' : 'clase'} de origen se conserva sin cambios.</p><div class="sh-foot"><button class="btn primary" data-close>Listo</button></div>`);
        }catch(e){
          console.error(e);
          toast(/unir_codigo_a_clase|schema cache|could not find/i.test(String(e && e.message)) ? 'Falta actualizar la base de datos (migración 0033).' : errMsg(e), 'error', { ms:6000 });
        }finally{ btn.disabled = false; }
      };
      btn.onclick = correr;
      $('#ucf', el).onsubmit = e => { e.preventDefault(); correr(); };
    }
  });
}

/* ---------- Ficha de inscripción del alumno nuevo ----------
   Enlace personal ?f=TOKEN: el alumno abre el formulario de su programa ya con su nombre.
   Naranja: ficha pendiente · Dorado: ficha completa. */
// 20 caracteres (el servidor acepta tokens de 16 a 40 letras y números).
function nuevoTokenFicha(){ const a = new Uint8Array(20); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]).join(''); }
function fichaMsg(nombre, prog, token, maestro){
  const p = nomProgDe(prog);
  return `Hola ${prettyName(nombre).split(' ')[0]} 👋\n${maestro ? 'Tu maestro(a) ' + prettyName(maestro) + ' te agregó' : 'Te agregamos'} a la clase de *${p}*.\nCompleta tu *ficha de inscripción* aquí 👇\n${appLink('f', token)}\nSolo toma un par de minutos.`;
}
function enviarFichaWa(cls, s, token, cel){ waOpen(fichaMsg(s.n, cls.meta.program, token, cls.meta.teacher), cel); }
// Estado de la ficha de un alumno: 'pend' (naranja), 'ok' (dorado) o '' si no tiene.
function fichaDe(cls, s){
  if(s.fichaCel) return { st:'pend', token:s.fichaTok, whatsapp:s.fichaCel, local:true };
  const f = (cls.fichas || {})[s.id]; if(!f) return null;
  return Object.assign({ st: f.completa ? 'ok' : 'pend' }, f);
}
function fichaBadge(f){ return !f ? '' : f.st === 'ok' ? '<span class="badge b-oro">Ficha completa</span>' : '<span class="badge b-naranja">Ficha pendiente</span>'; }
function haceCuanto(iso){
  if(!iso) return '';
  const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`;

// El maestro envía (o reenvía) el enlace de la ficha. Sirve también para alumnos nuevos agregados antes.
function pedirFicha(cls, s){
  const f = fichaDe(cls, s);
  if(f && f.local){ enviarFichaWa(cls, s, f.token, f.whatsapp); return; }
  if(f && f.st === 'ok'){ toast(`${prettyName(s.n)} ya completó su ficha ✓`, 'ok'); return; }
  sheet(`${sheetHead(f ? 'Reenviar enlace de inscripción' : 'Enviar enlace de inscripción', esc(prettyName(s.n)))}
    ${f && f.enviado_en ? `<p class="hint" style="margin-top:0">Último envío: ${esc(haceCuanto(f.enviado_en))}${f.envios > 1 ? ` · ${f.envios} envíos` : ''}. Aún no completa su ficha.</p>` : ''}
    <form id="fpf" autocomplete="off"><div class="field"><label>WhatsApp del alumno <span class="req">*</span></label><input name="whatsapp" type="tel" inputmode="tel" placeholder="Ej. 987 654 321" value="${esc((f && f.whatsapp) || '')}"></div></form>
    <div class="sh-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">${ICON.chat} Enviar por WhatsApp</button></div>`, {
    onMount(el, close){
      const i = $('[name=whatsapp]', el); setTimeout(() => i.focus(), 250);
      $('#fpf', el).onsubmit = e => { e.preventDefault(); $('#ok', el).click(); };
      $('#ok', el).onclick = async () => {
        const cel = i.value.trim();
        if(!normPhone(cel)){ i.closest('.field').classList.add('err'); toast('Escribe el WhatsApp del alumno (9 dígitos)', 'error'); return; }
        const token = (f && f.token) || nuevoTokenFicha();
        enviarFichaWa(cls, s, token, cel);
        close();
        // Si el alumno aún no subió al servidor, la ficha se crea al sincronizar.
        if((cls.dirty || {})['students/' + s.id]){ s.fichaCel = cel; s.fichaTok = token; saveClasses(); queueSync(); renderStuList(); return; }
        try{
          const r = await SB.rpc('preinscribir_alumno', { alumno:s.id, celular:cel, token });
          (cls.fichas = cls.fichas || {})[s.id] = Object.assign({}, f || {}, { token:r.token, whatsapp:cel, completa:!!r.completa, enviado_en:new Date().toISOString(), envios:((f && f.envios) || 0) + 1 });
          saveClasses(); renderStuList();
          if(r.token !== token) toast('Este alumno ya tenía otro enlace: toca otra vez “Enviar enlace” para mandarle el correcto.', 'warn', { ms:5000 });
        }catch(e){ console.error(e); toast(errMsg(e), 'error'); }
      };
    }
  });
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132C3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Check-in Asistencia · Seminarios e Institutos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ultra&family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132C3E;--navy-2:#1D435C;--teal:#1F7A83;--teal-2:#176269;--teal-50:#E6F2F2;
  --gold:#D79A28;--gold-50:#FBF3E2;--bg:#F2F5F6;--card:#FFFFFF;--text:#17262E;--muted:#5C7080;--faint:#8A9AA5;
  --border:#E1E8EB;--line:#EDF1F3;--green:#1E8449;--green-50:#E7F5EC;--red:#C0392B;--red-50:#FBEAE8;
  --amber:#A8670A;--amber-50:#FDF2E3;--purple:#5B3FA6;--purple-50:#EFE9FA;
  --r:16px;--r-sm:11px;--shadow:0 1px 2px rgba(19,44,62,.06),0 6px 22px rgba(19,44,62,.07);
  --top:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 'Inter',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-wrap:break-word}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex-shrink:0}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.mt6{margin-top:6px}

/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;box-shadow:0 2px 14px rgba(19,44,62,.18);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1100px;margin:0 auto;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:11px;user-select:none;-webkit-user-select:none;cursor:default}
.mark{width:46px;height:40px;border-radius:11px;background:#F5A623;display:grid;place-items:center;color:#111;font:400 15px/1 'Ultra',Georgia,serif;letter-spacing:-.01em;flex-shrink:0}
.bt b{display:block;font:800 16.5px 'Manrope'}
.bt small,.top-title small{display:block;font-size:11.5px;color:#B9CCD8;font-weight:500}
.top-title{flex:1;min-width:0}
.top-title b{display:block;font:700 15.5px 'Manrope';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .icon-btn{color:#fff;background:rgba(255,255,255,.09)}
.top .icon-btn:hover{background:rgba(255,255,255,.16)}
.top .spacer{flex:1}
.sync-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#E3EDF2;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:#9DB0BC}
.sync-pill.ok .dot{background:#4FD18B}
.sync-pill.pending .dot{background:#F2B544}
.sync-pill.error .dot{background:#F07A6E}
.sync-pill.syncing .dot{background:#7FD3DC;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.enter-btn{width:100%;font-size:18px;padding:17px 20px;position:relative;z-index:1;box-shadow:0 6px 18px rgba(215,154,40,.35)}
.enter-hero h1{font-size:25px}
.alert-badge{background:var(--amber-50);color:var(--amber)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2FB56F;margin-right:4px;animation:pulse 1.4s infinite}
.acc-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.late-box{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid #E7A79F;background:var(--red-50);border-radius:16px;padding:14px;cursor:pointer}
.late-box b{display:block;color:var(--red)}
.late-box small{display:block;color:#7B3A33;font-size:12.5px}
.late-ico{font-size:22px;flex-shrink:0}
.late-txt{color:var(--red)}
/* ---------- Layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.wrap.wide{max-width:1100px}
.has-savebar{padding-bottom:110px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card,.section+.section{margin-top:14px}
.section{margin-top:22px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.section-h h2{font-size:16px}
.hint{color:var(--muted);font-size:12.5px}
.opt{color:var(--faint);font-weight:500;font-size:12px}
.req{color:var(--red)}
.muted{color:var(--muted)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;text-align:center;line-height:1.25;max-width:100%}
/* Un texto largo pasa a la línea siguiente en vez de salirse del botón en celulares angostos. */
.btn svg{flex-shrink:0}
.btn:hover{background:#F6F9FA;border-color:#CFDADF}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#F0C9C4;background:#fff}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 20px;font-size:15.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 160px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:0;background:#EEF3F5;display:inline-grid;place-items:center;color:var(--navy);flex-shrink:0}
.icon-btn:hover{background:#E2EAEE}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn.danger{color:var(--red);background:var(--red-50)}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.01em}
.field input,.field select,.field textarea,.inp{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;background:#FBFCFD;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,131,.14);background:#fff}
.field.err input,.field.err select{border-color:var(--red);background:var(--red-50)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(31,122,131,.28)}
.chip:not(.on){border-color:#CBD7DC;color:#6B7F8C}
.pend-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--amber-50);border:1.5px solid #EBC982;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pend-box b{display:block;color:#6E4A08}
.pend-box small{color:#8A6A2E;font-size:12.5px}
.pend-box.ok{background:var(--green-50);border-color:#A9D8B9}
.pend-box.ok b{color:var(--green)}.pend-box.ok small{color:#3E7A55}
.pend-act{display:flex;gap:8px;flex-wrap:wrap}
.per-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;align-items:end}
.per-row label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
@media(max-width:560px){.per-row{grid-template-columns:1fr 1fr}.per-row .per-n{grid-column:1/-1}}
.hol-list{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:12px;margin:8px 0}
.hol-i{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.hol-i b{text-transform:capitalize}
.chip.on::before{content:"✓ "}
.seg{display:inline-flex;background:#E8EEF1;border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(19,44,62,.25)}
.seg.big button.on{background:var(--teal);box-shadow:0 3px 10px rgba(31,122,131,.35)}
.seg.big button.on::before{content:"✓ "}
.seg.big{background:#E3EAED;border:1.5px solid #D3DDE1}
.seg.big{display:flex;width:100%}
.seg.big button{flex:1;padding:11px;font-size:14.5px}
.cf-row{display:grid;grid-template-columns:1fr 130px 32px;gap:8px;margin-bottom:8px;align-items:center}
.cf-row .cf-opts{grid-column:1/3}
@media(max-width:480px){.cf-row{grid-template-columns:1fr 110px 32px}}

/* ---------- Home ---------- */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#1A3F57 60%,#1F5A66 100%);color:#fff;border-radius:22px;padding:24px 20px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(215,154,40,.22),transparent 70%)}
.hero h1{font-size:24px;line-height:1.2;max-width:460px}
.hero p{color:#C8D8E2;margin:8px 0 16px;max-width:480px;font-size:14px}
.join{display:flex;gap:8px;position:relative;z-index:1}
.join input{flex:1;min-width:0;border:0;border-radius:13px;padding:13px 14px;font-size:15.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;outline:none;background:#fff;color:var(--navy)}
.join input::placeholder{letter-spacing:0;text-transform:none;font-weight:500;color:#8A9AA5}
.join .btn{border-radius:13px}
.join-card .join input{border:1.5px solid var(--border);background:#FBFCFD}
.join-card .join input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,131,.14)}
.hero p b{color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.action-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.ac-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.ac-ico svg{width:24px;height:24px}
.action-card.ev .ac-ico{background:var(--teal-50);color:var(--teal)}
.action-card.cl .ac-ico{background:var(--gold-50);color:#9A6A12}
.action-card h2{font-size:18px}
.action-card p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.action-card .btn-row>.btn{flex:1 1 120px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;text-align:left;width:100%;margin-bottom:8px}
.item:hover{border-color:#C9D6DC}
.item .ii{flex:1;min-width:0}
.item b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .num-badge{background:var(--teal-50);color:var(--teal-2);font-weight:800;border-radius:10px;padding:5px 10px;font-size:13px;white-space:nowrap}
.item .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.ico.t{background:var(--teal-50);color:var(--teal)}
.ico.g{background:var(--gold-50);color:#9A6A12}
.empty{border:1.5px dashed #CFDADF;border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px;background:rgba(255,255,255,.5)}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:28px;line-height:1.7;user-select:none;-webkit-user-select:none}

/* ---------- Event / class header ---------- */
.ev-head h1{font-size:20px;line-height:1.25}
.meta{margin:4px 0 0;color:var(--muted);font-size:13px}
.eh-main{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.counter{background:var(--teal-50);border-radius:14px;padding:8px 14px;text-align:center;min-width:86px}
.counter b{display:block;font:800 26px/1.1 'Manrope';color:var(--teal-2)}
.counter span{font-size:11.5px;color:var(--teal-2);font-weight:600}
.code-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.code-chip{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--teal);background:#F4FAFA;color:var(--teal-2);border-radius:11px;padding:7px 12px;font:800 15px 'Manrope';letter-spacing:.08em}
.code-row .hint{flex:1;min-width:180px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.b-sem{background:var(--teal-50);color:var(--teal-2)}
.b-inst{background:var(--purple-50);color:var(--purple)}
.b-man{background:var(--amber-50);color:var(--amber)}
.b-new{background:var(--gold-50);color:#8A5D0D}
.b-ro{background:#EEF2F4;color:var(--muted)}
.b-ok{background:var(--green-50);color:var(--green)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px;margin:14px 0;box-shadow:var(--shadow);position:sticky;top:calc(var(--top) + env(safe-area-inset-top) + 8px);z-index:20}
.tabs button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff}
.tcount{background:rgba(31,122,131,.14);color:var(--teal-2);border-radius:999px;padding:1px 7px;font-size:11.5px}
.tabs button.on .tcount{background:rgba(255,255,255,.2);color:#fff}
.tabs button{min-width:0}
.top-title small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-big{font-size:clamp(22px,8.5vw,34px)!important;overflow-wrap:anywhere}
/* Celulares angostos: pestañas con el ícono arriba y la barra superior sin la hora de sincronización. */
@media (max-width:440px){
  .tabs button{flex-direction:column;gap:2px;padding:7px 2px;font-size:12px;position:relative}
  .tabs .tcount{position:absolute;top:3px;right:4px;padding:0 6px;font-size:10.5px}
  .sync-pill .lbl{display:none}
  .sync-pill{padding:8px}
}
@media(max-width:420px){.tabs button svg{display:none}}

/* ---------- Search ---------- */
.search-box{position:relative}
.search-box .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-box input{width:100%;border:2px solid var(--border);border-radius:15px;padding:15px 46px 15px 46px;font-size:17px;font-weight:500;outline:none;background:#fff;box-shadow:var(--shadow)}
.search-box input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(31,122,131,.13)}
.search-box .clear{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.search-box.sm input{padding:11px 40px;font-size:15px;border-radius:12px;box-shadow:none}
.search-box.sm .si{left:13px}
.scope-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.filt-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.filt-row .inp{padding:9px 10px;font-size:14px}
@media (max-width:560px){.filt-row{grid-template-columns:1fr 1fr}.filt-row #fW{grid-column:1/-1}}
.results{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:15px;padding:11px 12px;transition:border-color .12s,background .12s}
.person:hover{border-color:#BFD3D8}
.person:active{background:#F4FAFA}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#E7EEF1;color:var(--navy);font:800 14px 'Manrope';flex-shrink:0;text-transform:uppercase}
.person .pi,.roll-item .ri,.att-item .ai{flex:1;min-width:0}
.person b,.roll-item b,.att-item b{display:block;font-weight:700;font-size:15px;line-height:1.3}
.person small,.roll-item small,.att-item small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person mark{background:#FCEFD2;color:inherit;border-radius:3px;padding:0 1px}
.mk{display:inline-flex;align-items:center;gap:5px;background:var(--teal);color:#fff;border-radius:11px;padding:9px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.person.is-marked{background:#F6FBF8;border-color:#BFE3CC}
.person.is-marked .av{background:var(--green);color:#fff}
.mk.done{background:var(--green-50);color:var(--green)}
.mk.add{background:var(--navy)}
.empty-hint{text-align:center;color:var(--muted);padding:22px 10px 10px}
.empty-hint svg{width:30px;height:30px;color:#B5C3CA}
.empty-hint p{margin:8px 0 2px;font-weight:600;color:var(--text)}
.more-btn{align-self:center;margin-top:4px}
.manual-cta{display:flex;align-items:center;gap:13px;width:100%;text-align:left;margin-top:16px;border:1.5px dashed #D9B66F;background:var(--gold-50);border-radius:16px;padding:14px}
.manual-cta .mc-ico{width:42px;height:42px;border-radius:12px;background:#fff;color:#9A6A12;display:grid;place-items:center;flex-shrink:0}
.manual-cta span:nth-child(2){flex:1}
.manual-cta b{display:block;color:#6E4A08}
.manual-cta small{color:#8A6A2E;font-size:12.5px}
.who{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.mk.wait{background:var(--gold-50);color:#8A5A08}
.aprob-cta{display:flex;align-items:center;gap:13px;width:100%;text-align:left;margin:0 0 14px;border:1.5px solid #E7C27A;background:var(--gold-50);border-radius:16px;padding:12px 14px}
.aprob-cta .ap-ico{width:40px;height:40px;border-radius:12px;background:#fff;color:#9A6A12;display:grid;place-items:center;flex-shrink:0}
.aprob-cta span:nth-child(2){flex:1;min-width:0}
.aprob-cta b{display:block;color:#6E4A08}
.aprob-cta small{color:#8A6A2E;font-size:12.5px}
.aprob-cta .ap-n{background:var(--gold);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:800;font-size:13px}
.ap-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.ap-row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:14px;padding:9px 10px;flex-wrap:wrap}
.ap-row .pi{flex:1;min-width:150px}
.ap-row b{display:block;font-size:14.5px}
.ap-row small{display:block;color:var(--muted);font-size:12px}
.qr-wrap{display:flex;justify-content:center;margin:4px 0 10px}
.qr-img{width:min(260px,70vw);height:auto;border:1px solid var(--border);border-radius:14px}
.qr-full{display:flex;flex-direction:column;align-items:center}
.qr-full canvas{width:min(560px,92vw);height:auto}
.gr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.gr-card{margin:0}
.gr-card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.gr-card ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.gr-card li{border-radius:10px;padding:6px 8px;cursor:pointer;font-size:14px;font-weight:600}
.gr-card li:hover{background:var(--line)}
.gr-card li small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.gr-card li.lider{background:var(--gold-50);color:#6E4A08}
.ins-card .ins-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ins-card .ins-h b{font-size:16px}
.ins-card .kv{margin:10px 0 12px}
.acuerdo{border-top:1px solid var(--line);margin-top:6px;padding-top:14px}
.acuerdo h3{font-size:15.5px;margin:0 0 4px}
.acuerdo details{border:1px solid var(--border);border-radius:12px;background:#FAFCFC}
.acuerdo summary{cursor:pointer;padding:11px 13px;font-weight:700;font-size:13.5px;color:var(--teal-2)}
.acuerdo-txt{max-height:320px;overflow:auto;padding:0 13px 12px;font-size:12.5px;line-height:1.5;color:var(--text)}
.acuerdo-txt h4{font-size:13px;margin:12px 0 4px}
.acuerdo-txt p{margin:0 0 8px}
.check-row.err{color:var(--red)}
.check-row{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:4px 0 12px}
.check-row input{width:18px;height:18px;margin-top:1px;flex-shrink:0}
.qr-ev small{color:var(--muted);font-size:12.5px}
.qr-ev h1{margin:4px 0 0;font-size:21px}
.ac-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.ac-item{display:flex;align-items:center;gap:11px;border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer}
.ac-item.on{border-color:#BFE3CC;background:#F6FBF8}
.ac-item input{width:20px;height:20px;flex-shrink:0}
.ac-item span{flex:1;min-width:0}
.ac-item b{display:block;font-size:14.5px}
.ac-item small{display:block;color:var(--muted);font-size:12px}
.qr-done{text-align:center;padding:26px 18px}
.ok-anim{display:block;width:88px;height:88px;margin:0 auto;animation:okPop .45s .8s cubic-bezier(.3,1.6,.5,1) both}
.ok-c{fill:var(--green-50);stroke:var(--green);stroke-width:3;stroke-dasharray:176;stroke-dashoffset:176;transform:rotate(-90deg);transform-origin:center;animation:okTrazo .65s ease-out forwards}
.ok-p{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:okTrazo .35s .55s ease-out forwards}
@keyframes okTrazo{to{stroke-dashoffset:0}}
@keyframes okPop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ok-anim,.ok-c,.ok-p{animation:none;stroke-dashoffset:0}}
.qr-done h2{margin:10px 0 6px;font-size:21px;justify-content:center}
.qr-done p{margin:0;color:var(--text);font-size:15px}
.who button{border:0;background:none;color:var(--teal-2);font-weight:700;text-decoration:underline;padding:0}

/* ---------- Attendance list ---------- */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{color:var(--navy);font:800 16px 'Manrope';margin-left:4px}
.att-list{display:flex;flex-direction:column;gap:7px}
.att-item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px 10px 10px 12px;cursor:pointer}
.att-item .n{font:800 13px 'Manrope';color:var(--faint);min-width:24px;text-align:right}
.att-item .at{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;max-width:32%;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.att-item .at b{font-size:13.5px;color:var(--navy)}
.att-item .badge{display:inline-block}
.sig-thumb{height:28px;max-width:70px;border:1px solid var(--border);border-radius:6px;background:#fff}

/* ---------- Class roll ---------- */
.date-nav{display:flex;align-items:center;gap:10px;padding:12px}
.dn-mid{flex:1;text-align:center}
.dn-mid b{display:block;font:800 16px 'Manrope';text-transform:capitalize}
.dn-mid small{color:var(--muted);font-size:12px}
.date-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.date-tools .tally{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.date-mini{border:1.5px solid var(--border);border-radius:10px;padding:6px 9px;font-size:13px;background:#fff}
.roll{display:flex;flex-direction:column;gap:8px}
.roll-item{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--border);border-radius:15px;padding:10px 10px 10px 12px}
.roll-item.p{border-color:#BFE3CC;background:#F6FBF8}
.roll-item.f{border-color:#F1CFCA;background:#FDF7F6}
.roll-item .ri{cursor:pointer}
.pf{display:flex;gap:6px}
.pf-btn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--border);background:#fff;border-radius:11px;padding:9px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.pf-btn.p.on{background:var(--green);border-color:var(--green);color:#fff}
.pf-btn.f.on{background:var(--red);border-color:var(--red);color:#fff}
@media(max-width:470px){.pf-btn span{display:none}.pf-btn{padding:10px 12px}}
/* Marcar todo lo que esté sin marcar */
.fill-blank{display:flex;align-items:center;justify-content:flex-end;gap:8px 12px;flex-wrap:wrap;margin:0 0 12px}
.fill-blank .fb-l{color:var(--teal-2);font-size:13.5px;font-weight:600}
.fill-blank .fb-l small{color:var(--muted);font-weight:600}
.fb-opts{display:flex;gap:6px}
.fb-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;background:#fff}
.fb-btn svg{width:16px;height:16px}
.fb-btn.p{border-color:var(--green);color:var(--green)}.fb-btn.p:hover{background:var(--green-50)}
.fb-btn.f{border-color:var(--red);color:var(--red)}.fb-btn.f:hover{background:var(--red-50)}

/* ---------- Planilla ---------- */
.plan-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.plan-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);max-height:70vh}
table.plan{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.plan th,.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
.plan thead th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:700;font-size:11.5px;padding:7px 4px;z-index:2;min-width:44px;line-height:1.2}
.plan thead th span{display:block;font-weight:500;color:#B9CCD8;font-size:10.5px}
.plan thead th.today{background:var(--teal)}
/* ---------- Calendario por alumno ---------- */
.cal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cal-stats div{background:#F6F9FA;border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.cal-stats b{display:block;font:800 18px 'Manrope';color:var(--navy)}
.cal-stats span{font-size:11.5px;color:var(--muted);font-weight:600}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.lgd{width:14px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid}
.lgd.p{background:var(--green-50);border-color:var(--green)}.lgd.f{background:var(--red-50);border-color:var(--red)}.lgd.e{background:#fff;border-color:#B9C7CE;border-style:dashed}.lgd.h{background:repeating-linear-gradient(135deg,#F3F5F6,#F3F5F6 3px,#DDE3E6 3px,#DDE3E6 6px);border-color:#C3CED4}
.cal-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px 22px}
.cal-mh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:8px;min-height:34px}
.cal-mh b{color:var(--teal-2);font-size:14px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal-d{height:46px;border-radius:9px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;background:#fff;cursor:pointer;transition:transform .05s}
.cal-d:active{transform:scale(.94)}
.cal-d .n{font-size:12.5px;font-weight:700;color:var(--text);line-height:1}
.cal-d svg{width:15px;height:15px}
.cal-d i{width:15px;height:15px;display:block}
.cal-d.p{background:var(--green-50);border-color:var(--green);color:var(--green)}
.cal-d.f{background:var(--red-50);border-color:var(--red);color:var(--red)}
.cal-d.e{border-color:#B9C7CE;border-style:dashed}
.cal-d.t{box-shadow:0 0 0 2px var(--teal)}
.cal-d[disabled]{cursor:default;opacity:1}
.cal-x{height:46px;display:grid;place-items:center;font-size:12px;color:#C3CED4}
.cal-x.fut{color:#DCE3E7}
.cal-x.hol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:9px;background:repeating-linear-gradient(135deg,#F3F5F6,#F3F5F6 5px,#E8ECEE 5px,#E8ECEE 10px);color:#8A9AA5;font-weight:700;cursor:help}
.cal-x.hol small{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.link-btn{border:0;background:none;padding:0;color:var(--teal-2);font-weight:700;text-decoration:underline;font-size:inherit}
.plan tbody .sticky{cursor:pointer;color:var(--teal-2)}
@media(max-width:420px){.cal-d{height:40px}.cal-x{height:40px}.cal-stats b{font-size:16px}}
.plan .sticky{position:sticky;left:0;background:#fff;text-align:left;z-index:1;padding:8px 12px;min-width:190px;max-width:240px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.plan thead th.sticky{z-index:3;background:var(--navy)}
.plan .wk{border-left:3px solid #9FB4BE}
.plan thead th.wk{border-left:3px solid #5E8296}
.plan td.cell{width:44px;height:40px;cursor:pointer;font-weight:800;font-size:15px;user-select:none}
.plan td.cell:hover{background:#F2F7F8}
.plan td.cell.p{background:var(--green-50);color:var(--green)}
.plan td.cell.f{background:var(--red-50);color:var(--red)}
.plan.ro td.cell{cursor:default}
.plan td.pct{font-weight:800;padding:0 10px;color:var(--navy)}
.plan tfoot td{background:#F6F9FA;font-weight:700;color:var(--muted);padding:8px 4px;position:sticky;bottom:0}
.plan tfoot td.sticky{background:#F6F9FA}

/* ---------- Savebar ---------- */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sb-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.wide~.savebar .sb-in{max-width:1100px}
.sb-status{flex:1;font-size:12.5px;color:var(--muted);line-height:1.3;min-width:0;text-align:right}
.sb-status b{display:block;color:var(--navy);font-size:13.5px}
.sb-status small{font-size:inherit}
.savebar .btn{padding:13px 18px}
.savebar .btn.has-pending{background:var(--gold);border-color:var(--gold);color:var(--navy)}

/* ---------- Sheets / modals ---------- */
#layer .ov{position:fixed;inset:0;z-index:100;background:rgba(14,30,42,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
#layer .ov.in{opacity:1}
.sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .2s;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.wide{max-width:760px}
.ov.in .sheet{transform:none}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:#D8E1E5;margin:6px auto 8px}
@media(min-width:700px){#layer .ov{align-items:center}.sheet{border-radius:22px;max-height:88vh}.sheet::before{display:none}.sheet{padding-top:18px}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;position:sticky;top:-6px;background:#fff;padding-top:6px;z-index:2}
.sh-head h3{font-size:18px}
.sh-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sh-foot{display:flex;gap:10px;margin-top:6px;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:#fff;padding:12px 0 calc(4px + env(safe-area-inset-bottom))}
.sh-foot .btn{flex:1}
/* En celular, el botón principal (el último) va a la izquierda: en Netlify el sello de la esquina inferior derecha lo tapaba. */
@media(max-width:700px){.sh-foot{flex-direction:row-reverse}}
.sig-wrap{position:relative;border:1.5px dashed #B9C7CE;border-radius:14px;background:#FCFDFD;height:170px;overflow:hidden}
canvas.sig{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sig-ph{position:absolute;inset:0;display:grid;place-items:center;color:#B5C3CA;font-weight:600;pointer-events:none}
.sig-wrap.has .sig-ph{display:none}
.sig-wrap::after{content:"";position:absolute;left:18px;right:18px;bottom:38px;border-bottom:1px solid #DCE4E8;pointer-events:none}
.sig-clear{position:absolute;right:8px;top:8px}
.dup{background:var(--amber-50);border:1px solid #F0D7A8;border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-size:13px;color:#6E4A08}
.dup .item{margin:6px 0 0;padding:8px 10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;word-break:break-word}
.sig-big{max-width:100%;border:1px solid var(--border);border-radius:12px;margin-top:8px;background:#fff}
.code-big{font:800 34px 'Manrope';letter-spacing:.1em;color:var(--navy);text-align:center;padding:16px;border:2px dashed var(--teal);border-radius:16px;background:#F4FAFA;margin-bottom:12px}
.warn-box{background:var(--amber-50);border:1px solid #F0D7A8;color:#6E4A08;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:12px}
.info-box{background:var(--teal-50);border:1px solid #C5E1E1;color:#14545A;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:12px}
.pin-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pin-val{font:800 26px 'Manrope';letter-spacing:.35em;color:var(--navy);background:#F4F7F8;border:1.5px dashed #B9C7CE;border-radius:12px;padding:8px 16px;min-width:140px;text-align:center}
.pin-val.on{border-color:var(--teal);background:#F4FAFA;color:var(--teal-2)}
.pin-in{font:800 26px 'Manrope'!important;letter-spacing:.4em;text-align:center}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--navy);color:#fff;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;max-width:520px;animation:tin .2s ease}
.toast.ok{background:#16603A}
.toast.error{background:#9E2E22}
.toast.warn{background:#7A5207}
.toast button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px}
@keyframes tin{from{transform:translateY(12px);opacity:0}}

/* ---------- Admin ---------- */
.card h2{font-size:16.5px;display:flex;align-items:center;gap:9px;margin-bottom:10px}
.card h2 svg{color:var(--teal)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#F6F9FA;border:1px solid var(--line);border-radius:13px;padding:11px}
.kpi b{display:block;font:800 21px 'Manrope';color:var(--navy)}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
table.mini{width:100%;border-collapse:collapse;font-size:13.5px}
.mini th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;border-bottom:1px solid var(--border);padding:7px 6px}
.mini td{border-bottom:1px solid var(--line);padding:8px 6px}
.mini td.r,.mini th.r{text-align:right}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #C3D2D8;border-radius:16px;padding:22px;text-align:center;cursor:pointer;background:#FAFCFC;color:var(--muted)}
.drop:hover{border-color:var(--teal);background:#F4FAFA}
.drop svg{width:28px;height:28px;color:var(--teal)}
.drop b{color:var(--navy)}
pre.code{background:#0F2232;color:#D7E6EE;border-radius:12px;padding:12px;font-size:12px;overflow:auto;white-space:pre}
ol.steps{padding-left:20px;margin:6px 0 12px;font-size:13.5px;color:var(--text)}
ol.steps li{margin-bottom:5px}
.radio-list label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.radio-list label:has(input:checked){border-color:var(--teal);background:#F4FAFA}
.radio-list small{display:block;color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px 0;color:var(--muted);font-size:13.5px;font-weight:600}
/* Carga: dos puertas que se abren, como al entrar a un evento. */
.doors{position:relative;width:54px;height:66px;border:4px solid var(--navy);border-bottom-width:5px;border-radius:28px 28px 4px 4px;overflow:hidden;perspective:160px;background:radial-gradient(circle at 50% 70%,#FFF4D6,#F2C66B 75%)}
.doors i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--teal),#1A6870);animation:puertaI 2.4s ease-in-out infinite}
.doors i:first-child{left:0;transform-origin:left center}
.doors i:last-child{right:0;transform-origin:right center;background:linear-gradient(270deg,var(--teal),#1A6870);animation-name:puertaD}
.doors i::after{content:'';position:absolute;top:56%;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.doors i:first-child::after{right:4px}
.doors i:last-child::after{left:4px}
.loading.sm{padding:18px 0;gap:8px}
.loading.sm .doors{width:36px;height:44px;border-width:3px;border-radius:18px 18px 3px 3px}
@keyframes puertaI{0%,12%{transform:rotateY(0)}48%,68%{transform:rotateY(-78deg)}100%{transform:rotateY(0)}}
@keyframes puertaD{0%,12%{transform:rotateY(0)}48%,68%{transform:rotateY(78deg)}100%{transform:rotateY(0)}}
@media (prefers-reduced-motion:reduce){.doors i{animation:none}}

/* ---------- iPhone ---------- */
/* iOS agranda el texto por su cuenta al girar el celular; aquí se respeta el tamaño definido. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Safari de iPhone hace zoom al tocar un campo con letra menor a 16px y no vuelve atrás: todo queda "agrandado". */
@media (pointer:coarse){input,select,textarea,.inp,.date-mini{font-size:16px!important}}
/* Pantallas angostas (iPhone con "Zoom de pantalla: Texto más grande" queda en 320–375px):
   menos margen y relleno para que el contenido tenga el espacio, sin achicar la letra. */
@media (max-width:400px){
  .wrap{padding:12px 10px 32px}
  .top-in{padding:0 10px;gap:8px}
  .card{padding:14px 12px}
  .section{margin-top:16px}
  .btn{padding:10px 12px}
  .btn.sm{padding:7px 9px}
  .btn-row{gap:8px}
  .btn-row>.btn{flex-basis:120px}
  .item,.person{gap:9px;padding:10px}
  .roll-item,.att-item{gap:8px;padding:8px}
  .av{width:34px;height:34px;font-size:12.5px}
  .item .ico{width:34px;height:34px}
  .pf{gap:4px}
  .pf-btn{padding:9px 10px}
  .eh-main{gap:10px}

/* SHA-256 (puro JS, funciona también abriendo el archivo localmente) */
function sha256(str){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str);
  const l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total-4, (l*8)>>>0); dv.setUint32(total-8, Math.floor(l*8/4294967296));
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Uint32Array(64);
  const rotr = (x,n) => (x>>>n)|(x<<(32-n));
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++) w[t] = dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){ const s0 = rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3); const s1 = rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10); w[t] = (w[t-16]+s0+w[t-7]+s1)>>>0; }
    let [a,b,c,d,e,f,g,h] = H;
    for(let t=0;t<64;t++){
      const t1 = (h + (rotr(e,6)^rotr(e,11)^rotr(e,25)) + ((e&f)^(~e&g)) + K[t] + w[t])>>>0;
      const t2 = ((rotr(a,2)^rotr(a,13)^rotr(a,22)) + ((a&b)^(a&c)^(b&c)))>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H = [H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(v=>v>>>0);
  }
  return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}

function toast(msg, type='', opts={}){
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = `<span>${esc(msg)}</span>${opts.action?`<button>${esc(opts.action)}</button>`:''}`;
  box.appendChild(t);
  const kill = ()=>{ t.style.opacity='0'; t.style.transition='opacity .2s'; setTimeout(()=>t.remove(), 220); };
  if(opts.action) t.querySelector('button').onclick = ()=>{ kill(); opts.onAction && opts.onAction(); };
  setTimeout(kill, opts.ms || (opts.action ? 5000 : 2600));
  while(box.children.length > 3) box.firstChild.remove();
}
function sheet(html, {onMount, wide, onClose}={}){
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  layer.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('in'));
  let closed = false;
  const onKey = e => { if(e.key === 'Escape') close(); };
  function close(){ if(closed) return; closed = true; ov.classList.remove('in'); document.removeEventListener('keydown', onKey); setTimeout(()=>ov.remove(), 200); onClose && onClose(); }
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', e => { if(e.target === ov) close(); });
  $$('[data-close]', ov).forEach(b => b.onclick = close);
  const el = ov.firstElementChild;
  onMount && onMount(el, close);
  return close;
}
const sheetHead = (title, sub) => `<div class="sh-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-close aria-label="Cerrar">${ICON.x}</button></div>`;
function confirmBox(msg, {title='¿Confirmar?', ok='Aceptar', cancel='Cancelar', danger=false}={}){

    let done = false;

      onMount(el, close){ $('[data-no]',el).onclick = ()=>{ done=true; res(false); close(); }; $('[data-yes]',el).onclick = ()=>{ done=true; res(true); close(); }; },
      onClose(){ if(!done) res(false); }

  });
}

async function shareOrDownload(blob, name, text, {wa='', waText=''}={}){
  const file = new File([blob], name, {type: blob.type});
  const isHtml = /\.html?$/i.test(name);
  // El reporte HTML se puede compartir como archivo en celular y en Windows/Mac (menú Compartir del sistema → WhatsApp).
  // El Excel solo se intenta en celular: en computadora el sistema lo rechaza.
  const mobile = matchMedia('(pointer:coarse)').matches && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  let canFile = (mobile || isHtml) && !!(navigator.canShare && (() => { try{ return navigator.canShare({files:[file]}); }catch(e){ return false; } })());
  // Solo el archivo, sin título ni texto: algunas apps convierten el texto en un mensaje aparte y el archivo se pierde.
  const tryShare = async () => { await navigator.share({files:[file]}); };
  if(canFile){
    try{ await tryShare(); return; }
    catch(e){
      if(e && e.name === 'AbortError') return;
      // Solo vale reintentar con un toque nuevo si falló por haber tardado en generar el Excel.
      canFile = !!(e && e.name === 'NotAllowedError');
    }
  }
  downloadBlob(blob, name);
  const phone = normPhone(wa);
  const desktop = !matchMedia('(pointer:coarse)').matches;
  // Nunca se manda texto: solo se abre el chat para soltar el archivo.
  const openChat = () => {
    if(phone) window.open('https://wa.me/' + phone, '_blank');
    else if(desktop) window.open('https://web.whatsapp.com/', '_blank');
    else location.href = 'whatsapp://send';
  };
  sheet(`${sheetHead(`✓ ${isHtml ? 'Reporte' : 'Excel'} listo para enviar`, esc(name))}
    ${canFile ? `<button class="btn primary lg block" id="shF">${ICON.share} Compartir archivo → WhatsApp</button><p class="hint" style="text-align:center">Se abre el menú Compartir con el archivo adjunto: elige <b>WhatsApp</b> y el chat.</p>` : ''}

function expandCompact(c){
  const people = []; const used = new Set();
  if(!c || !Array.isArray(c.p)) return people;
  c.p.forEach(r => {
    const wi = c.wards[r[3]] || [0,''];
    const p = { n:r[0], k:c.stakes[wi[0]]||'', w:wi[1]||'' };
    if(r[5] && typeof r[5] === 'object') ['id','src','added'].forEach(k => { if(r[5][k]) p[k] = r[5][k]; });
    let id = p.id || pidFor(p.n, p.w);
    while(used.has(id)) id += 'x';
    used.add(id); p.id = id;
    people.push(p);
  });
  return people;
}
function compactPeople(people, v){
  const stakes = [], sIdx = {}, wards = [], wIdx = {};
  const p = people.map(x => {
    const st = x.k||'', wd = x.w||'';
    if(!(st in sIdx)){ sIdx[st] = stakes.length; stakes.push(st); }
    const wk = st+'|'+wd;
    if(!(wk in wIdx)){ wIdx[wk] = wards.length; wards.push([sIdx[st], wd]); }
    const row = [x.n, 0, '', wIdx[wk], ''];
    const extra = {};
    ['src','added'].forEach(k => { if(x[k]) extra[k] = x[k]; });
    if(x.id && x.id !== pidFor(x.n, x.w)) extra.id = x.id;
    if(Object.keys(extra).length) row.push(extra);
    return row;
  });
  return { v, stakes, wards, p };
}

/* Búsqueda: cada palabra escrita debe ser el inicio de alguna palabra del nombre (en cualquier orden). */
function searchPeople(q, filter, limit=40){
  const toks = norm(q).split(' ').filter(Boolean);
  if(!toks.length) return { list:[], total:0, outside:0 };
  const hits = []; let outside = 0;
  for(const p of ROSTER.people){
    let ok = true, score = 0;
    for(const t of toks){
      let f = false;
      for(const w of p._t){ if(w.startsWith(t)){ f = true; if(w === t) score += 2; else score += 1; break; } }
      if(!f){ ok = false; break; }
    }
    if(!ok) continue;
    if(filter && !filter(p)){ outside++; continue; }
    hits.push([score, p]);
  }
  hits.sort((a,b) => b[0]-a[0] || a[1].n.localeCompare(b[1].n,'es'));
  return { list: hits.slice(0, limit).map(h=>h[1]), total: hits.length, outside };
}
function highlight(name, q){
  const toks = norm(q).split(' ').filter(Boolean);
  return prettyName(name).split(' ').map(word => {
    const nw = norm(word);
    const t = toks.filter(t => nw.startsWith(t)).sort((a,b)=>b.length-a.length)[0];
    return t ? `<mark>${esc(word.slice(0,t.length))}</mark>${esc(word.slice(t.length))}` : esc(word);
  }).join(' ');
}

const eventoEnNube = ev => !!(ev && SB.on() && (ev.remote || !ev.contrib));

async function syncEventOnline(code, {silent=false}={}){
  let ev = EVENTS[code]; if(!ev) return;
  if(BUSY.has(code)) return; BUSY.add(code);
  setSync('syncing');
  try{
    await SB.ensureSession();
    if(!ev.remote){
      const r = await SB.rpc('crear_evento', { codigo_deseado: code, meta: metaParaNube(ev.meta) });
      ev.remote = r.id; ev.metaPending = false;
      Object.keys(ev.rows || {}).forEach(id => ev.pending[id] = Date.now());
      ev.sigPending = Object.assign({}, ev.sigPending, Object.fromEntries(Object.keys(ev.sigs || {}).map(id => [id, 1])));
      if(r.codigo !== code){
        // El código ya existía en línea: el evento queda con el código nuevo.
        delete EVENTS[code]; ev.code = r.codigo; EVENTS[r.codigo] = ev; BUSY.delete(code); BUSY.add(r.codigo);
        if(CUR.code === code){ CUR.code = r.codigo; history.replaceState(null, '', '#/evento/' + r.codigo); }
        code = r.codigo;
        toast(`El evento quedó con el código ${r.codigo}`, 'warn', { ms:5000 });
      }
      saveEvents();
    }
    if(ev.metaPending){ await SB.rpc('actualizar_evento', { evento: ev.remote, meta: metaParaNube(ev.meta) }); ev.metaPending = false; }
    const sent = Object.entries(ev.pending || {});
    const filas = sent.map(([id]) => {
      const r = ev.rows[id]; if(!r) return null;
      const f = Object.assign({}, r);
      if(ev.sigs && ev.sigs[id] && ev.sigPending && ev.sigPending[id]) f.firma = ev.sigs[id];
      return f;
    }).filter(Boolean);
    const res = await SB.rpc('sincronizar_evento', { evento: ev.remote, filas });
    sent.forEach(([id, st]) => { if(ev.pending[id] === st) delete ev.pending[id]; });
    filas.forEach(f => { if(f.firma) delete ev.sigPending[f.id]; });
    if(res.meta && Object.keys(res.meta).length && !ev.metaPending) ev.meta = Object.assign({}, res.meta, ev.meta.joinedAt ? { joinedAt: ev.meta.joinedAt } : {});
    ev.qr = res.qr || null;
    if(res.organizador) ev.contrib = false;
    const rows = {};
    (res.filas || []).forEach(r => { rows[r.id] = r; });
    Object.keys(ev.pending).forEach(id => { if(ev.rows[id]) rows[id] = ev.rows[id]; });
    ev.rows = rows;
    ev.lastSync = Date.now();
    saveEvents(); setSync('ok');
    if(!silent) toast('Asistencia guardada y sincronizada ✓', 'ok');
  }catch(e){
    console.error(e);
    saveEvents(); setSync('error');
    if(!silent) toast('Sin conexión: quedó guardado en este dispositivo y se enviará al reconectar.', 'warn', {ms:4200});
  }finally{ BUSY.delete(code); }
  if(CUR.type === 'event' && CUR.code === code) liveEvent();
}

async function syncEvent(code, {silent=false}={}){
  const ev = EVENTS[code]; if(!ev) return;
  if(eventoEnNube(ev)) return syncEventOnline(code, {silent});
  if(!Sync.on()){ if(!silent) toast('Guardado en este dispositivo. (La sincronización entre dispositivos no está configurada.)', 'warn', {ms:4200}); paintSync(); return; }
  if(BUSY.has(code)) return; BUSY.add(code);
  setSync('syncing');
  try{
    if(ev.metaPending){ await Sync.req(`events/${code}/meta`, 'PUT', ev.meta); ev.metaPending = false; }
    const sent = Object.entries(ev.pending||{});
    if(sent.length){
      const patch = {}; sent.forEach(([id]) => { patch[id] = ev.rows[id]; });
      await Sync.req(`events/${code}/rows`, 'PATCH', patch);
      sent.forEach(([id, st]) => { if(ev.pending[id] === st) delete ev.pending[id]; });
    }
    const sigs = Object.keys(ev.sigPending||{});
    if(sigs.length){
      const patch = {}; sigs.forEach(id => { if(ev.sigs[id]) patch[id] = ev.sigs[id]; });
      if(Object.keys(patch).length) await Sync.req(`eventsigs/${code}`, 'PATCH', patch);
      sigs.forEach(id => delete ev.sigPending[id]);
    }
    const remote = await Sync.req(`events/${code}`);
    if(remote){
      if(remote.meta && !ev.metaPending) ev.meta = remote.meta;
      Object.entries(remote.rows||{}).forEach(([id, r]) => { if(!ev.pending[id]) ev.rows[id] = r; });
    }
    ev.lastSync = Date.now();
    saveEvents(); setSync('ok');
    if(!silent) toast('Asistencia guardada y sincronizada ✓', 'ok');
  }catch(e){
    saveEvents(); setSync('error');
    if(!silent) toast('Sin conexión: quedó guardado en este dispositivo y se enviará al reconectar.', 'warn', {ms:4200});
  }finally{ BUSY.delete(code); }
  if(CUR.type === 'event' && CUR.code === code) liveEvent();
}
async function ensureEventSigs(ev){
  const need = Object.values(ev.rows||{}).filter(r => r && !r.del && r.sig && !ev.sigs[r.id]).map(r=>r.id);
  if(need.length && ev.remote && SB.on()){

    return;
  }

  try{
    if(need.length > 6){ const all = await Sync.req(`eventsigs/${ev.code}`); if(all) Object.assign(ev.sigs, all); }
    else { for(const id of need){ const s = await Sync.req(`eventsigs/${ev.code}/${id}`); if(s) ev.sigs[id] = s; } }
    saveEvents();
  }catch(e){}
}

/* Domingo de Pascua (algoritmo gregoriano anónimo) */
function easter(y){
  const a = y%19, b = Math.floor(y/100), c = y%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d-g+15)%30, i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7, m = Math.floor((a+11*h+22*l)/451);
  const mo = Math.floor((h+l-7*m+114)/31), da = ((h+l-7*m+114)%31)+1;
  return new Date(y, mo-1, da);
}
/* Feriados nacionales del Perú + los días que agregue el administrador */
const PE_FIXED = [['01-01','Año Nuevo'],['05-01','Día del Trabajo'],['06-07','Batalla de Arica y Día de la Bandera'],['06-29','San Pedro y San Pablo'],['07-23','Día de la Fuerza Aérea del Perú'],['07-28','Fiestas Patrias'],['07-29','Fiestas Patrias'],['08-06','Batalla de Junín'],['08-30','Santa Rosa de Lima'],['10-08','Combate de Angamos'],['11-01','Día de Todos los Santos'],['12-08','Inmaculada Concepción'],['12-09','Batalla de Ayacucho'],['12-25','Navidad']];

function holidaysOf(y){
  if(HOL_CACHE[y]) return HOL_CACHE[y];
  const map = {};
  PE_FIXED.forEach(([md, n]) => map[`${y}-${md}`] = n);
  const ea = easter(y);
  const th = new Date(ea); th.setDate(ea.getDate()-3); map[iso(th)] = 'Jueves Santo';
  const fr = new Date(ea); fr.setDate(ea.getDate()-2); map[iso(fr)] = 'Viernes Santo';
  (SETTINGS.holidays||[]).forEach(h => { if(h.d && h.d.startsWith(String(y))) map[h.d] = h.n || 'Día no laborable'; });
  return HOL_CACHE[y] = map;
}

function blockedReason(ds){

}

/* Rango de la clase: si está ligada a un periodo, usa las fechas vigentes que configuró el administrador. */
function classRange(cls){

    const p = periodsOf(m.program).find(x => x.key === m.period.key && x.s.slice(0,4) === String(m.period.s||'').slice(0,4));
    if(p) return { s: p.s, e: p.e, name: p.n };
    return { s: m.period.s || m.start, e: m.period.e || '', name: m.period.n };

function classDates(cls){

  if(days.length){ const d = new Date(start); let guard = 0; while(d <= end && guard < 800){ const ds = iso(d); if(days.includes(d.getDay()) && !blockedReason(ds)) set.add(ds); d.setDate(d.getDate()+1); guard++; } }

  if(cls.remote) return syncRemoteClass(code, {silent});
  if(!Sync.on()){ if(!silent) toast('Guardado en este dispositivo. (La sincronización entre dispositivos no está configurada.)', 'warn', {ms:4200}); paintSync(); return; }
  if(BUSY.has(code)) return; BUSY.add(code);
  setSync('syncing');
  try{
    if(cls.canEdit){
      const sent = Object.entries(cls.dirty||{});
      if(sent.length){
        const patch = {}; sent.forEach(([p]) => { patch[p] = getPath(cls, p); });
        await Sync.req(`classes/${code}`, 'PATCH', patch);
        sent.forEach(([p, st]) => { if(cls.dirty[p] === st) delete cls.dirty[p]; });
      }
      const sigs = Object.keys(cls.sigPending||{});
      if(sigs.length){
        const patch = {}; sigs.forEach(id => { if(cls.sigs[id]) patch[id] = cls.sigs[id]; });
        if(Object.keys(patch).length) await Sync.req(`classsigs/${code}`, 'PATCH', patch);
        sigs.forEach(id => delete cls.sigPending[id]);
      }
    }
    const remote = await Sync.req(`classes/${code}`);
    if(remote){
      const dirty = cls.dirty || {};
      if(remote.meta && !dirty.meta) cls.meta = remote.meta;
      Object.entries(remote.students||{}).forEach(([id, s]) => { if(!dirty['students/'+id]) cls.students[id] = s; });
      const ratt = remote.att || {};
      const dates = new Set([...Object.keys(ratt), ...Object.keys(cls.att||{})]);
      dates.forEach(d => {
        const loc = cls.att[d] || {}, rem = ratt[d] || {};
        const sids = new Set([...Object.keys(loc), ...Object.keys(rem)]);
        sids.forEach(sid => { if(dirty[`att/${d}/${sid}`]) return; if(rem[sid]) loc[sid] = rem[sid]; else delete loc[sid]; });
        if(Object.keys(loc).length) cls.att[d] = loc; else delete cls.att[d];
      });
    }
    cls.lastSync = Date.now();
    saveClasses(); setSync('ok');
    if(!silent) toast(cls.canEdit ? 'Asistencia guardada y sincronizada ✓' : 'Datos actualizados ✓', 'ok');
  }catch(e){
    saveClasses(); setSync('error');
    if(!silent) toast('Sin conexión: quedó guardado en este dispositivo y se enviará al reconectar.', 'warn', {ms:4200});
  }finally{ BUSY.delete(code); }
  if(CUR.type === 'class' && CUR.code === code) liveClass();
}
async function ensureClassSigs(cls){
  const need = Object.values(cls.students||{}).filter(s => s && !s.del && s.sig && !cls.sigs[s.id]).map(s=>s.id);
  if(!need.length || !Sync.on()) return;
  try{ const all = await Sync.req(`classsigs/${cls.code}`); if(all) Object.assign(cls.sigs, all); saveClasses(); }catch(e){}
}

let syncTimer = null;
function queueSync(){

async function syncAllPending(){
  for(const c of Object.keys(CLASSES)) if(CLASSES[c].remote && classPendingCount(CLASSES[c])) await syncRemoteClass(c, {silent:true});
  for(const c of Object.keys(EVENTS)) if(eventoEnNube(EVENTS[c]) && EVENTS[c].remote && eventPendingCount(EVENTS[c])) await syncEvent(c, {silent:true});
  if(!Sync.on()) return;
  for(const c of Object.keys(EVENTS)) if(eventPendingCount(EVENTS[c])) await syncEvent(c, {silent:true});
  for(const c of Object.keys(CLASSES)) if(!CLASSES[c].remote && CLASSES[c].canEdit && classPendingCount(CLASSES[c])) await syncClass(c, {silent:true});
}
async function uniqueCode(prefix, coll){
  let code = genCode(prefix);
  if(!Sync.on()) return code;
  for(let i=0;i<4;i++){
    try{ const ex = await Sync.req(`${coll}/${code}/meta`); if(!ex) return code; code = genCode(prefix); }catch(e){ return code; }
  }
  return code;
}

const SB = {
  client:null, signingIn:null, ready:false, admin:false, user:null, mis:[], solicitudes:[], counts:{solicitudes:0, alertas:0}, resumen:[], watchers:[], global:null, readyP:null,
  on(){ return !!(window.CA_CONFIG && window.CA_CONFIG.supabaseUrl && window.CA_CONFIG.supabaseKey); },
  init(){

  async ensureSession(){
    if(!this.client) throw new Error('No hay conexión con el servidor. Revisa tu internet.');
    if(this.user) return this.user;
    if(!this.signingIn) this.signingIn = this.client.auth.signInAnonymously().then(({ data, error }) => { if(error) throw error; this.user = data.user; return this.user; }).finally(() => { this.signingIn = null; });
    return this.signingIn;

  async refresh(){
    if(!this.user) return;

    this.admin = !!(perfil[0] && perfil[0].rol === 'admin');

  },
  // Si este dispositivo ya entró a clases, vuelve a tener sesión aunque se haya perdido.
  async volver(){
    try{
      if(!this.user && Object.keys(misAccesos()).length) await this.ensureSession();
      if(this.user) await this.refresh();
    }catch(e){ console.error(e); }
  },
  // Las clases que este dispositivo ya usaba y ya no aparecen (sesión nueva, datos borrados,
  // entrar y salir como administrador) se vuelven a pedir con el mismo nombre: entra sin esperar.
  async recuperarAccesos(){
    const g = misAccesos(), tengo = new Set(this.mis.map(c => c.id));
    let volvio = false, cambio = false;
    for(const id of Object.keys(g)){
      if(tengo.has(id)) continue;
      try{
        const r = await this.rpc('solicitar_acceso', Object.assign({ clase:id }, g[id].datos));
        if(r === 'acceso' || r === 'acceso_colaborador' || r === 'ya_tuya') volvio = true;
        else{ delete g[id]; cambio = true; }
      }catch(e){ console.error(e); if(/no existe|not found|foreign/i.test(String(e && e.message))){ delete g[id]; cambio = true; } }
    }
    if(cambio) LS.set('ca_mis_accesos', g);
    if(volvio) this.mis = await this.rpc('mis_clases');
    recordarAccesos(this.mis);
  },
  async loadCounts(){ this.counts = await this.rpc('contadores_admin'); paintBadges(); },
  async rpc(name, args){
    if(!this.client) throw new Error('No hay conexión con el servidor. Revisa tu internet.');
    const { data, error } = await this.client.rpc(name, args || {});
    if(error) throw error;
    return data;
  },
  async fetchAll(table, cols, filters=[], order){
    const out = [];
    for(let from=0; ; from+=1000){
      let q = this.client.from(table).select(cols);
      filters.forEach(([c, v]) => { q = q.eq(c, v); });
      if(order) q = q.order(order);
      const { data, error } = await q.range(from, from+999);
      if(error) throw error;
      out.push(...data);
      if(data.length < 1000) return out;
    }
  },
  watch(table, filter, cb){
    if(!this.client || !this.client.channel) return;
    const ch = this.client.channel(`w-${table}-${filter||'all'}-${Date.now()}`).on('postgres_changes', Object.assign({ event:'*', schema:'public', table }, filter ? { filter } : {}), debounce(cb, 900)).subscribe();
    this.watchers.push(ch);
  },
  stopWatch(){ this.watchers.forEach(ch => { try{ this.client.removeChannel(ch); }catch(e){} }); this.watchers = []; },
  watchGlobal(){
    if(this.global || !this.client || !this.client.channel) return;
    this.global = this.client.channel('admin-notificaciones').on('postgres_changes', { event:'INSERT', schema:'public', table:'solicitudes_acceso' }, ev => {
      if(ev && ev.new && ev.new.estado && ev.new.estado !== 'pendiente') return;
      toast('🔔 Nueva solicitud de acceso a una clase', 'warn', { action:'Ver', onAction: () => go('#/solicitudes'), ms:8000 });
      this.loadCounts().then(() => { if(CUR.type === 'home') renderHome(); if(CUR.type === 'solicitudes') renderSolicitudes(); }).catch(()=>{});
    }).subscribe();
  },
  async signOut(){
    this.stopWatch();
    if(this.global){ try{ this.client.removeChannel(this.global); }catch(e){} this.global = null; }
    await this.client.auth.signOut({ scope:'local' });
    this.user = null; this.admin = false; this.mis = []; this.solicitudes = []; this.barrios = null; this.counts = {solicitudes:0, alertas:0};
    Object.keys(CLASSES).forEach(c => { if(CLASSES[c].remote) delete CLASSES[c]; }); saveClasses();
    // Vuelve la sesión que tenía este dispositivo antes de entrar como administrador,
    // para no perder las clases y accesos que ya tenía.
    const prev = LS.get('ca_sesion_dispositivo', null);
    if(prev){
      LS.del('ca_sesion_dispositivo');
      try{ const { data, error } = await this.client.auth.setSession(prev); if(!error && data.user) this.user = data.user; }catch(e){ console.error(e); }
    }
    await this.volver();
  }
};

/* ---------- Sincronización de una clase en línea ---------- */
function studentFromRow(a){
  return { id:a.id, pid:a.persona_id, n:a.nombre, src: a.origen === 'maestro' && a.vinculo !== 'vinculado' ? 'nuevo' : 'base', vinculo:a.vinculo, data:{ k:a.estaca, w:a.barrio }, addedAt: Date.parse(a.agregado_en) || 0, ...(a.retirado_en ? { del:true } : {}) };
}
function metaFromRow(c){
  return { title:c.titulo, teacher:c.maestro_nombre, program:c.programa, stake:c.estaca, ward:c.barrio, days:c.dias || [], start:c.inicio || '', end:c.fin || '', extraDates:c.fechas_extra || [], skipDates:c.fechas_omitidas || [], horario:c.horario, curso:c.curso, createdAt: Date.parse(c.creado_en) || 0 };
}
async function pushRemoteClass(cls){
  const sent = Object.entries(cls.dirty||{});
  const id = cls.dbId;
  for(const [p, st] of sent.filter(([p]) => p.startsWith('students/'))){
    const s = getPath(cls, p);
    if(s){
      const { error } = await SB.client.from('clase_alumnos').upsert({ id:s.id, clase_id:id, nombre:s.n, estaca:(s.data||{}).k || '', barrio:(s.data||{}).w || '', persona_id:s.pid || null, retirado_en: s.del ? new Date(s.delAt || Date.now()).toISOString() : null }, { onConflict:'id' });
      if(error && error.code === '23505'){ delete cls.students[s.id]; toast(`${prettyName(s.n)} ya estaba en la clase`, 'warn'); }
      else if(error) throw error;
    }
    if(cls.dirty[p] === st) delete cls.dirty[p];
  }
  const att = sent.filter(([p]) => p.startsWith('att/'));
  const rows = [];
  for(const [p] of att){
    const [, fecha, alumno] = p.split('/');
    const v = (cls.att[fecha]||{})[alumno];
    if(v) rows.push({ clase_id:id, alumno_id:alumno, fecha, estado:v, marcado_por:SB.user.id, actualizado_en:new Date().toISOString() });
    else { const { error } = await SB.client.from('asistencia').delete().eq('alumno_id', alumno).eq('fecha', fecha); if(error) throw error; }
  }
  if(rows.length){ const { error } = await SB.client.from('asistencia').upsert(rows, { onConflict:'alumno_id,fecha' }); if(error) throw error; }
  att.forEach(([p, st]) => { if(cls.dirty[p] === st) delete cls.dirty[p]; });
  if(cls.dirty.meta){
    const st = cls.dirty.meta, m = cls.meta;
    await SB.rpc('actualizar_calendario', { clase:id, dias_nuevos:m.days || [], extra:m.extraDates || [], omitidas:m.skipDates || [] });
    if(cls.dirty.meta === st) delete cls.dirty.meta;
  }
}
async function pullRemoteClass(cls){
  const rows = await SB.fetchAll('clases', '*', [['codigo', cls.code]]);
  if(!rows.length) return false;
  const dirty = cls.dirty || {};
  cls.dbId = rows[0].id;
  cls.qr = rows[0].qr || null;
  if(!dirty.meta) cls.meta = metaFromRow(rows[0]);
  const alumnos = await SB.fetchAll('clase_alumnos', '*', [['clase_id', cls.dbId]]);
  const marcas = await SB.fetchAll('asistencia', 'alumno_id,fecha,estado', [['clase_id', cls.dbId]]);
  const ids = new Set(alumnos.map(a => a.id));
  Object.keys(cls.students).forEach(id => { if(!ids.has(id) && !dirty['students/'+id]) delete cls.students[id]; });
  alumnos.forEach(a => { if(!dirty['students/'+a.id]) cls.students[a.id] = studentFromRow(a); });
  const ratt = {}; marcas.forEach(m => { (ratt[m.fecha] = ratt[m.fecha] || {})[m.alumno_id] = m.estado; });
  const dates = new Set([...Object.keys(ratt), ...Object.keys(cls.att||{})]);
  dates.forEach(d => {
    const loc = cls.att[d] || {}, rem = ratt[d] || {};
    new Set([...Object.keys(loc), ...Object.keys(rem)]).forEach(sid => { if(dirty[`att/${d}/${sid}`]) return; if(rem[sid]) loc[sid] = rem[sid]; else delete loc[sid]; });
    if(Object.keys(loc).length) cls.att[d] = loc; else delete cls.att[d];
  });
  return true;
}
async function syncRemoteClass(code, {silent=false}={}){
  const cls = CLASSES[code]; if(!cls) return;
  if(BUSY.has(code)) return; BUSY.add(code);
  setSync('syncing');
  let gone = false;
  try{
    await SB.ensureSession();
    if(classPendingCount(cls)) await pushRemoteClass(cls);
    gone = !(await pullRemoteClass(cls));
    cls.lastSync = Date.now();
    if(gone) delete CLASSES[code];
    saveClasses(); setSync('ok');
    if(!silent && !gone) toast('Asistencia guardada y sincronizada ✓', 'ok');
  }catch(e){
    console.error(e);
    saveClasses(); setSync('error');
    if(!silent) toast('Sin conexión: quedó guardado en este dispositivo y se enviará al reconectar.', 'warn', {ms:4200});
  }finally{ BUSY.delete(code); }
  if(gone){ toast('Ya no tienes acceso a esta clase.', 'warn'); if(CUR.code === code) go('#/'); return; }
  if(CUR.type === 'class' && CUR.code === code) liveClass();
}
/* unirse: llegó con un código (pegado o por enlace). Si es una invitación, entra como colaborador
   por el tiempo que eligió el maestro y se abre la clase con su código fijo. */
async function openRemoteClass(code, unirse){
  await SB.readyP;
  try{
    await SB.ensureSession();
    const cls = CLASSES[code] || Object.assign(newClassObj(code, {}), { dirty:{} });
    cls.remote = true; cls.canEdit = true;
    let ok = await pullRemoteClass(cls);
    if(!ok && unirse){
      const r = await SB.rpc('unirme_con_codigo', { codigo_clase:code });
      const avisos = {
        no_existe:'No existe ninguna clase ni invitación con ese código. Revisa que esté bien escrito.',
        usado:'Esa invitación ya fue usada por otra persona. Pide al maestro un código nuevo.',
        sin_invitacion:'Ese es el código fijo de la clase. Para colaborar, pide al maestro un código de invitación.'
      };
      if(avisos[r.estado]){ toast(avisos[r.estado], 'error', { ms:6000 }); go('#/'); return; }
      if(r.estado === 'acceso') toast(`✓ Entraste como colaborador${r.vence_en ? ' hasta el '+fmtDate(fechaLocal(r.vence_en)) : ''}`, 'ok', { ms:5000 });
      await SB.refresh().catch(() => {});

    CLASSES[code] = cls; saveClasses();
    if(location.hash === '#/clase/'+code) renderClass(code); else go('#/clase/'+code);

/* ---------- Seguimiento: retrasos y últimos cambios ---------- */
const DIAS_RETRASO = 7;
/* Una clase está atrasada si su primera sesión sin marcar tiene más de una semana. */
function retrasoDe(c){
  if(!c || !c.inicio || !c.dias) return null;
  const dates = classDates({ meta:{ days:c.dias, start:c.inicio, end:c.fin || '', extraDates:c.fechas_extra || [], skipDates:c.fechas_omitidas || [] }, att:{} });
  const pend = dates.filter(d => d > (c.ultima_fecha || ''));
  if(!pend.length) return null;
  const dias = Math.floor((parseISO(todayISO()) - parseISO(pend[0])) / 864e5);
  return dias > DIAS_RETRASO ? { dias, desde:pend[0], sesiones:pend.length } : null;
}
const fechaLocal = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const fechaHora = ts => { if(!ts) return ''; const d = new Date(ts); return isNaN(d) ? '' : `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${fmtTime(d)}`; };
function seguimientoHTML(c){
  const r = retrasoDe(c);
  return `<small>${c.titular ? `Adoptada por <b>${esc(c.titular)}</b>${c.adoptada_en ? ' · '+esc(fechaHora(c.adoptada_en)) : ''}` : 'Sin adoptar'}</small>
    <small>${c.ultimo_cambio ? `Último cambio del maestro: <b>${esc(fechaHora(c.ultimo_cambio))}</b> · ${c.cambios} cambio${c.cambios===1?'':'s'}` : 'Sin cambios del maestro'}${r ? ` · <b class="late-txt">Atrasada ${r.dias} días</b>` : ''}${Number(c.recordatorios) ? ' · 🔔 Recordatorios activos' : ''}</small>`;
}
async function renderSeguimiento(filtro='adoptadas'){
  CUR = { type:'seguimiento', code:null };

      const nombres = { adoptadas:'Adoptadas', cambios:'Con cambios', atrasadas:'Atrasadas', sin:'Sin adoptar' };
      const list = grupos[filtro].slice().sort((a,b) => String(b.ultimo_cambio||'').localeCompare(String(a.ultimo_cambio||'')) || String(b.adoptada_en||'').localeCompare(String(a.adoptada_en||'')));

        <p class="hint" style="margin:0 2px 10px"><span class="live-dot"></span> En vivo · las clases con cambios recientes aparecen primero, para revisarlas en Wise.</p>
        ${list.map(c => `<button class="item" data-go="#/clase/${c.codigo}"><span class="av">${esc(initials(c.maestro))}</span><span class="ii"><b>${esc(prettyName(c.maestro))}</b><small>${esc([progLabel(c.programa), stakeShort(c.estaca), c.horario].filter(Boolean).join(' · '))}</small>${seguimientoHTML(c)}</span>${ICON.next}</button>`).join('') || '<div class="empty">No hay clases en este grupo.</div>'}`;
      $$('[data-go]', body).forEach(b => b.onclick = () => go(b.dataset.go));

  };

  const pinta = (b, s, boton='') => { box.innerHTML = `<div class="pend-box"><div><b>${b}</b><small>${s}</small></div>${boton}</div>`; };
  if(!window.CA_CONFIG.pushKey){ box.innerHTML = ''; return; }
  if(!pushDisponible()){
    if(esIOS() && !instalada()) pinta('Activa los recordatorios en tu iPhone', 'En Safari toca Compartir y luego “Agregar a inicio”. Abre la app desde ese ícono y activa aquí los recordatorios.');
    else pinta('Recordatorios no disponibles', 'Este navegador no permite notificaciones. Revisa la página cada semana para marcar tu asistencia.');
    return;
  }
  const sub = await suscripcionActual().catch(() => null);
  if(sub && Notification.permission === 'granted'){
    pinta('Recordatorios activados', 'Te avisaremos si tu asistencia se atrasa más de una semana.', '<button class="btn sm" id="pushOff">Desactivar</button>');
    $('#pushOff').onclick = () => desactivarPush().then(paintPush).catch(e => toast(errMsg(e), 'error'));
    return;
  }
  if(Notification.permission === 'denied'){ pinta('Notificaciones bloqueadas', 'Actívalas en los ajustes del navegador para este sitio y vuelve a abrir la página.'); return; }
  pinta('Recibe recordatorios en este celular', 'Te avisaremos si tu asistencia se atrasa más de una semana. Se detienen al ponerte al día.', '<button class="btn sm gold" id="pushOn">Activar</button>');
  $('#pushOn').onclick = () => activarPush().then(paintPush).catch(e => { console.error(e); toast(errMsg(e), 'error'); });
}
async function activarPush(){
  const permiso = await Notification.requestPermission();
  if(permiso !== 'granted'){ toast('No se activaron: falta dar permiso de notificaciones.', 'warn'); return; }
  await SB.ensureSession();
  const reg = await navigator.serviceWorker.register('/sw.js');
  await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:claveBytes(window.CA_CONFIG.pushKey) });
  const j = sub.toJSON();
  await SB.rpc('guardar_suscripcion', { punto:j.endpoint, clave_p256dh:j.keys.p256dh, clave_auth:j.keys.auth });
  toast('✓ Recordatorios activados en este celular', 'ok');
}
async function desactivarPush(){
  const sub = await suscripcionActual(); if(!sub) return;
  await SB.rpc('quitar_suscripcion', { punto:sub.endpoint });
  await sub.unsubscribe();
  toast('Recordatorios desactivados');
}

/* ---------- Clases creadas en el dispositivo antes de la base en línea ---------- */
/* Se busca su clase en línea (por alumnos, maestro y curso) y, si el maestro confirma,
   se le suman los alumnos y las marcas que tenía guardadas aquí. */
let localesRevisadas = false, revisandoLocales = false;
const clasesLocales = () => Object.values(CLASSES).filter(c => c && !c.remote && c.canEdit !== false && classStudents(c).length);
const marcasLocales = cls => Object.values(cls.att || {}).reduce((n, d) => n + Object.keys(d || {}).length, 0);
function localesHTML(){
  const list = clasesLocales();
  if(!list.length) return '';
  return `<section class="section"><div class="section-h"><h2>Guardadas en este dispositivo</h2></div>
    <p class="hint" style="margin:0 2px 8px">Clases que creaste aquí antes de la base en línea. Únelas a tu clase en línea para no perder sus alumnos ni su asistencia.</p>
    ${list.map(c => `<div class="item"><span class="ico g">${ICON.book}</span><span class="ii"><b>${esc(c.meta.title || 'Clase')}</b><small>${esc([c.meta.teacher, progLabel(c.meta.program), classStudents(c).length+' alumnos', marcasLocales(c)+' marcas'].filter(Boolean).join(' · '))}</small></span>${
      c.enLinea ? `<button class="btn sm" data-go="#/clase/${esc(c.enLinea)}">${ICON.check} Unida</button>` : `<button class="btn sm gold" data-unir="${esc(c.code)}">Unir</button>`}</div>`).join('')}</section>`;
}
function datosLocal(cls){
  const m = cls.meta || {};
  return {
    maestro:m.teacher || myName() || '', titulo:m.title || '', programa:m.program || '', estaca:m.stake || '',
    alumnos:classStudents(cls).map(s => {
      const marcas = {};
      Object.entries(cls.att || {}).forEach(([d, a]) => { const v = (a || {})[s.id]; if(v && /^\d{4}-\d\d-\d\d$/.test(d)) marcas[d] = v; });
      return { nombre:s.n, estaca:(s.data||{}).k || '', barrio:(s.data||{}).w || '', marcas };
    })
  };
}
async function revisarClasesLocales(){
  revisandoLocales = true;
  try{
    for(const cls of clasesLocales().filter(c => !c.enLinea)){
      // Ya le dieron acceso a la clase que esperaba: se une sin preguntar otra vez.
      if(cls.esperando && SB.user && (SB.mis||[]).some(x => x.id === cls.esperando)){ await unirClaseLocal(cls, cls.esperando); continue; }
      if(cls.noUnir || cls.esperando) continue;
      const seguir = await buscarClaseParaLocal(cls, false);
      if(!seguir) break;
    }
  }catch(e){ console.error(e); }
  revisandoLocales = false;
}
/* Devuelve true si se puede pasar a la siguiente clase local. */
async function buscarClaseParaLocal(cls, manual){
  if(!cls) return true;
  let sug = [];
  try{
    await SB.ensureSession();
    const datos = datosLocal(cls);
    sug = await SB.rpc('sugerir_clase_local', { datos:{ maestro:datos.maestro, titulo:datos.titulo, programa:datos.programa, estaca:datos.estaca, alumnos:datos.alumnos.map(a => a.nombre) } });
  }catch(e){ console.error(e); if(manual) toast(errMsg(e), 'error'); return true; }
  const ids = new Set(sug.map(x => x.id));
  const mias = (SB.mis||[]).filter(x => !ids.has(x.id)).map(x => ({ id:x.id, maestro:x.maestro, programa:x.programa, estaca:x.estaca, horario:x.horario, curso:x.curso, alumnos:x.alumnos, tengo_acceso:true, mia:true }));
  const opciones = sug.concat(mias);
  if(!opciones.length){
    if(manual) sheet(`${sheetHead('No encontramos tu clase')}<p class="hint" style="margin-top:0">Ninguna clase en línea coincide con <b>${esc(cls.meta.title || 'esta clase')}</b>. Entra a <b>Entrar a mi clase</b>, búscala por tu nombre y vuelve aquí a tocar <b>Unir</b>.</p><div class="sh-foot"><button class="btn" data-close>Cerrar</button><button class="btn primary" id="toEnt">Entrar a mi clase</button></div>`, { onMount(el, close){ $('#toEnt', el).onclick = () => { close(); go('#/entrar'); }; } });
    return true;
  }
  const n = classStudents(cls).length;
  return new Promise(res => {
    let fin = false;
    const terminar = v => { if(!fin){ fin = true; res(v); } };
    sheet(`${sheetHead(sug.length ? 'Encontramos una clase para ti' : 'Elige tu clase en línea', esc(cls.meta.title || ''))}
      <div class="info-box">En este dispositivo tienes la clase <b>${esc(cls.meta.title || 'sin título')}</b>${cls.meta.teacher ? ` de <b>${esc(cls.meta.teacher)}</b>` : ''} con <b>${n}</b> alumnos y <b>${marcasLocales(cls)}</b> marcas. Si es la misma clase, sus alumnos y su asistencia se suman a la clase en línea. Lo que ya está marcado en línea no se cambia.</div>
      ${opciones.map((o, i) => `<div class="item" style="margin:8px 0 0"><span class="av">${esc(initials(o.maestro))}</span><span class="ii"><b>${esc(prettyName(o.maestro))}</b><small>${esc([progLabel(o.programa), stakeShort(o.estaca), o.horario, o.curso].filter(Boolean).join(' · '))}</small><small>${o.mia ? 'Una de tus clases' : `<b>${o.coincidentes} de ${n}</b> alumnos coinciden`}${o.adoptada && !o.tengo_acceso ? ' · ya adoptada' : ''}</small></span><button class="btn sm ${i===0 && !o.mia ? 'gold' : ''}" data-op="${i}">Es esta</button></div>`).join('')}
      <div class="sh-foot"><button class="btn ghost" id="noEs">No es ninguna</button><button class="btn" data-close>Ahora no</button></div>`, {
      wide:true,
      onClose(){ terminar(false); },
      onMount(el, close){
        $('#noEs', el).onclick = () => { cls.noUnir = true; saveClasses(); terminar(true); close(); toast('Puedes unirla después desde “Guardadas en este dispositivo”.'); };
        $$('[data-op]', el).forEach(b => b.onclick = async () => { close(); terminar(false); await unirClaseLocal(cls, opciones[+b.dataset.op].id, opciones[+b.dataset.op]); });
      }
    });
  });
}
async function unirClaseLocal(cls, id, op){
  try{
    toast('Uniendo tu asistencia…');
    await SB.ensureSession();
    const r = await SB.rpc('unir_clase_local', { clase:id, datos:datosLocal(cls) });
    if(r.estado === 'sin_acceso'){
      cls.esperando = id; saveClasses();
      await confirmBox('Esta clase ya la adoptó otra persona. Pide acceso con tu nombre y apellido: si eres su maestro entrarás al instante y uniremos tu asistencia. Si no, se unirá cuando el administrador te dé acceso.', { title:'Pide acceso primero', ok:'Pedir acceso', cancel:'Cerrar' })
        && openSolicitud(op || { id, maestro:'', horario:'', estaca:cls.meta.stake, programa:cls.meta.program });
      return;
    }
    if(r.estado !== 'unida'){ toast('Esa clase ya no existe.', 'error'); return; }
    cls.enLinea = r.codigo; delete cls.esperando; delete cls.noUnir; saveClasses();
    await SB.refresh();
    sheet(`${sheetHead('✓ Clase unida')}<dl class="kv"><dt>Alumnos agregados</dt><dd>${r.alumnos}</dd><dt>Marcas agregadas</dt><dd>${r.marcas}</dd>${r.distintas ? `<dt>Marcas que ya estaban en línea con otro valor (se mantuvieron)</dt><dd>${r.distintas}</dd>` : ''}</dl>
      <p class="hint">La copia de este dispositivo se conserva como respaldo.</p><div class="sh-foot"><button class="btn primary" id="toCl">Abrir la clase</button></div>`, { onMount(el, close){ $('#toCl', el).onclick = () => { close(); go('#/clase/'+r.codigo); }; } });
    if(CUR.type === 'home') renderHome(true);
  }catch(e){ console.error(e); toast(errMsg(e), 'error'); }
}
/* Iniciar sesión como administrador reemplaza la sesión anónima del dispositivo (con sus clases).
   Se guarda para recuperarla al cerrar la sesión de administrador. */
async function guardarSesionDispositivo(){
  const { data } = await SB.client.auth.getSession();
  const s = data && data.session;
  if(s && s.user && s.user.is_anonymous) LS.set('ca_sesion_dispositivo', { access_token:s.access_token, refresh_token:s.refresh_token });
}
function askAdminOnline(){
  sheet(`${sheetHead('Acceso de administrador')}<form id="alf"><div class="field"><label>Correo</label><input id="aEm" type="email" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="aPw" type="password" autocomplete="current-password"></div></form><div class="sh-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Entrar</button></div>`, {
    onMount(el, close){
      setTimeout(() => $('#aEm', el).focus(), 250);
      const tryIt = async () => {
        try{
          await guardarSesionDispositivo();
          const { data, error } = await SB.client.auth.signInWithPassword({ email:$('#aEm', el).value.trim(), password:$('#aPw', el).value });
          if(error) throw error;
          SB.user = data.user;
          await SB.refresh();
          if(!SB.admin){ await SB.signOut(); toast('Esa cuenta no es de administrador.', 'error'); return; }
          close(); toast('Bienvenido', 'ok'); go('#/todas');
        }catch(e){ toast(/invalid/i.test(String(e.message)) ? 'Correo o contraseña incorrectos.' : errMsg(e), 'error'); }
      };
      $('#ok', el).onclick = tryIt;
      $('#alf', el).onsubmit = e => { e.preventDefault(); tryIt(); };
    }
  });
}

/* ---------- Entrar a mi clase ---------- */
function renderEntrar(){
  CUR = { type:'entrar', code:null };
  app.innerHTML = topbar({ back:'#/', title:'Entrar a mi clase', sub:'Seminarios e Institutos' }) + `<main class="wrap">
    <section class="card"><h2>${ICON.search} ¿Cómo te llamas?</h2>
      <p class="hint" style="margin-top:0">Escribe tu nombre y apellido como maestro de la clase.</p>
      <div class="search-box"><span class="si">${ICON.search}</span><input id="tq" type="search" placeholder="Nombre y apellido…" autocomplete="off" spellcheck="false" value="${esc(myName())}"></div>
      <div id="tres" class="results" style="margin-top:12px"></div>
    </section></main>`;
  bindTop();
  const q = $('#tq');
  const run = debounce(() => buscarMiClase(q.value), 300);
  q.oninput = run;
  setTimeout(() => q.focus(), 100);
  if(q.value) buscarMiClase(q.value);
}
async function buscarMiClase(txt){
  const el = $('#tres'); if(!el) return;
  if(norm(txt).length < 3){ el.innerHTML = '<p class="hint" style="margin:0 2px">Sigue escribiendo para ver las clases.</p>'; return; }
  try{
    await SB.ensureSession();
    const list = await SB.rpc('buscar_clases', { texto:txt });
    if($('#tq') && $('#tq').value !== txt) return;
    if(!list.length){ el.innerHTML = `<div class="empty-hint"><p>No encontramos esa clase</p><small>Revisa cómo escribiste tu nombre o avísale al administrador.</small></div>`; return; }
    el.innerHTML = list.map((c, i) => `<div class="person" style="cursor:default"><span class="av">${esc(initials(c.maestro))}</span><span class="pi"><b>${esc(prettyName(c.maestro))}</b><small>${esc([progLabel(c.programa), stakeShort(c.estaca), c.horario, c.curso].filter(Boolean).join(' · '))}</small></span>${
      c.tengo_acceso ? `<button class="mk done" data-open="${c.codigo}">${ICON.check} Abrir</button>`
      : c.solicitud_pendiente ? `<span class="badge b-new">Solicitud enviada</span>`
      : c.adoptada ? `<button class="mk add" data-req="${i}">${ICON.lock} Pedir acceso</button>`
      : `<button class="mk" data-adopt="${i}">Es mi clase</button>`}</div>`).join('');
    $$('[data-open]', el).forEach(b => b.onclick = () => go('#/clase/'+b.dataset.open));
    $$('[data-adopt]', el).forEach(b => b.onclick = () => adoptarClase(list[+b.dataset.adopt], txt));
    $$('[data-req]', el).forEach(b => b.onclick = () => openSolicitud(list[+b.dataset.req]));
  }catch(e){ console.error(e); el.innerHTML = `<div class="warn-box">${esc(errMsg(e))}</div>`; }
}
async function adoptarClase(c, nombre){
  if(!(await confirmBox(`<b>${esc(prettyName(c.maestro))}</b><br>${esc([stakeShort(c.estaca), c.horario, c.curso].filter(Boolean).join(' · '))}<br><br>La clase quedará guardada en tu inicio y otra persona necesitará permiso del administrador para verla.`, { title:'¿Esta es tu clase?', ok:'Sí, es mi clase' }))) return;
  try{
    setMyName(nombre);
    await SB.rpc('guardar_mi_nombre', { nombre_nuevo:nombre });
    const r = await SB.rpc('adoptar_clase', { clase:c.id });
    if(r === 'ocupada'){ toast('Otra persona acaba de tomar esta clase. Puedes pedir acceso.', 'warn'); buscarMiClase(nombre); return; }
    await abrirMiClase(c.id);
    toast('✓ Clase agregada a tu inicio', 'ok');
  }catch(e){ console.error(e); toast(errMsg(e), 'error'); }
}
/* La búsqueda no trae el código de clases ajenas: se toma de mis clases tras obtener acceso. */
async function abrirMiClase(id){
  await SB.refresh();
  const mia = (SB.mis||[]).find(x => x.id === id);
  go(mia ? '#/clase/'+mia.codigo : '#/');
}
function openSolicitud(c){
  const parts = String(myName()).trim().split(/\s+/);
  sheet(`${sheetHead('Solicitar acceso', `Clase de ${esc(prettyName(c.maestro))} · ${esc(c.horario)}`)}
    <div class="info-box">Esta clase ya fue adoptada. <b>Si eres su maestro</b> y entras desde otro celular o la PC, escribe tu nombre y apellido: si tu apellido coincide con el de la clase, entrarás al instante y la clase quedará guardada en este dispositivo. Si no, el administrador revisará tu solicitud.</div>
    <form id="sf" autocomplete="off">
      <div class="row2"><div class="field"><label>Nombres <span class="req">*</span></label><input name="nombres" value="${esc(parts[0] || '')}" autocapitalize="words"></div><div class="field"><label>Apellidos <span class="req">*</span></label><input name="apellidos" value="${esc(parts.slice(1).join(' '))}" autocapitalize="words"></div></div>
      <div class="row2"><div class="field"><label>Estaca <span class="req">*</span></label><select name="estaca"><option value="">Seleccionar…</option>${PROG_STAKES.map(s => `<option value="${esc(s)}" ${s===c.estaca?'selected':''}>${esc(stakeShort(s))}</option>`).join('')}</select></div><div class="field"><label>Barrio <span class="req">*</span></label><input name="barrio" autocapitalize="words"></div></div>
      <div class="field"><label>Programa <span class="req">*</span></label><select name="programa"><option value="S" ${c.programa==='S'?'selected':''}>Seminario</option><option value="I" ${c.programa==='I'?'selected':''}>Instituto</option></select></div>
    </form>
    <div class="sh-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Enviar solicitud</button></div>`, {
    wide:true,
    onMount(el, close){
      $('#ok', el).onclick = async () => {
        const v = {}; $$('[name]', el).forEach(i => v[i.name] = i.value.trim());
        const miss = ['nombres','apellidos','estaca','barrio'].filter(k => !v[k]);
        $$('.field', el).forEach(f => f.classList.remove('err'));
        if(miss.length){ miss.forEach(k => $(`[name=${k}]`, el).closest('.field').classList.add('err')); toast('Completa los campos obligatorios (*)', 'error'); return; }
        try{
          await SB.ensureSession();
          const r = await SB.rpc('solicitar_acceso', Object.assign({ clase:c.id }, v));
          setMyName(`${v.nombres} ${v.apellidos}`);
          await SB.rpc('guardar_mi_nombre', { nombre_nuevo:`${v.nombres} ${v.apellidos}` });
          close();
          if(r === 'acceso' || r === 'ya_tuya' || r === 'acceso_colaborador'){ guardarAcceso(c.id, v); toast(r === 'acceso_colaborador' ? '✓ El administrador ya te había dado acceso: entraste como colaborador' : '✓ Eres el maestro de esta clase: ya puedes usarla en este dispositivo', 'ok', { ms:5000 }); await abrirMiClase(c.id);
            const local = clasesLocales().find(x => x.esperando === c.id); if(local) await unirClaseLocal(local, c.id);
            return; }
          SB.solicitudes = await SB.rpc('mis_solicitudes');
          toast('✓ Solicitud enviada al administrador', 'ok');
          if($('#tq')) buscarMiClase($('#tq').value);
        }catch(e){ console.error(e); toast(errMsg(e), 'error'); }
      };
    }
  });
}

/* ---------- Importar clases desde el reporte Class Roll ---------- */
const ROLL_MES = { jan:1, ene:1, feb:2, mar:3, apr:4, abr:4, may:5, jun:6, jul:7, aug:8, ago:8, sep:9, set:9, oct:10, nov:11, dec:12, dic:12 };
function rollDate(s){ const m = String(s).trim().match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/); if(!m || !ROLL_MES[m[2].toLowerCase()]) return null; return `${m[3].length===2?'20'+m[3]:m[3]}-${pad2(ROLL_MES[m[2].toLowerCase()])}-${pad2(m[1])}`; }
const rollClean = s => String(s ?? '').replace(/\s+/g,' ').trim();
function levenshtein(a, b){ if(Math.abs(a.length-b.length) > 3) return 9; let p = Array.from({length:b.length+1}, (_, i) => i); for(let i=1;i<=a.length;i++){ const c = [i]; for(let j=1;j<=b.length;j++) c[j] = Math.min(p[j]+1, c[j-1]+1, p[j-1]+(a[i-1]===b[j-1]?0:1)); p = c; } return p[b.length]; }
/* El reporte a veces repite el apellido: "Pérez Soto, Pérez Soto, Ana" o "Pérez Soto, Ana, Pérez Soto". */
function rollName(n){
  const parts = rollClean(n).split(',').map(s => s.trim()).filter(Boolean);
  if(parts.length < 2) return parts.join('');
  const ape = parts[0];
  const rest = parts.slice(1).filter(x => levenshtein(norm(x), norm(ape)) > 2);
  let nom = rest.join(' ') || parts[parts.length-1];
  const i = norm(nom).lastIndexOf(norm(ape));
  if(i > 0 && norm(nom).endsWith(norm(ape))) nom = nom.split(/\s+/).slice(0, -ape.split(/\s+/).length).join(' ') || nom;
  return `${ape}, ${nom}`;
}
function rollStake(u){ const w = norm(u).split(' ')[0]; return ({ canete:PROG_STAKES[0], chincha:PROG_STAKES[1], ica:PROG_STAKES[2], nazca:PROG_STAKES[3], nasca:PROG_STAKES[3], pisco:PROG_STAKES[4] })[w] || ''; }
function parseRollWorkbook(wb, progDefault){
  const clases = [], avisos = [];
  wb.SheetNames.forEach(sn => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:false, defval:'' });
    const titulo = rows.slice(0,3).map(r => rollClean(r && r[0])).join(' ');
    const mT = titulo.match(/Class Roll\s*(.*?)\s*\(\d+\)/i);
    const unidad = mT ? mT[1] : titulo;
    const periodo = (rows.slice(0,5).map(r => rollClean(r && r[0])).join(' ').match(/T[ée]rmino:\s*(.*?)(?:\s*Fecha|\s*$)/i) || [])[1] || '';
    let cur = null, cols = [], enLista = false, halladas = 0;
    rows.forEach(r => {
      const head = r.map(rollClean).find(c => / - .+ - /.test(c));
      if(head){
        const p = head.split(' - ');
        const tok = p[0].trim().split(/\s+/);
        const up = norm(unidad).toUpperCase();
        const programa = /\bSEM\b/.test(up) ? 'S' : /\bINS?T?\b/.test(up) ? 'I' : progDefault;
        cur = { unidad, periodo, estaca:rollStake(unidad), programa, maestro:p.slice(1,-1).join(' - ').trim(), horario: programa === 'I' ? p[0].trim() : tok.slice(1).join(' '), curso:p[p.length-1].trim(), fechas:[], alumnos:[], total:null, desconocidas:0 };
        const tot = r.map(rollClean).find(c => /Total de alumnos/i.test(c)); if(tot) cur.total = +tot.replace(/\D/g,'');
        clases.push(cur); halladas++; cols = []; enLista = false; return;
      }
      if(!cur) return;
      if(rollClean(r[0]) === 'Nombre'){ enLista = true; cols = []; r.forEach((c, j) => { const d = rollDate(c); if(d) cols.push([j, d]); }); cur.fechas = cols.map(x => x[1]); return; }
      if(!enLista) return;
      const n = rollClean(r[0]); if(!n || !n.includes(',')) return;
      const marcas = {};
      cols.forEach(([j, d]) => { const v = rollClean(r[j]).toUpperCase(); if(!v) return; if(v === 'A') marcas[d] = 'F'; else if(ATT_TXT[v]) marcas[d] = v; else cur.desconocidas++; });
      cur.alumnos.push({ nombre:rollName(n), marcas });
    });
    if(!halladas) avisos.push(`${sn}: no se encontró una clase`);
  });
  clases.forEach(c => {
    const f = c.fechas.slice().sort();
    c.titulo = c.programa === 'I' ? c.curso : [c.curso, c.horario].filter(Boolean).join(' · ');
    c.inicio = f[0] || todayISO();
    c.dias = [...new Set(f.map(d => parseISO(d).getDay()))].filter(d => d !== 0);
    if(!c.estaca) avisos.push(`${c.maestro}: no se reconoció la estaca “${c.unidad}”`);
    if(c.total != null && c.total > c.alumnos.length) avisos.push(`${c.maestro}: el reporte dice ${c.total} alumnos y se leyeron ${c.alumnos.length}`);
    if(!f.length) avisos.push(`${c.maestro} (${c.horario}): el reporte no trae fechas; el maestro podrá agregarlas al marcar`);
    if(c.desconocidas) avisos.push(`${c.maestro}: ${c.desconocidas} marcas con letras desconocidas se omitieron`);
  });
  return { clases, avisos };
}

            <table class="mini"><thead><tr><th>Estaca</th><th class="r">Clases</th><th class="r">Alumnos</th></tr></thead><tbody>${Object.entries(porEstaca).map(([k,o]) => `<tr><td>${esc(stakeShort(k))}</td><td class="r">${o.c}</td><td class="r">${o.a}</td></tr>`).join('')}</tbody></table>
            ${parsed.avisos.length ? `<div class="warn-box" style="margin-top:10px"><b>Revisa:</b><br>${parsed.avisos.slice(0,12).map(esc).join('<br>')}</div>` : ''}`;
          goBtn.classList.toggle('hide', !parsed.clases.some(c => c.estaca));
        }catch(err){ console.error(err); prev.innerHTML = `<div class="warn-box" style="margin-top:12px">${esc(err.message || 'No se pudo leer el archivo')}</div>`; }
      };

        const res = await importRollClases(lista, (i) => { prev.innerHTML = loadingHTML(`Creando clase ${i} de ${lista.length}…`); });
        await SB.loadCounts().catch(()=>{});
        goBtn.classList.add('hide');
        prev.innerHTML = `<div class="${res.errores.length ? 'warn-box' : 'info-box'}" style="margin-top:12px"><b>Listo.</b> ${res.nuevas} clases nuevas · ${res.alumnos} alumnos · ${res.marcas.toLocaleString('es-PE')} marcas.${res.errores.length ? `<br>${res.errores.length} no se pudieron crear:<br>${res.errores.slice(0,8).map(esc).join('<br>')}` : ''}<br>Alertas de base: <b>${SB.counts.alertas || 0}</b>.</div>`;
        if(CUR.type === 'todas') route();
      };
    }
  });
}
async function parseRollFiles(files, prog){
  await loadScript(SHEETJS_URL);
  const out = { clases:[], avisos:[] };
  for(const f of files){
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array', raw:false });
    const r = parseRollWorkbook(wb, prog);
    out.clases.push(...r.clases); out.avisos.push(...r.avisos.map(a => `${f.name} · ${a}`));
  }
  return out;
}
function finDeClase(c){
  if(c.programa === 'I') return c.fechas.slice().sort().pop() || '';
  const p = currentPeriod('S');
  return p ? p.e : '';
}
async function importRollClases(lista, onStep){
  const res = { nuevas:0, alumnos:0, marcas:0, errores:[] };
  for(let i=0;i<lista.length;i++){
    onStep && onStep(i+1);
    const c = lista[i];
    try{
      const r = await SB.rpc('importar_clase', { datos:{ titulo:c.titulo, programa:c.programa, estaca:c.estaca, maestro:c.maestro, horario:c.horario, curso:c.curso, unidad:c.unidad, periodo:c.periodo, dias:c.dias, inicio:c.inicio, fin:finDeClase(c), alumnos:c.alumnos } });
      if(r.nueva) res.nuevas++;
      res.alumnos += r.alumnos; res.marcas += r.marcas;
    }catch(e){ console.error(e); res.errores.push(`${c.maestro}: ${errMsg(e)}`); }
  }
  return res;
}

// Enlace y QR de inscripción del programa, para compartir con los jóvenes.
async function paintEnlaceInscripcion(prog, nuevo){
  const box = $('#insEnlace'); if(!box) return;
  const nomProg = prog === 'S' ? 'Seminario' : 'Instituto';
  let token;
  try{
    if(nuevo) await SB.rpc('enlace_inscripcion', { prog, activo:false });
    token = await SB.rpc('enlace_inscripcion', { prog, activo:true });
  }catch(e){ console.error(e); box.innerHTML = `<div class="warn-box">${esc(errMsg(e))}</div>`; return; }
  if($('#insEnlace') !== box) return;
  const link = appLink('i', token);
  box.innerHTML = `<h2>${ICON.link} Enlace de inscripción en ${nomProg}</h2>
    <p class="hint" style="margin-top:0">Compártelo con los jóvenes: se buscan en la base (o escriben sus datos si no aparecen), completan lo que falta y aceptan el acuerdo de inscripción. Aparecen abajo para que los inscribas en Wise2.</p>
    <div class="qr-wrap"></div>
    <div class="btn-row"><button class="btn primary" id="enCp">${ICON.copy} Copiar enlace</button><button class="btn" id="enWa">${ICON.chat} WhatsApp</button><button class="btn" id="enDl">${ICON.download} Descargar QR</button><button class="btn" id="enBig">Mostrar en pantalla</button></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn danger" id="enNew">Cambiar enlace</button></div>`;
  try{ const cv = await qrCanvas(link, { size:360 }); cv.className = 'qr-img'; $('.qr-wrap', box).appendChild(cv); }catch(e){ $('.qr-wrap', box).innerHTML = ''; }
  const poster = () => qrCanvas(link, { title: 'Inscripción en ' + nomProg, sub: 'Seminarios e Institutos de Religión', size:900 });
  $('#enCp', box).onclick = () => copyText(link, 'Enlace copiado');
  $('#enWa', box).onclick = () => waOpen(`Inscríbete en *${nomProg}* aquí 👇\n${link}\nBusca tu nombre, completa tus datos y acepta el acuerdo de inscripción.`);
  $('#enDl', box).onclick = async () => { const cv = await poster(); cv.toBlob(b => downloadBlob(b, 'QR inscripcion ' + nomProg + '.png'), 'image/png'); };
  $('#enBig', box).onclick = async () => { const cv = await poster(); sheet(`${sheetHead('Inscripción en ' + nomProg)}<div class="qr-full" id="qrFull"></div><div class="sh-foot"><button class="btn primary" data-close>Cerrar</button></div>`, { wide:true, onMount(el){ $('#qrFull', el).appendChild(cv); } }); };
  $('#enNew', box).onclick = async () => {
    if(!(await confirmBox('El enlace y el QR actuales dejarán de funcionar y se creará uno nuevo. Úsalo si el enlace llegó a quien no debía.', { title:'Cambiar enlace', ok:'Cambiar', danger:true }))) return;
    paintEnlaceInscripcion(prog, true);
  };
}
async function renderAlertas(tab='pendiente'){
  CUR = { type:'alertas', code:null };
  app.innerHTML = topbar({ back:'#/', title:'Alertas de base', sub:'Administración' }) + `<main class="wrap"><div id="alBody">${loadingHTML()}</div></main>`;
  bindTop();
  const body = $('#alBody');
  try{
    const [lista, cargas] = await Promise.all([SB.rpc('alertas_base'), SB.fetchAll('cargas_base', '*')]);
    PERSONAS_CACHE = await SB.fetchAll('personas', 'id,nombre,clave,estaca,barrio');
    const ult = cargas.sort((a,b) => String(b.cargado_en).localeCompare(String(a.cargado_en)))[0];
    const pend = lista.filter(a => a.vinculo === 'pendiente'), nom = lista.filter(a => a.vinculo === 'no_miembro');
    const cur = tab === 'pendiente' ? pend : nom;
    body.innerHTML = `<section class="card"><p class="hint" style="margin-top:0">Un alumno sin coincidencia <b>no significa que no sea miembro</b>: puede que la base esté desactualizada. Sube la base reciente; quienes coincidan salen solos de la alerta. Si alguien sigue aquí después de eso, etiquétalo como no miembro.</p>
        <p class="meta" style="margin-bottom:12px">${ult ? `Última base subida: <b>${esc(new Date(ult.cargado_en).toLocaleString('es-PE'))}</b> · ${esc(ult.archivo)} · ${ult.resueltas} alertas resueltas` : 'Todavía no se ha subido una base desde esta pantalla.'}</p>
        <div class="btn-row"><button class="btn primary" data-go="#/admin">${ICON.upload} Subir base actualizada</button></div></section>
      <div class="seg" style="margin:14px 0" id="alTabs"><button data-t="pendiente" class="${tab==='pendiente'?'on':''}">Con alerta (${pend.length})</button><button data-t="no_miembro" class="${tab==='no_miembro'?'on':''}">No miembros (${nom.length})</button></div>
      ${cur.map((a, i) => alertaHTML(a, i, ult)).join('') || `<div class="empty">${tab==='pendiente' ? 'No hay alertas. ¡Todos los alumnos coinciden con la base!' : 'Nadie etiquetado como no miembro.'}</div>`}`;
    $$('[data-go]', body).forEach(b => b.onclick = () => go(b.dataset.go));
    $$('#alTabs button', body).forEach(b => b.onclick = () => renderAlertas(b.dataset.t));
    const etiquetar = async (al, vinculo, persona) => {
      try{ await SB.rpc('etiquetar_alumno', Object.assign({ alumno:al.id, vinculo_nuevo:vinculo }, persona ? { persona } : {})); await SB.loadCounts(); renderAlertas(tab); }
      catch(e){ console.error(e); toast(errMsg(e), 'error'); }
    };
    $$('[data-nm]', body).forEach(b => b.onclick = () => etiquetar(cur[+b.dataset.nm], 'no_miembro'));
    $$('[data-back]', body).forEach(b => b.onclick = () => etiquetar(cur[+b.dataset.back], 'pendiente'));
    $$('[data-link]', body).forEach(b => b.onclick = () => { const [i, pid] = b.dataset.link.split('|'); etiquetar(cur[+i], 'vinculado', pid); });
  }catch(e){ console.error(e); body.innerHTML = `<div class="warn-box">${esc(errMsg(e))}</div>`; }
}
function sugerenciasDe(a){
  const k = norm(a.nombre);
  return (PERSONAS_CACHE||[]).map(p => [levenshtein(k, norm(p.nombre)), p]).filter(x => x[0] <= 3).sort((x, y) => x[0]-y[0]).slice(0,3).map(x => x[1]);
}
function alertaHTML(a, i, ult){
  const sigue = ult && a.ultimo_intento && a.ultimo_intento >= ult.cargado_en;
  const sug = a.vinculo === 'pendiente' ? sugerenciasDe(a) : [];
  return `<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><b>${esc(prettyName(a.nombre))}</b>
      <p class="meta">${progLabel(a.programa)} · ${esc(stakeShort(a.estaca))} · ${esc(prettyName(a.maestro))} · ${esc(a.horario)}${a.origen === 'maestro' ? ' · Agregado por el maestro' : ''}</p>
      ${a.vinculo === 'pendiente' ? `<p class="meta">${sigue ? '<b style="color:var(--amber)">Sigue sin coincidencia tras la última base subida</b>' : 'Falta comprobar con una base más reciente'}</p>` : ''}</div>
      <button class="btn sm ghost" data-go="#/clase/${a.codigo}">Ver clase</button></div>
    ${sug.length ? `<div style="margin-top:10px"><small class="hint">¿Es alguna de estas personas?</small>${sug.map(p => `<div class="item" style="margin:6px 0 0"><span class="ii"><b>${esc(prettyName(p.nombre))}</b><small>${esc([p.barrio, stakeShort(p.estaca)].filter(Boolean).join(' · '))}</small></span><button class="btn sm" data-link="${i}|${p.id}">Es esta persona</button></div>`).join('')}</div>` : ''}
    <div class="btn-row" style="margin-top:10px">${a.vinculo === 'pendiente' ? `<button class="btn sm danger" data-nm="${i}">Etiquetar como no miembro</button>` : `<button class="btn sm" data-back="${i}">Volver a alerta</button>`}</div></section>`;
}
async function subirBaseEnLinea(rows, archivo){
  if(!SB.on() || !SB.admin) return;
  try{
    toast('Subiendo la base y revisando alertas…');
    const r = await SB.rpc('cargar_personas', { filas:rows.filter(x => x.n).map(x => ({ nombre:x.n, estaca:x.k || '', barrio:x.w || '', programa:x.g || '' })), archivo });
    await SB.loadCounts();
    sheet(`${sheetHead('Base actualizada')}<dl class="kv"><dt>Personas en el archivo</dt><dd>${r.total}</dd><dt>Personas nuevas</dt><dd>${r.nuevas}</dd><dt>Alertas resueltas</dt><dd>${r.resueltas}</dd><dt>Siguen con alerta</dt><dd>${r.siguen}</dd></dl>
      <div class="sh-foot"><button class="btn" data-close>Cerrar</button><button class="btn primary" id="toAl">Ver alertas</button></div>`, { onMount(el, close){ $('#toAl', el).onclick = () => { close(); go('#/alertas'); }; } });
  }catch(e){ console.error(e); toast('La base se guardó en este dispositivo, pero no se pudo subir: '+errMsg(e), 'error'); }
}

/* ---------- Búsqueda de alumnos y compartir en clases en línea ---------- */
const runRemoteSearch = debounce(async (cls, q) => {
  const el = $('#cres'); if(!el || ST.cq.trim() !== q) return;
  try{
    const f = filtroAlumnos(cls);
    const list = await SB.rpc('buscar_personas', { texto:q, f_programa:f.p, f_estaca:f.k, f_barrio:f.w });
    if(ST.cq.trim() !== q) return;
    const inClass = new Set(classStudents(cls).map(s => s.pid).filter(Boolean));
    const dentro = list.filter(p => p.en_filtro), fuera = list.filter(p => !p.en_filtro);
    const fila = p => `<button class="person ${inClass.has(p.id)?'is-marked':''}" data-pid="${p.id}"><span class="av">${esc(initials(p.nombre))}</span><span class="pi"><b>${highlight(p.nombre, q)}</b><small>${esc([p.barrio, stakeShort(p.estaca), progLabel(p.programa), p.aproximado ? 'nombre parecido' : ''].filter(Boolean).join(' · '))}</small></span>${inClass.has(p.id) ? `<span class="mk done">${ICON.check} En la clase</span>` : `<span class="mk add">${ICON.plus} Agregar</span>`}</button>`;
    const filtrado = !!(f.p || f.k || f.w);
    el.innerHTML = (dentro.map(fila).join('') || `<div class="empty-hint"><p>Sin coincidencias${filtrado ? ' con este filtro' : ''}</p><small>${fuera.length ? 'Revisa las personas fuera del filtro o agrégalo' : 'Puedes agregarlo'} como alumno nuevo.</small></div>`)
      + (fuera.length ? (ST.cfMore || !dentro.length ? `<p class="hint" style="margin:10px 2px 4px">Fuera del filtro (${fuera.length}${fuera.length >= 40 ? '+' : ''})</p>${fuera.map(fila).join('')}` : `<button class="btn sm ghost more-btn" id="cmore">Ver ${fuera.length}${fuera.length >= 40 ? '+' : ''} fuera del filtro</button>`) : '');
    const more = $('#cmore', el); if(more) more.onclick = () => { ST.cfMore = true; runRemoteSearch(cls, q); };
    $$('.person[data-pid]', el).forEach(b => b.onclick = () => {
      const p = list.find(x => x.id === b.dataset.pid); if(!p) return;
      if(inClass.has(p.id)){ toast('Ya está en la clase'); return; }
      const s = { id:crypto.randomUUID(), pid:p.id, n:p.nombre, src:'base', vinculo:'vinculado', data:{ k:p.estaca, w:p.barrio }, addedAt:Date.now() };
      cls.students[s.id] = s; markDirty(cls, 'students/'+s.id); saveClasses(); queueSync();
      toast(`✓ ${prettyName(p.nombre)} agregado`, 'ok');
      ST.cq = ''; const q2 = $('#cq'); if(q2){ q2.value = ''; q2.focus(); }
      renderClassSearch(cls); renderStuList(); liveClass(true);
    });
  }catch(e){ console.error(e); el.innerHTML = `<div class="warn-box">${esc(errMsg(e))}</div>`; }
}, 300);
function renderRemoteClassSearch(cls){
  const el = $('#cres'); if(!el) return;
  const q = ST.cq.trim();
  ST.cfMore = false;
  if(norm(q).length < 3){ el.innerHTML = '<p class="hint" style="margin:0 2px">Escribe un nombre y un apellido (no hace falta completo) para buscar en la base de personas.</p>'; return; }
  runRemoteSearch(cls, q);
}
/* Filtro al agregar alumnos: por defecto el programa y la estaca de la clase. */
function filtroAlumnos(cls){
  if(!ST.cf) ST.cf = { p:cls.meta.program || '', k:PROG_STAKES.includes(cls.meta.stake) ? cls.meta.stake : '', w:'' };
  return ST.cf;
}
async function renderRemoteFilters(cls){
  const box = $('#cfilt'); if(!box) return;
  const f = filtroAlumnos(cls);
  const paint = () => {
    const barrios = (SB.barrios || []).filter(b => b.estaca === f.k).map(b => b.barrio);

      <select class="inp" id="fK" aria-label="Estaca"><option value="">Todas las estacas</option>${PROG_STAKES.map(s => `<option value="${esc(s)}" ${s===f.k?'selected':''}>${esc(stakeShort(s))}</option>`).join('')}</select>
      <select class="inp" id="fW" aria-label="Barrio" ${f.k ? '' : 'disabled'}><option value="">${f.k ? 'Todos los barrios' : 'Elige una estaca'}</option>${barrios.map(b => `<option value="${esc(b)}" ${b===f.w?'selected':''}>${esc(b)}</option>`).join('')}</select>`;

/* Invitación de un solo uso: el maestro elige cuánto dura el acceso; al usarse se crea otra. */
async function paintInvitacion(cls, duracion){
  const box = $('#invCard'); if(!box || !cls.dbId) return;
  const mia = (SB.mis||[]).find(x => x.codigo === cls.code);
  if(!SB.admin && !(mia && (mia.tipo === 'titular' || mia.tipo === 'dispositivo'))) return;
  try{
    const [inv] = await SB.rpc('invitacion_de_clase', Object.assign({ clase:cls.dbId }, duracion ? { duracion_nueva:duracion } : {}));
    if(!inv || $('#invCard') !== box) return;
    const DUR = { semana:'1 semana', mes:'1 mes', periodo:'Todo el periodo' };
    const hasta = inv.vence_en ? 'hasta el '+fmtDate(fechaLocal(inv.vence_en)) : 'hasta el fin de la clase';
    box.classList.remove('hide');
    box.innerHTML = `<h2>${ICON.users} Invitar a un colaborador</h2>
      <p class="hint" style="margin-top:0">¿Por cuánto tiempo tendrá acceso?</p>
      <div class="seg" id="invDur" style="margin-bottom:12px">${Object.keys(DUR).map(k => `<button data-d="${k}" class="${k===inv.duracion?'on':''}">${DUR[k]}</button>`).join('')}</div>
      <div class="code-big">${esc(inv.codigo)}</div>
      <p class="hint" style="margin-top:0">Este código sirve para <b>una sola persona</b>: podrá ver y marcar la asistencia ${esc(hasta)} si lo usa hoy. Cuando lo use, aquí aparecerá un código nuevo para invitar a otra persona.</p>
      <div class="btn-row"><button class="btn" id="cpCode">${ICON.copy} Copiar código</button><button class="btn" id="waInv">${ICON.chat} Enviar invitación</button></div>`;
    $$('#invDur button', box).forEach(b => b.onclick = () => paintInvitacion(cls, b.dataset.d));
    $('#cpCode', box).onclick = () => copyText(inv.codigo);
    $('#waInv', box).onclick = () => waOpen(`Hola 👋 Te invito a colaborar en la asistencia de la clase de *${prettyName(cls.meta.teacher)}* (${progLabel(cls.meta.program)}${cls.meta.horario ? ' · '+cls.meta.horario : ''}) por ${DUR[inv.duracion].toLowerCase()}.\nAbre este enlace: ${appLink('c', inv.codigo)}\n(o ingresa el código *${inv.codigo}*)`);
  }catch(e){ console.error(e); }
}

/* ============================================================
   ESTADO DE VISTA Y RUTAS
   ============================================================ */
let CUR = { type:'home', code:null };
const ST = { tab:'marcar', ctab:'hoy', q:'', scope:null, lq:'', classDate:null, planMonth:null, cq:'', cscope:null };

function go(h){ if(location.hash === h) route(); else location.hash = h; }
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const parts = h.split('/').filter(Boolean);
  window.scrollTo(0,0);
  layer.innerHTML = '';
  SB.stopWatch();
  if(SB.on() && !SB.ready){ app.innerHTML = topbar() + `<main class="wrap">${loadingHTML()}</main>`; return; }
  if(parts[0] === 'qr' && parts[1]) return renderQr(parts[1]);
  if(parts[0] === 'qrc' && parts[1]) return renderQrClase(parts[1]);
  if(parts[0] === 'insc' && parts[1]) return renderInscripcionPublica(parts[1]);
  if(parts[0] === 'entrar') return renderEntrar();
  if(['todas','solicitudes','alertas','seguimiento','inscripciones'].includes(parts[0])){
    if(!SB.admin){ go('#/'); return; }
    if(parts[0] === 'inscripciones') return renderInscripciones();
    if(parts[0] === 'solicitudes') return renderSolicitudes();
    if(parts[0] === 'alertas') return renderAlertas();
    if(parts[0] === 'seguimiento') return renderSeguimiento();
    return renderTodas(parts[1], parts[2]);
  }
  if(parts[0] === 'evento' && parts[1] === 'nuevo') return renderEventForm(null);
  if(parts[0] === 'evento' && parts[1] && parts[2] === 'editar') return renderEventForm(parts[1]);
  if(parts[0] === 'evento' && parts[1]) return renderEvent(parts[1]);
  if(parts[0] === 'clases') return SB.on() ? go('#/') : renderClasses();
  if(parts[0] === 'clase' && parts[1] === 'nueva') return SB.on() ? go('#/') : renderClassForm(null);
  if(parts[0] === 'clase' && parts[1] && parts[2] === 'editar') return renderClassForm(parts[1]);
  if(parts[0] === 'clase' && parts[1]) return renderClass(parts[1]);
  if(parts[0] === 'admin') return isAdmin() ? renderAdmin() : (go('#/'), askAdmin());
  renderHome();
}

function topbar({back, title, sub}={}){
  return `<header class="top"><div class="top-in">
    ${back ? `<button class="icon-btn" data-go="${back}" aria-label="Volver">${ICON.back}</button><div class="top-title"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`
           : `<div class="brand" id="brand"><span class="mark">S&amp;I</span><span class="bt"><b>Check-in Asistencia</b><small>Seminarios e Institutos</small></span></div><span class="spacer"></span>`}
    <button class="sync-pill" id="syncPill" title="Estado de sincronización"><span class="dot"></span><span class="lbl"></span></button>
  </div></header>`;
}
function bindTop(){
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  const pill = $('#syncPill');
  if(pill) pill.onclick = () => {
    if(CUR.type === 'event') syncEvent(CUR.code);
    else if(CUR.type === 'class') syncClass(CUR.code);
    else if(!Sync.on() && !SB.on()) toast('Todo se guarda en este celular. Para juntar la asistencia, envía el Excel y se importa en otro dispositivo.', '', {ms:4200});
    else { syncAllPending().then(()=>toast('Todo sincronizado','ok')); }
  };
  paintSync();
}
function paintSync(){
  const pill = $('#syncPill'); if(!pill) return;
  let cls = 'local', lbl = 'Guardado en el celular';
  let pending = 0;
  if(CUR.type === 'event' && EVENTS[CUR.code]) pending = eventPendingCount(EVENTS[CUR.code]);
  else if(CUR.type === 'class' && CLASSES[CUR.code]) pending = CLASSES[CUR.code].canEdit ? classPendingCount(CLASSES[CUR.code]) : 0;
  const online = Sync.on() || (CUR.type === 'class' && classOnline(CLASSES[CUR.code])) || (SB.on() && CUR.type !== 'event') || (CUR.type === 'event' && eventoEnNube(EVENTS[CUR.code]));
  if(online){
    if(SYNC_STATE.s === 'syncing'){ cls = 'syncing'; lbl = 'Sincronizando…'; }
    else if(SYNC_STATE.s === 'error'){ cls = 'error'; lbl = pending ? `Sin conexión · ${pending} sin enviar` : 'Sin conexión'; }
    else if(pending){ cls = 'pending'; lbl = `${pending} sin enviar`; }
    else if(SYNC_STATE.at){ cls = 'ok'; lbl = 'Sincronizado '+fmtTime(SYNC_STATE.at); }
    else { cls = 'ok'; lbl = 'En línea'; }
  }
  pill.className = 'sync-pill '+cls;
  $('.lbl', pill).textContent = lbl;
  const sb = $('#sbStatus'), btn = $('#saveBtn');
  if(sb){
    if(!online) sb.innerHTML = `<b>Guardado en este celular</b><small>Al terminar, envía la asistencia</small>`;
    else if(pending) sb.innerHTML = `<b>${pending} cambio${pending>1?'s':''} sin enviar</b><small>Toca “Guardar asistencia”</small>`;
    else if(SYNC_STATE.s === 'syncing') sb.innerHTML = `<b>Sincronizando…</b>`;
    else sb.innerHTML = `<b>Todo sincronizado</b>${SYNC_STATE.at ? '<small>Última vez '+fmtTime(SYNC_STATE.at)+'</small>' : ''}`;
  }
  if(btn) btn.classList.toggle('has-pending', pending > 0);
}

/* El enlace de invitación lleva los datos del evento (título, estaca, barrio, fecha, preguntas)
   para que el colaborador los tenga aunque no exista una base de datos en línea. */
function packMeta(m){
  const o = { t:m.title, k:m.stake, w:m.ward, d:m.date, f:m.fields, c:m.custom, p:m.wa || '' };
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unpackMeta(s){
  try{
    s = String(s).replace(/-/g,'+').replace(/_/g,'/');
    const o = JSON.parse(decodeURIComponent(escape(atob(s))));
    return { title:o.t || '', stake:o.k || '', ward:o.w || '', date:o.d || todayISO(), fields:Array.isArray(o.f) ? o.f : ['k','w'], custom:Array.isArray(o.c) ? o.c : [], wa:o.p || '' };
  }catch(e){ return null; }
}
function eventLink(ev){ return appLink('e', ev.code) + (ev.meta.placeholder ? '' : '&m=' + packMeta(ev.meta)); }
function inviteText(ev){ return `Hola 👋 Ayúdame a registrar la asistencia de *${ev.meta.title}*.\nAbre este enlace: ${eventLink(ev)}\n(o ingresa el código *${ev.code}*)`; }
async function openEvent(code, linkMeta){
  const ex = EVENTS[code];
  if(ex){
    if(linkMeta && ex.meta.placeholder){ ex.meta = Object.assign({}, linkMeta, { joinedAt: ex.meta.joinedAt }); saveEvents(); }
    go('#/evento/'+code); return;
  }
  if(SB.on()){
    toast('Buscando evento…');
    try{
      await SB.init();   // con el enlace de invitación, la conexión todavía se está abriendo
      await SB.ensureSession();
      const r = await SB.rpc('unirme_evento', { codigo_evento: code });
      if(r && r.estado === 'ok'){
        const meta = Object.assign({ title:'Evento '+code, stake:'', ward:'', date:todayISO(), fields:['k','w'], custom:[] }, r.meta || {}, { joinedAt: Date.now() });
        const ev = newEventObj(r.codigo, meta); ev.metaPending = false; ev.remote = r.id; ev.contrib = !r.organizador;
        EVENTS[r.codigo] = ev; saveEvents();
        ST.tab = 'marcar';
        go('#/evento/'+r.codigo);
        if(!myName()) setTimeout(askName, 400);
        return;
      }
    }catch(e){ console.error(e); }
  }
  if(Sync.on()){
    toast('Buscando evento…');
    try{
      const r = await Sync.req(`events/${code}`);
      if(r && r.meta){
        const ev = newEventObj(code, r.meta); ev.metaPending = false; ev.rows = r.rows || {}; ev.lastSync = Date.now(); ev.contrib = true;
        EVENTS[code] = ev; saveEvents();
        go('#/evento/'+code);
        if(!myName()) setTimeout(askName, 400);
        return;
      }
    }catch(e){}
  }
  if(!linkMeta && !(await confirmBox(`No hay datos del evento <b>${code}</b> en este celular. Puedes unirte igual: marca a los asistentes y al final envía tu Excel al organizador, que lo unirá con los demás por el código.<br><br>Revisa que el código esté bien escrito.`, { title:'Unirme como colaborador', ok:'Unirme' }))) return;
  const meta = linkMeta ? Object.assign({}, linkMeta) : { title:'Evento '+code, stake:'', ward:'', date:todayISO(), fields:['k','w'], custom:[], placeholder:true };
  meta.joinedAt = Date.now();
  const ev = newEventObj(code, meta); ev.metaPending = false; ev.contrib = true;
  EVENTS[code] = ev; saveEvents();
  ST.tab = 'marcar';
  go('#/evento/'+code);
  if(!myName()) setTimeout(askName, 400);
}
async function openClass(code){

function bindSW(root, px, ward){
  const ss = $('#'+px+'Stake',root), so = $('#'+px+'StakeO',root), ws = $('#'+px+'Ward',root), wo = $('#'+px+'WardO',root);
  const fill = sel => {
    const st = ss.value === '__o' ? '' : ss.value;
    const list = st ? wardsOf(st) : [];
    const isO = !!sel && !list.includes(sel);
    ws.innerHTML = `<option value="">${esc(ws.dataset.all)}</option>` + list.map(w=>`<option ${w===sel?'selected':''}>${esc(w)}</option>`).join('') + `<option value="__o" ${isO?'selected':''}>Otro…</option>`;
    wo.classList.toggle('hide', !isO); wo.value = isO ? sel : '';
  };
  ss.onchange = () => { so.classList.toggle('hide', ss.value !== '__o'); if(ss.value === '__o') so.focus(); fill(''); };
  ws.onchange = () => { wo.classList.toggle('hide', ws.value !== '__o'); if(ws.value === '__o') wo.focus(); };
  fill(ward || '');
}
function readSW(root, px){
  const ss = $('#'+px+'Stake',root).value, ws = $('#'+px+'Ward',root).value;
  return { stake: ss === '__o' ? $('#'+px+'StakeO',root).value.trim() : ss, ward: ws === '__o' ? $('#'+px+'WardO',root).value.trim() : ws };
}

function renderResultsOnline(el, ev, q, marked, hint){
  const m = ev.meta;

  const key = [ev.remote, norm(q), fk, fw].join('|');
  const paint = () => {
    const dentro = EVQ.list.filter(p => p.en_filtro), fuera = EVQ.list.filter(p => !p.en_filtro);
    const show = ST.evMore ? EVQ.list : dentro;

      const r = marked.get(p.id);
      const mk = !r ? `<span class="mk">Marcar</span>` : r.estado === 'por_aprobar' ? `<span class="mk wait">Por aprobar</span>` : `<span class="mk done">${ICON.check} ${fmtTime(r.t)}</span>`;

    }).join('');
    if(!show.length) html = `<div class="empty-hint">${ICON.search}<p>No se encontró “${esc(q)}”${fk ? ' en ' + (fw ? 'el barrio' : 'la estaca') : ''}</p><small>Revisa la ortografía o regístralo manualmente abajo.</small></div>`;
    if(!ST.evMore && fuera.length) html += `<button class="btn sm ghost more-btn" id="moreScope">Ver ${fuera.length} coincidencia${fuera.length > 1 ? 's' : ''} fuera de ${fw ? 'este barrio' : 'esta estaca'}</button>`;
    el.innerHTML = html;

    try{
      const list = await SB.rpc('buscar_personas_evento', { evento: ev.remote, texto: q, f_estaca: fk || null, f_barrio: fw || null });
      if(norm(ST.q.trim()) !== norm(q) || !$('#results')) return;

      paint();
    }catch(e){ console.error(e); el.innerHTML = `<div class="empty-hint">${ICON.search}<p>No se pudo buscar en la base</p><small>${esc(errMsg(e))}</small></div>`; }
  }, 250);
}

/* ============================================================
   QR DE ASISTENCIA (organizador)
   ============================================================ */
const QR_JS_URL = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const qrLink = token => appLink('q', token);
// Dibuja el QR en un canvas, con el título del evento arriba y un texto abajo si se piden.
async function qrCanvas(text, { title='', sub='', size=720 }={}){
  if(!window.qrcode) await loadScript(QR_JS_URL);
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), pad = 4, cell = Math.max(2, Math.floor(size / (n + pad * 2)));
  const qs = cell * (n + pad * 2);
  const head = title ? Math.round(qs * 0.26) : 0, foot = sub ? Math.round(qs * 0.1) : 0;
  const c = document.createElement('canvas'); c.width = qs; c.height = qs + head + foot;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.textAlign = 'center';
  if(title){
    let fs = Math.round(qs * 0.07);
    g.font = `800 ${fs}px Manrope, system-ui, sans-serif`;
    while(fs > 14 && g.measureText(title).width > qs * 0.92){ fs -= 2; g.font = `800 ${fs}px Manrope, system-ui, sans-serif`; }
    g.fillStyle = '#132C3E'; g.fillText(title, qs / 2, head * 0.45);
    g.font = `600 ${Math.round(qs * 0.042)}px system-ui, sans-serif`; g.fillStyle = '#1F7A83';
    g.fillText('Escanea para registrar tu asistencia', qs / 2, head * 0.85);
  }
  g.fillStyle = '#000';
  for(let r = 0; r < n; r++) for(let k = 0; k < n; k++) if(q.isDark(r, k)) g.fillRect((k + pad) * cell, head + (r + pad) * cell, cell, cell);
  if(sub){ g.font = `500 ${Math.round(qs * 0.036)}px system-ui, sans-serif`; g.fillStyle = '#5C7080'; g.fillText(sub, qs / 2, head + qs + foot * 0.45); }
  return c;
}

    <p class="hint" style="margin-top:0">Proyéctalo o imprímelo. Los acompañantes que anote un asistente te aparecen arriba para aprobar.</p>
    <div class="btn-row"><button class="btn primary" id="qrBig">Mostrar en pantalla</button><button class="btn" id="qrDl">${ICON.download} Descargar</button><button class="btn" id="qrCp">${ICON.link} Copiar enlace</button><button class="btn" id="qrWa">${ICON.chat} WhatsApp</button></div>
    <div class="btn-row" style="margin-top:10px"><button class="btn danger" id="qrOff">Apagar QR</button></div>`;
  try{ const cv = await qrCanvas(link, { size:420 }); cv.className = 'qr-img'; $('.qr-wrap', box).appendChild(cv); }
  catch(e){ $('.qr-wrap', box).innerHTML = `<p class="hint">No se pudo dibujar el QR (revisa tu internet). El enlace sí funciona.</p>`; }
  const poster = () => qrCanvas(link, { title: ev.meta.title, sub: [fmtDate(ev.meta.date), ev.meta.ward || ev.meta.stake].filter(Boolean).join(' · '), size:900 });
  $('#qrBig', box).onclick = async () => {

    sheet(`${sheetHead('QR de asistencia', esc(ev.meta.title))}<div class="qr-full" id="qrFull"></div><div class="sh-foot"><button class="btn primary" data-close>Cerrar</button></div>`, { wide:true, onMount(el){ $('#qrFull', el).appendChild(cv); } });

  $('#qrCp', box).onclick = () => copyText(link, 'Enlace copiado');
  $('#qrWa', box).onclick = () => waOpen(`Registra tu asistencia a *${ev.meta.title}* aquí 👇\n${link}`);
  $('#qrOff', box).onclick = async () => {
    if(!(await confirmBox('Nadie podrá registrarse con este QR. Si lo vuelves a crear, saldrá un QR distinto.', { title:'Apagar QR', ok:'Apagar', danger:true }))) return;
    try{ await SB.rpc('qr_evento', { evento: ev.remote, activo: false }); ev.qr = null; saveEvents(); paintQrCard(ev); }

/* ============================================================
   GRUPOS O COMPAÑÍAS (con la lista del evento)
   ============================================================ */
function rndInt(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function barajar(a){ for(let i = a.length - 1; i > 0; i--){ const j = rndInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const barrioDe = r => (r.data && (r.data.w || r.data.k)) || '';
// Reparte al azar en grupos del mismo tamaño (±1). Con "mezclar", cada barrio se reparte entre todos los grupos.
function formarGrupos(rows, nGrupos, nLideres, mezclar, nombre){
  let orden;
  if(mezclar){
    const porB = {}; rows.forEach(r => { (porB[barrioDe(r)] = porB[barrioDe(r)] || []).push(r); });
    orden = barajar(Object.values(porB)).map(barajar).sort((a, b) => b.length - a.length).flat();
  } else orden = barajar(rows.slice());
  const lista = Array.from({ length:nGrupos }, (_, i) => ({ n: `${nombre} ${i + 1}`, lideres:[], miembros:[] }));
  const off = rndInt(nGrupos);
  orden.forEach((r, i) => lista[(i + off) % nGrupos].miembros.push(r.id));
  lista.forEach(g => { g.lideres = barajar(g.miembros.slice()).slice(0, nLideres); });
  return { nombre, lideres:nLideres, mezclar, creados: Date.now(), por: myName(), lista };
}
function guardarGrupos(ev, g){
  if(g) ev.meta.grupos = g; else delete ev.meta.grupos;
  ev.metaPending = true; saveEvents(); queueSync(); renderGrupos();
}

function qrBuscador(box, { onPick, quien='tu' }){

    </form>`;
  const q = $('#qbq', box), res = $('#qbRes', box);
  let n = 0, ultimo = null;
  const buscar = debounce(async () => {
    const t = q.value.trim();
    if(t === ultimo) return; ultimo = t;
    const id = ++n;
    if(!norm(t).split(' ').some(w => w.length >= 3)){ res.innerHTML = `<div class="empty-hint"><small>Escribe tu nombre o apellido (al menos 3 letras).</small></div>`; return; }

      res.innerHTML = list.length ? list.map((p, i) => `<button class="person" data-i="${i}"><span class="av">${esc(initials(p.nombre))}</span><span class="pi"><b>${highlight(p.nombre, t)}</b><small>${esc([p.barrio, stakeShort(p.estaca)].filter(Boolean).join(' · '))}${p.registrado ? ' · ya registrado' : ''}</small></span><span class="mk">${quien === 'tu' ? 'Soy yo' : 'Elegir'}</span></button>`).join('')
        : `<div class="empty-hint"><p>No encontramos “${esc(t)}”</p><small>Revisa cómo lo escribiste o usa “No aparece en la lista”.</small></div>`;
      $$('[data-i]', res).forEach(b => b.onclick = () => { const p = list[+b.dataset.i]; onPick({ persona_id:p.id, nombre:p.nombre, barrio:p.barrio, estaca:p.estaca }); });
    }catch(e){ console.error(e); ultimo = null; if(id === n) res.innerHTML = `<div class="info-box">No se pudo buscar: ${esc(errMsg(e))}. Revisa tu internet e inténtalo otra vez.</div>`; }
  }, 350);
  // Algunos teclados de celular no avisan cada letra: también se busca al soltar la tecla o al tocar "buscar".
  q.addEventListener('input', buscar); q.addEventListener('keyup', buscar); q.addEventListener('change', buscar); q.addEventListener('search', buscar);
  $('#qbMan', box).onclick = () => { $('#qbForm', box).classList.remove('hide'); $('#qbMan', box).classList.add('hide'); const t = q.value.trim().split(/\s+/); if(t[0]) $('[name=nombres]', box).value = titleCase(t[0]); if(t.length > 1) $('[name=apellidos]', box).value = titleCase(t.slice(1).join(' ')); $('[name=nombres]', box).focus(); };
  $('#qbForm', box).onsubmit = e => {
    e.preventDefault();
    const v = {}; $$('[name]', box).forEach(i => v[i.name] = i.value.trim());
    v.nombres = titleCase(v.nombres); v.apellidos = titleCase(v.apellidos);
    $$('.field', box).forEach(f => f.classList.remove('err'));
    const miss = ['nombres', 'apellidos'].filter(k => !v[k]);
    if(miss.length){ miss.forEach(k => $(`[name=${k}]`, box).closest('.field').classList.add('err')); toast('Escribe nombres y apellidos', 'error'); return; }
    onPick({ nombres:v.nombres, apellidos:v.apellidos, estaca:v.estaca, barrio:v.barrio, nombre:`${v.apellidos}, ${v.nombres}` });
  };
  setTimeout(() => q.focus(), 200);
}

async function qrEnviar(){
  const btn = $('#qrOk'); if(btn) btn.disabled = true;

    const r = await SB.rpc('registrar_por_qr', { token: QRS.token, yo: quienPara(QRS.yo), acompanantes: elegidos.map(quienPara), dispositivo: DEV });
    const yo = Object.assign({}, QRS.yo, { nombre: r.nombre }); if(r.persona_id) yo.persona_id = r.persona_id;
    guardarYo(yo);
    const vistos = new Set([claveP(yo)]);
    LS.set('ca_acomp', [...elegidos, ...misAcomp()].filter(a => { const k = claveP(a); if(vistos.has(k)) return false; vistos.add(k); return true; }).slice(0, 30));
    const hechos = LS.get('ca_qr_hechos', {}); hechos[QRS.token] = r;
    LS.set('ca_qr_hechos', Object.fromEntries(Object.entries(hechos).slice(-20)));
    if(navigator.vibrate) navigator.vibrate(40);

    ${S ? `<h3 style="margin-top:14px">Datos de tu padre o madre</h3>

        <div class="field"><label>Correo del padre o madre <span class="opt">(opcional)</span></label><input name="tutor_correo" type="email" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(prev.tutor_correo || '')}"></div></div>

    <label class="check-row" id="qdAcepto" style="margin-top:12px"><input type="checkbox" id="qdAcuerdo"><span>${S ? 'Mi padre, madre o tutor y yo hemos leído y aceptamos' : 'He leído y acepto'} el <b>acuerdo de inscripción en ${S ? 'Seminario' : 'Instituto'}</b>.</span></label></div>`;

// Un solo formulario: nombres (si no está en la base), estaca, barrio, si es miembro (y entonces
// cédula y usuario de la Iglesia), fecha de nacimiento y celular.
// d: { persona, nombre, estaca, barrio } si se eligió de la base; { manual:true, nombres, apellidos } si no.
// ctx: programa, encabezado, texto de introducción, botón y qué hacer al enviar (QR de clase por defecto).
function qrcDatos(d, ctx){
  ctx = Object.assign({ prog: QRC.c && QRC.c.programa, head: QRC.head, intro: 'no estás en la lista de esta clase. Tu maestro confirmará tu asistencia y con estos datos te inscribiremos. Solo el administrador los verá.', boton: 'Enviar mi asistencia', enviar: x => qrcMarcar(x), volver: () => qrcBuscar() }, ctx);
  const prev = LS.get('ca_yo_datos', {});
  const base = !!d.persona;
  const campo = (name, lab, req, attrs = '', val = prev[name] || '') => `<div class="field"><label>${lab} ${req ? '<span class="req">*</span>' : '<span class="opt">(opcional)</span>'}</label><input name="${name}" value="${esc(val)}" ${attrs}></div>`;
  $('#qrMain').innerHTML = ctx.head + `<section class="card"><h2>Tus datos para inscribirte</h2>
    <p class="hint" style="margin-top:0">${base ? `<b>${esc(prettyName(d.nombre))}</b>, ` : ''}${esc(base ? ctx.intro : ctx.intro.charAt(0).toUpperCase() + ctx.intro.slice(1))}</p>
    <form id="qdForm" autocomplete="on">
      ${base ? '' : `<div class="row2">${campo('nombres', 'Nombres', true, 'autocapitalize="words"', d.nombres || '')}${campo('apellidos', 'Apellidos', true, 'autocapitalize="words"', d.apellidos || '')}</div>`}
      <div class="row2"><div class="field"><label>Estaca <span class="req">*</span></label><select name="estaca"><option value="">Seleccionar…</option>${PROG_STAKES.map(s => `<option value="${esc(s)}" ${s === ((base && d.estaca) || prev.estaca) ? 'selected' : ''}>${esc(stakeShort(s))}</option>`).join('')}<option value="Otra" ${prev.estaca === 'Otra' ? 'selected' : ''}>Otra</option></select></div>
        ${campo('barrio', 'Barrio o rama', true, 'autocapitalize="words"', (base && d.barrio) || prev.barrio || '')}</div>
      <div class="field" id="qdMiembro"><label>¿Eres miembro de la Iglesia? <span class="req">*</span></label><div class="seg big" data-v="${esc(prev.miembro || '')}"><button type="button" data-o="si" class="${prev.miembro === 'si' ? 'on' : ''}">Sí</button><button type="button" data-o="no" class="${prev.miembro === 'no' ? 'on' : ''}">No</button></div></div>
      <div id="qdIglesia" class="${prev.miembro === 'si' ? '' : 'hide'}">
        ${campo('cedula', 'Número de cédula de miembro', false, 'inputmode="numeric" placeholder="Si lo sabes"')}
        ${campo('usuario', 'Nombre de usuario de tu cuenta de la Iglesia', false, 'autocapitalize="off" spellcheck="false" placeholder="Si lo sabes"')}
      </div>
      <div class="row2">${campo('nacimiento', 'Fecha de nacimiento', true, `type="date" max="${todayISO()}"`)}${campo('celular', 'Celular', true, 'type="tel" inputmode="tel" placeholder="Ej. 987 654 321"')}</div>
      ${acuerdoHTML(ctx.prog, prev)}
      <div class="btn-row"><button class="btn primary lg block" type="submit">${ICON.check} ${esc(ctx.boton)}</button></div>
    </form>
    <p class="who"><button id="qdAtras">Volver a buscar mi nombre</button></p></section>`;
  const seg = $('#qdMiembro [data-v]');
  $$('[data-o]', seg).forEach(b => b.onclick = () => { $$('[data-o]', seg).forEach(x => x.classList.toggle('on', x === b)); seg.dataset.v = b.dataset.o; $('#qdIglesia').classList.toggle('hide', b.dataset.o !== 'si'); });
  $('#qdAtras').onclick = () => ctx.volver();
  if(!base) setTimeout(() => $('#qdForm [name=nombres]').focus(), 200);
  $('#qdForm').onsubmit = e => {
    e.preventDefault();
    const v = {}; $$('#qdForm [name]').forEach(i => { if(i.value.trim()) v[i.name] = i.value.trim(); });
    v.miembro = seg.dataset.v;
    if(v.miembro !== 'si'){ delete v.cedula; delete v.usuario; }
    $$('#qdForm .field').forEach(f => f.classList.remove('err'));
    const prog = ctx.prog === 'S' ? 'S' : 'I';
    const miss = [...(base ? [] : ['nombres', 'apellidos']), 'estaca', 'barrio', 'miembro', 'nacimiento', 'celular', ...(prog === 'S' ? ['tutor', 'tutor_celular', 'direccion'] : [])].filter(k => !v[k]);
    if(v.celular && v.celular.replace(/\D/g, '').length < 7) miss.push('celular');
    if(v.tutor_celular && v.tutor_celular.replace(/\D/g, '').length < 7) miss.push('tutor_celular');
    if(v.tutor_correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.tutor_correo)) miss.push('tutor_correo');
    if(miss.length){ miss.forEach(k => { const f = k === 'miembro' ? $('#qdMiembro') : $(`#qdForm [name=${k}]`).closest('.field'); f.classList.add('err'); }); toast('Completa los campos obligatorios (*)', 'error'); return; }
    $('#qdAcepto').classList.remove('err');
    if(!$('#qdAcuerdo').checked){ $('#qdAcepto').classList.add('err'); toast('Para inscribirte debes aceptar el acuerdo de inscripción', 'error'); return; }
    v.acuerdo = ACUERDO_VERSION[prog];
    const { nombres, apellidos, ...datos } = v;
    const { acuerdo, ...recordar } = datos;
    LS.set('ca_yo_datos', recordar);
    ctx.enviar(base ? { persona: d.persona, datos } : { nombres: titleCase(nombres), apellidos: titleCase(apellidos), datos });
  };
}
const fmtInscripcion = x => !x ? '' : [x.miembro === 'no' ? 'No es miembro' : '', x.cedula ? 'Cédula ' + x.cedula : '', x.usuario ? 'Usuario ' + x.usuario : '', x.nacimiento ? 'Nac. ' + fmtDMY(x.nacimiento) : '', x.celular ? 'Cel. ' + x.celular : ''].filter(Boolean).join(' · ');
function qrcBuscar(){
  const main = $('#qrMain');
  main.innerHTML = QRC.head + `<section class="card"><h2>¿Quién eres?</h2><p class="hint" style="margin-top:0">Escribe tu nombre: te buscamos en la lista de la clase y, si no estás, en la base de Seminarios e Institutos. Solo lo harás la primera vez en este celular.</p>
    <div class="search-box"><span class="si">${ICON.search}</span><input id="qcq" type="search" placeholder="Tu nombre o apellido" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"></div>
    <div id="qcRes" class="results"><div class="empty-hint"><small>Escribe tu nombre o apellido (al menos 3 letras).</small></div></div>
    <button class="manual-cta" id="qcMan"><span class="mc-ico">${ICON.userPlus}</span><span><b>No me encuentro</b><small>Escribe tus datos; tu maestro te agregará</small></span>${ICON.next}</button></section>`;
  const q = $('#qcq'), res = $('#qcRes');
  let n = 0, ultimo = null;
  const buscar = debounce(async () => {
    const t = q.value.trim(); if(t === ultimo) return; ultimo = t;
    const id = ++n;
    if(!norm(t).split(' ').some(w => w.length >= 3)){ res.innerHTML = `<div class="empty-hint"><small>Escribe tu nombre o apellido (al menos 3 letras).</small></div>`; return; }
    res.innerHTML = loadingHTML('Buscando…', true);
    try{
      const list = await SB.rpc('buscar_alumno_qr', { token: QRC.token, texto: t });
      if(id !== n) return;
      res.innerHTML = list.length ? list.map((p, i) => `<button class="person" data-i="${i}"><span class="av">${esc(initials(p.nombre))}</span><span class="pi"><b>${highlight(p.nombre, t)}</b><small>${p.ya_enviada ? 'Ya envió su asistencia hoy' : p.en_clase === false ? esc([p.barrio, 'no está en la lista: tu maestro te agregará'].filter(Boolean).join(' · ')) : 'Alumno de la clase'}</small></span><span class="mk">Soy yo</span></button>`).join('')
        : `<div class="empty-hint"><p>No encontramos “${esc(t)}”</p><small>Revisa cómo lo escribiste o usa “No me encuentro”.</small></div>`;
      $$('[data-i]', res).forEach(b => b.onclick = () => { const p = list[+b.dataset.i]; if(p.en_clase === false) qrcDatos({ persona: p.id, nombre: p.nombre, barrio: p.barrio }); else qrcMarcar({ alumno: p.id }); });
    }catch(e){ console.error(e); ultimo = null; if(id === n) res.innerHTML = `<div class="info-box">No se pudo buscar: ${esc(errMsg(e))}.</div>`; }
  }, 350);
  ['input', 'keyup', 'change', 'search'].forEach(ev => q.addEventListener(ev, buscar));
  $('#qcMan').onclick = () => { const t = q.value.trim().split(/\s+/).filter(Boolean); qrcDatos({ manual:true, nombres: titleCase(t[0] || ''), apellidos: titleCase(t.slice(1).join(' ')) }); };
  setTimeout(() => q.focus(), 200);
}
async function qrcMarcar(d){
  $$('#qrMain button').forEach(b => b.disabled = true);
  try{
    const r = await SB.rpc('marcar_por_qr_clase', { token: QRC.token, alumno: d.alumno || null, persona: d.persona || null, nombres: d.nombres || null, apellidos: d.apellidos || null, dispositivo: DEV, datos: d.datos || {} });
    if(r.alumno_id){ const g = misClasesQr(); g[QRC.token] = { id: r.alumno_id, nombre: r.nombre }; LS.set('ca_qr_clase', g); }
    if(!miYo()) guardarYo({ nombre: r.nombre, persona_id: r.persona_id || undefined, nombres: d.nombres, apellidos: d.apellidos });
    if(navigator.vibrate) navigator.vibrate(40);
    const nom = prettyName(r.nombre);
    const [tit, txt] = r.estado === 'ya_presente' ? ['Ya estás presente', `${esc(nom)}, tu maestro ya marcó tu asistencia de hoy.`]
      : r.estado === 'ya_enviada' ? ['Ya la habías enviado', `${esc(nom)}, tu asistencia de hoy ya está enviada. Tu maestro la confirmará.`]
      : ['¡Asistencia enviada!', r.nuevo ? `Gracias, ${esc(nom)}. Tu maestro te agregará a la clase y confirmará tu asistencia.` : `Gracias, ${esc(nom)}. Tu maestro la confirmará en un momento.`];
    $('#qrMain').innerHTML = QRC.head + `<section class="card qr-done">${OK_ANIM}<h2>${tit}</h2><p>${txt}</p></section>`;
  }catch(e){ console.error(e); $$('#qrMain button').forEach(b => b.disabled = false); toast(errMsg(e), 'error'); }
}

const INSC_P = { token:'', prog:'S', head:'' };
const nomProgDe = p => p === 'S' ? 'Seminario' : 'Instituto';
async function renderInscripcionPublica(token){
  CUR = { type:'qr', code:null };
  INSC_P.token = token;
  pedirAlmacenPersistente();
  app.innerHTML = qrShell(loadingHTML('Abriendo la inscripción…'));
  let r;
  try{ r = await SB.rpc('inscripcion_por_enlace', { token }); }
  catch(e){ console.error(e); $('#qrMain').innerHTML = `<div class="empty">No se pudo abrir la inscripción. Revisa tu internet.<br><br><button class="btn primary" id="qrRe">Intentar otra vez</button></div>`; $('#qrRe').onclick = () => renderInscripcionPublica(token); return; }
  if(!r || r.estado !== 'abierto'){ $('#qrMain').innerHTML = `<div class="empty">Este enlace de inscripción ya no está activo. Pide el enlace actualizado.</div>`; return; }

}

        : `<div class="empty-hint"><p>No encontramos “${esc(t)}”</p><small>Revisa cómo lo escribiste o usa “No me encuentro”.</small></div>`;
      $$('[data-i]', res).forEach(b => b.onclick = () => { const p = list[+b.dataset.i]; inscDatos({ persona: p.id, nombre: p.nombre, estaca: p.estaca, barrio: p.barrio }); });

async function inscEnviar(x){

function personFormHTML({sw}={}){
  const R = ' <span class="req">*</span>';
  let h = `<div class="row2"><div class="field"><label>Nombres completos${R}</label><input name="nombres" autocomplete="off" autocapitalize="words"></div><div class="field"><label>Apellidos${R}</label><input name="apellidos" autocomplete="off" autocapitalize="words"></div></div><div id="dupHint"></div>`;
  if(sw) h += `<div class="row2">${swFields(sw.stake, sw.ward, 'm')}</div>`;
  return h;
}
function bindPersonForm(el, {onUseExisting, sw}={}){
  if(sw) bindSW(el, 'm', sw.ward);
  const no = $('[name=nombres]', el), ap = $('[name=apellidos]', el), dup = $('#dupHint', el);
  const check = debounce(() => {
    const q = (no.value + ' ' + ap.value).trim();
    if(!onUseExisting || norm(q).split(' ').length < 2){ dup.innerHTML = ''; return; }
    const r = searchPeople(q, null, 3);

function defaultClassDate(dates){
  const t = todayISO();
  if(dates.includes(t)) return t;
  const past = dates.filter(d => d <= t);
  return past.length ? past[past.length-1] : (dates[0] || t);
}

// El PIN en texto solo vive en este dispositivo: nunca sale en reportes, Excel ni respaldos.
function cleanForBackup(o){ const c = JSON.parse(JSON.stringify(o)); delete c._busy; delete c.pin; return c; }
let PIN_LAST = '';
function downloadBackup(obj, name){
  const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
  downloadBlob(blob, `${slug(name)} - ${todayISO()}.json`);
  toast('Backup descargado','ok');
}
/* Hoja de respaldo dentro del Excel: el JSON del evento/clase partido en celdas de 30.000 caracteres. */
const BK_MARK = 'CA-BACKUP';
function addBackupSheet(wb, obj){
  const ws = wb.addWorksheet('Respaldo (no editar)');
  const json = JSON.stringify(obj); const N = 30000; const chunks = [];
  for(let i=0;i<json.length;i+=N) chunks.push(json.slice(i, i+N));
  ws.getCell('A1').value = BK_MARK;
  ws.getCell('B1').value = 'Respaldo para importar en Check-in Asistencia (botón “Importar reporte, Excel o backup”). No modifiques ni borres esta hoja.';
  ws.getCell('B1').font = { bold:true, color:{argb:'FFC0392B'} };
  ws.getCell('A2').value = 1; ws.getCell('B2').value = chunks.length;
  chunks.forEach((c, i) => { ws.getCell(3+i, 1).value = c; });
  ws.getColumn(1).width = 14; ws.getColumn(2).width = 100;
}
function cellText(c){
  const v = c && c.value;
  if(v == null) return '';
  if(typeof v === 'object'){ if(v.richText) return v.richText.map(r => r.text).join(''); if(v.text != null) return String(v.text); if(v.result != null) return String(v.result); }
  return String(v);
}
async function readBackupXlsx(file){
  const X = await excelLib();
  const wb = new X.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  let ws = null;
  wb.eachSheet(s => { if(!ws && cellText(s.getCell('A1')).trim() === BK_MARK) ws = s; });
  if(!ws) throw new Error(`“${file.name}” no tiene la hoja de respaldo. Usa el Excel generado por Check-in Asistencia.`);
  const n = Number(cellText(ws.getCell('B2'))) || 0;
  let json = ''; for(let i=0;i<n;i++) json += cellText(ws.getCell(3+i, 1));
  try{ return JSON.parse(json); }catch(e){ throw new Error(`El respaldo de “${file.name}” está dañado (¿se editó la hoja de respaldo?).`); }
}
function importBackupPicker(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
  inp.accept = '.html,.htm,.xlsx,.json,text/html,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.onchange = async () => {
    const files = [...inp.files]; if(!files.length) return;
    toast(files.length > 1 ? `Importando ${files.length} archivos…` : 'Importando…');
    const touchedEv = new Set(), touchedCl = new Set(), errors = [];
    let added = 0;
    for(const f of files){
      try{
        const obj = /\.html?$/i.test(f.name) ? readBackupHtml(await f.text(), f.name) : /\.xlsx$/i.test(f.name) ? await readBackupXlsx(f) : JSON.parse(await f.text());
        if(!obj || obj.kind !== 'ca-backup') throw new Error(`“${f.name}” no es un respaldo de Check-in Asistencia.`);
        const evs = obj.type === 'event' ? [obj.data] : obj.type === 'all' ? Object.values(obj.events||{}) : [];
        const cls = obj.type === 'class' ? [obj.data] : obj.type === 'all' ? Object.values(obj.classes||{}) : [];
        evs.forEach(ev => { added += mergeEventBackup(ev); touchedEv.add(ev.code); });
        for(const c of cls){
          // Clase de otro maestro (o de otro dispositivo): para poder editarla hay que poner el PIN con que se creó.
          const ex = CLASSES[c.code];
          let mode = 'edit';
          if(!(ex && ex.canEdit) && c.meta && c.meta.pinHash){
            mode = await askClassPin(c);
            if(!mode){ toast(`No se importó “${c.meta.title}”.`, 'warn'); continue; }
          }
          mergeClassBackup(c, obj.exportedAt, mode === 'edit');
          if(mode === 'edit' && PIN_LAST) CLASSES[c.code].pin = PIN_LAST;
          touchedCl.add(c.code);
        }
      }catch(e){ errors.push(e.message || f.name); }
    }
    saveEvents(); saveClasses();
    errors.forEach(m => toast(m, 'error', {ms:5000}));
    const n = touchedEv.size + touchedCl.size;
    if(!n){ return; }
    const parts = [...touchedEv].map(c => `${EVENTS[c].meta.title}: ${eventRows(EVENTS[c]).length} asistentes`).concat([...touchedCl].map(c => `${CLASSES[c].meta.title}: ${classStudents(CLASSES[c]).length} alumnos${CLASSES[c].canEdit ? '' : ' (solo lectura)'}`));
    toast(`Importado ✓ ${parts.join(' · ')}${added ? ` (+${added} registros nuevos)` : ''}`, 'ok', {ms:5000});
    if(n === 1) go(touchedEv.size ? '#/evento/'+[...touchedEv][0] : '#/clase/'+[...touchedCl][0]); else route();
    syncAllPending();
  };
  inp.click();
}
/* Pide el PIN de una clase que viene en un archivo. Devuelve 'edit' (PIN correcto), 'view' (solo ver) o null (canceló). */
function askClassPin(b){
  return new Promise(res => {
    let done = false;
    const m = b.meta || {};
    sheet(`${sheetHead(ICON.lock.replace('<svg','<svg style="vertical-align:-3px;margin-right:6px"') + 'Continuar esta clase', esc(m.title) + ' · ' + esc(b.code))}
      <div class="info-box">Clase de <b>${esc(m.teacher || 'otro maestro')}</b> · ${progLabel(m.program)} · ${Object.values(b.students||{}).filter(s => s && !s.del).length} alumnos.<br>Para usarla en este dispositivo y <b>seguir marcando la asistencia</b>, escribe el <b>PIN</b> que se puso al crear la clase.</div>
      <div class="field"><label>PIN del maestro</label><input id="pin" class="pin-in" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>
      <p class="hint" style="margin-top:-6px">¿No tienes el PIN? Toca <b>Solo ver</b>: la clase se agrega sin poder editarla y luego puedes desbloquearla con el PIN.</p>
      <div class="sh-foot"><button class="btn" id="ro">Solo ver</button><button class="btn primary" id="ok">${ICON.check} Desbloquear y agregar</button></div>`, {
      onMount(el, close){
        const i = $('#pin', el); setTimeout(() => i.focus(), 250);
        const tryIt = () => {
          if(sha256(b.code + ':' + i.value.trim()) === m.pinHash){ done = true; PIN_LAST = i.value.trim(); res('edit'); close(); }
          else { i.closest('.field').classList.add('err'); i.select(); toast('PIN incorrecto', 'error'); }
        };
        $('#ok', el).onclick = tryIt; i.onkeydown = e => { if(e.key === 'Enter') tryIt(); };
        $('#ro', el).onclick = () => { done = true; res('view'); close(); };
      },
      onClose(){ if(!done) res(null); }
    });
  });
}
/* Une un respaldo de evento con lo que ya hay. El código es el nexo: los aportes de cada
   colaborador se suman al mismo evento; los datos del organizador reemplazan a los provisionales. */
function mergeEventBackup(b){
  const ex = EVENTS[b.code];
  const ev = ex || newEventObj(b.code, b.meta);
  if(!ex) ev.meta = b.meta;
  else if(ev.meta.placeholder && b.meta && !b.meta.placeholder) ev.meta = b.meta;
  if(!ex) ev.contrib = false;
  let added = 0;
  Object.entries(b.rows||{}).forEach(([id, r]) => {
    const cur = ev.rows[id];
    if(!cur){ ev.rows[id] = r; added++; }
    else if((r.delAt||0) > (cur.delAt||0)) ev.rows[id] = r;
    if(Sync.on()) ev.pending[id] = Date.now();
  });
  Object.entries(b.sigs||{}).forEach(([id, s]) => { if(!ev.sigs[id]) ev.sigs[id] = s; if(Sync.on()) ev.sigPending[id] = 1; });
  ev.metaPending = Sync.on();
  EVENTS[b.code] = ev;
  return added;
}
/* Clases: el respaldo más reciente manda; uno más antiguo solo completa lo que falte. */
function mergeClassBackup(b, exportedAt, canEdit = true){
  const ex = CLASSES[b.code];
  const c = ex || newClassObj(b.code, b.meta);
  const at = String(exportedAt || '');
  const newer = !c.bkAt || at >= String(c.bkAt);
  if(!ex || newer) c.meta = b.meta;
  c.canEdit = !!((ex && ex.canEdit) || canEdit);
  Object.entries(b.students||{}).forEach(([id, s]) => { if(!c.students[id] || newer) c.students[id] = s; markDirty(c, 'students/'+id); });
  Object.entries(b.att||{}).forEach(([d, row]) => Object.entries(row||{}).forEach(([sid, v]) => { if(!c.att[d]) c.att[d] = {}; if(!c.att[d][sid] || newer) c.att[d][sid] = v; markDirty(c, `att/${d}/${sid}`); }));
  Object.entries(b.sigs||{}).forEach(([id, s]) => { if(!c.sigs[id]) c.sigs[id] = s; c.sigPending[id] = 1; });
  markDirty(c, 'meta');
  if(newer && at) c.bkAt = at;
  if(!Sync.on() || !c.canEdit){ c.dirty = {}; c.sigPending = {}; }
  CLASSES[b.code] = c;
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132C3E">
<title>Check-in Asistencia · Seminarios e Institutos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132C3E;--navy-2:#1D435C;--teal:#1F7A83;--teal-2:#176269;--teal-50:#E6F2F2;
  --gold:#D79A28;--gold-50:#FBF3E2;--bg:#F2F5F6;--card:#FFFFFF;--text:#17262E;--muted:#5C7080;--faint:#8A9AA5;
  --border:#E1E8EB;--line:#EDF1F3;--green:#1E8449;--green-50:#E7F5EC;--red:#C0392B;--red-50:#FBEAE8;
  --amber:#A8670A;--amber-50:#FDF2E3;--purple:#5B3FA6;--purple-50:#EFE9FA;
  --r:16px;--r-sm:11px;--shadow:0 1px 2px rgba(19,44,62,.06),0 6px 22px rgba(19,44,62,.07);
  --top:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 'Inter',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:'Manrope',sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex-shrink:0}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.mt6{margin-top:6px}

/* ---------- Topbar ---------- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;box-shadow:0 2px 14px rgba(19,44,62,.18);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1100px;margin:0 auto;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:11px;user-select:none;-webkit-user-select:none;cursor:default}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#F0C36B);display:grid;place-items:center;color:var(--navy);font:800 15px 'Manrope';flex-shrink:0}
.bt b{display:block;font:800 16.5px 'Manrope'}
.bt small,.top-title small{display:block;font-size:11.5px;color:#B9CCD8;font-weight:500}
.top-title{flex:1;min-width:0}
.top-title b{display:block;font:700 15.5px 'Manrope';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .icon-btn{color:#fff;background:rgba(255,255,255,.09)}
.top .icon-btn:hover{background:rgba(255,255,255,.16)}
.top .spacer{flex:1}
.sync-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#E3EDF2;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:#9DB0BC}
.sync-pill.ok .dot{background:#4FD18B}
.sync-pill.pending .dot{background:#F2B544}
.sync-pill.error .dot{background:#F07A6E}
.sync-pill.syncing .dot{background:#7FD3DC;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- Layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.wrap.wide{max-width:1100px}
.has-savebar{padding-bottom:110px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card,.section+.section{margin-top:14px}
.section{margin-top:22px}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.section-h h2{font-size:16px}
.hint{color:var(--muted);font-size:12.5px}
.opt{color:var(--faint);font-weight:500;font-size:12px}
.req{color:var(--red)}
.muted{color:var(--muted)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{background:#F6F9FA;border-color:#CFDADF}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#F0C9C4;background:#fff}
.btn.danger.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 20px;font-size:15.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 160px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:0;background:#EEF3F5;display:inline-grid;place-items:center;color:var(--navy);flex-shrink:0}
.icon-btn:hover{background:#E2EAEE}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn.danger{color:var(--red);background:var(--red-50)}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.01em}
.field input,.field select,.field textarea,.inp{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;background:#FBFCFD;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,131,.14);background:#fff}
.field.err input,.field.err select{border-color:var(--red);background:var(--red-50)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(31,122,131,.28)}
.chip:not(.on){border-color:#CBD7DC;color:#6B7F8C}
.pend-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--amber-50);border:1.5px solid #EBC982;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pend-box b{display:block;color:#6E4A08}
.pend-box small{color:#8A6A2E;font-size:12.5px}
.pend-box.ok{background:var(--green-50);border-color:#A9D8B9}
.pend-box.ok b{color:var(--green)}.pend-box.ok small{color:#3E7A55}
.pend-act{display:flex;gap:8px;flex-wrap:wrap}
.per-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;align-items:end}
.per-row label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
@media(max-width:560px){.per-row{grid-template-columns:1fr 1fr}.per-row .per-n{grid-column:1/-1}}
.hol-list{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:12px;margin:8px 0}
.hol-i{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.hol-i b{text-transform:capitalize}
.chip.on::before{content:"✓ "}
.seg{display:inline-flex;background:#E8EEF1;border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(19,44,62,.25)}
.seg.big button.on{background:var(--teal);box-shadow:0 3px 10px rgba(31,122,131,.35)}
.seg.big button.on::before{content:"✓ "}
.seg.big{background:#E3EAED;border:1.5px solid #D3DDE1}
.seg.big{display:flex;width:100%}
.seg.big button{flex:1;padding:11px;font-size:14.5px}
.cf-row{display:grid;grid-template-columns:1fr 130px 32px;gap:8px;margin-bottom:8px;align-items:center}
.cf-row .cf-opts{grid-column:1/3}
@media(max-width:480px){.cf-row{grid-template-columns:1fr 110px 32px}}

/* ---------- Home ---------- */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#1A3F57 60%,#1F5A66 100%);color:#fff;border-radius:22px;padding:24px 20px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(215,154,40,.22),transparent 70%)}
.hero h1{font-size:24px;line-height:1.2;max-width:460px}
.hero p{color:#C8D8E2;margin:8px 0 16px;max-width:480px;font-size:14px}
.join{display:flex;gap:8px;position:relative;z-index:1}
.join input{flex:1;min-width:0;border:0;border-radius:13px;padding:13px 14px;font-size:15.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;outline:none;background:#fff;color:var(--navy)}
.join input::placeholder{letter-spacing:0;text-transform:none;font-weight:500;color:#8A9AA5}
.join .btn{border-radius:13px}
.join-card .join input{border:1.5px solid var(--border);background:#FBFCFD}
.join-card .join input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,131,.14)}
.hero p b{color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.action-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.ac-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.ac-ico svg{width:24px;height:24px}
.action-card.ev .ac-ico{background:var(--teal-50);color:var(--teal)}
.action-card.cl .ac-ico{background:var(--gold-50);color:#9A6A12}
.action-card h2{font-size:18px}
.action-card p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.action-card .btn-row>.btn{flex:1 1 120px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;text-align:left;width:100%;margin-bottom:8px}
.item:hover{border-color:#C9D6DC}
.item .ii{flex:1;min-width:0}
.item b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .num-badge{background:var(--teal-50);color:var(--teal-2);font-weight:800;border-radius:10px;padding:5px 10px;font-size:13px;white-space:nowrap}
.item .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.ico.t{background:var(--teal-50);color:var(--teal)}
.ico.g{background:var(--gold-50);color:#9A6A12}
.empty{border:1.5px dashed #CFDADF;border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px;background:rgba(255,255,255,.5)}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:28px;line-height:1.7;user-select:none;-webkit-user-select:none}

/* ---------- Event / class header ---------- */
.ev-head h1{font-size:20px;line-height:1.25}
.meta{margin:4px 0 0;color:var(--muted);font-size:13px}
.eh-main{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.counter{background:var(--teal-50);border-radius:14px;padding:8px 14px;text-align:center;min-width:86px}
.counter b{display:block;font:800 26px/1.1 'Manrope';color:var(--teal-2)}
.counter span{font-size:11.5px;color:var(--teal-2);font-weight:600}
.code-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.code-chip{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--teal);background:#F4FAFA;color:var(--teal-2);border-radius:11px;padding:7px 12px;font:800 15px 'Manrope';letter-spacing:.08em}
.code-row .hint{flex:1;min-width:180px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-sem{background:var(--teal-50);color:var(--teal-2)}
.b-inst{background:var(--purple-50);color:var(--purple)}
.b-man{background:var(--amber-50);color:var(--amber)}
.b-new{background:var(--gold-50);color:#8A5D0D}
.b-ro{background:#EEF2F4;color:var(--muted)}
.b-ok{background:var(--green-50);color:var(--green)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px;margin:14px 0;box-shadow:var(--shadow);position:sticky;top:calc(var(--top) + env(safe-area-inset-top) + 8px);z-index:20}
.tabs button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff}
.tcount{background:rgba(31,122,131,.14);color:var(--teal-2);border-radius:999px;padding:1px 7px;font-size:11.5px}
.tabs button.on .tcount{background:rgba(255,255,255,.2);color:#fff}
@media(max-width:420px){.tabs button svg{display:none}}

/* ---------- Search ---------- */
.search-box{position:relative}
.search-box .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-box input{width:100%;border:2px solid var(--border);border-radius:15px;padding:15px 46px 15px 46px;font-size:17px;font-weight:500;outline:none;background:#fff;box-shadow:var(--shadow)}
.search-box input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(31,122,131,.13)}
.search-box .clear{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.search-box.sm input{padding:11px 40px;font-size:15px;border-radius:12px;box-shadow:none}
.search-box.sm .si{left:13px}
.scope-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
.results{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:15px;padding:11px 12px;transition:border-color .12s,background .12s}
.person:hover{border-color:#BFD3D8}
.person:active{background:#F4FAFA}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#E7EEF1;color:var(--navy);font:800 14px 'Manrope';flex-shrink:0;text-transform:uppercase}
.person .pi,.roll-item .ri,.att-item .ai{flex:1;min-width:0}
.person b,.roll-item b,.att-item b{display:block;font-weight:700;font-size:15px;line-height:1.3}
.person small,.roll-item small,.att-item small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person mark{background:#FCEFD2;color:inherit;border-radius:3px;padding:0 1px}
.mk{display:inline-flex;align-items:center;gap:5px;background:var(--teal);color:#fff;border-radius:11px;padding:9px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.person.is-marked{background:#F6FBF8;border-color:#BFE3CC}
.person.is-marked .av{background:var(--green);color:#fff}
.mk.done{background:var(--green-50);color:var(--green)}
.mk.add{background:var(--navy)}
.empty-hint{text-align:center;color:var(--muted);padding:22px 10px 10px}
.empty-hint svg{width:30px;height:30px;color:#B5C3CA}
.empty-hint p{margin:8px 0 2px;font-weight:600;color:var(--text)}
.more-btn{align-self:center;margin-top:4px}
.manual-cta{display:flex;align-items:center;gap:13px;width:100%;text-align:left;margin-top:16px;border:1.5px dashed #D9B66F;background:var(--gold-50);border-radius:16px;padding:14px}
.manual-cta .mc-ico{width:42px;height:42px;border-radius:12px;background:#fff;color:#9A6A12;display:grid;place-items:center;flex-shrink:0}
.manual-cta span:nth-child(2){flex:1}
.manual-cta b{display:block;color:#6E4A08}
.manual-cta small{color:#8A6A2E;font-size:12.5px}
.who{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
.who button{border:0;background:none;color:var(--teal-2);font-weight:700;text-decoration:underline;padding:0}

/* ---------- Attendance list ---------- */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{color:var(--navy);font:800 16px 'Manrope';margin-left:4px}
.att-list{display:flex;flex-direction:column;gap:7px}
.att-item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:13px;padding:10px 10px 10px 12px;cursor:pointer}
.att-item .n{font:800 13px 'Manrope';color:var(--faint);min-width:24px;text-align:right}
.att-item .at{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.att-item .at b{font-size:13.5px;color:var(--navy)}
.sig-thumb{height:28px;max-width:70px;border:1px solid var(--border);border-radius:6px;background:#fff}

/* ---------- Class roll ---------- */
.date-nav{display:flex;align-items:center;gap:10px;padding:12px}
.dn-mid{flex:1;text-align:center}
.dn-mid b{display:block;font:800 16px 'Manrope';text-transform:capitalize}
.dn-mid small{color:var(--muted);font-size:12px}
.date-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.date-tools .tally{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.date-mini{border:1.5px solid var(--border);border-radius:10px;padding:6px 9px;font-size:13px;background:#fff}
.roll{display:flex;flex-direction:column;gap:8px}
.roll-item{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--border);border-radius:15px;padding:10px 10px 10px 12px}
.roll-item.p{border-color:#BFE3CC;background:#F6FBF8}
.roll-item.f{border-color:#F1CFCA;background:#FDF7F6}
.roll-item .ri{cursor:pointer}
.pf{display:flex;gap:6px}
.pf-btn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--border);background:#fff;border-radius:11px;padding:9px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.pf-btn.p.on{background:var(--green);border-color:var(--green);color:#fff}
.pf-btn.f.on{background:var(--red);border-color:var(--red);color:#fff}
@media(max-width:470px){.pf-btn span{display:none}.pf-btn{padding:10px 12px}}

/* ---------- Planilla ---------- */
.plan-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.plan-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);max-height:70vh}
table.plan{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.plan th,.plan td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
.plan thead th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:700;font-size:11.5px;padding:7px 4px;z-index:2;min-width:44px;line-height:1.2}
.plan thead th span{display:block;font-weight:500;color:#B9CCD8;font-size:10.5px}
.plan thead th.today{background:var(--teal)}
/* ---------- Calendario por alumno ---------- */
.cal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cal-stats div{background:#F6F9FA;border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.cal-stats b{display:block;font:800 18px 'Manrope';color:var(--navy)}
.cal-stats span{font-size:11.5px;color:var(--muted);font-weight:600}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}

/* ============================================================
   UI BÁSICA: toasts, hojas modales, confirmaciones
   ============================================================ */
function toast(msg, type='', opts={}){
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = `<span>${esc(msg)}</span>${opts.action?`<button>${esc(opts.action)}</button>`:''}`;
  box.appendChild(t);
  const kill = ()=>{ t.style.opacity='0'; t.style.transition='opacity .2s'; setTimeout(()=>t.remove(), 220); };
  if(opts.action) t.querySelector('button').onclick = ()=>{ kill(); opts.onAction && opts.onAction(); };
  setTimeout(kill, opts.ms || (opts.action ? 5000 : 2600));
  while(box.children.length > 3) box.firstChild.remove();
}
function sheet(html, {onMount, wide, onClose}={}){
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<div class="sheet ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  layer.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('in'));
  let closed = false;
  const onKey = e => { if(e.key === 'Escape') close(); };
  function close(){ if(closed) return; closed = true; ov.classList.remove('in'); document.removeEventListener('keydown', onKey); setTimeout(()=>ov.remove(), 200); onClose && onClose(); }
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', e => { if(e.target === ov) close(); });
  $$('[data-close]', ov).forEach(b => b.onclick = close);
  const el = ov.firstElementChild;
  onMount && onMount(el, close);
  return close;
}
const sheetHead = (title, sub) => `<div class="sh-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button class="icon-btn" data-close aria-label="Cerrar">${ICON.x}</button></div>`;
function confirmBox(msg, {title='¿Confirmar?', ok='Aceptar', cancel='Cancelar', danger=false}={}){
  return new Promise(res => {
    let done = false;
    sheet(`${sheetHead(esc(title))}<p style="margin:0 0 8px;color:var(--muted)">${msg}</p><div class="sh-foot"><button class="btn" data-no>${esc(cancel)}</button><button class="btn ${danger?'danger solid':'primary'}" data-yes>${esc(ok)}</button></div>`, {
      onMount(el, close){ $('[data-no]',el).onclick = ()=>{ done=true; res(false); close(); }; $('[data-yes]',el).onclick = ()=>{ done=true; res(true); close(); }; },
      onClose(){ if(!done) res(false); }
    });
  });
}
async function copyText(t, okMsg='Copiado'){
  try{ await navigator.clipboard.writeText(t); toast(okMsg,'ok'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(okMsg,'ok'); }catch(_){ toast('No se pudo copiar','error'); } ta.remove(); }
}
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
/* Enviar el Excel: 1) menú Compartir del celular con el archivo adjunto (WhatsApp, correo, Drive…);
   2) si el navegador no lo permite, se descarga y se abre WhatsApp (directo al chat si hay número). */
async function shareOrDownload(blob, name, text, {wa='', waText=''}={}){
  const file = new File([blob], name, {type: blob.type});
  const isHtml = /\.html?$/i.test(name);
  // El reporte HTML se puede compartir como archivo en celular y en Windows/Mac (menú Compartir del sistema → WhatsApp).
  // El Excel solo se intenta en celular: en computadora el sistema lo rechaza.
  const mobile = matchMedia('(pointer:coarse)').matches && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  let canFile = (mobile || isHtml) && !!(navigator.canShare && (() => { try{ return navigator.canShare({files:[file]}); }catch(e){ return false; } })());
  // Solo el archivo, sin título ni texto: algunas apps convierten el texto en un mensaje aparte y el archivo se pierde.
  const tryShare = async () => { await navigator.share({files:[file]}); };
  if(canFile){
    try{ await tryShare(); return; }
    catch(e){
      if(e && e.name === 'AbortError') return;
      // Solo vale reintentar con un toque nuevo si falló por haber tardado en generar el Excel.
      canFile = !!(e && e.name === 'NotAllowedError');
    }
  }
  downloadBlob(blob, name);
  const phone = normPhone(wa);
  const desktop = !matchMedia('(pointer:coarse)').matches;
  // Nunca se manda texto: solo se abre el chat para soltar el archivo.
  const openChat = () => {
    if(phone) window.open('https://wa.me/' + phone, '_blank');
    else if(desktop) window.open('https://web.whatsapp.com/', '_blank');
    else location.href = 'whatsapp://send';
  };
  sheet(`${sheetHead(`✓ ${isHtml ? 'Reporte' : 'Excel'} listo para enviar`, esc(name))}
    ${canFile ? `<button class="btn primary lg block" id="shF">${ICON.share} Compartir archivo → WhatsApp</button><p class="hint" style="text-align:center">Se abre el menú Compartir con el archivo adjunto: elige <b>WhatsApp</b> y el chat.</p>` : ''}
    <div class="info-box"><b>${canFile ? 'Si el menú no aparece:' : 'El archivo ya está en tu carpeta de Descargas.'}</b> ${canFile ? 'el archivo también quedó en <b>Descargas</b>.' : desktop ? 'Este navegador no puede adjuntarlo por ti:' : 'Este celular no permite adjuntarlo automáticamente:'}
      <ol class="steps" style="margin:6px 0 0"><li>Toca <b>Abrir chat de WhatsApp</b>${phone ? ' (se abre el chat del destinatario)' : ' y elige el chat'}. <i>Este botón solo abre el chat, no adjunta.</i></li>${desktop
        ? `<li><b>Arrastra el archivo</b> desde la barra de descargas del navegador (o desde la carpeta Descargas) hasta la conversación, o usa 📎 <b>→ Documento</b>.</li>`
        : `<li>Toca 📎 <b>→ Documento</b> y abre la carpeta <b>Descargas</b>.</li>`}<li>Elige <b>${esc(name)}</b> y envíalo.</li></ol></div>
    <div class="btn-row"><button class="btn ${canFile ? '' : 'primary'}" id="shW" style="${canFile ? '' : 'background:#1E8449;border-color:#1E8449;color:#fff'}">${ICON.chat} Abrir chat de WhatsApp</button><button class="btn" id="shD">${ICON.download} Descargar de nuevo</button></div>
    <div class="sh-foot"><button class="btn" data-close>Listo</button></div>`, {
    onMount(el){
      const sf = $('#shF', el);
      if(sf) sf.onclick = async () => {
        try{ await tryShare(); }
        catch(e){ if(e && e.name === 'AbortError') return; sf.nextElementSibling && sf.nextElementSibling.remove(); sf.remove(); const w = $('#shW', el); w.classList.add('primary'); w.style.cssText = 'background:#1E8449;border-color:#1E8449;color:#fff'; toast('Este dispositivo no permite adjuntar el archivo: ábrelo en WhatsApp con 📎 → Documento.', 'warn', {ms:4500}); }
      };
      $('#shW', el).onclick = openChat;
      $('#shD', el).onclick = () => downloadBlob(blob, name);
    }
  });
}
function normPhone(p){
  let d = String(p||'').replace(/\D/g,'');
  if(d.length === 9 && d[0] === '9') d = '51' + d;
  return d.length >= 10 ? d : '';
}
function waOpen(text, phone){ window.open('https://wa.me/'+(normPhone(phone)||'')+'?text='+encodeURIComponent(text), '_blank'); }

   ============================================================ */
let ROSTER = { v:'', src:'', people:[] };
let PBY = new Map();
let STAKES = [];
let WARDS_BY = {};
function expandCompact(c){
  const people = []; const used = new Set();
  if(!c || !Array.isArray(c.p)) return people;
  c.p.forEach(r => {
    const wi = c.wards[r[3]] || [0,''];
    const p = { n:r[0], a:r[1]||'', s:r[2]||'', k:c.stakes[wi[0]]||'', w:wi[1]||'', g:r[4]||'' };
    if(r[5] && typeof r[5] === 'object') Object.assign(p, r[5]);
    let id = p.id || pidFor(p.n, p.w);
    while(used.has(id)) id += 'x';
    used.add(id); p.id = id;
    people.push(p);
  });
  return people;
}
function compactPeople(people, v){
  const stakes = [], sIdx = {}, wards = [], wIdx = {};
  const p = people.map(x => {
    const st = x.k||'', wd = x.w||'';
    if(!(st in sIdx)){ sIdx[st] = stakes.length; stakes.push(st); }
    const wk = st+'|'+wd;
    if(!(wk in wIdx)){ wIdx[wk] = wards.length; wards.push([sIdx[st], wd]); }
    const row = [x.n, Number(x.a)||0, x.s||'', wIdx[wk], x.g||''];
    const extra = {};
    ['ph','nac','src','added'].forEach(k => { if(x[k]) extra[k] = x[k]; });
    if(x.id && x.id !== pidFor(x.n, x.w)) extra.id = x.id;
    if(Object.keys(extra).length) row.push(extra);
    return row;
  });
  return { v, stakes, wards, p };
}
function setRoster(r){
  ROSTER = r; PBY = new Map();
  const ws = {};
  r.people.forEach(p => { p._t = norm(p.n).split(' '); PBY.set(p.id, p); if(p.k){ (ws[p.k] = ws[p.k] || new Set()).add(p.w||''); } });
  STAKES = Object.keys(ws).sort((a,b)=>a.localeCompare(b,'es'));
  WARDS_BY = {}; STAKES.forEach(s => WARDS_BY[s] = [...ws[s]].filter(Boolean).sort((a,b)=>a.localeCompare(b,'es')));
}
function loadRoster(){
  const emb = window.ROSTER_EMBED && window.ROSTER_EMBED.p ? window.ROSTER_EMBED : {v:'',stakes:[],wards:[],p:[]};
  let best = { v: emb.v||'', src:'embebida', compact: emb };
  const loc = LS.get('ca_roster', null);
  if(loc && loc.compact && String(loc.v) > String(best.v)) best = { v: loc.v, src: loc.src || 'este dispositivo', compact: loc.compact };
  setRoster({ v: best.v, src: best.src, people: expandCompact(best.compact) });
}

/* Búsqueda: cada palabra escrita debe ser el inicio de alguna palabra del nombre (en cualquier orden). */
function searchPeople(q, filter, limit=40){
  const toks = norm(q).split(' ').filter(Boolean);
  if(!toks.length) return { list:[], total:0, outside:0 };
  const hits = []; let outside = 0;
  for(const p of ROSTER.people){
    let ok = true, score = 0;
    for(const t of toks){
      let f = false;
      for(const w of p._t){ if(w.startsWith(t)){ f = true; if(w === t) score += 2; else score += 1; break; } }
      if(!f){ ok = false; break; }
    }
    if(!ok) continue;
    if(filter && !filter(p)){ outside++; continue; }
    hits.push([score, p]);
  }
  hits.sort((a,b) => b[0]-a[0] || a[1].n.localeCompare(b[1].n,'es'));
  return { list: hits.slice(0, limit).map(h=>h[1]), total: hits.length, outside };
}
function highlight(name, q){
  const toks = norm(q).split(' ').filter(Boolean);
  return prettyName(name).split(' ').map(word => {
    const nw = norm(word);
    const t = toks.filter(t => nw.startsWith(t)).sort((a,b)=>b.length-a.length)[0];
    return t ? `<mark>${esc(word.slice(0,t.length))}</mark>${esc(word.slice(t.length))}` : esc(word);
  }).join(' ');
}
function personSub(p){ return [p.w || p.k, p.a ? p.a+' años' : '', progLabel(p.g)].filter(Boolean).join(' · '); }

/* ============================================================
   SINCRONIZACIÓN (Firebase Realtime Database vía REST)
   ============================================================ */
const Sync = {
  base(){ return String(LS.get('ca_db','') || (window.CA_CONFIG && window.CA_CONFIG.db) || '').trim().replace(/\/+$/,''); },
  on(){ return /^https:\/\/[^\s]+$/.test(this.base()); },
  async req(path, method='GET', body){
    const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 12000);
    try{
      const r = await fetch(this.base()+'/'+path+'.json', { method, signal: ctrl.signal, headers: body!==undefined ? {'Content-Type':'application/json'} : undefined, body: body!==undefined ? JSON.stringify(body) : undefined });
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    } finally { clearTimeout(tm); }
  }
};
let SYNC_STATE = { s:'idle', at:0 };
function setSync(s){ SYNC_STATE = { s, at: s==='ok' ? Date.now() : SYNC_STATE.at }; paintSync(); }

/* ============================================================
   EVENTOS
   ============================================================ */
let EVENTS = LS.get('ca_events', {});
let CLASSES = LS.get('ca_classes', {});
const BUSY = new Set();
const saveEvents = () => LS.set('ca_events', EVENTS);
const saveClasses = () => LS.set('ca_classes', CLASSES);

function newEventObj(code, meta){ return { code, meta, rows:{}, pending:{}, sigs:{}, sigPending:{}, metaPending:true, lastSync:0 }; }
function eventRows(ev){
  const rows = Object.values(ev.rows||{}).filter(r => r && !r.del).sort((a,b)=>a.t-b.t);
  const seen = new Set();
  return rows.filter(r => { if(!r.pid) return true; if(seen.has(r.pid)) return false; seen.add(r.pid); return true; });
}
function eventPendingCount(ev){ return Object.keys(ev.pending||{}).length + Object.keys(ev.sigPending||{}).length + (ev.metaPending?1:0); }

async function syncEvent(code, {silent=false}={}){
  const ev = EVENTS[code]; if(!ev) return;
  if(!Sync.on()){ if(!silent) toast('Guardado en este dispositivo. (La sincronización entre dispositivos no está configurada.)', 'warn', {ms:4200}); paintSync(); return; }
  if(BUSY.has(code)) return; BUSY.add(code);
  setSync('syncing');
  try{
    if(ev.metaPending){ await Sync.req(`events/${code}/meta`, 'PUT', ev.meta); ev.metaPending = false; }
    const sent = Object.entries(ev.pending||{});
    if(sent.length){
      const patch = {}; sent.forEach(([id]) => { patch[id] = ev.rows[id]; });
      await Sync.req(`events/${code}/rows`, 'PATCH', patch);
      sent.forEach(([id, st]) => { if(ev.pending[id] === st) delete ev.pending[id]; });
    }
    const sigs = Object.keys(ev.sigPending||{});
    if(sigs.length){
      const patch = {}; sigs.forEach(id => { if(ev.sigs[id]) patch[id] = ev.sigs[id]; });
      if(Object.keys(patch).length) await Sync.req(`eventsigs/${code}`, 'PATCH', patch);
      sigs.forEach(id => delete ev.sigPending[id]);
    }
    const remote = await Sync.req(`events/${code}`);
    if(remote){
      if(remote.meta && !ev.metaPending) ev.meta = remote.meta;
      Object.entries(remote.rows||{}).forEach(([id, r]) => { if(!ev.pending[id]) ev.rows[id] = r; });
    }
    ev.lastSync = Date.now();
    saveEvents(); setSync('ok');
    if(!silent) toast('Asistencia guardada y sincronizada ✓', 'ok');
  }catch(e){
    saveEvents(); setSync('error');
    if(!silent) toast('Sin conexión: quedó guardado en este dispositivo y se enviará al reconectar.', 'warn', {ms:4200});
  }finally{ BUSY.delete(code); }
  if(CUR.type === 'event' && CUR.code === code) liveEvent();
}
async function ensureEventSigs(ev){
  const need = Object.values(ev.rows||{}).filter(r => r && !r.del && r.sig && !ev.sigs[r.id]).map(r=>r.id);
  if(!need.length || !Sync.on()) return;
  try{
    if(need.length > 6){ const all = await Sync.req(`eventsigs/${ev.code}`); if(all) Object.assign(ev.sigs, all); }
    else { for(const id of need){ const s = await Sync.req(`eventsigs/${ev.code}/${id}`); if(s) ev.sigs[id] = s; } }
    saveEvents();
  }catch(e){}
}

function saveSettingsLocal(s){ s.v = new Date().toISOString(); LS.set('ca_settings', s); SETTINGS = s; HOL_CACHE = {}; }
/* Domingo de Pascua (algoritmo gregoriano anónimo) */
function easter(y){
  const a = y%19, b = Math.floor(y/100), c = y%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d-g+15)%30, i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7, m = Math.floor((a+11*h+22*l)/451);
  const mo = Math.floor((h+l-7*m+114)/31), da = ((h+l-7*m+114)%31)+1;
  return new Date(y, mo-1, da);
}
/* Feriados nacionales del Perú + los días que agregue el administrador */
const PE_FIXED = [['01-01','Año Nuevo'],['05-01','Día del Trabajo'],['06-07','Batalla de Arica y Día de la Bandera'],['06-29','San Pedro y San Pablo'],['07-23','Día de la Fuerza Aérea del Perú'],['07-28','Fiestas Patrias'],['07-29','Fiestas Patrias'],['08-06','Batalla de Junín'],['08-30','Santa Rosa de Lima'],['10-08','Combate de Angamos'],['11-01','Día de Todos los Santos'],['12-08','Inmaculada Concepción'],['12-09','Batalla de Ayacucho'],['12-25','Navidad']];
let HOL_CACHE = {};
function holidaysOf(y){
  if(HOL_CACHE[y]) return HOL_CACHE[y];
  const map = {};
  PE_FIXED.forEach(([md, n]) => map[`${y}-${md}`] = n);
  const ea = easter(y);
  const th = new Date(ea); th.setDate(ea.getDate()-3); map[iso(th)] = 'Jueves Santo';
  const fr = new Date(ea); fr.setDate(ea.getDate()-2); map[iso(fr)] = 'Viernes Santo';
  (SETTINGS.holidays||[]).forEach(h => { if(h.d && h.d.startsWith(String(y))) map[h.d] = h.n || 'Día no laborable'; });
  return HOL_CACHE[y] = map;
}
/* Devuelve el motivo si ese día no hay clase (domingo o feriado); vacío si es un día normal. */
function blockedReason(ds){
  const d = parseISO(ds);
  if(d.getDay() === 0) return 'Domingo';
  const h = holidaysOf(d.getFullYear())[ds];
  return h ? 'Feriado: ' + h : '';
}
function periodsOf(prog){ return ((SETTINGS.periods||{})[prog] || []).map((p, i) => Object.assign({ key: prog+i }, p)).filter(p => p.s && p.e); }
function currentPeriod(prog){
  const t = todayISO(), list = periodsOf(prog);
  return list.find(p => p.s <= t && t <= p.e) || list.find(p => p.s > t) || list[list.length-1] || null;
}
function periodLabel(p){ return `${p.n} · ${fmtDMY(p.s)} al ${fmtDMY(p.e)}`; }
/* Rango de la clase: si está ligada a un periodo, usa las fechas vigentes que configuró el administrador. */
function classRange(cls){
  const m = cls.meta;
  if(m.period){
    const p = periodsOf(m.program).find(x => x.key === m.period.key && x.s.slice(0,4) === String(m.period.s||'').slice(0,4));
    if(p) return { s: p.s, e: p.e, name: p.n };
    return { s: m.period.s || m.start, e: m.period.e || '', name: m.period.n };
  }
  return { s: m.start || todayISO(), e: m.end || '', name: '' };
}
function classDates(cls){
  const m = cls.meta; const set = new Set();
  const r = classRange(cls);
  const start = parseISO(r.s);
  const t = todayISO();
  const end = parseISO(r.e && r.e < t ? r.e : t);
  const days = (m.days || []).filter(d => d !== 0);
  if(days.length){ const d = new Date(start); let guard = 0; while(d <= end && guard < 800){ const ds = iso(d); if(days.includes(d.getDay()) && !blockedReason(ds)) set.add(ds); d.setDate(d.getDate()+1); guard++; } }
  (m.extraDates||[]).forEach(x => { if(x <= t) set.add(x); });
  Object.keys(cls.att||{}).forEach(x => { if(Object.keys(cls.att[x]||{}).length && !blockedReason(x)) set.add(x); });
  (m.skipDates||[]).forEach(x => { if(!(cls.att[x] && Object.keys(cls.att[x]).length)) set.delete(x); });
  return [...set].sort();
}
/* Fechas donde empieza una semana nueva (lunes a sábado) respecto a la fecha anterior de la lista: llevan una línea divisoria. */
function weekStarts(list){ const out = new Set(); let prev = ''; list.forEach(d => { const dt = parseISO(d); const mon = new Date(dt); mon.setDate(dt.getDate() - ((dt.getDay() + 6) % 7)); const k = iso(mon); if(prev && k !== prev) out.add(d); prev = k; }); return out; }
function classPendingCount(cls){ return Object.keys(cls.dirty||{}).length + Object.keys(cls.sigPending||{}).length; }
async function syncClass(code, {silent=false}={}){
  const cls = CLASSES[code]; if(!cls) return;
  if(!Sync.on()){ if(!silent) toast('Guardado en este dispositivo. (La sincronización entre dispositivos no está configurada.)', 'warn', {ms:4200}); paintSync(); return; }
  if(BUSY.has(code)) return; BUSY.add(code);
  setSync('syncing');
  try{
    if(cls.canEdit){
      const sent = Object.entries(cls.dirty||{});
      if(sent.length){
        const patch = {}; sent.forEach(([p]) => { patch[p] = getPath(cls, p); });
        await Sync.req(`classes/${code}`, 'PATCH', patch);
        sent.forEach(([p, st]) => { if(cls.dirty[p] === st) delete cls.dirty[p]; });
      }
      const sigs = Object.keys(cls.sigPending||{});
      if(sigs.length){
        const patch = {}; sigs.forEach(id => { if(cls.sigs[id]) patch[id] = cls.sigs[id]; });
        if(Object.keys(patch).length) await Sync.req(`classsigs/${code}`, 'PATCH', patch);
        sigs.forEach(id => delete cls.sigPending[id]);
      }
    }
    const remote = await Sync.req(`classes/${code}`);
    if(remote){
      const dirty = cls.dirty || {};
      if(remote.meta && !dirty.meta) cls.meta = remote.meta;
      Object.entries(remote.students||{}).forEach(([id, s]) => { if(!dirty['students/'+id]) cls.students[id] = s; });
      const ratt = remote.att || {};
      const dates = new Set([...Object.keys(ratt), ...Object.keys(cls.att||{})]);
      dates.forEach(d => {
        const loc = cls.att[d] || {}, rem = ratt[d] || {};
        const sids = new Set([...Object.keys(loc), ...Object.keys(rem)]);
        sids.forEach(sid => { if(dirty[`att/${d}/${sid}`]) return; if(rem[sid]) loc[sid] = rem[sid]; else delete loc[sid]; });
        if(Object.keys(loc).length) cls.att[d] = loc; else delete cls.att[d];
      });
    }
    cls.lastSync = Date.now();
    saveClasses(); setSync('ok');
    if(!silent) toast(cls.canEdit ? 'Asistencia guardada y sincronizada ✓' : 'Datos actualizados ✓', 'ok');
  }catch(e){
    saveClasses(); setSync('error');
    if(!silent) toast('Sin conexión: quedó guardado en este dispositivo y se enviará al reconectar.', 'warn', {ms:4200});
  }finally{ BUSY.delete(code); }
  if(CUR.type === 'class' && CUR.code === code) liveClass();
}
async function ensureClassSigs(cls){
  const need = Object.values(cls.students||{}).filter(s => s && !s.del && s.sig && !cls.sigs[s.id]).map(s=>s.id);
  if(!need.length || !Sync.on()) return;
  try{ const all = await Sync.req(`classsigs/${cls.code}`); if(all) Object.assign(cls.sigs, all); saveClasses(); }catch(e){}
}

let syncTimer = null;
function queueSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    if(CUR.type === 'event') syncEvent(CUR.code, {silent:true});
    else if(CUR.type === 'class') syncClass(CUR.code, {silent:true});
  }, 1200);
  paintSync();
}
async function syncAllPending(){
  if(!Sync.on()) return;
  for(const c of Object.keys(EVENTS)) if(eventPendingCount(EVENTS[c])) await syncEvent(c, {silent:true});
  for(const c of Object.keys(CLASSES)) if(CLASSES[c].canEdit && classPendingCount(CLASSES[c])) await syncClass(c, {silent:true});
}
async function uniqueCode(prefix, coll){
  let code = genCode(prefix);
  if(!Sync.on()) return code;
  for(let i=0;i<4;i++){
    try{ const ex = await Sync.req(`${coll}/${code}/meta`); if(!ex) return code; code = genCode(prefix); }catch(e){ return code; }
  }
  return code;
}

function go(h){ if(location.hash === h) route(); else location.hash = h; }
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const parts = h.split('/').filter(Boolean);
  window.scrollTo(0,0);
  layer.innerHTML = '';
  if(parts[0] === 'evento' && parts[1] === 'nuevo') return renderEventForm(null);
  if(parts[0] === 'evento' && parts[1] && parts[2] === 'editar') return renderEventForm(parts[1]);
  if(parts[0] === 'evento' && parts[1]) return renderEvent(parts[1]);
  if(parts[0] === 'clases') return renderClasses();
  if(parts[0] === 'clase' && parts[1] === 'nueva') return renderClassForm(null);
  if(parts[0] === 'clase' && parts[1] && parts[2] === 'editar') return renderClassForm(parts[1]);
  if(parts[0] === 'clase' && parts[1]) return renderClass(parts[1]);
  if(parts[0] === 'admin') return isAdmin() ? renderAdmin() : (go('#/'), askAdmin());
  renderHome();
}

function topbar({back, title, sub}={}){
  return `<header class="top"><div class="top-in">
    ${back ? `<button class="icon-btn" data-go="${back}" aria-label="Volver">${ICON.back}</button><div class="top-title"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`
           : `<div class="brand" id="brand"><span class="mark">CA</span><span class="bt"><b>Check-in Asistencia</b><small>Seminarios e Institutos</small></span></div><span class="spacer"></span>`}
    <button class="sync-pill" id="syncPill" title="Estado de sincronización"><span class="dot"></span><span class="lbl"></span></button>
  </div></header>`;
}
function bindTop(){
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  const pill = $('#syncPill');
  if(pill) pill.onclick = () => {
    if(CUR.type === 'event') syncEvent(CUR.code);
    else if(CUR.type === 'class') syncClass(CUR.code);
    else if(!Sync.on()) toast('Todo se guarda en este celular. Para juntar la asistencia, envía el Excel y se importa en otro dispositivo.', '', {ms:4200});
    else { syncAllPending().then(()=>toast('Todo sincronizado','ok')); }
  };
  paintSync();
}
function paintSync(){
  const pill = $('#syncPill'); if(!pill) return;
  let cls = 'local', lbl = 'Guardado en el celular';
  let pending = 0;
  if(CUR.type === 'event' && EVENTS[CUR.code]) pending = eventPendingCount(EVENTS[CUR.code]);
  else if(CUR.type === 'class' && CLASSES[CUR.code]) pending = CLASSES[CUR.code].canEdit ? classPendingCount(CLASSES[CUR.code]) : 0;
  if(Sync.on()){
    if(SYNC_STATE.s === 'syncing'){ cls = 'syncing'; lbl = 'Sincronizando…'; }
    else if(SYNC_STATE.s === 'error'){ cls = 'error'; lbl = pending ? `Sin conexión · ${pending} sin enviar` : 'Sin conexión'; }
    else if(pending){ cls = 'pending'; lbl = `${pending} sin enviar`; }
    else if(SYNC_STATE.at){ cls = 'ok'; lbl = 'Sincronizado '+fmtTime(SYNC_STATE.at); }
    else { cls = 'ok'; lbl = 'En línea'; }
  }
  pill.className = 'sync-pill '+cls;
  $('.lbl', pill).textContent = lbl;
  const sb = $('#sbStatus'), btn = $('#saveBtn');
  if(sb){
    if(!Sync.on()) sb.innerHTML = `<b>Guardado en este celular</b>Al terminar, envía la asistencia`;
    else if(pending) sb.innerHTML = `<b>${pending} cambio${pending>1?'s':''} sin enviar</b>Toca “Guardar asistencia”`;
    else if(SYNC_STATE.s === 'syncing') sb.innerHTML = `<b>Sincronizando…</b>`;
    else sb.innerHTML = `<b>Todo sincronizado</b>${SYNC_STATE.at ? 'Última vez '+fmtTime(SYNC_STATE.at) : ''}`;
  }
  if(btn) btn.classList.toggle('has-pending', pending > 0);
}

/* El enlace de invitación lleva los datos del evento (título, estaca, barrio, fecha, preguntas)
   para que el colaborador los tenga aunque no exista una base de datos en línea. */
function packMeta(m){
  const o = { t:m.title, k:m.stake, w:m.ward, d:m.date, f:m.fields, c:m.custom, p:m.wa || '' };
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unpackMeta(s){
  try{
    s = String(s).replace(/-/g,'+').replace(/_/g,'/');
    const o = JSON.parse(decodeURIComponent(escape(atob(s))));
    return { title:o.t || '', stake:o.k || '', ward:o.w || '', date:o.d || todayISO(), fields:Array.isArray(o.f) ? o.f : ['k','w','a'], custom:Array.isArray(o.c) ? o.c : [], wa:o.p || '' };
  }catch(e){ return null; }
}
function eventLink(ev){ return appLink('e', ev.code) + (ev.meta.placeholder ? '' : '&m=' + packMeta(ev.meta)); }
function inviteText(ev){ return `Hola 👋 Ayúdame a registrar la asistencia de *${ev.meta.title}*.\nAbre este enlace: ${eventLink(ev)}\n(o ingresa el código *${ev.code}*)`; }
async function openEvent(code, linkMeta){
  const ex = EVENTS[code];
  if(ex){
    if(linkMeta && ex.meta.placeholder){ ex.meta = Object.assign({}, linkMeta, { joinedAt: ex.meta.joinedAt }); saveEvents(); }
    go('#/evento/'+code); return;
  }
  if(Sync.on()){
    toast('Buscando evento…');
    try{
      const r = await Sync.req(`events/${code}`);
      if(r && r.meta){
        const ev = newEventObj(code, r.meta); ev.metaPending = false; ev.rows = r.rows || {}; ev.lastSync = Date.now(); ev.contrib = true;
        EVENTS[code] = ev; saveEvents();
        go('#/evento/'+code);
        if(!myName()) setTimeout(askName, 400);
        return;
      }
    }catch(e){}
  }
  if(!linkMeta && !(await confirmBox(`No hay datos del evento <b>${code}</b> en este celular. Puedes unirte igual: marca a los asistentes y al final envía tu Excel al organizador, que lo unirá con los demás por el código.<br><br>Revisa que el código esté bien escrito.`, { title:'Unirme como colaborador', ok:'Unirme' }))) return;
  const meta = linkMeta ? Object.assign({}, linkMeta) : { title:'Evento '+code, stake:'', ward:'', date:todayISO(), fields:['k','w','a'], custom:[], placeholder:true };
  meta.joinedAt = Date.now();
  const ev = newEventObj(code, meta); ev.metaPending = false; ev.contrib = true;
  EVENTS[code] = ev; saveEvents();
  ST.tab = 'marcar';
  go('#/evento/'+code);
  if(!myName()) setTimeout(askName, 400);
}
async function openClass(code){
  if(CLASSES[code]){ go('#/clase/'+code); return; }
  if(!Sync.on()){
    if(await confirmBox(`La clase <b>${code}</b> no está en este celular. Pide al maestro el reporte (o Excel) de su clase y ábrelo aquí: trae un respaldo que la carga completa.`, { title:'Importar clase', ok:'Elegir archivo', cancel:'Cerrar' })) importBackupPicker();
    return;
  }
  toast('Buscando clase…');
  try{
    const r = await Sync.req(`classes/${code}`);
    if(!r || !r.meta){ toast('No se encontró ninguna clase con ese código.', 'error'); return; }
    const c = newClassObj(code, r.meta); c.dirty = {}; c.canEdit = false; c.students = r.students || {}; c.att = r.att || {}; c.lastSync = Date.now();
    CLASSES[code] = c; saveClasses();
    go('#/clase/'+code);
  }catch(e){ toast('No hay conexión para buscar el código.', 'error'); }
}

}
function bindSW(root, px, ward){
  const ss = $('#'+px+'Stake',root), so = $('#'+px+'StakeO',root), ws = $('#'+px+'Ward',root), wo = $('#'+px+'WardO',root);
  const fill = sel => {
    const st = ss.value === '__o' ? '' : ss.value;
    const list = st ? wardsOf(st) : [];
    const isO = !!sel && !list.includes(sel);
    ws.innerHTML = `<option value="">${esc(ws.dataset.all)}</option>` + list.map(w=>`<option ${w===sel?'selected':''}>${esc(w)}</option>`).join('') + `<option value="__o" ${isO?'selected':''}>Otro…</option>`;
    wo.classList.toggle('hide', !isO); wo.value = isO ? sel : '';
  };
  ss.onchange = () => { so.classList.toggle('hide', ss.value !== '__o'); if(ss.value === '__o') so.focus(); fill(''); };
  ws.onchange = () => { wo.classList.toggle('hide', ws.value !== '__o'); if(ws.value === '__o') wo.focus(); };
  fill(ward || '');
}
function readSW(root, px){
  const ss = $('#'+px+'Stake',root).value, ws = $('#'+px+'Ward',root).value;
  return { stake: ss === '__o' ? $('#'+px+'StakeO',root).value.trim() : ss, ward: ws === '__o' ? $('#'+px+'WardO',root).value.trim() : ws };
}

function scopeOptions(stake, ward){

function scopeFilter(scope, stake, ward){

function renderResults(){
  const el = $('#results'); if(!el) return;
  const ev = EVENTS[CUR.code]; const m = ev.meta;
  const q = ST.q.trim();
  const hint = $('#scopeHint');
  const marked = new Map(); eventRows(ev).forEach(r => { if(r.pid) marked.set(r.pid, r); });
  if(norm(q).length < 2){
    if(hint) hint.textContent = '';
    const last = eventRows(ev).slice(-3).reverse();
    el.innerHTML = `<div class="empty-hint">${ICON.search}<p>Escribe al menos 2 letras del nombre o apellido</p><small>Puedes escribir en cualquier orden, sin tildes: “piero abarca”.</small></div>`
      + (last.length ? `<div class="hint" style="margin:6px 2px 0">Últimos registrados:</div>` + last.map(r => `<div class="person is-marked" style="cursor:default"><span class="av">${esc(initials(r.n))}</span><span class="pi"><b>${esc(prettyName(r.n))}</b><small>${esc(r.data && (r.data.w||r.data.k) || '')}${r.by?' · por '+esc(r.by):''}</small></span><span class="mk done">${ICON.check} ${fmtTime(r.t)}</span></div>`).join('') : '');
    return;
  }
  const f = scopeFilter(ST.scope, m.stake, m.ward);

  if(hint) hint.textContent = res.total ? `${res.total} coincidencia${res.total>1?'s':''}` : '';
  let html = res.list.map(p => {
    const r = marked.get(p.id);
    return `<button class="person ${r?'is-marked':''}" data-pid="${p.id}"><span class="av">${esc(initials(p.n))}</span><span class="pi"><b>${highlight(p.n, q)}</b><small>${esc(personSub(p))}</small></span>${r ? `<span class="mk done">${ICON.check} ${fmtTime(r.t)}</span>` : `<span class="mk">Marcar</span>`}</button>`;
  }).join('');
  if(!res.list.length) html = `<div class="empty-hint">${ICON.search}<p>No se encontró “${esc(q)}”${f ? ' en '+(ST.scope==='w'?'el barrio':'la estaca') : ''}</p><small>Revisa la ortografía o regístralo manualmente abajo.</small></div>`;

  if(res.total > res.list.length) html += `<div class="hint" style="text-align:center">Mostrando ${res.list.length} de ${res.total}. Escribe más para afinar.</div>`;
  el.innerHTML = html;
  $$('.person[data-pid]', el).forEach(b => b.onclick = () => onPickEvent(ev, PBY.get(b.dataset.pid), marked.get(b.dataset.pid)));
  const more = $('#moreScope'); if(more) more.onclick = () => { const o = scopeOptions(m.stake, m.ward); const i = o.findIndex(x => x[0] === ST.scope); ST.scope = o[Math.min(i+1, o.length-1)][0]; $$('#scope button').forEach(x => x.classList.toggle('on', x.dataset.s === ST.scope)); renderResults(); };
}

function SigPad(wrap){
  const canvas = $('canvas', wrap); const ctx = canvas.getContext('2d');
  let drawing = false, has = false, last = null, ratio = 1;
  function setup(){
    const r = canvas.getBoundingClientRect(); ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = Math.round(r.width * ratio); canvas.height = Math.round(r.height * ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#10243A'; ctx.lineWidth = 2.4;
  }
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); drawing = true; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} last = pos(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI*2); ctx.fillStyle = '#10243A'; ctx.fill(); has = true; wrap.classList.add('has'); });
  canvas.addEventListener('pointermove', e => { if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); const mx = (last.x+p.x)/2, my = (last.y+p.y)/2; ctx.quadraticCurveTo(last.x, last.y, mx, my); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end); canvas.addEventListener('pointerleave', end);
  requestAnimationFrame(setup);
  return {
    clear(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); has = false; wrap.classList.remove('has'); },
    empty(){ return !has; },
    data(){
      if(!has) return '';
      const W = 480, H = Math.round(W * canvas.height / canvas.width);
      const out = document.createElement('canvas'); out.width = W; out.height = H;
      const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0,0,W,H); o.drawImage(canvas, 0, 0, W, H);
      return out.toDataURL('image/png');
    }
  };
}

function openStudentCal(cls, sid, onClose){

        const T = dates.length, pct = studentStats(cls, s.id, dates).pct;
        const rng = classRange(cls);

// El PIN en texto solo vive en este dispositivo: nunca sale en reportes, Excel ni respaldos.
function cleanForBackup(o){ const c = JSON.parse(JSON.stringify(o)); delete c._busy; delete c.pin; return c; }
let PIN_LAST = '';
function downloadBackup(obj, name){
  const blob = new Blob([JSON.stringify(obj)], {type:'application/json'});
  downloadBlob(blob, `${slug(name)} - ${todayISO()}.json`);
  toast('Backup descargado','ok');
}
/* Hoja de respaldo dentro del Excel: el JSON del evento/clase partido en celdas de 30.000 caracteres. */
const BK_MARK = 'CA-BACKUP';
function addBackupSheet(wb, obj){
  const ws = wb.addWorksheet('Respaldo (no editar)');
  const json = JSON.stringify(obj); const N = 30000; const chunks = [];
  for(let i=0;i<json.length;i+=N) chunks.push(json.slice(i, i+N));
  ws.getCell('A1').value = BK_MARK;
  ws.getCell('B1').value = 'Respaldo para importar en Check-in Asistencia (botón “Importar reporte, Excel o backup”). No modifiques ni borres esta hoja.';
  ws.getCell('B1').font = { bold:true, color:{argb:'FFC0392B'} };
  ws.getCell('A2').value = 1; ws.getCell('B2').value = chunks.length;
  chunks.forEach((c, i) => { ws.getCell(3+i, 1).value = c; });
  ws.getColumn(1).width = 14; ws.getColumn(2).width = 100;
}
function cellText(c){
  const v = c && c.value;
  if(v == null) return '';
  if(typeof v === 'object'){ if(v.richText) return v.richText.map(r => r.text).join(''); if(v.text != null) return String(v.text); if(v.result != null) return String(v.result); }
  return String(v);
}
async function readBackupXlsx(file){
  const X = await excelLib();
  const wb = new X.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());
  let ws = null;
  wb.eachSheet(s => { if(!ws && cellText(s.getCell('A1')).trim() === BK_MARK) ws = s; });
  if(!ws) throw new Error(`“${file.name}” no tiene la hoja de respaldo. Usa el Excel generado por Check-in Asistencia.`);
  const n = Number(cellText(ws.getCell('B2'))) || 0;
  let json = ''; for(let i=0;i<n;i++) json += cellText(ws.getCell(3+i, 1));
  try{ return JSON.parse(json); }catch(e){ throw new Error(`El respaldo de “${file.name}” está dañado (¿se editó la hoja de respaldo?).`); }
}
function importBackupPicker(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
  inp.accept = '.html,.htm,.xlsx,.json,text/html,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.onchange = async () => {
    const files = [...inp.files]; if(!files.length) return;
    toast(files.length > 1 ? `Importando ${files.length} archivos…` : 'Importando…');
    const touchedEv = new Set(), touchedCl = new Set(), errors = [];
    let added = 0;
    for(const f of files){
      try{
        const obj = /\.html?$/i.test(f.name) ? readBackupHtml(await f.text(), f.name) : /\.xlsx$/i.test(f.name) ? await readBackupXlsx(f) : JSON.parse(await f.text());
        if(!obj || obj.kind !== 'ca-backup') throw new Error(`“${f.name}” no es un respaldo de Check-in Asistencia.`);
        const evs = obj.type === 'event' ? [obj.data] : obj.type === 'all' ? Object.values(obj.events||{}) : [];
        const cls = obj.type === 'class' ? [obj.data] : obj.type === 'all' ? Object.values(obj.classes||{}) : [];
        evs.forEach(ev => { added += mergeEventBackup(ev); touchedEv.add(ev.code); });
        for(const c of cls){
          // Clase de otro maestro (o de otro dispositivo): para poder editarla hay que poner el PIN con que se creó.
          const ex = CLASSES[c.code];
          let mode = 'edit';
          if(!(ex && ex.canEdit) && c.meta && c.meta.pinHash){
            mode = await askClassPin(c);
            if(!mode){ toast(`No se importó “${c.meta.title}”.`, 'warn'); continue; }
          }
          mergeClassBackup(c, obj.exportedAt, mode === 'edit');
          if(mode === 'edit' && PIN_LAST) CLASSES[c.code].pin = PIN_LAST;
          touchedCl.add(c.code);
        }
      }catch(e){ errors.push(e.message || f.name); }
    }
    saveEvents(); saveClasses();
    errors.forEach(m => toast(m, 'error', {ms:5000}));
    const n = touchedEv.size + touchedCl.size;
    if(!n){ return; }
    const parts = [...touchedEv].map(c => `${EVENTS[c].meta.title}: ${eventRows(EVENTS[c]).length} asistentes`).concat([...touchedCl].map(c => `${CLASSES[c].meta.title}: ${classStudents(CLASSES[c]).length} alumnos${CLASSES[c].canEdit ? '' : ' (solo lectura)'}`));
    toast(`Importado ✓ ${parts.join(' · ')}${added ? ` (+${added} registros nuevos)` : ''}`, 'ok', {ms:5000});
    if(n === 1) go(touchedEv.size ? '#/evento/'+[...touchedEv][0] : '#/clase/'+[...touchedCl][0]); else route();
    syncAllPending();
  };
  inp.click();
}
/* Pide el PIN de una clase que viene en un archivo. Devuelve 'edit' (PIN correcto), 'view' (solo ver) o null (canceló). */
function askClassPin(b){
  return new Promise(res => {
    let done = false;
    const m = b.meta || {};
    sheet(`${sheetHead(ICON.lock.replace('<svg','<svg style="vertical-align:-3px;margin-right:6px"') + 'Continuar esta clase', esc(m.title) + ' · ' + esc(b.code))}
      <div class="info-box">Clase de <b>${esc(m.teacher || 'otro maestro')}</b> · ${progLabel(m.program)} · ${Object.values(b.students||{}).filter(s => s && !s.del).length} alumnos.<br>Para usarla en este dispositivo y <b>seguir marcando la asistencia</b>, escribe el <b>PIN</b> que se puso al crear la clase.</div>
      <div class="field"><label>PIN del maestro</label><input id="pin" class="pin-in" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>
      <p class="hint" style="margin-top:-6px">¿No tienes el PIN? Toca <b>Solo ver</b>: la clase se agrega sin poder editarla y luego puedes desbloquearla con el PIN.</p>
      <div class="sh-foot"><button class="btn" id="ro">Solo ver</button><button class="btn primary" id="ok">${ICON.check} Desbloquear y agregar</button></div>`, {
      onMount(el, close){
        const i = $('#pin', el); setTimeout(() => i.focus(), 250);
        const tryIt = () => {
          if(sha256(b.code + ':' + i.value.trim()) === m.pinHash){ done = true; PIN_LAST = i.value.trim(); res('edit'); close(); }
          else { i.closest('.field').classList.add('err'); i.select(); toast('PIN incorrecto', 'error'); }
        };
        $('#ok', el).onclick = tryIt; i.onkeydown = e => { if(e.key === 'Enter') tryIt(); };
        $('#ro', el).onclick = () => { done = true; res('view'); close(); };
      },
      onClose(){ if(!done) res(null); }
    });
  });
}
/* Une un respaldo de evento con lo que ya hay. El código es el nexo: los aportes de cada
   colaborador se suman al mismo evento; los datos del organizador reemplazan a los provisionales. */
function mergeEventBackup(b){
  const ex = EVENTS[b.code];
  const ev = ex || newEventObj(b.code, b.meta);
  if(!ex) ev.meta = b.meta;
  else if(ev.meta.placeholder && b.meta && !b.meta.placeholder) ev.meta = b.meta;
  if(!ex) ev.contrib = false;
  let added = 0;
  Object.entries(b.rows||{}).forEach(([id, r]) => {
    const cur = ev.rows[id];
    if(!cur){ ev.rows[id] = r; added++; }
    else if((r.delAt||0) > (cur.delAt||0)) ev.rows[id] = r;
    if(Sync.on()) ev.pending[id] = Date.now();
  });
  Object.entries(b.sigs||{}).forEach(([id, s]) => { if(!ev.sigs[id]) ev.sigs[id] = s; if(Sync.on()) ev.sigPending[id] = 1; });
  ev.metaPending = Sync.on();
  EVENTS[b.code] = ev;
  return added;
}
/* Clases: el respaldo más reciente manda; uno más antiguo solo completa lo que falte. */
function mergeClassBackup(b, exportedAt, canEdit = true){
  const ex = CLASSES[b.code];
  const c = ex || newClassObj(b.code, b.meta);
  const at = String(exportedAt || '');
  const newer = !c.bkAt || at >= String(c.bkAt);
  if(!ex || newer) c.meta = b.meta;
  c.canEdit = !!((ex && ex.canEdit) || canEdit);
  Object.entries(b.students||{}).forEach(([id, s]) => { if(!c.students[id] || newer) c.students[id] = s; markDirty(c, 'students/'+id); });
  Object.entries(b.att||{}).forEach(([d, row]) => Object.entries(row||{}).forEach(([sid, v]) => { if(!c.att[d]) c.att[d] = {}; if(!c.att[d][sid] || newer) c.att[d][sid] = v; markDirty(c, `att/${d}/${sid}`); }));
  Object.entries(b.sigs||{}).forEach(([id, s]) => { if(!c.sigs[id]) c.sigs[id] = s; c.sigPending[id] = 1; });
  markDirty(c, 'meta');
  if(newer && at) c.bkAt = at;
  if(!Sync.on() || !c.canEdit){ c.dirty = {}; c.sigPending = {}; }
  CLASSES[b.code] = c;
}

const THIN = { style:'thin', color:{argb:'FFD5DEE2'} };
const BORDER = { top:THIN, left:THIN, bottom:THIN, right:THIN };
async function excelLib(){ if(!window.ExcelJS) await loadScript(EXCELJS_URL); return window.ExcelJS; }
function xlHeader(row){ row.eachCell(c => { c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF132C3E'}}; c.font = {bold:true,color:{argb:'FFFFFFFF'},size:11}; c.alignment = {vertical:'middle',horizontal:'center',wrapText:true}; c.border = BORDER; }); row.height = 30; }
function xlInfo(ws, title, lines, ncols){
  if(ncols > 1) ws.mergeCells(1,1,1,ncols);
  const t = ws.getCell(1,1); t.value = title; t.font = {bold:true,size:15,color:{argb:'FF132C3E'}}; ws.getRow(1).height = 24;
  lines.forEach((l,i) => { if(ncols > 1) ws.mergeCells(i+2,1,i+2,ncols); const c = ws.getCell(i+2,1); c.value = l; c.font = {size:10.5,color:{argb:'FF5C7080'}}; });
  return lines.length + 3;
}
function xlBody(row, i){ row.eachCell({includeEmpty:true}, c => { c.border = BORDER; c.alignment = Object.assign({vertical:'middle', wrapText:true}, c.alignment||{}); if(i % 2) c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFF6F9FA'}}; }); }
async function xlBlob(wb){ const buf = await wb.xlsx.writeBuffer(); return new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }
function addSig(wb, ws, dataUrl, col, row){
  try{ const id = wb.addImage({ base64: dataUrl, extension:'png' }); ws.addImage(id, { tl:{ col: col-1+0.1, row: row-1+0.12 }, ext:{ width:140, height:46 } }); }catch(e){}
}

  body += `<section data-s="alu" hidden><p class="tap" style="margin:0 0 8px">Toca un alumno para ver sus datos completos.</p><div class="wrap"><table><thead><tr><th>N°</th><th>Apellidos y nombres</th><th>Origen</th><th>Agregado</th><th>Edad</th><th>Barrio</th>${sem ? '<th>F. nac.</th><th>Padre o madre</th><th>Teléfono</th><th>Firma</th>' : '<th>Teléfono</th><th>Correo</th><th>F. nac.</th>'}<th>%</th></tr></thead><tbody>`
    + studs.map((s, i) => { const f = s.form || {}, d = s.data || {}, st = studentStats(cls, s.id, dates);
      const extra = sem ? [fmtDMY(f.nac || d.nac), f.padre, f.telPadre].map(x => `<td>${esc(x || '')}</td>`).join('') + `<td>${cls.sigs[s.id] ? `<img class="sig" src="${cls.sigs[s.id]}" alt="Firma">` : ''}</td>`
                        : [f.tel || d.ph, f.email, fmtDMY(f.nac || d.nac)].map(x => `<td>${esc(x || '')}</td>`).join('');
      return `<tr class="clk" data-det="s${i}"><td>${i+1}</td><td><b>${esc(s.n)}</b></td><td>${s.src === 'nuevo' ? '<span class="bd">Nuevo</span>' : 'Base'}</td><td>${esc(fmtStamp(s.addedAt))}</td><td>${esc(d.a !== '' && d.a != null ? d.a : '')}</td><td>${esc(d.w || d.k || '')}</td>${extra}<td class="pct">${st.pct === '' ? '—' : st.pct+'%'}</td></tr>`; }).join('')
    + `</tbody></table></div></section>`;
  body += studs.map(detail).join('');
  return reportShell(m.title, sub, body, { kind:'ca-backup', type:'class', ver:1, exportedAt:new Date().toISOString(), from: myName(), data: cleanForBackup(cls) });
}

    <div class="sh-foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">${ICON.save} Guardar</button></div>`, {
    onMount(el, close){
      bindSW(el, 'e', v.w);
      const nac = $('[name=nac]', el), age = $('[name=a]', el);

        else { const idx = people.findIndex(x => x.id === p.id); people[idx] = Object.assign({}, p, np, { id: p.id }); }

function collectNewcomers(){
  const done = LS.get('ca_admin_done', {});
  const out = [];

  Object.values(CLASSES).forEach(c => classStudents(c).filter(s => s.src === 'nuevo').forEach(s => out.push({ _key:'c:'+s.id, n:s.n, nac:(s.form||{}).nac, a:(s.data||{}).a, k:c.meta.stake, w:c.meta.ward, g:c.meta.program, ph:(s.form||{}).tel || (s.form||{}).telPadre || '', from:'Clase: '+c.meta.title })));
  const names = new Set(ROSTER.people.map(p => norm(p.n)));
  return out.filter(x => !done[x._key] && !names.has(norm(x.n)));
}

    if(!(await confirmBox(`Se agregarán ${list.length} personas a la base de este dispositivo.`, {title:'Agregar todos', ok:'Agregar'}))) return;
    const people = ROSTER.people.slice(); const done = LS.get('ca_admin_done', {});
    list.forEach(x => { if(!x.k) return; const np = { n:x.n, a:x.a || ageFrom(x.nac) || '', s:'', k:x.k, w:x.w || '', g:x.g || ((x.a||ageFrom(x.nac)) !== '' ? ((x.a||ageFrom(x.nac)) <= 18 ? 'S' : 'I') : ''), ph:x.ph, nac:x.nac, src:'manual', added:todayISO() }; np.id = pidFor(np.n, np.w); people.push(np); done[x._key] = 1; });
    people.sort((a,b) => a.n.localeCompare(b.n,'es'));
    saveRosterLocal(people, ROSTER.src); LS.set('ca_admin_done', done);
    toast('Personas agregadas ✓','ok'); renderAdmin();
  };
}
function excelSerialToISO(v){
  if(v == null || v === '') return '';
  if(v instanceof Date && !isNaN(v)) return iso(v);
  if(typeof v === 'number' || /^\d+(\.\d+)?$/.test(String(v).trim())){ const n = Number(v); if(n < 1000) return ''; const d = new Date(Math.round((n - 25569) * 86400000)); return iso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
async function handleImport(file){
  const prev = $('#impPrev');
  prev.innerHTML = '<p class="hint">Leyendo archivo…</p>';
  try{
    await loadScript(SHEETJS_URL);
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:true });
    let hi = -1, H = [];
    for(let i=0;i<Math.min(12, raw.length);i++){ const h = (raw[i]||[]).map(x => norm(x)); if(h.some(x => ['student name','nombres','nombre','nombre completo','nombres y apellidos','apellidos y nombres','alumno','nombres completos'].includes(x))){ hi = i; H = h; break; } }
    if(hi < 0) throw new Error('No se encontró una columna de nombres (Student Name / Nombres).');
    const col = (...tests) => H.findIndex(h => tests.some(t => typeof t === 'function' ? t(h) : h === t));
    const C = {
      full: col('student name','nombre completo','nombres y apellidos','apellidos y nombres','alumno'),
      nom: col('nombres','nombre','nombres completos'), ape: col('apellidos','apellido'),
      a: col('age','edad'), s: col('sex','sexo','genero'),
      k: col(h => h.startsWith('stake') || h.includes('estaca')), w: col(h => h.startsWith('ward') || h.includes('barrio') || h === 'rama' || h === 'unidad'),
      g: col('program name','programa'), ph: col('student phone','celular','telefono','phone','movil'), nac: col('birth date','fecha de nacimiento','nacimiento','fecha nacimiento')
    };
    const rows = [];
    for(let i=hi+1;i<raw.length;i++){
      const r = raw[i]; if(!r) continue;
      const get = k => C[k] >= 0 ? String(r[C[k]] ?? '').trim() : '';
      let n = '';
      if(C.full >= 0) n = get('full');
      else if(C.ape >= 0 && C.nom >= 0){ const a = get('ape'), b = get('nom'); n = a && b ? `${a}, ${b}` : (a || b); }
      else n = get('nom');
      n = n.replace(/\s+/g,' ').trim(); if(!n) continue;
      const nac = C.nac >= 0 ? excelSerialToISO(r[C.nac]) : '';
      let a = get('a'); a = /^\d+$/.test(a) ? Number(a) : (ageFrom(nac) || '');
      const gs = get('g').toUpperCase();
      let g = /\bSEM\b|SEMINARIO/.test(gs) ? 'S' : /\bIN\b|INSTITUTO/.test(gs) ? 'I' : (a !== '' ? (a <= 18 ? 'S' : 'I') : '');
      const s = get('s').toUpperCase();
      rows.push({ n, a, s: s.startsWith('M') || s.startsWith('H') ? 'M' : s.startsWith('F') ? 'F' : '', k: get('k'), w: get('w'), g, ph: get('ph'), nac });
    }
    if(!rows.length) throw new Error('El archivo no tiene filas con nombres.');
    const byId = new Map(ROSTER.people.map(p => [p.id, p]));
    const byName = new Map(); ROSTER.people.forEach(p => { const k = norm(p.n); byName.set(k, byName.has(k) ? null : p); });
    let nNew = 0, nUpd = 0;
    rows.forEach(r => { const ex = byId.get(pidFor(r.n, r.w)) || byName.get(norm(r.n)); if(ex) nUpd++; else nNew++; });
    IMPORT = { rows, name: file.name };
    const found = Object.entries({ 'Nombre': C.full >= 0 || C.nom >= 0, 'Edad': C.a >= 0, 'Sexo': C.s >= 0, 'Estaca': C.k >= 0, 'Barrio': C.w >= 0, 'Programa': C.g >= 0, 'Celular': C.ph >= 0, 'Nacimiento': C.nac >= 0 }).map(([k, ok]) => `<span class="badge ${ok?'b-ok':'b-ro'}">${ok?'✓':'—'} ${k}</span>`).join(' ');
    prev.innerHTML = `<div style="margin-top:14px"><div class="info-box"><b>${esc(file.name)}</b>: ${rows.length.toLocaleString('es-PE')} personas · <b>${nNew}</b> nuevas · <b>${nUpd}</b> ya existen</div>
      <div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">${found}</div>
      ${C.ph >= 0 ? '<div class="warn-box">El archivo trae celulares. Si publicas esta data, los teléfonos quedarán dentro del HTML público. Desmarca la opción si no quieres incluirlos.</div>' : ''}
      <div class="radio-list">
        <label><input type="radio" name="mode" value="merge" checked><span><b>Complementar</b><small>Agrega a las personas nuevas y actualiza los datos de las que ya existen. No borra a nadie.</small></span></label>
        <label><input type="radio" name="mode" value="replace"><span><b>Reemplazar toda la base</b><small>La base queda igual al archivo. Se conservan las personas agregadas a mano.</small></span></label>
      </div>
      ${C.ph >= 0 ? '<label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13.5px"><input type="checkbox" id="keepPh"> Incluir celulares</label>' : ''}
      <div class="btn-row"><button class="btn" id="impCancel">Cancelar</button><button class="btn primary" id="impApply">${ICON.check} Aplicar cambios</button></div></div>`;
    $('#impCancel').onclick = () => { IMPORT = null; prev.innerHTML = ''; };
    $('#impApply').onclick = () => applyImport($('input[name=mode]:checked').value, !!($('#keepPh') && $('#keepPh').checked));
  }catch(e){ prev.innerHTML = `<div class="warn-box" style="margin-top:12px">${esc(e.message || 'No se pudo leer el archivo')}</div>`; }
}
function applyImport(mode, keepPh){
  if(!IMPORT) return;
  const rows = IMPORT.rows.map(r => { const x = Object.assign({}, r); if(!keepPh) delete x.ph; Object.keys(x).forEach(k => { if(x[k] === '') delete x[k]; }); return x; });
  let people;
  if(mode === 'replace'){
    people = rows.map(r => Object.assign({ a:'', s:'', k:'', w:'', g:'' }, r));
    const keep = ROSTER.people.filter(p => p.src === 'manual');
    const names = new Set(people.map(p => norm(p.n)));
    keep.forEach(p => { if(!names.has(norm(p.n))) people.push(p); });
  } else {
    people = ROSTER.people.map(p => Object.assign({}, p));
    const byId = new Map(people.map(p => [p.id, p]));
    const byName = new Map(); people.forEach(p => { const k = norm(p.n); byName.set(k, byName.has(k) ? null : p); });
    rows.forEach(r => {
      const ex = byId.get(pidFor(r.n, r.w)) || byName.get(norm(r.n));
      if(ex){ const id = ex.id; Object.assign(ex, r); ex.id = id; if(ex.src === 'manual') delete ex.src; }
      else people.push(Object.assign({ a:'', s:'', k:'', w:'', g:'' }, r, { added: todayISO() }));
    });
  }
  people.forEach(p => { if(!p.id) p.id = pidFor(p.n, p.w); });
  people.sort((a,b) => a.n.localeCompare(b.n,'es'));
  saveRosterLocal(people, 'importada: '+IMPORT.name);
  IMPORT = null;
  toast(`Base actualizada: ${people.length.toLocaleString('es-PE')} personas ✓`, 'ok');
  renderAdmin();
}
async function publishRoster(){
  if(!Sync.on()){ toast('Configura primero la sincronización','error'); return; }
  if(!(await confirmBox(`Se enviará la base actual (${ROSTER.people.length.toLocaleString('es-PE')} personas) a todos los dispositivos.`, {title:'Publicar data', ok:'Publicar'}))) return;
  try{
    toast('Publicando…');
    const v = ROSTER.v || new Date().toISOString();
    await Sync.req('roster', 'PUT', { v, compact: compactPeople(ROSTER.people, v) });
    if(SETTINGS.v) await Sync.req('settings', 'PUT', SETTINGS);
    toast('Data publicada ✓ Los celulares la recibirán al abrir la página.', 'ok', {ms:4000});
  }catch(e){ toast('No se pudo publicar: '+(e.message||'error'), 'error'); }
}
async function checkCloudRoster(){
  if(!Sync.on()) return;
  try{
    try{ const st = await Sync.req('settings'); if(st && st.periods && String(st.v) > String(SETTINGS.v)){ LS.set('ca_settings', st); loadSettings(); } }catch(e){}
    const v = await Sync.req('roster/v');
    if(v && String(v) > String(ROSTER.v)){
      const r = await Sync.req('roster');
      if(r && r.compact){ LS.set('ca_roster', { v: r.v, src:'nube', compact: r.compact }); setRoster({ v: r.v, src:'nube', people: expandCompact(r.compact) }); toast(`Base de datos actualizada (${ROSTER.people.length.toLocaleString('es-PE')} personas)`, 'ok'); if(CUR.type === 'home') renderHome(); }
    }
  }catch(e){}
}

    const heads = ['Apellidos y nombres','Edad','Sexo','Estaca','Barrio','Programa','Celular','Fecha de nacimiento','Origen','Agregado'];

async function getSourceHtml(){
  const M = '/*' + 'ROSTER_START*/';
  try{ const r = await fetch(location.href.split('#')[0].split('?')[0], { cache:'no-store' }); if(r.ok){ const t = await r.text(); if(t.includes(M)) return t; } }catch(e){}
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML = '<div class="loading">Cargando…</div>';
  clone.querySelector('#layer').innerHTML = ''; clone.querySelector('#toasts').innerHTML = '';
  clone.querySelectorAll('script[data-dyn]').forEach(s => s.remove());
  return '<!DOCTYPE html>\n' + clone.outerHTML;
}
async function downloadHtml(){
  try{
    let src = await getSourceHtml();
    const RS = '/*' + 'ROSTER_START*/', RE = '/*' + 'ROSTER_END*/', DS = '/*' + 'DBURL_START*/', DE = '/*' + 'DBURL_END*/';
    const rep = (s, a, b, val) => { const i = s.indexOf(a), j = s.indexOf(b, i); if(i < 0 || j < 0) throw new Error('No se pudo preparar el archivo.'); return s.slice(0, i + a.length) + val + s.slice(j); };
    const v = ROSTER.v || new Date().toISOString();
    src = rep(src, RS, RE, JSON.stringify(compactPeople(ROSTER.people, v)).replace(/<\//g, '<\\/'));
    src = rep(src, DS, DE, JSON.stringify(Sync.base()));
    src = rep(src, '/*' + 'SETTINGS_START*/', '/*' + 'SETTINGS_END*/', JSON.stringify(SETTINGS).replace(/<\//g, '<\\/'));
    downloadBlob(new Blob([src], { type:'text/html' }), 'index.html');
    toast('Descargado “index.html”: súbelo a Netlify para actualizar la página.', 'ok', {ms:5000});
  }catch(e){ toast(e.message || 'No se pudo generar el HTML','error'); }
}

const THIN = { style:'thin', color:{argb:'FFD5DEE2'} };
const BORDER = { top:THIN, left:THIN, bottom:THIN, right:THIN };
async function excelLib(){ if(!window.ExcelJS) await loadScript(EXCELJS_URL); return window.ExcelJS; }
function xlHeader(row){ row.eachCell(c => { c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF132C3E'}}; c.font = {bold:true,color:{argb:'FFFFFFFF'},size:11}; c.alignment = {vertical:'middle',horizontal:'center',wrapText:true}; c.border = BORDER; }); row.height = 30; }
function xlInfo(ws, title, lines, ncols){
  if(ncols > 1) ws.mergeCells(1,1,1,ncols);
  const t = ws.getCell(1,1); t.value = title; t.font = {bold:true,size:15,color:{argb:'FF132C3E'}}; ws.getRow(1).height = 24;
  lines.forEach((l,i) => { if(ncols > 1) ws.mergeCells(i+2,1,i+2,ncols); const c = ws.getCell(i+2,1); c.value = l; c.font = {size:10.5,color:{argb:'FF5C7080'}}; });
  return lines.length + 3;
}
function xlBody(row, i){ row.eachCell({includeEmpty:true}, c => { c.border = BORDER; c.alignment = Object.assign({vertical:'middle', wrapText:true}, c.alignment||{}); if(i % 2) c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFF6F9FA'}}; }); }
async function xlBlob(wb){ const buf = await wb.xlsx.writeBuffer(); return new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }
async function exportEvent(ev, share){
  try{
    toast('Generando Excel…');
    const X = await excelLib();
    await ensureEventSigs(ev);
    const m = ev.meta, rows = eventRows(ev);
    const fields = FIELD_DEFS.filter(f => (m.fields||[]).includes(f.k)); const cus = m.custom || [];
    const wb = new X.Workbook(); wb.creator = 'Check-in Asistencia'; wb.created = new Date();
    const ws = wb.addWorksheet('Asistencia');
    const heads = ['N°','Hora','Apellidos y nombres','Origen', ...fields.map(f => f.label), ...cus.map(c => c.label), 'Registrado por'];
    const hr = xlInfo(ws, m.title, [`Estaca: ${m.stake || '—'}   ·   Barrio: ${m.ward || 'Todos'}   ·   Fecha: ${fmtDate(m.date)}`, `Código: ${ev.code}   ·   Total asistentes: ${rows.length}   ·   Exportado: ${new Date().toLocaleString('es-PE')}`], heads.length);
    ws.getRow(hr).values = heads; xlHeader(ws.getRow(hr));
    rows.forEach((r, i) => { const row = ws.addRow([i+1, fmtTime(r.t), r.n, r.src === 'manual' ? 'Inscripción manual' : 'Base', ...fields.map(f => fieldVal(r, f.k)), ...cus.map(c => (r.custom||{})[c.id] || ''), r.by || '']); xlBody(row, i); row.getCell(1).alignment = {horizontal:'center',vertical:'middle'}; row.getCell(2).alignment = {horizontal:'center',vertical:'middle'}; });
    ws.columns.forEach((c, i) => { c.width = [5, 8, 38, 17][i] || 16; });
    ws.views = [{ state:'frozen', ySplit: hr }];
    if(rows.length) ws.autoFilter = { from:{row:hr, column:1}, to:{row:hr, column:heads.length} };
    const man = rows.filter(r => r.src === 'manual');
    if(man.length){
      const w2 = wb.addWorksheet('Registro manual');
      const h2 = ['N°','Nombres','Apellidos','Estaca','Barrio', ...cus.map(c => c.label)];
      const hr2 = xlInfo(w2, 'Registro manual · '+m.title, [`Personas que no estaban en la base · ${fmtDate(m.date)} · Código ${ev.code}`], h2.length);
      w2.getRow(hr2).values = h2; xlHeader(w2.getRow(hr2));
      man.forEach((r, i) => {
        const mm = r.manual || {};
        const row = w2.addRow([i+1, mm.nombres, mm.apellidos, r.data && r.data.k, r.data && r.data.w, ...cus.map(c => (r.custom||{})[c.id] || '')]);
        xlBody(row, i);
      });
      w2.columns.forEach((c, i) => { c.width = [5,22,22,18,20][i] || 16; });
      w2.views = [{ state:'frozen', ySplit: hr2 }];
    }
    addBackupSheet(wb, { kind:'ca-backup', type:'event', ver:1, exportedAt:new Date().toISOString(), from: myName(), contrib: !!ev.contrib, data: cleanForBackup(ev) });
    const blob = await xlBlob(wb);
    const name = ev.contrib
      ? `Asistencia - ${ev.code} - aporte ${slug(myName() || 'colaborador')} - ${todayISO()}.xlsx`
      : `Asistencia - ${slug(m.title)} - ${ev.code} - ${m.date}.xlsx`;
    if(share) await shareOrDownload(blob, name, `Asistencia · ${m.title} (${rows.length})`, { wa: m.wa, waText: '' }); else { downloadBlob(blob, name); toast('Excel descargado ✓','ok'); }
  }catch(e){ console.error(e); toast(e.message || 'No se pudo generar el Excel', 'error'); }
}
async function exportClass(cls, share){
  try{
    toast('Generando Excel…');
    const X = await excelLib();
    await ensureClassSigs(cls);
    const m = cls.meta, studs = classStudents(cls), dates = classDates(cls);
    const wb = new X.Workbook(); wb.creator = 'Check-in Asistencia'; wb.created = new Date();
    const ws = wb.addWorksheet('Asistencia');
    const heads = ['N°','Alumno', ...dates.map(d => DOW[parseISO(d).getDay()]+'\n'+fmtShort(d)), 'Asistió','Faltó','%'];
    const hr = xlInfo(ws, m.title, [`${progLabel(m.program)}   ·   Maestro: ${m.teacher}   ·   ${[m.stake, m.ward].filter(Boolean).join(' · ') || ''}`, `Código: ${cls.code}   ·   Alumnos: ${studs.length}   ·   Sesiones: ${dates.length}   ·   Exportado: ${new Date().toLocaleString('es-PE')}`], Math.min(heads.length, 14));
    ws.getRow(hr).values = heads; xlHeader(ws.getRow(hr));
    studs.forEach((s, i) => {
      const st = studentStats(cls, s.id, dates);
      const row = ws.addRow([i+1, s.n, ...dates.map(d => { const v = (cls.att[d]||{})[s.id]; return ATT_TXT[v] || ''; }), st.P, st.F, st.pct === '' ? '' : st.pct/100]);
      xlBody(row, i);
      dates.forEach((d, j) => { const c = row.getCell(3+j); c.alignment = {horizontal:'center',vertical:'middle'}; if(c.value === '✓'){ c.font = {bold:true,color:{argb:'FF1E8449'}}; c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFE7F5EC'}}; } else if(c.value === '✗'){ c.font = {bold:true,color:{argb:'FFC0392B'}}; c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFFBEAE8'}}; } });
      const pc = row.getCell(heads.length); pc.numFmt = '0%'; pc.font = {bold:true}; pc.alignment = {horizontal:'center'};
      row.getCell(1).alignment = {horizontal:'center'};
    });
    const tot = ws.addRow(['', 'Asistentes por sesión', ...dates.map(d => studs.filter(s => ATT_OK((cls.att[d]||{})[s.id])).length), '', '', '']);
    tot.eachCell({includeEmpty:true}, c => { c.font = {bold:true,color:{argb:'FF132C3E'}}; c.border = BORDER; c.alignment = {horizontal:'center'}; c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFE6F2F2'}}; });
    ws.getColumn(1).width = 5; ws.getColumn(2).width = 36;
    dates.forEach((d, j) => ws.getColumn(3+j).width = 6.5);
    [1,2,3].forEach(k => ws.getColumn(heads.length - 3 + k).width = 8);
    ws.views = [{ state:'frozen', ySplit: hr, xSplit: 2 }];
    const w2 = wb.addWorksheet('Alumnos');
    const h2 = ['N°','Apellidos y nombres','Origen','Estaca','Barrio','Asistencia %'];
    const hr2 = xlInfo(w2, 'Alumnos · '+m.title, [`${progLabel(m.program)} · Maestro: ${m.teacher} · Código ${cls.code}`], h2.length);
    w2.getRow(hr2).values = h2; xlHeader(w2.getRow(hr2));
    studs.forEach((s, i) => {
      const d = s.data || {}; const st = studentStats(cls, s.id, dates);
      const row = w2.addRow([i+1, s.n, s.src === 'nuevo' ? 'Nuevo (manual)' : 'Base', d.k || '', d.w || '', st.pct === '' ? '' : st.pct/100]);
      xlBody(row, i); row.getCell(h2.length).numFmt = '0%';
    });
    w2.columns.forEach((c, i) => { c.width = [5,36,14,18,20][i] || 14; });
    w2.views = [{ state:'frozen', ySplit: hr2 }];
    addBackupSheet(wb, { kind:'ca-backup', type:'class', ver:1, exportedAt:new Date().toISOString(), from: myName(), data: cleanForBackup(cls) });
    const blob = await xlBlob(wb);
    const name = `Asistencia clase - ${slug(m.title)} - ${cls.code} - ${todayISO()}.xlsx`;
    if(share) await shareOrDownload(blob, name, `Asistencia · ${m.title} · ${m.teacher}`, { wa: m.wa, waText: '' }); else { downloadBlob(blob, name); toast('Excel descargado ✓','ok'); }
  }catch(e){ console.error(e); toast(e.message || 'No se pudo generar el Excel', 'error'); }
}

function readBackupHtml(text, fname){
  const m = String(text).match(/<script type="application\/json" id="ca-backup">([\s\S]*?)<\/script>/);
  if(!m) throw new Error(`“${fname}” no es un reporte de Check-in Asistencia.`);
  try{ return JSON.parse(m[1]); }catch(e){ throw new Error(`El respaldo de “${fname}” está dañado.`); }
}

/* Calendario de solo lectura para el reporte (mismo criterio que el del maestro). Celdas mínimas: los íconos van por CSS. */
function reportCalendar(cls, s, dates){
  const t = todayISO(), dset = new Set(dates), rng = classRange(cls), cdays = cls.meta.days || [];
  const att = d => (cls.att[d]||{})[s.id] || '';
  const P = dates.filter(d => ATT_OK(att(d))).length, F = dates.filter(d => att(d) === 'F').length, T = dates.length;
  const pct = studentStats(cls, s.id, dates).pct;
  const start = parseISO(dates.length && dates[0] < rng.s ? dates[0] : rng.s);
  const months = []; const cur = new Date(start.getFullYear(), start.getMonth(), 1); const end = parseISO(rng.e && rng.e < t ? rng.e : t);
  while(cur <= end && months.length < 24){ months.push([cur.getFullYear(), cur.getMonth()]); cur.setMonth(cur.getMonth()+1); }
  const mh = ([y, mo]) => {
    const key = `${y}-${pad2(mo+1)}`, lead = (new Date(y, mo, 1).getDay() + 6) % 7, days = new Date(y, mo+1, 0).getDate();
    let c = '<i>lun</i><i>mar</i><i>mié</i><i>jue</i><i>vie</i><i>sáb</i><i>dom</i>' + '<s></s>'.repeat(lead);
    for(let dd=1; dd<=days; dd++){
      const ds = `${key}-${pad2(dd)}`;
      if(dset.has(ds)){ const v = att(ds); c += `<b class="${ATT_OK(v)?'p':v==='F'?'f':'e'}${ds===t?' t':''}">${dd}</b>`; }
      else { const why = blockedReason(ds); c += (why && why !== 'Domingo' && cdays.includes(new Date(y, mo, dd).getDay()) && ds >= rng.s && (!rng.e || ds <= rng.e)) ? `<b class="h" title="${esc(why)}">${dd}</b>` : `<u>${dd}</u>`; }
    }
    return `<div class="cm"><h4>${MES_L[mo][0].toUpperCase()+MES_L[mo].slice(1)} de ${y}</h4><div class="cg">${c}</div></div>`;
  };
  return `<div class="cs4"><div><b>${P}/${T}</b><span>Asistencia</span></div><div><b>${pct === '' ? '—' : pct+'%'}</b><span>Porcentaje</span></div><div><b>${F}</b><span>Faltas</span></div><div><b>${T-P-F}</b><span>Sin marcar</span></div></div>
    <div class="clg"><span><b class="p"></b>Asistió</span><span><b class="f"></b>Falta</span><span><b class="e"></b>Sin marcar</span><span><b class="h"></b>Feriado</span></div>
    <div class="cms">${months.map(mh).join('') || '<p class="dsub">Aún no hay días de clase.</p>'}</div>`;
}

async function handleImport(file){
  const prev = $('#impPrev');
  prev.innerHTML = '<p class="hint">Leyendo archivo…</p>';
  try{
    await loadScript(SHEETJS_URL);
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:true });
    let hi = -1, H = [];
    for(let i=0;i<Math.min(12, raw.length);i++){ const h = (raw[i]||[]).map(x => norm(x)); if(h.some(x => ['student name','nombres','nombre','nombre completo','nombres y apellidos','apellidos y nombres','alumno','nombres completos'].includes(x))){ hi = i; H = h; break; } }
    if(hi < 0) throw new Error('No se encontró una columna de nombres (Student Name / Nombres).');
    const col = (...tests) => H.findIndex(h => tests.some(t => typeof t === 'function' ? t(h) : h === t));
    const C = {
      full: col('student name','nombre completo','nombres y apellidos','apellidos y nombres','alumno'),
      nom: col('nombres','nombre','nombres completos'), ape: col('apellidos','apellido'),
      k: col(h => h.startsWith('stake') || h.includes('estaca')), w: col(h => h.startsWith('ward') || h.includes('barrio') || h === 'rama' || h === 'unidad'),
      g: col('program name', 'program', 'programa'),
    };
    /* "Ica Peru Stake SEM (12011)" → S · "Ica Peru Stake IN (61151)" → I */
    const progDe = v => { const u = String(v||'').toUpperCase(); return /\bSEM\b|SEMINAR/.test(u) ? 'S' : /\bINS?T?\b|INSTITU/.test(u) ? 'I' : ''; };
    const rows = [];
    for(let i=hi+1;i<raw.length;i++){
      const r = raw[i]; if(!r) continue;
      const get = k => C[k] >= 0 ? String(r[C[k]] ?? '').trim() : '';
      let n = '';
      if(C.full >= 0) n = get('full');
      else if(C.ape >= 0 && C.nom >= 0){ const a = get('ape'), b = get('nom'); n = a && b ? `${a}, ${b}` : (a || b); }
      else n = get('nom');
      n = n.replace(/\s+/g,' ').trim(); if(!n) continue;
      rows.push({ n, k: get('k'), w: get('w'), g: progDe(get('g')) });
    }
    if(!rows.length) throw new Error('El archivo no tiene filas con nombres.');
    const byId = new Map(ROSTER.people.map(p => [p.id, p]));
    const byName = new Map(); ROSTER.people.forEach(p => { const k = norm(p.n); byName.set(k, byName.has(k) ? null : p); });
    let nNew = 0, nUpd = 0;
    rows.forEach(r => { const ex = byId.get(pidFor(r.n, r.w)) || byName.get(norm(r.n)); if(ex) nUpd++; else nNew++; });
    IMPORT = { rows, name: file.name };
    const found = Object.entries({ 'Nombre': C.full >= 0 || C.nom >= 0, 'Estaca': C.k >= 0, 'Barrio': C.w >= 0, 'Programa': rows.some(r => r.g) }).map(([k, ok]) => `<span class="badge ${ok?'b-ok':'b-ro'}">${ok?'✓':'—'} ${k}</span>`).join(' ');
    prev.innerHTML = `<div style="margin-top:14px"><div class="info-box"><b>${esc(file.name)}</b>: ${rows.length.toLocaleString('es-PE')} personas · <b>${nNew}</b> nuevas · <b>${nUpd}</b> ya existen</div>
      <div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">${found}</div>
      <div class="radio-list">
        <label><input type="radio" name="mode" value="merge" checked><span><b>Complementar</b><small>Agrega a las personas nuevas y actualiza los datos de las que ya existen. No borra a nadie.</small></span></label>
        <label><input type="radio" name="mode" value="replace"><span><b>Reemplazar toda la base</b><small>La base queda igual al archivo. Se conservan las personas agregadas a mano.</small></span></label>
      </div>
      <div class="btn-row"><button class="btn" id="impCancel">Cancelar</button><button class="btn primary" id="impApply">${ICON.check} Aplicar cambios</button></div></div>`;
    $('#impCancel').onclick = () => { IMPORT = null; prev.innerHTML = ''; };
    $('#impApply').onclick = () => applyImport($('input[name=mode]:checked').value);
  }catch(e){ prev.innerHTML = `<div class="warn-box" style="margin-top:12px">${esc(e.message || 'No se pudo leer el archivo')}</div>`; }
}
function applyImport(mode){
  if(!IMPORT) return;
  const rows = IMPORT.rows.map(r => { const x = Object.assign({}, r); Object.keys(x).forEach(k => { if(x[k] === '') delete x[k]; }); return x; });
  let people;
  if(mode === 'replace'){
    people = rows.map(r => Object.assign({ k:'', w:'' }, r));
    const keep = ROSTER.people.filter(p => p.src === 'manual');
    const names = new Set(people.map(p => norm(p.n)));
    keep.forEach(p => { if(!names.has(norm(p.n))) people.push(p); });
  } else {
    people = ROSTER.people.map(p => Object.assign({}, p));
    const byId = new Map(people.map(p => [p.id, p]));
    const byName = new Map(); people.forEach(p => { const k = norm(p.n); byName.set(k, byName.has(k) ? null : p); });
    rows.forEach(r => {
      const ex = byId.get(pidFor(r.n, r.w)) || byName.get(norm(r.n));
      if(ex){ const id = ex.id; Object.assign(ex, r); ex.id = id; if(ex.src === 'manual') delete ex.src; }
      else people.push(Object.assign({ k:'', w:'' }, r, { added: todayISO() }));
    });
  }
  people.forEach(p => { if(!p.id) p.id = pidFor(p.n, p.w); });
  people.sort((a,b) => a.n.localeCompare(b.n,'es'));
  saveRosterLocal(people, 'importada: '+IMPORT.name);
  subirBaseEnLinea(rows, IMPORT.name);
  IMPORT = null;
  toast(`Base actualizada: ${people.length.toLocaleString('es-PE')} personas ✓`, 'ok');
  renderAdmin();
}

async function getSourceHtml(){
  const M = '/*' + 'ROSTER_START*/';
  try{ const r = await fetch(location.href.split('#')[0].split('?')[0], { cache:'no-store' }); if(r.ok){ const t = await r.text(); if(t.includes(M)) return t; } }catch(e){}
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML = '<div class="loading">Cargando…</div>';
  clone.querySelector('#layer').innerHTML = ''; clone.querySelector('#toasts').innerHTML = '';
  clone.querySelectorAll('script[data-dyn]').forEach(s => s.remove());
  return '<!DOCTYPE html>\n' + clone.outerHTML;
}
async function downloadHtml(){
  try{
    let src = await getSourceHtml();
    const RS = '/*' + 'ROSTER_START*/', RE = '/*' + 'ROSTER_END*/', DS = '/*' + 'DBURL_START*/', DE = '/*' + 'DBURL_END*/';
    const rep = (s, a, b, val) => { const i = s.indexOf(a), j = s.indexOf(b, i); if(i < 0 || j < 0) throw new Error('No se pudo preparar el archivo.'); return s.slice(0, i + a.length) + val + s.slice(j); };
    const v = ROSTER.v || new Date().toISOString();
    src = rep(src, RS, RE, JSON.stringify(compactPeople(ROSTER.people, v)).replace(/<\//g, '<\\/'));
    src = rep(src, DS, DE, JSON.stringify(Sync.base()));
    src = rep(src, '/*' + 'SETTINGS_START*/', '/*' + 'SETTINGS_END*/', JSON.stringify(SETTINGS).replace(/<\//g, '<\\/'));
    downloadBlob(new Blob([src], { type:'text/html' }), 'index.html');
    toast('Descargado “index.html”: súbelo a Netlify para actualizar la página.', 'ok', {ms:5000});
  }catch(e){ toast(e.message || 'No se pudo generar el HTML','error'); }
}
